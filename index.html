   Lịch sử trong ngày, đúng thứ tự đã đi: (1) thêm KẺ NGANG giữa các hàng; (2) thêm kẻ DƯỚI
   hàng cuối; (3) thêm kẻ TRÊN hàng đầu; (4) kéo kẻ ra tận mép trong của thẻ (`margin: 0 -10px`).
   Ba bước đầu để lại một khối kẻ có HAI ĐẦU VUÔNG — kẻ kết thúc thẳng ở mép thẻ, không có cạnh
   dọc nào để đóng góc, nên bốn góc của khối trông "hở". Đó là lý do có bản này.
   Cách làm: bọc 18 hàng trong `.mix-table` — một khung có VIỀN + BO GÓC. Hai kẻ ngoài cùng KHÔNG
   còn là `border` của hàng mà là VIỀN của khung, nên chúng bo theo cung; kẻ giữa các hàng vẫn do
   từng `.mix-row` tự vẽ ở phía trên (`border-top`), giữ nguyên cách cũ.
   `overflow: hidden` là BẮT BUỘC, không phải cho đẹp: thiếu nó thì kẻ giữa các hàng và nền nút
   📌 vẫn VUÔNG và thò ra ngoài cung bo — đúng cái "hở ở hai góc bo" cần chặn.
   KÍCH THƯỚC KHÔNG ĐỔI MỘT PIXEL: khung có `margin: 0 -10px` (đúng `padding` của `.quiz-card`)
   nên cạnh dọc của khung chạm mép trong của thẻ y như kẻ cũ, và hàng hạ `padding` ngang từ 10px
   xuống 9px để bù 1px viền khung (10 = 1 + 9): chữ, ô số, nút 📌 và cột số câu giữ nguyên vị trí.
   Màu: viền khung và kẻ đều dùng `--border` (0,22 trắng ở tối / 0,22 đen ở sáng) — cùng độ đậm
   với viền ô số và nút ghim trong CÙNG hàng, nhìn ra là một hệ.
   MỘT ĐIỀU CẦN BIẾT: cạnh dọc của khung nằm SÁT viền của `.quiz-card` (hai đường 1px cạnh nhau),
   nên dọc theo bảng, mép thẻ đọc ra dày 2px trong khi viền trên/dưới của khung vẫn 1px. Đây là
   hệ quả của việc giữ kẻ chạm tận mép thẻ (bước 4) — KHÔNG chồng hai đường lên nhau, nếu chồng
   thì đường dọc sẽ đậm gấp đôi (0,39) ở riêng đoạn bảng, còn tệ hơn. */
.mix-table {
  margin: 0 -10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.mix-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 9px;          /* 9px + 1px viền khung = đúng 10px như trước */
  border-top: 1px solid var(--border);
}
/* Hàng ĐẦU không vẽ kẻ trên: viền TRÊN của `.mix-table` đã đóng vai đó, và nhờ vậy hai đầu kẻ
   trên được bo theo cung thay vì kết thúc vuông. Hàng CUỐI cũng vậy với viền DƯỚI của khung —
   nên KHÔNG có luật `border-bottom` nào cho hàng, và cũng KHÔNG cần: mọi hàng chỉ vẽ kẻ TRÊN.
   `:first-child` dùng được ở ĐÂY (khác trước): `.mix-table` chỉ chứa `.mix-row`, nên hàng đầu
   đúng là con đầu tiên. Trước đây các hàng nằm trực tiếp trong `.quiz-card` cùng với dòng tổng /
   dòng cảnh báo / hàng nút nên phải tự thêm class `last` — class đó giờ đã bỏ. */
.mix-row:first-child { border-top: 0; }
/* HÀNG ĐÃ CHỌN SỐ (> 0) có NỀN XANH DƯƠNG NHẠT (20/9/2026 — "tôi muốn hàng nào có số đã chọn thì
   có màu nền xanh dương nhạt"): nhìn một cái là biết bộ nào đang được tính vào bài, không phải dò
   từng ô số. Dùng ĐÚNG họ xanh của ô số trong bảng (`rgba(14,165,233,…)` — xem `.mix-input`).
   Alpha đã SIẾT lại cho "vừa mắt" (20/9/2026 — "chỉnh nền xanh của hàng có số ... cho vừa mắt
   hơn"): chế độ SÁNG 0,14 → **0,10** vì 10/18 hàng cùng lúc có số nên 0,14 đọc ra như kẻ sọc; chế
   độ TỐI 0,10 → **0,12** vì trên nền #202020 nấc cũ hơi khó thấy. Hai chế độ vì thế ĐẢO chiều so
   với bản đầu (bản đầu: tối 0,10 / sáng 0,14).
   Thang alpha trên nền #202020 (chữ đếm `--text-dim` #94a3b8): 0,06 → 5,86:1 · 0,08 → 5,66 ·
   **0,10 → 5,53** · 0,12 → 5,34 (dùng) · 0,14 → 5,15 · 0,18 → 4,81 · 0,22 → 4,50 = SÁT ngưỡng,
   TỨC 0,22 LÀ TRẦN. Tên bộ (chữ trắng) đi từ 15,02 → 11,53 nên không bao giờ là chỗ chặn.
   Nền bị `.mix-table` (`overflow: hidden` + bo góc 10px) CẮT THEO CUNG, nên hàng đầu và hàng cuối
   không thò ra ngoài khung — đừng bỏ `overflow: hidden` của khung.
   Class do JS gắn/gỡ (`paintMixMarks()`), KHÔNG viết luật theo thuộc tính giá trị: CSS không chọn
   được theo `input.value`, đó đúng là lý do phải có class `.mix-zero` trước đây. */
.mix-row.on { background: rgba(14,165,233,0.12); }
input[id^="mixPct-"]::-webkit-outer-spin-button,
input[id^="mixPct-"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[id^="mixPct-"] { -moz-appearance: textfield; appearance: textfield; }
/* Chế độ sáng: #60a5fa trên thẻ trắng chỉ 2,5:1 — phải đổi sang xanh ĐẬM, cùng màu
   #1e40af mà .quiz-toggle.on dùng ở chế độ sáng (7,45:1 trên nền chip).
   Lưu ý: `#93c5fd` cũng là màu `.quiz-toggle.on` dùng ở CHẾ ĐỘ TỐI từ 20/9/2026, nhưng đó là
   màu sáng (đọc trên nền tối), còn ở đây là màu ĐẬM trên nền sáng — hai giá trị cho hai chế độ. */
body.light-mode .mix-reset { color: var(--accent-deep); border-color: rgba(0,0,0,0.35); }
body.light-mode .mix-reset:hover { border-color: var(--accent-deep); }

/* ── SEARCH ───────────────────────── */
/* Thanh tìm kiếm đứng RIÊNG, ngay dưới thanh xanh trên cùng và TRÊN thẻ “📚 Thư viện
   bộ đề” (19/9/2026 — trước đó nó nằm trong thẻ). Vì ở ngoài thẻ nên KHÔNG có nền hay
   viền của .quiz-card: chỉ ô nhập (--navy-mid + viền --border) nổi trên nền trang.
   Lề trên 8px trùng nhịp với .main 0 8px hai bên, để nó thẳng hàng với các thẻ bên dưới. */
.search-wrap { position: relative; margin: 8px 0 6px; }
/* Gốc định vị của icon 🔍 và nút ✕. `.search-wrap` KHÔNG dùng được vì nó còn chứa danh sách kết
   quả — xem ghi chú trong `quizHomeHtml()`. */
.search-field { position: relative; }
.search-input {
  /* Lề phải 12px → 38px để chừa chỗ cho nút XOÁ (19/9/2026 — "tôi muốn có dấu x để xoá ở thanh
     tìm kiếm"). Thiếu bước này thì chữ dài chui xuống dưới nút ✕ và không đọc được. */
  width: 100%; padding: 9px 38px 9px 34px;
  border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--navy-mid); color: var(--text);
  font-family: 'Inter', sans-serif; font-size: var(--fs-lead); font-weight: 400;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  font-size: var(--fs-lead); pointer-events: none; opacity: 0.6;
}
/* Nút XOÁ (✕) nằm TRONG ô nhập, sát mép phải (19/9/2026 — "tôi muốn có dấu x để xoá ở thanh tìm
   kiếm"). 34×34 là vùng chạm tối thiểu trên điện thoại; ký tự ✕ không tính vào vùng đó.
   Chỉ hiện khi ô CÓ chữ — xem `paintSearchClear()` trong JS.
   `.search-clear[hidden]` PHẢI khai riêng: luật `.search-clear` đặt `display:flex`, mà thuộc tính
   `hidden` chỉ ăn khi không có `display` nào đè (đúng cách đã làm với `.set-dd-list[hidden]`). */
.search-clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; border-radius: 8px; cursor: pointer;
  color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: var(--fs-base); line-height: 1;
}
.search-clear[hidden] { display: none; }
.search-clear:hover, .search-clear:active { color: var(--text); background: rgba(127, 127, 127, 0.18); }
/* Chế độ sáng PHẢI khai lại màu hover: `--text` chỉ có trong `:root` (bộ biến chế độ tối) và
   `body.light-mode` không ghi đè nó — dùng nguyên `var(--text)` ở đây là chữ trắng trên nền trắng.
   Cùng họ lỗi đã làm nút dropdown mất chữ. */
body.light-mode .search-clear:hover, body.light-mode .search-clear:active {
  color: var(--text-base); background: rgba(0, 0, 0, 0.06);
}
.search-results {
  max-height: 360px; overflow-y: auto; margin-top: 6px;
  -webkit-overflow-scrolling: touch;
}
.search-results:empty { display: none; }
.search-hit {
  padding: 9px; margin-bottom: 6px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--navy-mid);
}
.search-hit-set {
  font-size: var(--fs-note); font-weight: 500; color: var(--accent-glow);
  margin-bottom: 4px;
}
.search-hit-q {
  font-size: var(--fs-lead); font-weight: 500; color: var(--text);
  line-height: 1.5; margin-bottom: 4px;
}
.search-hit-a {
  font-size: var(--fs-sub); font-weight: 400; color: var(--green);
  line-height: 1.4;
}
.search-hit-q em, .search-hit-a em {
  font-style: normal; background: rgba(251,191,36,0.25);
  border-radius: 3px; padding: 0 2px;
}
.search-empty {
  font-size: var(--fs-sub); color: var(--text-dim); padding: 8px 0;
}
body.light-mode .search-input { background: var(--surface-card); border-color: var(--border-field); color: var(--text-strong); }
body.light-mode .search-hit { background: var(--surface-card); border-color: var(--border-light); }
body.light-mode .search-hit-q { color: var(--text-strong); }
body.light-mode .search-hit-a { color: #166534; }
body.light-mode .header {
  background:
    linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 42%),
    linear-gradient(135deg, var(--header-from), var(--header-deep));
  box-shadow: 0 3px 10px rgba(30,64,175,0.35);
}
body.light-mode .header-sub { color: #dbeafe; }
body.light-mode .modal { background: var(--surface-modal); }
/* Hai luật dưới chỉ để ĐỔI NỀN cho chế độ sáng (mọi thứ khác đã dùng token tự đổi đúng):
   nền trang sáng là xám, còn `--navy-mid` thì vẫn là xám ĐẬM của chế độ tối. */
body.light-mode .login-gate { background: var(--surface-sunken); }
body.light-mode .login-card { background: var(--surface-card); color: var(--text-strong); }
body.light-mode .modal-handle { background: rgba(0,0,0,0.15); }
body.light-mode .quiz-card { background: var(--surface-card); border-color: var(--border-light); }
body.light-mode .quiz-input { background: var(--surface-card); border-color: var(--border-field); color: var(--text-strong); }
/* Ô số của bảng trộn ở CHẾ ĐỘ SÁNG. Phải khai báo SAU `body.light-mode .quiz-input` ở trên:
   hai luật cùng độ ưu tiên (0,2,0) nên luật nào đứng sau mới thắng — đặt trước là màu trắng
   của .quiz-input đè mất, và lỗi này chỉ hiện ở chế độ sáng.
   Chữ xanh ở đây phải ĐẬM (#075985): #38bdf8 trên nền trắng gần như không đọc được. */
body.light-mode .mix-input {
  background: rgba(14, 165, 233, 0.06);
  border-color: rgba(14, 165, 233, 0.45);
  color: var(--mix-cyan);
}
/* Ô SỐ 0 ở CHẾ ĐỘ SÁNG — phải khai báo LẠI Ở ĐÂY, không dùng được khối `.mix-zero` phía trên.
   Lý do là bẫy specificity đã gặp nhiều lần trong app: `body.light-mode .mix-input` và
   `body.light-mode .mix-zero` CÙNG độ ưu tiên (0,2,1), nên luật nào ĐỨNG SAU thì thắng — mà
   `body.light-mode .mix-input` nằm sau khối `.mix-zero` trong tệp, nên ở chế độ sáng nó đè mất
   cả nền trắng, cả viền xám lẫn màu chữ của ô 0 (ĐO ĐƯỢC: nền vẫn xanh nhạt, viền vẫn xanh).
   Bản trước tôi chỉ khai `background` ở đây — thiếu `border-color` và `color` nên ô 0 ở chế độ
   sáng vẫn xanh viền và xanh chữ. Giờ khai đủ ba thuộc tính. */
body.light-mode .mix-zero {
  background: var(--surface-card);
  border-color: var(--border);
  color: var(--text-dim);
}
/* Hàng có số ở CHẾ ĐỘ SÁNG: **0,10** — ĐẢO CHIỀU so với bản đầu (0,10 tối / 0,14 sáng). Lý do:
   ở chế độ sáng có tới 10/18 hàng cùng mang số nên 0,14 đọc ra thành kẻ sọc xanh, còn trên nền
   trắng thì 0,10 vẫn thấy rõ mà dịu mắt hơn.
   Thang alpha trên nền trắng rgb(255,255,255) (chữ đếm `--text-dim` #5b6675): 0,06 → 5,51:1 ·
   0,08 → 5,39 · **0,10 → 5,27 (dùng)** · 0,12 → 5,16 · 0,14 → 5,05 · 0,18 → 4,87 · 0,22 → 4,66.
   Tên bộ `#134e4a` đi từ 8,95 → 7,57 — cũng không phải chỗ chặn. Nhớ ở chế độ sáng nấc nào cũng
   vượt ngưỡng, nên TRẦN 0,22 ở đây là do chế độ TỐI quyết định, không phải do nền trắng. */
body.light-mode .mix-row.on { background: rgba(14,165,233,0.10); }
body.light-mode .quiz-btn { background: var(--surface-card); border-color: var(--border-field); color: var(--text-strong); }
body.light-mode .quiz-btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
body.light-mode .quiz-btn.danger { background: var(--danger); color: var(--on-accent); border-color: var(--danger); }
/* Nút QUAY LẠI ở CHẾ ĐỘ SÁNG: luật `body.light-mode .home-btn { border-color: var(--home-brd) }`
   và biến `--home-brd` đã bị XOÁ 20/9/2026 ("bỏ viền và cho icon to hơn") — nút không còn viền ở
   CẢ HAI chế độ nên không còn gì phải khai riêng cho chế độ sáng, và bẫy specificity cũ
   (`body.light-mode .quiz-btn` (0,2,1) đè `.home-btn` (0,1,0), đo được `rgb(179,191,204)`) tự
   hết. Dấu hiệu khi chọn bằng bàn phím giờ là `.home-btn:focus-visible` (box-shadow) ở khu vực
   chính — đừng khôi phục viền ở đây, cả hai chế độ phải đọc ra GIỐNG NHAU. */
/* VIỀN KHI ĐANG CHỌN ở CHẾ ĐỘ SÁNG — phải khai báo Ở ĐÂY, không phải cạnh `.quiz-btn:focus`.
   Ba luật `body.light-mode .quiz-btn[.primary|.danger]` ngay trên có độ ưu tiên (0,3,1), còn
   luật gốc `.quiz-btn:focus` chỉ (0,3,0) — nên nếu không có khối này thì ở chế độ sáng viền focus
   bị LUẬT NỀN ĐÈ MẤT (đúng cái bẫy đã ghi ở mục quiz-opt: mọi luật `body.light-mode .<x>` cho
   phần tử có TRẠNG THÁI đều âm thầm thắng luật trạng thái).
   Độ ưu tiên ở đây là (0,4,1) nên thắng chắc.
   Ở sáng dùng `--accent` (#1d4ed8) = **6,70:1** trên nền nút trắng — xanh dương ĐẬM là thứ dễ thấy
   nhất trên nền sáng, nên KHÔNG theo chế độ tối nhảy sang #60a5fa (chỉ ~2,5:1 trên nền trắng).
   Hai luật dưới là ngoại lệ cho nút ĐẶC, nơi nền đã là khối xanh/đỏ đậm nên viền đậm chìm vào
   chính nó — ở đó `#60a5fa` mới tách ra được. Nếu gộp cả hai chế độ thành một giá trị thì một
   trong hai chế độ sẽ mất dấu "đang chọn". */
body.light-mode .quiz-btn:focus { border-color: var(--accent); }
body.light-mode .quiz-btn.primary:focus,
body.light-mode .quiz-btn.danger:focus { border-color: var(--accent-glow); }
/* Nền đáp án ở CHẾ ĐỘ SÁNG: gần như TRẮNG, chỉ còn một vệt xám. Đường đi của riêng chỗ này
   trong ngày 19/9/2026 — sáu nấc, và KHÔNG còn dư địa:
   #ffffff → #f1f3f5 → #f7f8fa ("nhạt hơn 1 tí") → #f1f3f5 ("nền xám nhẹ") → #f5f6f8
   ("trắng xám nhẹ", chọn để KHỚP 1,08:1 với tấm ở chế độ tối) → **#fafbfc = ĐANG DÙNG**
   ("nhạt hơn nữa").
   **VÙNG NÀY ĐÃ PHẲNG — đây là thông tin quan trọng nhất của cả chuỗi:** từ #fafbfc trở lên
   chỉ còn #fbfcfd 1,03:1 · #fdfdfe 1,02:1 · #ffffff 1,00:1, tức ba nấc còn lại KHÁC NHAU
   KHOẢNG MỘT ĐƠN VỊ RGB — mắt không phân biệt được, và #ffffff chính là thẻ nên tấm BIẾN MẤT.
   Sau nấc này thì thứ định hình ô đáp án là **VIỀN #b3bfcc = 1,87:1 trên thẻ trắng** — mạnh
   hơn hẳn nền (1,04:1), tức viền đã gánh việc từ lâu rồi. Muốn ô nổi hơn nữa thì ĐẬM VIỀN,
   đừng hạ nền thêm (không còn gì để hạ).
   Chữ đáp án vẫn #5f6b7c, KHÔNG phải đổi: 5,22:1 trên tấm mới — nền nhạt đi thì chữ ĐỠ khó
   đọc, đúng chiều ngược với chế độ tối.
   Thang đầy đủ trên thẻ #ffffff — (chữ đáp án) · (tấm/thẻ):
     #f5f6f8 5,00:1 · 1,08:1 (nấc trước) · #f6f7f9 5,05:1 · 1,07:1 · #f7f8fa 5,09:1 · 1,06:1
     **#f8f9fb 5,14:1 · 1,05:1 · #f9fafb 5,18:1 · 1,05:1 · #fafbfc 5,22:1 · 1,04:1 (đang dùng)**
     #fbfcfd 5,27:1 · 1,03:1 · #fdfdfe 5,32:1 · 1,02:1 · #ffffff 5,41:1 · 1,00:1 (thẻ — tấm mất)
   Xám đậm hơn (nếu muốn quay lại): #f1f3f5 4,86:1 · 1,11:1 · #f0f0f0 4,75:1 · 1,14:1 (xám THUẦN
   R=G=B) · #ededed 4,62:1 · 1,17:1 · #e9ecef 4,56:1 · 1,19:1 (= nền trang, ĐỪNG dùng làm tấm).
   Chế độ TỐI ngược chiều: ở đó tấm #262626 trên thẻ #202020 = 1,08:1 và nền không đổi. */
/* VIỀN Ở ĐÂY đã đậm lên #b3bfcc → **#96a2af** (cùng lượt "định hình bằng viền"): đúng giá trị để
   đạt **2,60:1 trên thẻ trắng — KHỚP CHÍNH XÁC với viền ở chế độ tối** (rgba trắng 0,29 → #606060
   trên thẻ #202020 cũng 2,60:1). Độ dày 2px lấy từ luật `.quiz-opt` gốc ở trên. Đổi một bên thì
   phải đo lại bên kia, nếu không hai chế độ lại lệch nhau như trước lượt này (1,87 so với 2,05). */
body.light-mode .quiz-opt { background: var(--surface-answer); border-color: var(--border-answer); color: var(--answer); }
/* Đáp án đã chọn ở CHẾ ĐỘ SÁNG phải hiện xanh/đỏ y như chế độ tối.
   Luật `body.light-mode .quiz-opt` ở ngay trên có độ ưu tiên cao hơn
   `.quiz-opt.correct/.wrong` (2 class + 1 thẻ so với 2 class), nên nó XOÁ luôn màu của
   chế độ tối — chọn đúng hay sai đều ra nền trắng như nhau. Phải khai báo lại ở đúng
   mức ưu tiên đó. MÀU thì KHÔNG dùng lại của chế độ tối: nền trắng cần màu ĐẬM hơn hẳn mới nổi
   — xem lý do đo được ở khối ngay dưới. */
/* 19/9/2026 — viền "đúng" đổi --green (#10b981, chỉ 2,54:1 trên thẻ trắng) → **#059669 = 3,77:1**,
   tức mạnh hơn hẳn viền bình thường (#96a2af 2,60:1). Trước lượt này đáp án ĐÚNG có viền MỜ HƠN
   cả một ô chưa trả lời — đúng cái người dùng hỏi ("chọn sai thì đáp án đúng có còn nổi bật
   không"). Viền "sai" giữ --red #ef4444 (3,76:1 — vốn đã đủ mạnh, và trùng đúng màu đỏ mà nút
   nguy hiểm ở chế độ sáng đang dùng), chỉ hạ tint.
   Tint 0,15 → 0,12 ở CẢ HAI: chữ đáp án #5f6b7c trên nền xanh 4,68:1 (đã đạt, giữ được 4,67:1)
   và trên nền đỏ chỉ 4,45:1 — DƯỚI ngưỡng 4,5:1 — nay **4,64:1**.
   Kết quả: viền 3,77 và 3,76 — hai trạng thái CÂN NHAU về độ mạnh, thay vì lệch như trước. */
body.light-mode .quiz-opt.correct { border-color: var(--ok-strong); background: rgba(5,150,105,0.12); }
body.light-mode .quiz-opt.wrong { border-color: var(--red); background: rgba(239,68,68,0.12); }
/* Chip bật/tắt ở chế độ sáng: chữ xanh nhạt --accent-glow (#60a5fa) trên nền chip
   xanh nhạt chỉ đạt 2.06:1 — không đọc được. Đổi sang xanh đậm, vì giờ trạng thái
   BẬT chỉ hiện bằng màu (nhãn không còn kèm “: Bật”). Đậm thêm lần nữa theo yêu cầu
   (18/9/2026): #1d4ed8 → #1e40af, đo được 7.45:1 trên nền chip ở chế độ sáng. */
/* Chip ĐANG BẬT ở chế độ SÁNG cũng đậm hơn cùng lượt: nền 0,14 → **0,26**, viền và chữ giữ
   nguyên (viền #1d4ed8 = 6,70:1 trên nền trắng, chữ #1e40af = 6,43:1 trên nền đã pha).
   Ở đây KHÔNG dùng chữ trắng như chế độ tối: nền sáng nên chữ trắng là không đọc được — đúng
   quy ước "đậm ở sáng, trắng ở tối" của app. */
/* Chip đang bật ở CHẾ ĐỘ SÁNG — đồng bộ với nút 📦 Thư viện (20/9/2026): nền 0,26 → **0,14**,
   chữ `#1e40af` → **`#1d4ed8`**. Đo trên nền đã pha `rgb(228,238,254)`: **5,71:1** (trước là 7,45:1

 lý liên quan (nếu có) và khuyến khích không quá 02 (hai) năm đối với HĐMBĐ ngoài sinh hoạt"],"correct":0,"explain":""},{"q":"Thời gian CTĐL thông báo đến KH thời hạn kết thúc hợp đồng","options":["Không muộn hơn 30 ngày trước ngày hết thời hạn HĐMBĐ","Không muộn hơn 20 ngày trước ngày hết thời hạn HĐMBĐ","Không muộn hơn 15 ngày trước ngày hết thời hạn HĐMBĐ","Không muộn hơn 10 ngày trước ngày hết thời hạn HĐMBĐ"],"correct":0,"explain":""},{"q":"Hiệu lực của HĐMBĐ","options":["Kể từ thời điểm đại diện có thẩm quyền của hai bên ký kết hoặc theo ngày thỏa thuận trong HĐMBĐ","Kể từ ngày gắn điện kế","Kể từ ngày các bên mua điện ký HĐMBĐ","Kể từ ngày các bên bán điện ký HĐMBĐ"],"correct":0,"explain":""},{"q":"Các trường hợp chấm dứt HĐMBĐ, chấm dứt HĐMBĐ trước thời hạn","options":["Kết thúc thời hạn HĐMBĐ mà các bên không có thỏa thuận gia hạn hoặc KH không có phản hồi khi nhận được thông báo của CTĐL về việc gia hạn HĐMBĐ","Các bên thỏa thuận về việc chấm dứt HĐMBĐ","Một trong các bên đơn phương chấm dứt hợp đồng theo các quyền đơn phương chấm dứt HĐMBĐ đã thỏa thuận tại HĐMBĐ","Cả 3 câu đều đúng"],"correct":3,"explain":""},{"q":"Đối với các KH mua điện mục đích sinh hoạt không sử dụng điện 05 (năm) tháng liên tục","options":["CTĐL thông báo và đề nghị KH xác nhận nhu cầu duy trì HĐMBĐ.","Trường hợp KH có phản hồi đồng ý chấm dứt HĐMBĐ thì CTĐL sẽ thực hiện chấm dứt HĐMBĐ.","Trường hợp KH không phản hồi và tiếp tục không sử dụng điện, CTĐL chủ động xem xét quyết định việc chấm dứt HĐMBĐ khi thời gian không sử dụng điện của KH quá 06 (sáu) tháng liên tục.","CTĐL thông báo và đề nghị KH xác nhận nhu cầu duy trì HĐMBĐ. Trường hợp KH có phản hồi đồng ý chấm dứt HĐMBĐ thì CTĐL sẽ thực hiện chấm dứt HĐMBĐ. Trường hợp KH không phản hồi và tiếp tục không sử dụng điện, CTĐL chủ động xem xét quyết định việc chấm dứt HĐMBĐ khi thời gian không sử dụng điện của KH quá 06 (sáu) tháng liên tục."],"correct":3,"explain":""},{"q":"Điều kiện mua công suất phản kháng đối với khách hàng sử "correct":3,"explain":""},{"q":"Đối với cấp điện mới qua lưới điện hạ áp, đối với việc ký kết hợp đồng mua bán điện và thi công lắp đặt công tơ, Tổng công ty quy định Không được phép:","options":["Thi công lắp đặt.","Gắn công tơ trước, ký hợp đồng mua bán điện sau.","Ký Biên bản kiểm tra, treo tháo TBĐĐ và nghiệm thu TBĐĐ","Câu a, c đúng."],"correct":1,"explain":""},{"q":"Hồ sơ cần phải có của khách hàng mua điện phục vụ mục đích ngoài sinh hoạt","options":["Giấy tờ tùy thân; Thông tin xác định chủ thể HĐMBĐ tại địa điểm sử dụng điện","Thông tin xác định mục đích sử dụng điện tại địa điểm sử dụng điện","Đăng ký biểu đồ phụ tải (KH sản xuất, kinh doanh dịch vụ có công suất đăng ký ≥ 40 kW); Giấy bảo lãnh/chứng thư bảo lãnh, đặt cọc (trường hợp KH phải bảo đảm thực hiện HĐMBĐ)","Cả 3 câu đều đúng"],"correct":3,"explain":""},{"q":"Khi tiếp nhận yêu cầu của khách hàng, CTĐL thực hiện","options":["CTĐL tiếp nhận hồ sơ KH mua điện trong địa bàn phân cấp quản lý và có trách nhiệm liên lạc với KH hướng dẫn thủ tục, hồ sơ, thỏa thuận ngày giờ, chuyển bộ phận giải quyết để cử nhân viên mang hồ sơ đến tận nhà KH để khảo sát và hoàn tất thủ tục mua điện. Trường hợp KH liên hệ trực tiếp tại nơi giao dịch KH, CBCNV tiếp nhận yêu cầu có trách nhiệm kiểm tra hồ sơ, trả lời ngay và hẹn ngày Nhân viên đến khảo sát. Trường hợp KH còn thiếu giấy tờ cần bổ sung, CBCNV tiếp nhận có trách nhiệm hướng dẫn đầy đủ về những hồ sơ còn thiếu theo quy định và KH sẽ cung cấp bổ sung khi nhân viên Điện lực đến nhà khảo sát","Đối với trường hợp tiếp nhận hồ sơ tại nhà khách hàng cùng với thời gian khách hàng khảo sát, CBCNV tiếp nhận có trách nhiệm hướng dẫn khách hàng chuẩn bị giấy tờ bản chính để đối chiếu","Câu a và b đúng.","Câu a và b sai."],"correct":2,"explain":""},{"q":"Trường hợp khách hàng trực tiếp đến làm thủ tục tại Công ty Điện lực mang theo bản chính của các giấy tờ theo quy định, CBCNV tiếp nhận hồ sơ có trách nhiệm","options":["Đề nghị khách hàng photocopy bản chính (nếu không có); đối chiếu bản chính và ký xác nhận đã đối chiếu.","Kiểm tra hồ sơ, trả lời ngay và hẹn ngày Nhân viên đến khảo sát. Trường hợp KH còn thiếu giấy tờ cần bổ sung, CBCNV tiếp nhận có trách nhiệm hướng dẫn đầy đủ về những hồ sơ còn thiếu theo quy định và KH sẽ cung cấp bổ sung khi nhân viên Điện lực đến nhà khảo sát.","Đề nghị khách hàng photocopy giấy tờ và đi công chứng bản sao.","Chụp hình lại các bản chính để cập nhật vào hồ sơ giải quyết."],"correct":1,"explain":""},{"q":"Thời gian giải quyết cấp điện mới hạ áp","options":["Trường hợp KH đã đáp ứng đủ hồ sơ hợp lệ theo quy định, CTĐL phải hoàn tất các thủ tục ký kết HĐMBĐ, cấp điện cho KH trong thời gian không quá 03 ngày làm việc","Đối với các trường hợp trong quá trình lắp đặt phải trồng trụ, cáp ngầm, công tơ hệ số nhân, … thì thời gian giải quyết không quá 07 ngày làm việc kể từ ngày Nhận đủ hồ sơ","Các CTĐL áp dụng các giải pháp chủ động rút ngắn thời hạn giải quyết cấp điện hoặc thực hiện cấp điện theo thời gian yêu cầu của KH, nhưng phải đảm bảo hồ sơ pháp lý theo quy định","Cả 3 câu đều đúng"],"correct":3,"explain":""},{"q":"Trường hợp KH mua điện sinh hoạt: Phiếu khảo sát có được xem là căn cứ để xác định chủ thể HĐMBĐ không","options":["Phiếu khảo sát của CTĐL không thể là căn cứ để xác định chủ thể HĐMBĐ để cấp điện sinh hoạt, trường hợp này khi giải quyết cấp điện KH vẫn phải đảm bảo cung cấp đầy đủ và đúng thủ tục quy định","Phiếu khảo sát của CTĐL không thể là căn cứ để xác định chủ thể HĐMBĐ để cấp điện sinh hoạt","Phiếu khảo sát của CTĐL có thể là căn cứ để xác định chủ thể HĐMBĐ để cấp điện sinh hoạt","Cả 3 câu đều sai"],"correct":0,"explain":""},{"q":"Điều kiện kỹ thuật cấp điện đối với khách hàng đề nghị mua điện với công suất đăng ký không quá 160 kVA hoặc lớn hơn 160 kVA:","options":["Cấp điện trên lưới hạ áp nếu phụ tải KH sử dụng không quá 160 kVA","Nếu nhu cầu phụ tải sử dụng lớn hơn 160 kVA, CTĐL giải quyết cấp điện cho KH thông qua hình thức đầu tư công trình điện chuyên dùng","Câu a và b đúng","Câu a và b sai"],"correct":2,"explain":""},{"q":"Thời gian phản hồi cho khách hàng đối với trường hợp chưa có lưới điện phân phối hoặc lưới điện phân phối bị quá tải có xác nhận của Cơ quan Điều tiết điện lực hoặc cơ quan được ủy quyền","options":["Trong thời gian ≤ 05 ngày làm việc kể từ khi nhận được đề nghị mua điện, trong đó nêu rõ thời hạn dự kiến cấp điện được.","Trong thời gian ≤ 04 ngày làm việc kể từ khi nhận được đề nghị mua điện","Trong thời gian ≤ 03 ngày làm việc kể từ khi nhận được đề nghị mua điện","Trong thời gian ≤ 02 ngày làm việc kể từ khi nhận được đề nghị mua điện"],"correct":0,"explain":""},{"q":"Thời gian phản hồi cho khách hàng Đối với các trường hợp trở ngại chưa cấp điện ngay cho KH hoặc không đủ điều kiện để cấp điện","options":["Bằng văn bản trong thời hạn 03 ngày làm việc kể từ ngày nhận được đề nghị mua điện, trong đó nêu rõ lý do và thời gian dự kiến cấp điện (nếu có). Riêng đối với trường hợp nhà KH đã có công tơ cùng một mục đích sử dụng điện, không đủ điều kiện để cấp thêm một công tơ, nhân viên khảo sát có thể thông báo cho KH bằng Phiếu thông báo kết quả khảo sát.","Bằng văn bản trong thời hạn 04 ngày làm việc kể từ ngày nhận được đề nghị mua điện","Bằng văn bản trong thời hạn 05 ngày làm việc kể từ ngày nhận được đề nghị mua điện","Bằng văn bản trong thời hạn 07 ngày làm việc kể từ ngày nhận được đề nghị mua điện"],"correct":0,"explain":""},{"q":"Giải quyết cấp điện cho KH có nhu cầu sử dụng điện ngắn hạn để phục vụ cho công tác thi công công trình, phục vụ lễ hội,…: CTĐL giải quyết cho KH thuê hoặc sử dụng TBA lưu động với thời hạn","options":["Không quá 12 tháng. Hết thời hạn này, trường hợp KH vẫn còn nhu cầu thuê trạm, CTĐL thỏa thuận tiếp tục gia hạn hợp đồng cho thuê","6 tháng","3 tháng","Không giới hạn"],"correct":0,"explain":""},{"q":"Các yêu cầu thực hiện đối với cấp điện mới trung áp","options":["Bộ phận tiếp nhận của CTĐL đề nghị khách hàng: Chuẩn xác thông tin mục đích, nhu cầu, thời gian sử dụng điện và vị trí dự kiến lắp đặt TBA (KH cung cấp bản vẽ mặt bằng hoặc bản vẽ xây dựng khu vực được yêu cầu cấp điện…) để phục vụ cho việc xác định hướng tuyến, vị trí xây dựng, lắp đặt, đấu nối thông qua ứng dụng GIS","Thông báo, hướng dẫn cụ thể hồ sơ cấp điện và các hồ sơ, thủ tục liên quan của các Cơ quan Nhà nước; liên hệ KH để điều chỉnh, bổ sung các hồ sơ cần hoàn thiện trong quá trình thực hiện","CTĐL lập danh mục hồ sơ để theo dõi hồ sơ, trình tự, tiến độ giải quyết cấp điện. Mọi giao dịch, chứng từ phát sinh giữa CTĐL với KH, Cơ quan Nhà nước phải cập nhật theo thời gian thực tế, xác nhận/ký số giữa các bên giao/nhận bằng các hình thức bảng kê, biên bản","Cả 3 câu đều đúng"],"correct":3,"explain":""},{"q":"Thời gian thỏa thuận đấu nối trong trường hợp cấp điện TBA của KH đầu tư","options":["Không quá 02 ngày làm việc (sau khi KH cung cấp đầy đủ hồ sơ đảm bảo đủ điều kiện được đấu nối cấp điện theo quy định và ngành điện hoàn tất công tác khảo sát cấp điện)","Không quá 03 ngày làm việc","Không quá 04 ngày làm việc","Không quá 05 ngày làm việc"],"correct":0,"explain":""},{"q":"Thời hạn CTĐL giải quyết các thủ tục của ngành điện đối với công trình TBA KH đầu tư","options":["Không quá 05 ngày làm việc, bao gồm: thời gian thỏa thuận đấu nối không quá 02 ngày làm việc; thời gian nghiệm thu đóng điện không quá 03 ngày làm việc (sau khi công trình điện của KH đã được thi công hoàn tất và đảm bảo đủ điều kiện nghiệm thu đóng điện)","Không quá 05 ngày làm việc","Không quá 04 ngày làm việc","Không quá 03 ngày làm việc"],"correct":0,"explain":""},{"q":"Hồ sơ khách hàng cần cung cấp khi cấp điện mới trung áp","options":["Giấy tờ tùy thân; Thông tin xác định chủ thể HĐMBĐ tại địa điểm sử dụng điện; Thông tin xác định mục đích sử dụng điện tại địa điểm sử dụng điện (đối với KH mua điện ngoài mục đích sinh hoạt)","Hồ sơ đăng ký đấu nối; Giấy phép hoạt động điện lực đối với các trường hợp mua buôn điện (trừ trường hợp được miễn Giấy phép hoạt động điện lực theo quy định)","Đăng ký biểu đ ":2,"explain":""},{"q":"Trường hợp KH đang sử dụng điện ngoài sinh hoạt có yêu cầu thay đổi sang sử dụng điện sinh hoạt","options":["Đề xuất thu hồi công tơ hiện hữu thay bằng loại công tơ có công suất và mục đích sử dụng phù hợp (nếu có)","Lập Biên bản chấm dứt HĐMBĐ cũ trong đó nêu rõ tiền điện KH còn nợ sẽ được chuyển vào tiền điện phát sinh của HĐMBĐ mới và thời hạn KH cam kết thanh toán hết nợ","Lập HĐMBĐ mới trong đó phải ghi nội dung yêu cầu KH thanh toán đầy đủ, đúng hạn tiền nợ phát sinh đã ghi trong Biên bản chấm dứt HĐMBĐ cũ (tại Điều khoản thỏa thuận khác)","Cả 3 câu đều đúng"],"correct":3,"explain":""},{"q":"Hồ sơ khách hàng cần cung cấp khi thay đổi định mức sử dụng điện","options":["Giấy tờ tùy thân;","Thông tin xác định chủ thể HĐMBĐ tại địa điểm sử dụng điện;","Thông tin xác định định mức sử dụng điện;","Cả 3 loại giấy tờ trên"],"correct":3,"explain":""},{"q":"Trường hợp KH đã có các giấy tờ, thông tin về quyền sở hữu, sử dụng hợp pháp địa điểm mua điện nhưng chưa có đề nghị/ xác nhận đồng ý về việc thay đổi chủ thể HĐMBĐ của chủ thể HĐMBĐ cũ","options":["CTĐL thông báo ngay cho chủ thể HĐMBĐ cũ về việc đề nghị chấm dứt HĐMBĐ khi tiếp nhận yêu cầu của KH","Sau 15 ngày kể từ ngày gửi thông báo và chủ thể HĐMBĐ cũ không có ý kiến khác, CTĐL thực hiện thông báo đơn phương chấm dứt HĐMBĐ cũ và ký HĐMBĐ với chủ thể mới. HĐMBĐ ngoài sinh hoạt mới có bổ sung thỏa thuận “Trường hợp có tranh chấp về địa điểm sử dụng điện/chủ sở hữu địa điểm sử dụng điện không đồng ý bằng văn bản cho Bên mua điện được ký HĐMBĐ, Bên bán điện được quyền đơn phương chấm dứt hợp đồng”","Thời gian thực hiện dịch vụ tính từ ngày CTĐL chấm dứt HĐMBĐ với chủ thể HĐMBĐ cũ (sau 15 ngày từ ngày gửi thông báo) đến ngày hoàn tất việc ký kết HĐMBĐ với chủ thể HĐMBĐ mới","Cả 3 câu đều đúng"],"correct":3,"explain":""},{"q":"CTĐL xem xét thực hiện gia hạn HĐMBĐ hoặc ký HĐMBĐ ngắn hạn (HĐMBĐ dưới 12 tháng) trong trường hợp","options":["KH hết thời hạn hợp đồng thuê địa điểm sử dụng điện.","KH chưa được gia hạn hợp đồng thuê địa điểm sử dụng điện mới.","KH hết thời hạn hợp đồng thuê địa điểm sử dụng điện, chưa được gia hạn hợp đồng thuê mới nhưng được bên cho thuê địa điểm đồng ý bằng văn bản cho tạm thời tiếp tục quản lý, sử dụng địa điểm và cung cấp cam kết thanh toán tiền điện của chủ sở hữu địa điểm sử dụng điện. Thời hạn gia hạn không quá thời hạn bên cho thuê địa điểm đồng ý để KH được quản lý, sử dụng địa điểm.","KH hết thời hạn hợp đồng thuê địa điểm sử dụng điện, chưa được gia hạn hợp đồng thuê mới nhưng được bên cho thuê địa điểm đồng ý bằng văn bản cho tạm thời tiếp tục quản lý, sử dụng địa điểm."],"correct":2,"explain":""},{"q":"Thời hạn gia hạn HĐMBĐ khi KH mua điện ngoài mục đích sinh hoạt sử dụng giấy tờ hợp pháp khác có đủ thông tin xác định chủ thể HĐMBĐ tại địa điểm sử dụng điện và có đăng ký kinh doanh tại địa điểm sử dụng điện còn giá trị sử dụng","options":["Mỗi lần gia hạn không quá 12 (mười hai) tháng","Không quá 6 tháng","Không quá 3 tháng","Theo thỏa thuận với KH"],"correct":0,"explain":""},{"q":"Khi thực hiện chấm dứt HĐMBĐ, CTĐL phải","options":["Xác minh nợ và quá trình sử dụng điện của KH: nợ tiền điện, các khoản phạt, có vi phạm sử dụng điện, chỉ số ghi điện mới nhất lần cuối cùng và đề nghị KH thanh toán trước các khoản nợ này","Thu hồi hệ thống đo đếm và lập thủ tục chấm dứt HĐMBĐ. Khi thu hồi thì phải thực hiện tính toán và đề nghị KH thanh toán số tiền đến chỉ số ngưng trên công tơ hoặc các khoản tiền còn nợ khác (nếu có)","Câu a và b đúng","Câu a và b sai"],"correct":2,"explain":""},{"q":"Thời gian thực hiện ngừng, cấp điện trở lại","options":["Không quá 05 ngày làm việc","Không quá 03 ngày","Không quá 05 ngày","Không quá 07 ngày"],"correct":0,"explain":""},{"q":"CTĐL giải quyết phát sinh trong quá trình thực hiện HĐMBĐ","options":["Trong thời gian thực hiện HĐMBĐ nếu KH có đề nghị thay đổi, bổ sung HĐMBĐ, thì hai bên bàn bạc, thỏa thuận bổ sung Phụ lục HĐMBĐ hoặc chấm dứt HĐMBĐ cũ đồng thời ký kết HĐMBĐ mới","HĐMBĐ được số hoá, lưu trữ và quản lý trên chương trình CMIS, bảo đảm độ tin cậy, an toàn dữ liệu. Các hồ sơ HĐMBĐ giấy phải được số hoá đầy đủ, đựng trong bao hồ sơ riêng, có phòng (kho) riêng để lưu trữ, và bố trí cá nhân chịu trách nhiệm bảo quản khi ra vào khu vực lưu trữ","Hồ sơ HĐMBĐ được lập danh mục bao gồm: bản gốc HĐMBĐ còn thời hạn thực hiện; biên bản chấm dứt HĐMBĐ (nếu có); các văn bản có giá trị pháp lý, giá trị thực hiện giữa các bên theo HĐMBĐ đã ký kết; văn bản nội bộ của CTĐL liên quan đến công tác quản lý theo quy chế quản lý nội bộ (báo cáo trở ngại; báo cáo bất thường; phiếu phúc tra;… Danh mục văn bản lưu trữ của mỗi hồ sơ quản lý HĐMBĐ do bộ phận quản lý HĐMBĐ khởi tạo ngay khi thực hiện ký mới HĐMBĐ (ký lần đầu) và được cập nhật bổ sung trong quá trình thực hiện HĐMBĐ","Cả 3 câu đều đúng"],"correct":3,"explain":""},{"q":"Nhận diện rủi ro sai sót về thông tin HĐMBĐ","options":["HĐMBĐ lập sai thông tin khách hàng (chủ thể hợp đồng, địa chỉ, số điện thoại...);","Cập nhật CMIS thông tin định mức và mục đích sử dụng điện không đúng với thông tin hồ sơ thực tế;","Thiếu thông tin bảo lãnh HĐMBĐ;","Tất cả đều đúng"],"correct":3,"explain":""},{"q":"Nhận diện rủi ro sai sót về thay đổi công suất sử dụng điện","options":["Thông tin hồ sơ khách hàng không phù hợp thực tế;","Thông tin công suất, sản lượng điện không đúng với thực tế;","Bỏ sót thông tin khách hàng phải ký mua công suất phản kháng đối với trường hợp khách hàng có công suất sử dụng cực đại >=40kW;","Cả 3 câu đều đúng."],"correct":3,"explain":""},{"q":"Một trong các rủi ro khi thực hiện thay đổi vị trí thiết bị đo đếm","options":["Huỷ yêu cầu thay đổi vị trí thiết bị đo đếm, làm ảnh hưởng uy tín ngành điện, giảm nguồn thu sản xuất khác của đơn vị, thực hiện sai quy địnnh pháp luật (có sự thoả thuận riêng của Khách hàng với nhân viên ngành điện tự thực hiện di dời).","Huỷ yêu cầu thay đổi vị trí thiết bị đo đếm, làm ảnh hưởng uy tín ngành điện","Thực hiện sai quy địnnh pháp luật","Huỷ yêu cầu thay đổi vị trí thiết bị đo đếm"],"correct":0,"explain":""},{"q":"Rủi ro về pháp lý nào là đúng khi thực hiện thay đổi chủ thể HĐMBĐ","options":["Không lập, ký BB chấm dứt HĐMBĐ cũ và không ký mới lại HĐMBĐ, dẫn đến rủi ro khách hàng không ký hợp đồng nhưng vẫn có điện sử dụng","Trường hợp chưa nhận được ý kiến đồng ý chấm dứt HĐMBĐ, không thực hiện đúng trình tự gửi thông báo đơn phương chấm dứt HĐMBĐ, dẫn đến rủi ro về tranh chấp HĐMBĐ","Câu a và b đúng","Câu a và b sai"],"correct":2,"explain":""},{"q":"Nhận diện rủi ro về Thông tin thủ tục chấm dứt HĐMBĐ trước hạn và thông tin nợ tiền điện","options":["Thông tin thủ tục chấm dứt HĐMBĐ trước hạn và thông tin nợ tiền điện không đầy đủ: Xác định chủ thể HĐMBĐ không phù hợp với hồ sơ thực tế, thực hiện thanh lý HĐMBĐ không chính xác; Xác định thông tin công tơ thu hồi không chính xác; Không thực hiện xác minh nợ và chốt chỉ số.\"","Xác định chủ thể HĐMBĐ không phù hợp với hồ sơ thực tế, thực hiện thanh lý HĐMBĐ không chính xác;","Xác định thông tin công tơ thu hồi không chính xác","Không thực hiện xác minh nợ và chốt chỉ số"],"correct":0,"explain":""}]},{"name":"Các tình huống vi phạm sử dụng điện","addedAt":1789792793096,"questions":[{"q":"Khi phát hiện trường hợp nào sau đây, công nhân phát hiện phải báo cáo?","options":["Viên chì niêm phong đầy đủ.","Viên chì niêm phong bị đứt dây xâu.","Viên chì niêm phong bị mờ và nghi giả","Câu b và c"],"correct":3,"explain":""},{"q":"Trường hợp nào sau đây, khi quan sát và phát hiện phải báo cáo?","options":["Viên chì niêm phong không có ký hiệu.","Viên chì niêm phong không tròn đều.","Viên chì niêm phong bị mờ.","Câu a và c"],"correct":0,"explain":""},{"q":"Trường hợp nào sau đây, khi quan sát và phát hiện phải báo cáo?","options":["Viên chì niêm phong bị mờ.","Dây xâu chì niêm bị đứt.","Dây xâu chì được liên kết bằng mối hàn.","Đáp án b và c.","Cả 3 đáp án trên."],"correct":3,"explain":""},{"q":"Truờng hợp nào sau đây, khi quan sát và phát hiện phải báo cáo?","options":["Viên chì niêm bị mất.","Dây xâu chì bị đứt.","Dây xâu chì được liên kết bằng mối hàn.","Cả 3 đáp án trên.","Đáp án a và b"],"correct":3,"explain":""},{"q":"Khi thực hiện công tác, công nhân phát hiện phải báo cáo đối với trường hợp nào sau đây?","options":["Công tơ treo ngoài trụ điện.","Công tơ bị mất.","Công tơ được treo ở vị trí thấp.","Đáp án b và c."],"correct":1,"explain":""},{"q":"Khi thực hiện công tác, công nhân phát hiện phải báo cáo đối với trường hợp nào sau đây?","options":["Công tơ ngừng hoạt động khi không có tải.","Công tơ hoạt động khi không có tải.","Công tơ lúc hoạt động, lúc không hoạt động khi có tải","Đáp án b và c."],"correct":3,"explain":""},{"q":"Khi thực hiện công tác, công nhân phát hiện phải báo cáo đối với trường hợp nào sau đây?","options":["Công tơ ngừng hoạt động khi có tải.","Công tơ hoạt động khi có tải.","Công tơ lúc hoạt động, lúc không hoạt động khi có tải","Đáp án a và c."],"correct":3,"explain":""},{"q":"Khi phát hiện hành vi trộm cắp điện, thẩm quyền kiểm tra và lập biên bản kiểm tra sử dụng điện thuộc về chức danh công việc nào?","options":["Tổ trưởng Tổ kiểm tra và giám sát điện năng.","Công nhân kiểm tra.","Kiểm tra viên.","Tất cả đáp án trên."],"correct":3,"explain":""},{"q":"Khi thực hiện công tác, công nhân phát hiện phải báo cáo đối với trường hợp nào sau đây?","options":["Cáp murler được hàn nối khoảng giữa.","Cáp nhị thứ được hàn nối khoảng giữa","Cáp duplex được hàn nối khoảng giữa.","Đáp án a và b.","Tất cả đáp án trên."],"correct":4,"explain":""},{"q":"Thời hạn tối đa để báo cáo khi phát hiện HTĐĐ bất thường?","options":["2 giờ làm việc.","4 giờ làm việc.","8 giờ.","24 giờ."],"correct":3,"explain":""},{"q":"Khi phát hiện HTĐĐ bất thường, công nhân phát hiện phải báo cáo trong thời gian tối đa là bao nhiêu lâu?","options":["4 giờ.","8 giờ.","24 giờ.","02 ngày."],"correct":2,"explain":""},{"q":"Công nhân phát hiện HTĐĐ bất thường phải thực hiện báo cáo trong thời gian tối đa là bao nhiêu lâu?","options":["8 giờ.","24 giờ.","02 ngày.","03 ngày."],"correct":1,"explain":""},{"q":"Hãy chọn ký hiệu có in trên viên chì niêm phong nắp đậy đầu dây công tơ?","options":["EVN HCMC","HCMC","HCM"],"correct":2,"explain":""},{"q":"Hãy chọn ký hiệu có in trên viên chì niêm phong hộp bảo vệ công tơ?","options":["HCM","EVN HCMC","HCMC"],"correct":0,"explain":""},{"q":"Hãy chọn đáp án vị trí lắp đặt công tơ sai quy định?","options":["Lắp đặt ngoài thùng bảo vệ.","Lắp đặt tại khu vực sản xuất có nhiệt độ thường xuyên trên 40 độ C","Lắp đặt ngoài khu vực của Bên mua điện.","Đáp án a và b.","Tất cả đáp án trên."],"correct":3,"explain":""},{"q":"Hành vi nào sau đây vi phạm hành chính trong lĩnh vực Điện lực?","options":["Tháo lắp thiết bị đo đếm mà không được sự đồng ý của Bên mua điện.","Tháo lắp thiết bị đo đếm mà không có thẻ cán bộ công nhân viên.","Tháo lắp thiết bị đo đếm khi không có lệnh công tác hoặc không được phân công nhiệm vụ.","Cả 3 đáp án trên."],"correct":2,"explain":""},{"q":"Hành vi nào sau đây vi phạm hành chính về lĩnh vực điện lực?","options":["Bên mua điện tự ý di dời công tơ.","Bên bán điện xử lý sự cố quá 02 giờ mà không có lí do chính đáng.","Bên bán điện ngừng, giảm mức cung cấp điện mà không thông báo theo quy định.","Tất cả các hành vi trên"],"correct":3,"explain":""},{"q":"Trường hợp ngừng cấp điện nào sau đây, bên bán điện không phải thực hiện thông báo thời điểm ngừng cấp điện trước 24 giờ?","options":["Bên mua điện không thực hiện biện pháp bảo đảm thực hiện hợp đồng theo thỏa thuận.","Bên mua điện không duy trì biện pháp bảo đảm thực hiện hợp đồng theo thỏa thuận.","Bên mua điện không thanh toán tiền điện.","Bên mua điện có hành vi trộm cắp điện."],"correct":3,"explain":""},{"q":"Hành vi nào sau đây của bên bán điện bị xử phạt vi phạm hành chính trong lĩnh vực điện lực?","options":["Không nghiệm thu đúng thời hạn quy định sau khi lắp đặt, thay thế, sửa chữa hoặc hiệu chỉnh thiết bị đo đếm điện.","Không có thẻ nghiệp vụ mà hiệu chỉnh thiết bị đo đếm trên lưới điện.","Tháo, lắp thiết bị đo đếm trên lưới điện khi không được giao nhiệm vụ.","Cả ba đáp án trên."],"correct":3,"explain":""},{"q":"Hành vi nào sau đây của bên bán điện bị xử phạt vi phạm hành chính trong lĩnh vực điện lực?","options":["Không hoàn thành sửa chữa, thay thế thiết bị đo đếm trong thời hạn 03 ngày khi phát hiện hư hỏng.","Không hoàn thành sửa chữa, thay thế thiết bị đo đếm trong thời hạn 03 ngày khi nhận được yêu cầu của bên mua điện.","Không hoàn thành kiểm tra, sửa chữa, thay thế thiết bị đo đếm trong thời hạn 03 ngày làm việc khi nhận được yêu cầu của bên mua điện.","Không hoàn thành kiểm tra, sửa chữa, thay thế thiết bị đo đếm trong thời hạn 05 ngày khi nhận được yêu cầu của bên mua điện."],"correct":2,"explain":""},{"q":"Trong điều kiện bình thường, tại vị trí đặt thiết bị đo đếm độ lệch điện áp so với điện áp danh định của lưới điện cho phép trong khoảng bao nhiêu?","options":["+5% đến -10%","± 2%","± 5%","+5% đến -10%"],"correct":2,"explain":""},{"q":"Trường hợp thiết bị đo đếm điện không chính xác so với tiêu chuẩn quy định, nếu xác định được thời gian thiết bị đo đếm điện chạy nhanh, bên bán điện có trách nhiệm:","options":["Hoàn trả lại tiền điện năng đã thu cho bên mua điện.","Hoàn trả lại tiền điện năng thực tế đã thu vượt trội cho bên mua điện.","Hoàn trả lại tiền điện năng đã thu vượt trội cho bên mua điện theo thời hạn tính toán là 01 chu kỳ ghi chỉ số công tơ điện không bao gồm kỳ đang sử dụng điện nhưng chưa đến ngày ghi chỉ số.","Hoàn trả số tiền điện thực tế đã thu vượt trội bằng cách trừ vào tiền điện bên mua điện phải trả trong kỳ kế tiếp."],"correct":1,"explain":""},{"q":"Trường hợp thiết bị đo đếm điện không chính xác so với tiêu chuẩn quy định, nếu không xác định được thời gian thiết bị đo đếm điện chạy nhanh, bên bán điện có trách nhiệm:","options":["Hoàn trả lại tiền điện năng đã thu cho bên mua điện.","Hoàn trả lại tiền điện năng thực tế đã thu vượt trội cho bên mua điện.","Hoàn trả lại tiền điện năng đã thu vượt trội cho bên mua điện theo thời hạn tính toán là 01 chu kỳ ghi chỉ số công tơ điện không bao gồm kỳ đang sử dụng điện nhưng chưa đến ngày ghi chỉ số.","Hoàn trả số tiền điện thực tế đã thu vượt trội bằng cách trừ vào tiền điện bên mua điện phải trả trong kỳ kế tiếp."],"correct":2,"explain":""},{"q":"Chu kỳ thực hiện kiểm tra định kỳ các TBĐĐ đang vận hành được quy định như sau:","options":["TBĐĐ 1 pha, đo đếm trực tiếp: không quá 03 năm/lần","TBĐĐ 1 pha, đo đếm gián tiếp: không quá 02 năm/lần","Căn cứ tình hình cụ thể của từng đơn vị, Giám đốc Công ty Điện lực có thể quyết định rút ngắn chu kỳ kiểm tra định kỳ TBĐĐ tại các đơn vị","Tất cả đáp án trên đều đúng.","Đáp án a và b."],"correct":3,"explain":""},{"q":"Chu kỳ thực hiện kiểm tra định kỳ các TBĐĐ đang vận hành được quy định như sau:","options":["TBĐĐ 3 pha có điện năng trung bình dưới 100.000 kWh/tháng: không quá 01 năm/lần.","TBĐĐ có điện năng trung bình từ 100.000 kWh/tháng trở lên: không quá 06 tháng/lần","Đáp án a và b đúng.","Tất cả đáp án trên đều sai."],"correct":2,"explain":""},{"q":"Kiểm tra đột xuất HTĐĐ được thực hiện khi:","options":["Phát hiện TBĐĐ có dấu hiệu bất thường","Kiểm tra theo yêu cầu của ngành Điện, của Cơ quan Nhà nước","Kiểm tra theo yêu cầu của khách hàng.","Tất cả đáp án trên đều đúng.","Đáp án a và b đúng."],"correct":3,"explain":""},{"q":"Khi tiến hành kiểm tra đột xuất hoặc kiểm tra định kỳ TBĐĐ mà phải tháo gỡ chì niêm hộp đấu dây, đơn vị điện lực phải tiến hành:","options":["Kiểm tra theo ý kiến của Công An địa phương","Kiểm tra theo ý kiến của người làm chứng","Kiểm tra theo trình tự quy định của Bộ Công Thương","Tất cả đáp án trên đều đúng."],"correct":2,"explain":""},{"q":"Khi thực hiện kiểm tra định kỳ đối với TBĐĐ 1 pha trực tiếp cần thực hiện các nội dung sau:","options":["Kiểm tra sự nguyên vẹn của chì niêm, niêm phong TBĐĐ.","Kiểm tra dấu hiệu bị hư hỏng hoặc hoạt động bất thường của TBĐĐ.","Sử dụng biên bản kiểm tra treo tháo TBĐĐ","Tất cả đáp án trên đều đúng.","Đáp án a và b đúng."],"correct":4,"exp iểm tra và thông báo nội dung kiểm tra cho bên được kiểm tra biết","Khi tiến hành kiểm tra, bên kiểm tra phải tổ chức nhóm kiểm tra hoặc đoàn kiểm tra có nhóm trưởng hoặc trưởng đoàn kiểm tra, trong đó ít nhất phải có 01 (một) Kiểm tra viên điện lực. Kiểm tra viên điện lực có trách nhiệm xuất trình thẻ Kiểm tra viên điện lực và thông báo nội dung kiểm tra cho bên được kiểm tra biết.","Khi tiến hành kiểm tra, bên kiểm tra phải tổ chức nhóm kiểm tra hoặc đoàn kiểm tra có Lãnh đạo công ty điện lực và công nhân kiểm tra và thông báo nội dung kiểm tra cho bên được kiểm tra biết.","Khi tiến hành kiểm tra, bên kiểm tra phải tổ chức nhóm kiểm tra hoặc đoàn kiểm tra có nhóm trưởng hoặc trưởng đoàn kiểm tra, trong đó thành phần đoàn kiểm tra phải là Kiểm tra viên điện lực. Kiểm tra viên điện lực có trách nhiệm xuất trình thẻ Kiểm tra viên điện lực và thông báo nội dung kiểm tra cho bên được kiểm tra biết."],"correct":1,"explain":""}]},{"name":"Ghi điện & Đo xa","addedAt":1789792793115,"questions":[{"q":"Mã ghi điện nào dùng để ghi chỉ số được lấy từ hệ thống đo xa:","options":["Mã Z","Mã V","Mã U","Mã Y"],"correct":0,"explain":""},{"q":"Mã ghi điện dùng để ghi chỉ số được lấy từ hệ thống đo xa, mã nào sau đây có chỉ số bằng 0 hoặc chỉ số nhỏ hơn chỉ số của kỳ trước.","options":["Mã T","Mã A","Mã U","Mã Q"],"correct":1,"explain":""},{"q":"Mã ghi điện dùng để ghi chỉ số công tơ bị gỡ hoặc không còn tại chổ:","options":["Mã T","Mã V","Mã U","Mã G"],"correct":3,"explain":""},{"q":"Mã ghi điện dùng để ghi chỉ số công tơ bị ghi lố:","options":["Mã L","Mã V","Mã U","Mã G"],"correct":0,"explain":""},{"q":"Mã ghi điện dùng để ghi chỉ số công tơ đã qua tua:","options":["Mã L","Mã Q","Mã U","Mã G"],"correct":1,"explain":""},{"q":"Mã ghi điện dùng để ghi chỉ số công tơ xác định là chỉ số đúng:","options":["Mã L","Mã Q","Mã Y","Mã G"],"correct":2,"explain":""},{"q":"Mã ghi điện dùng để ghi chỉ số công tơ bị cắt điện do Công ty Điện lực thực hiện:","options":["Mã D.","Mã Q.","Mã Y.","Mã U. ect":1,"explain":""},{"q":"Theo quy định khách hàng có số lần ghi điện và lập hóa đơn tiền điện 02 lần trong tháng là:","options":["Khách hàng là đối tượng sản xuất kinh doanh được lắp công tơ điện tử.","Khách hàng có mức tiêu thụ bình quân trên 50.000kWh/tháng.","Khách hàng sử dụng điện có điện năng tiêu thụ bình quân từ 50.000 đến 100.000kWh/tháng.","Khách hàng sử dụng điện có mức điện năng tiêu thụ bình quân từ  trên 100.000kWh/tháng"],"correct":2,"explain":""},{"q":"Khi khách hàng  khiếu nại về chỉ số công tơ, Điện lực phải thực hiện phúc tra theo phiếu yêu cầu trong thời gian bao lâu?","options":["Ngay ngày hôm sau.","Trong vòng 24 giờ.","05 ngày sau.","07 ngày sau"],"correct":1,"explain":""},{"q":"Để kiểm tra xem công tơ điện tử có đang vận hành ở chế độ mang tải, ta phải quan sát đặc điểm gì trên công tơ?","options":["Đĩa từ của công tơ quay.","Vòng quay số hàng đơn vị quay.","Đèn led của công tơ chớp, tắt.","Công tơ phát ra âm thanh thông báo."],"correct":2,"explain":""},{"q":"Nếu đơn vị tính trên công tơ điện tử 3 giá là MWh thì trên MTB hệ số nhân hiển thị là:","options":["10.","100.","1000.","Cả 3 câu trên đều sai."],"correct":2,"explain":""},{"q":"Theo quy định thì sai lệch thời gian hiển thị trên công tơ điện tử với đồng hồ chuẩn tối đa là bao nhiêu phút thì phải thông báo về Điện lực để thay công tơ khác?","options":["± 5 phút.","± 10 phút.","± 15 phút.","± 20 phút."],"correct":2,"explain":""},{"q":"Theo quy trình công tơ có điện năng tiêu thụ tăng hoặc giảm bất thường bao nhiêu phần trăm thì phải tổ chức kiểm tra chỉ số:","options":["± 20 %","± 30 %","± 40 %","± 50 %"],"correct":1,"explain":""},{"q":"Khách hàng sử dụng điện cho mục đích thắp sáng sinh hoạt thì ghi điện viên được phép đánh mã T, V mấy kỳ liên tiếp?","options":["Không được phép đánh mã T, V.","1 kỳ.","2 kỳ.","3 kỳ"],"correct":2,"explain":""},{"q":"Khách hàng khiếu nại sai chỉ số phải tổ chức kiểm tra, giải quyết trong thời hạn bao lâu:","options":["02 ngày.","03 ngày.","Nhỏ hơn hoặc bằn  nghệ PLC hoặc RF-Mesh yêu cầu thu thập dữ liệu các sự kiện, cảnh báo kèm thời gian xảy ra sự kiện","options":["30 phút/lần","60 phút/lần","Không yêu cầu","120 phút/lần"],"correct":2,"explain":""},{"q":"Thời gian khai báo thông tin điểm đo trên phần mềm EVNHES được quy định như thế nào?","options":["Không quá 48h00 sau khi hoàn tất công tác lắp đặt","Từ 1 đến 3 ngày sau khi hoàn tất công tác lắp đặt","Không quá 24h00 sau khi hoàn tất công tác khai báo điểm đo trên hệ thống CMIS","Trong 48h00 sau khi hoàn tất công tác lắp đặt"],"correct":2,"explain":""},{"q":"Công ty Điện lực chịu trách nhiệm tổ chức đào tạo, bồi huấn cho các bộ phận, nhân viên được giao nhiệm vụ quản lý, vận hành, khai thác dữ liệu đo đếm từ xa, xử lý mất kết nối","options":["Hàng quý","Hàng năm","Định kỳ 6 tháng/lần","Hàng tháng"],"correct":2,"explain":""},{"q":"Công ty Lưới điện Cao thế chịu trách nhiệm quản lý các điểm đo","options":["Điểm đo ranh giới giữa Công ty Điện lực và Công ty Lưới điện Cao thế nằm ngoài trạm cao thế","Điểm đo đầu nguồn của Tổng công ty nằm trong các trạm trung gian do PTC4, Tổng công ty Điện lực Miền Nam quản lý.","Điểm đo đầu nguồn ranh giới lẻ (nếu có) nằm ngoài trạm trung gian.","Tất cả đều đúng"],"correct":1,"explain":""},{"q":"Theo hướng dẫn quản lý vận hành hệ thống đo xa tại phụ lục IX Quyết định 2599/QĐ-EVNHCMC ngày 30/5/2025, bộ phận nào chịu trách nhiệm theo dõi các điểm đo mất kết nối tại Công ty Điện lực","options":["Đội QLHTĐĐ","Đội QLVH","Phòng Kỹ thuật","Phòng Kinh doanh"],"correct":3,"explain":""},{"q":"Theo hướng dẫn quản lý vận hành hệ thống đo xa tại phụ lục IX Quyết định 2599/QĐ-EVNHCMC ngày 30/5/2025, sau khi hoàn tất công tác khắc phục các điểm đo mất kết thì đơn vị quản lý điểm đo ghi nhận nguyên nhân mất kết nối vào biên bản kiểm tra hiện trường và cập nhật trên phần mềm nào?","options":["Phần mềm EVNHES","Phần mềm CMIS","Phần mềm MDIS","Phần mềm MDMS"],"correct":2,"explain":""},{"q":"Theo hướng dẫn quản lý vận hành hệ thống đo xa tại phụ lục IX Q ả tỉ số biến hiện hữu nếu là công tơ gián tiếp), đảm bảo công tơ không VPSDĐ và các thông số phù hợp trước khi tháo.","Khi tháo công tơ về, CTĐL thực hiện hậu kiểm tình trạng công tơ, chỉ số ngưng công tơ trước khi chuyển tái kiểm định.","Tất cả các đáp án đều đúng."],"correct":3,"explain":""},{"q":"Chọn câu đúng về trình tự thực hiện cần thiết khi thay kiểm định biến dòng điện đo lường.","options":["Chọn biến dòng đã được kiểm định và có tỉ số biến phù hợp với biến dòng điện cần thay thế.","Kiểm tra tình trạng và tỉ số của cả 03 biến dòng tại điểm đo đang công tác (kể cả biến dòng chưa đến hạn), đảm bảo các biến dòng hiện hữu không bị tác động trộm cắp điện và có cùng tỉ số trước khi tháo.","Kiểm tra tỉ số các biến dòng hiện hữu, đảm bảo phù hợp với tỉ số biến hiển thị trên công tơ và tỉ số biến được lập trình. Khi tháo biến dòng về, CTĐL thực hiện hậu kiểm trước khi chuyển tái kiểm định.","Tất cả các đáp án đều đúng."],"correct":3,"explain":""},{"q":"Chọn câu đúng về trình tự thực hiện cần thiết khi gắn mới công tơ điện.","options":["Chỉ thực hiện gắn mới công tơ khi đã ký hợp đồng mua bán điện","Kiểm tra tình trạng công tơ trước khi gắn (công tơ đã được kiểm định và phân bổ CMIS), kiểm tra tình trạng hoạt động của công tơ sau khi gắn, đảm bảo công tơ hoạt động bình thường.","Kiểm tra tỉ số các biến dòng hiện hữu, đảm bảo phù hợp với tỉ số biến hiển thị trên công tơ và tỉ số biến được lập trình.","Tất cả các đáp án đều đúng."],"correct":3,"explain":""},{"q":"Chọn câu đúng về hiệu lực thiết bị đo đếm sau kiểm định hiện nay tính theo ngày (từ ngày đến ngày của tháng kiểm định).","options":["60 tháng; 60 tháng; 60 tháng; 36 tháng.","72 tháng; 60 tháng; 60 tháng; 36 tháng.","60 tháng; 60 tháng; 60 tháng; 24 tháng.","Các câu trên đều sai."],"correct":1,"explain":""},{"q":"Chọn câu đúng về hiệu lực thiết bị đo đếm sau kiểm định hiện nay tính theo tháng (từ tháng đến tháng của tháng kiểm định).","options":["72 tháng; 60 tháng; 36 tháng; 36 tháng.","72 tháng; 60 tháng; 36 tháng; 36 tháng.","71 tháng; 60 tháng; 36 tháng; 48 tháng.","Các câu trên đều sai."],"correct":3,"explain":""},{"q":"Luật Đo lường quy định, thiết bị đo đếm điện năng trước khi lắp đặt để buôn bán điện với khách hàng phải được:","options":["Kiểm định đạt và đã được bấm chì kiểm định theo đúng quy định.","Kiểm định đạt và dán tem kiểm định.","Bấm chì niêm kiểm định của chính tổ chức kiểm định.","Phê duyệt mẫu, kiểm định đạt và đã được niêm chì của chính tổ chức kiểm định được Ủy ban Tiêu chuẩn Đo lường Chất lượng Quốc gia (Tổng cục Tiêu chuẩn Đo lường Chất lượng) chỉ định."],"correct":3,"explain":""},{"q":"Căn cứ vào đâu để biết thiết bị đo đếm điện năng đến hạn kiểm định định kỳ:","options":["Căn cứ ngày nhập dữ liệu kiểm định (giấy chứng nhận kiểm định), hoặc và chì kiểm định.","Căn cứ vào ngày đưa thiết bị đo đếm lên lưới điện.","Căn cứ vào chì kiểm định mà không phải phân biệt là dấu kiểu 1 hay kiểu 2.","Căn cứ vào Thông tư 23/2013 và Thông tư 07/2019."],"correct":0,"explain":""},{"q":"Đơn vị thực hiện kiểm định thiết bị đo đếm trước khi đưa vào sử dụng lắp đặt cho khách hàng là:","options":["Chỉ duy nhất Công ty Thí nghiệm Điện lực TPHCM.","Công ty Thí nghiệm Điện lực TPHCM, hoặc các Tổ chức kiểm định đã được Ủy ban Tiêu chuẩn Đo lường Chất lượng Quốc gia (Tổng cục Tiêu chuẩn Đo lường Chất lượng) chỉ định và còn hiệu lực.","Công ty Thí nghiệm Điện lực TP.HCM hoặc Trung tâm Kỹ thuật Tiêu chuẩn Đo lường Chất lượng TP.HCM.","Công ty Thí nghiệm Điện lực TPHCM, Công ty Thí nghiệm điện Miền nam, Trung tâm trực thuộc Sở KHCN TP.HCM,"],"correct":1,"explain":""},{"q":"Trong các dịch vụ khách hàng, dịch vụ nào Công ty Điện lực không trực tiếp thực hiện:","options":["Thay di dời hệ thống đo đếm (kể cả cáp phục vụ đo đếm).","Tăng cường công suất.","Kiểm định công tơ điện, biến dòng (CT/TI), biến điện áp (VT/TU).","Tất cả các đáp án đều đúng."],"correct":2,"explain":""},{"q":"Trong các dịch vụ khách hàng, dịch vụ nào Công ty Điện lực trực tiếp thực hiện:","options":["Kiểm định công tơ điện.","Thử nghiệm hệ thống NLMT trước khi hòa lưới.","Kiểm định thiết bị đo đếm điện năng.","Tất cả các đáp án đều sai."],"correct":3,"explain":""},{"q":"Trách nhiệm của Công ty Điện lực trong công tác quản lý thiết bị đo đếm điện năng là:","options":["Quản lý, lắp đặt và tháo gỡ HTĐĐ trên địa bàn do CTĐL quản lý, kiểm tra và giải quyết kịp thời các trường hợp TBĐĐ hư, cháy và các khiếu nại của KH về TBĐĐ.","Đảm bảo các TBĐĐ mua và bán điện tuân theo quy định của Luật Đo lường về phê duyệt mẫu và chu kỳ kiểm định.","TBĐĐ khi lắp đặt phải đảm bảo đo đếm đúng và đủ, đảm bảo 100% TBĐĐ khi lên lưới phải được ghi điện, thu tiền đầy đủ.","Tất cả các đáp án đều đúng."],"correct":3,"explain":""},{"q":"Việc giữ kìm niêm phong thiết bị đo đếm được quy định:","options":["Nhân viên sử dụng kìm niêm phong thiết bị đo đếm phải chịu trách nhiệm về việc niêm phong với mã hiệu mà mình được cấp, có thể giao người khác sử dụng nếu có sự chỉ đạo của Lãnh đạo đơn vị.","Nhân viên sử dụng kìm niêm phong thiết bị đo đếm tuyệt đối không được lưu giữ kìm niêm phong nắp đậy đầu dây qua đêm tại nhà mà không trả về đơn vị, trừ khi có sự đồng ý của Lãnh đạo đơn vị.","Nhân viên sử dụng kìm niêm phong thiết bị đo đếm phải chịu trách nhiệm về việc niêm phong với mã hiệu mà mình được cấp, tuyệt đối không được giao kìm cho người khác sử dụng. Tuyệt đối không được lưu giữ kìm niêm phong nắp đậy đầu dây qua đêm tại nhà mà không trả về đơn vị theo quy định. Ngoài ra, đối với trường hợp công tác đêm phải có giấy công tác do Lãnh đạo đơn vị duyệt.","Tuyệt đối không được lưu giữ kìm niêm phong nắp đậy đấu dây qua đêm tại nhà mà không trả về đơn vị theo quy định. Ngoại trừ trường hợp công tác đêm thì được mang về nhà, hoặc Lãnh đạo đơn vị cho phép."],"correct":2,"explain":""},{"q":"Quy định về quản lý kìm niêm phong thiết bị đo đếm:","options":["Các CTĐL có địa bàn rộng có thể lập nhiều tủ kìm để quản lý.","Tủ kìm cá nhân phải được đặt bên trong “Tủ kìm lớn”, Lãnh đạo CTĐL phải đảm bảo việc kiểm soát chặt chẽ, bao gồm cả việc phải kiểm tra đột xuất và thường xuyên.","Mỗi trụ sở (chi nhánh) có đặt tủ kìm phục vụ công tác đều phải bố trí tủ kìm trả trễ tương ứng tại phòng bảo vệ trụ sở chi nhánh đó.","Tất cả các đáp án đều đúng."],"correct":3,"explain":""},{"q":"Nhân viên 'X' giữ kìm thuộc Đội Quản lý hệ thống đo đếm tại Công ty Điện lực 'Y', khi 'X' được điều động từ tổ này qua tổ khác (địa bàn xã/phường này qua xã phường khác) thì CTĐL 'Y' có trách nhiệm:","options":["CTĐL 'Y' cấp kìm mới (kìm và mặt kìm) cho nhân viên 'X' để công tác tại địa bàn mới.","CTĐL 'Y' cho phép nhân viên 'X' tiếp tục sử dụng kìm cũ (kìm và mặt kìm) đã cấp trước đây, CTĐL không được phép cấp kìm mới cho nhân viên 'X' vì 'X' vẫn đang công tác tại CTĐL 'Y'.","CTĐL 'Y' cho phép nhân viên 'X' tiếp tục sử dụng kìm cũ (kìm và mặt kìm) đã cấp trước đây, hoặc CTĐL 'Y' được phép cấp kìm mới cho nhân viên 'X', nhưng CTĐL 'Y' phải thực hiện đúng thủ tục thu hồi hoàn tất trước khi làm thủ tục cấp kìm mới cho nhân viên  'X'.","Tất cả các đáp án đều sai."],"correct":2,"explain":""},{"q":"Quy định về quản lý mã kìm niêm phong thiết bị đo đếm:","options":["Mỗi mã kìm được cấp cho một nhân viên, chỉ được phép cấp mã kìm này cho nhân viên khác khi và chỉ khi nhân viên này chuyển công tác (hoặc nghỉ việc).","Mỗi mã kìm được cấp cho một nhân viên, nên nhân viên sẽ mang theo kìm của mình khi được tăng cường đến CTĐL bạn.","Mỗi mã kìm được cấp cho một nhân viên, khi nhân viên này chuyển công tác (hoặc nghỉ việc) thì mã kìm này không được phép cấp cho nhân viên khác.","Nhân viên Q được cấp mã kìm ABC. Khi nhân viên Q được chuyển công tác thì mã kìm ABC không được cấp cho người khác và cũng không được cấp lại cho nhân viên Q."],"correct":2,"explain":""},{"q":"Công tơ điện tử một pha CE14, 20(80)A, CCX là 1, giả sử có kết quả kiểm chứng như sau:\n 10 In                     50 In               100 In                100 In                   Imax\nCosØ = 1          CosØ = 1          CosØ = 1         CosØ = 0,5L           CosØ = 1\n   -1,1                    +1,1                   +0,9                 -0,8                     +0,8","options":["Công tơ này đạt cấp chính xác 2.","Công tơ này không đạt cấp chính xác 2.","Công tơ này đạt cấp chính xác 1.","Công tơ này không đạt cấp chính xác 1."],"correct":3,"explain":""},{"q":"Trường hợp kiểm tra phát hiện công tơ điện bị mất, cháy hỏng, hoặc hoạt động bất thường thì trong thời gian 'N' ngày làm việc kể từ khi phát hiện, CTĐL thực hiện thay thế TBĐĐ cho khách hàng, tính toán truy thu hoặc thoái hoàn điện năng theo HĐMBĐ đã ký kết và các quy định pháp luật, vậy 'N' ngày là:","options":["01 ngày.","02 ngày.","03 ngày.","04 ngày."],"correct":0,"explain":""},{"q":"Đơn vị chịu trách nhiệm cập nhật ngày kiểm định của thiết bị đo đếm vào chương trình CMIS là:","options":["Đơn vị kiểm định.","Công ty Thí nghiệm Điện lực TP.HCM.","Công ty Dịch vụ Điện lực TP.HCM.","Công ty Thí nghiệm Điện lực TP.HCM cập nhật, ngoại trừ hàng mua mới không do Công ty Thí nghiệm Điện lực TP.HCM."],"correct":3,"explain":""},{"q":"Bên mua điện có yêu cầu kiểm tra HTĐĐ, Bên bán điện thực hiện kiểm tra, sửa chữa, thay thế (nếu cần) và lập biên bản có chữ ký xác nhận của đại diện 02 bên (mua và bán) trong thời gian được Quy định như sau:","options":["Công ty Điện lực thực hiện không quá 03 ngày làm việc đối với công tơ.","Công ty Điện lực thực hiện không quá 05 ngày làm việc đối với công tơ.","Công ty Điện lực thực hiện không quá 07 ngày làm việc đối với công tơ.","Tất cả các đáp án đều đúng."],"correct":0,"explain":""},{"q":"Đối với trường hợp bên mua điện (khách hàng) có nhu cầu ‘thay đổi vị trí thiết bị đo đếm’ thì chi phí do:","options":["Khách hàng chịu mọi chi phí.","Công ty Điện lực chịu mọi chi phí.","Khách hàng chịu mọi chi phí, trừ chi phí đào đường.","Khách hàng chịu mọi chi phí, trừ chi phí thiết bị đo đếm và thiết bị đóng cắt là tài sản của ngành điện."],"correct":3,"explain":""},{"q":"Khi khách hàng có yêu cầu kiểm tra VT-CT, CTĐL thực hiện kiểm tra, sửa chữa, thay thế VT-CT (nếu cần) và lập biên bản có chữ ký xác nhận của khách hàng (hoặc đại diện khách hàng) trong thời gian:","options":["Công ty Điện lực thực hiện không quá 03 ngày làm việc.","Công ty Điện lực thực hiện không quá 05 ngày làm việc.","Công ty Điện lực thực hiện không quá 07 ngày làm việc.","Công ty Điện lực thực hiện không quá 01 ngày làm việc."],"correct":0,"explain":""},{"q":"Hộ Kinh doanh X (thuê nhà/xưởng của bà H và tại một địa chỉ bà H đang sử dụng công tơ đo đếm gián tiếp của Điện lực nhưng ĐNTT bằng 0 trong vòng 06 tháng liên tục) đang sử dụng điện thông qua công tơ 3 pha đo đếm trực tiếp, khi HKD X có nhu cầu tăng cường công suất thì CTĐL cần thực hiện:","options":["CTĐL yêu cầu HKD X tự làm việc với bà H để được nhường lại 01 công tơ gián tiếp.","CTĐL không tăng cường công suất cho HKD X.","CTĐL thực hiện tăng cường công suất cho HKD X, đồng thời CTĐL phải trực tiếp làm việc với bà H để thu hồi các công tơ không sử dụng điện nhiều kỳ theo đúng quy định.","Tất cả các đáp án đều đúng."],"correct":2,"explain":""},{"q":"Hệ thống đo đếm hạ thế sử dụng công tơ điện tử 3 pha gián tiếp và CT có tỉ số biến 300/5 (220/380V), có K = 450 xung/kWh, khi đếm được 90 xung, điện năng tải sử dụng là:","options":["6 kW.","12 kWh.","20 kWh.","24 kWh."],"correct":1,"explain":""}]},{"name":"Kiểm tra","addedAt":1789792793162,"questions":[{"q":"Luật Điện lực quy định nào sau đây là đúng ?","options":["Khách hàng sử dụng điện có quyền tự tháo gỡ, di dời công tơ điện khi có nhu cầu.","Khách hàng sử dụng điện có quyền gọi thợ điện tháo gỡ, di dời công tơ điện khi có nhu cầu.","Khách hàng sử dụng điện không được tự ý tháo gỡ, di chuyển công tơ điện. Khi có nhu cầu di chuyển công tơ điện sang vị trí khác, phải được sự đồng ý của bên bán điện và phải chịu chi phí di chuyển.","Các câu trên đều đúng."],"correct":2,"explain":""},{"q":"Luật Điện lực quy định nào sau đây là đúng ?","options":["Đơn vị bán lẻ điện được vào khu vực quản lý của bên mua điện để kiểm tra, ghi chỉ số đo điện năng và liên hệ với khách hàng.","Đơn vị bán lẻ điện không được vào khu vực quản lý của bên mua điện.","Đơn vị bán lẻ điện chỉ được vào khu vực quản lý của bên mua điện để liên hệ với khách hàng.","Các câu trên đều đúng."],"correct":0,"explain":""},{"q":"Sở Công Thương có thẩm quyền giải quyết tranh chấp hợp đồng mua bán điện ở cấp điện áp nào?","options":["Cấp điện áp 110kV trở lên.","Cấp điện áp từ 110kV trở lên.","Cấp điện áp trên 110kV.","Cấp điện áp dưới 110kV."],"correct":3,"explain":""},{"q":"Cục Điều tiết điện lực có thẩm quyền giải quyết tranh chấp hợp đồng mua bán điện ở cấp điện áp nào ?","options":["Cấp điện áp 110kV.","Cấp điện áp đến 110kV.","Cấp điện áp trên 110kV.","Cấp điện áp từ 110kV."],"correct":3,"explain":""},{"q":"Luật Điện lực quy định nào sau đây là đúng ?","options":["Đơn vị bán lẻ điện không có nghĩa vụ kiểm tra thực hiện Hợp đồng mua bán điện.","Đơn vị bán lẻ điện không được kiểm tra thực hiện Hợp đồng mua bán điện.","Đơn vị bán lẻ điện có nghĩa vụ phải kiểm tra việc thực hiện Hợp đồng mua bán điện đối với Bên mua điện.","Các câu trên đều đúng."],"correct":2,"explain":""},{"q":"Khi tranh chấp hợp đồng mua bán điện thì trình tự giải quyết là:","options":["Tự thương lượng; đề nghị Sở Công Thương giải quyết; khởi kiện dân sự.","Đề nghị Sở Công Thương; khởi kiện dân sự; đề nghị Cục Điều tiết Điện lực giải quyết.","Tự thương lượng; khởi kiện dân sự; đề nghị Sở Công Thương giải quyết.","Đề nghị Sở Công Thương giải quyết; đề nghị Cục Điều tiết Điện lực giải quyết; khởi kiện dân sự."],"correct":0,"explain":""},{"q":"Trường hợp nào sau đây thuộc đối tượng phải mua công suất phản kháng ?","options":["Bên mua điện có trạm biến áp riêng hoặc có công suất sử dụng cực đại đăng ký trong hợp đồng mua bán điện từ 40kW trở lên và có hệ số công suất cosɸ <0,9.","Bên mua điện có trạm biến áp riêng hoặc có công suất sử dụng cực đại đăng ký trong hợp đồng mua bán điện trên 40kW và có hệ số công suất cosɸ <0,9.","Bên mua điện có trạm biến áp riêng hoặc có công suất sử dụng cực đại đăng ký trong hợp đồng mua bán điện từ 80kW trở lên.","Bên mua điện có trạm biến áp riêng hoặc có công suất sử dụng cực đại đăng ký trong hợp đồng mua bán điện từ 80kW trở lên và có hệ số công suất cosɸ <0,9."],"correct":0,"explain":""},{"q":"Luật Điện lực quy định nào sau đây là đúng ?","options":["Khách hàng sử dụng điện có quyền cản trở cơ quan, tổ chức, cá nhân có thẩm quyền kiểm tra sử dụng điện.","Khách hàng sử dụng điện không có quyền cản trở cơ quan, tổ chức, cá nhân có thẩm quyền sửa chữa, cải tạo, khắc phục sự cố đối với công trình điện lực, kiểm tra, giám sát hoạt động điện lực và sử dụng điện.","Khách hàng sử dụng điện có quyền ngăn chặn cơ quan, tổ chức, cá nhân có thẩm quyền sửa chữa, cải tạo, khắc phục sự cố đối với công trình điện lực.","Các câu trên đều đúng."],"correct":1,"explain":""},{"q":"Thông tư 56/2025/TT-BCT ngày 27/11/2025 quy định:","options":["Kiểm tra viên điện lực phải thực hiện các công việc khi kiểm tra phát hiện có hành vi trộm cắp điện","Quy định về quy trình kiểm tra chuyên ngành Công Thương theo quy định tại điểm b khoản 2 Điều 18 Nghị định số 217/2025/NĐ-CP.","Thông báo cho bên mua điện trước 24 giờ để thực hiện ngừng cấp điện.","Các câu trên đều đúng."],"correct":1,"explain":""},{"q":"Ai sẽ là người có trách nhiệm chuyển hồ sơ vụ trộm cắp điện để truy cứu hình sự ?","options":["Chủ tịch UBND thành phố.","Người có thẩm quyền xử phạt vi phạm hành chính theo quy định.","Chánh Thanh tra Sở Công Thương.","Chủ tịch quận/huyện."],"correct":1,"explain":""},{"q":"Thông tư 42/2022/TT-BCT ngày 30/12/2022 quy định:","options":["Phương pháp xác định số tiền trộm cắp điện từ sản lượng điện năng trộm cắp.","Thời gian truy thu là 365 ngày, trừ thời gian ngừng cấp điện và ngừng sử dụng điện có lý do.","Thời gian truy thu là 12 tháng, trừ thời gian ngừng cấp điện và ngừng sử dụng điện có lý do.","Thời gian truy thu là 12 tháng, trừ thời gian ngừng cấp điện và ngừng sử dụng điện."],"correct":0,"explain":""},{"q":"Bên bán điện bị xử phạt vi phạm hành chính trong lĩnh vực điện lực khi thực hiện hành vi nào sau đây ?","options":["Không nghiệm thu đúng thời hạn quy định sau khi lắp đặt, thay thế, sửa chữa hoặc hiệu chỉnh thiết bị đo đếm điện.","Không có thẻ nghiệp vụ mà hiệu chỉnh thiết bị đo đếm trên lưới điện.","Tháo, lắp thiết bị đo đếm trên lưới điện khi không được giao nhiệm vụ.","Tất cả các đáp án."],"correct":3,"explain":""},{"q":"Luật Điện lực quy định về vị trí lắp đặt công tơ điện","options":["Vị trí lắp đặt công tơ đo đếm điện phải bảo đảm an toàn, mỹ quan, thuận lợi cho bên mua điện kiểm tra chỉ số đo điện năng và bên bán điện ghi chỉ số đo điện năng.","Lắp nơi thuận tiên cho Bên bán lẻ điện ghi chỉ số công tơ điện.","Lắp nơi thuận tiện cho bên mua điện kiểm tra chỉ số đo điện.","Tất cả các câu trên đều sai."],"correct":0,"explain":""},{"q":"Luật Điện lực quy định khách hàng sử dụng điện có các nghĩa vụ gì ?","options":["Khách hàng sử dụng điện không cần tạo điều kiện cho Bên bán lẻ điện kiểm tra công tơ điện, sử dụng điện.","Khách hàng sử dụng điện có các nghĩa vụ tạo điều kiện để bên bán điện, đơn vị truyền tải điện, đơn vị phân phối điện kiểm tra, sửa chữa, ghi chỉ số đo điện năng, bảo dưỡng, sửa chữa, lắp đặt và thay thế hệ thống đo đếm điện, trang thiết bị điện của đơn vị truyền tải điện, đơn vị phân phối điện và liên hệ với khách hàng.","Khách hàng sử dụng điện chỉ tạo điều kiện cho Bên bán lẻ điện sửa điện, ghi chỉ số công tơ.","Tất cả các câu trên đều sai."],"correct":1,"explain":""},{"q":"Chủ nhà mới vi phạm sử dụng điện sai giá/trộm cắp điện (công tơ điện hiện hữu vẫn đang mang tên của chủ nhà cũ) có chịu trách nhiệm bồi thường, khắc phục hậu quả không ?","options":["Chủ nhà cũ đứng tên Hợp đồng đứng tên công tơ điện hoàn toàn chịu trách nhiệm.","Chủ nhà mới không phải chịu trách nhiệm về hệ thống đo đếm vi phạm sử dụng điện sai giá/trộm cắp điện.","Chủ nhà mới là Bên sử dụng điện mới phải chịu trách nhiệm về hệ thống đo đếm điện đã tiếp nhận địa điểm sử dụng điện đã có thiết bị đo đếm điện. Trong thời gian chưa thông báo cho bên bán điện, bên sử dụng điện phải chịu trách nhiệm về hệ thống đo đếm điện đã tiếp nhận. Bên bán điện có trách nhiệm tiếp tục cung cấp điện, kiểm tra HTĐĐ điện và ký hợp đồng mua bán điện khi bên sử dụng điện mới đáp ứng đủ điều kiện.","Tất cả các câu trên đều sai."],"correct":2,"explain":""},{"q":"Theo quy định tại Nghị định số 133/2026/NĐ-CP, hành vi cản trở người có thẩm quyền kiểm tra việc sử dụng điện hoặc sử dụng điện sai mục đích thỏa thuận có mức giá cao hơn sẽ bị phạt tiền trong phạm vi nào?","options":["Từ 3.000.000 đồng đến 5.000.000","Từ 5.000.000 đồng đến 8.000.000","Từ 6.000.000 đồng đến 8.000.000","Từ 4.000.000 đồng đến 8.000.000"],"correct":0,"explain":""},{"q":"Theo Nghị định số 133/2026/NĐ-CP quy định về xử phạt vi phạm hành chính trong lĩnh vực điện lực, văn bản này bắt đầu chính thức có hiệu lực thi hành từ ngày nào?","options":["Ngày 25 tháng 5 năm 2026","Ngày 25 tháng 5 năm 2024","Ngày 25 tháng 5 năm 2023","Ngày 25 tháng 5 năm 2025"],"correct":0,"explain":""},{"q":"Theo Thông tư số 56/2025/TT-BCT quy định về xquy trình kiểm tra chuyên ngành công thương, văn bản này bắt đầu chính thức có hiệu lực thi hành từ ngày nào?","options":["Ngày 28 tháng 11 năm 2025","Ngày 28 tháng 11 năm 2024","Ngày 28 tháng 11 năm 2023","Ngày 28 tháng 11 năm 2026"],"correct":0,"explain":""},{"q":"Theo Luật Đo lường và Nghị định số 119/2017/NĐ-CP, thiết bị \"Công tơ điện\" được sử dụng để đo đếm điện năng giao nhận thương mại mua bán giữa các bên được xếp vào nhóm nào sau đây để quản lý bắt buộc về kiểm định?","options":["Phương tiện đo nhóm 1 (kiểm định tự nguyện theo nhu cầu nội bộ của doanh nghiệp).","Phương tiện đo nhóm 2 (bắt buộc phải kiểm đạt trước khi sử dụng).","Chuẩn đo lường quốc gia áp dụng riêng cho các phòng thí nghiệm trọng điểm liên kết quốc tế.","Các câu trên đều đúng."],"correct":1,"explain":""},{"q":"Vi phạm trong sử dụng phương tiện đo nhóm 2 được quy định tại Nghị định số 119/2017/NĐ-CP tại điều, khoản cụ thể nào sau đây:","options":["Không đảm bảo các điều kiện vận chuyển, bảo quản, yêu cầu sử dụng phương tiện đo theo hướng dẫn của cơ sở sản xuất, nhập khẩu phương tiện đo hoặc quy định của cơ quan có thẩm quyền.","Không đảm bảo các điều kiện vận chuyển, bảo quản.","Không đảm bảo các điều kiện vận chuyển, bảo quản hoặc nhập khẩu phương tiện đo.","Tất cả các câu trên đều sai."],"correct":0,"explain":""}]},{"name":"KT điện cho CNKD-Bậc6_7","addedAt":1789792793203,"questions":[{"q":"Công dụng của đầu phân áp trong máy biến áp phân phối :","options":["Điều chỉnh điện áp bên sơ cấp tăng lên hoặc giảm xuống","Điều chỉnh số vòng dây của cuộn sơ cấp, để có được điện áp định mức bên thứ cấp .","Điều chỉnh điện áp ra bên thứ cấp tăng lên hay giảm xuống","Tất cả đều sai"],"correct":1,"explain":""},{"q":"Cách điện của thiết bị có thể bị hư hỏng ngẫu nhiên do :","options":["Ngắn mạch .","Sử dụng lâu ngày .","Cọ sát .","Tất cả đều đúng ."],"correct":3,"explain":""},{"q":"Thứ cấp của trạm biến áp được đấu theo tam giác , có thể dùng để cung cấp cho :","options":["Các phụ tải 3 pha cân bằng đều","Các mạch truyền tải điện .","Các phụ tải 1 pha nhưng được chia tải đều trên 3 pha","Tất cả đều đúng"],"correct":3,"explain":""},{"q":"Xét về mặt kinh doanh , các biện pháp có thể làm giảm được tổn thất trên lưới là","options":["Huấn luyện tay nghề cho công nhân .","Kiểm tra , kiểm chứng các mạch đo đếm .","Hạn chế khách hàng sử dụng điện năng phản kháng .","Tất cả đều đúng ."],"correct":3,"explain":""},{"q":"Đối với lưới 1 pha hạ thế , để cung cấp đúng điện áp theo yêu cầu của phụ tải , các cuộn thứ cấp của MBA 1 pha có thể đấu với nhau theo :","options":["Sao hoặc tam giác .","Song song hoặc nối tiếp","Đấu hỗn hợp .","Không cần phải đấu"],"correct":1,"explain":""},{"q":"Máy phát điện 3 pha thường được đấu theo :","options":["Kiểu sao","Có thể đấu nối tiếp hoặc song song .","Có thể đấu theo sao hoặc tam giác.","Kiểu tam giác."],"correct":0,"explain":""},{"q":"Khởi động từ là một thiết bị được dùng để :","options":["Đóng cắt vận hành và bảo vệ cho mạng lưới điện","Đóng cắt vận hành và bảo vệ quá tải cho động cơ .","Khởi động các động cơ điện và máy phát điện","Khởi động các thiết bị điện có cơ cấu là mạch từ"],"correct":1,"explain":""},{"q":"Điện áp vận hành của mạng là:","options":["Điện áp làm việc của mạng .","Điện áp thực tế tại mỗi điểm nút trên mạng .","Điện áp của thiết bị hay của vật tiêu thụ đấu nối vào mạng đó.","Tất cả đều sai ."],"correct":1,"explain":""},{"q":"Tụ điện được lắp đặt trong hệ thống điện nhằm mục đích nâng cao hệ số công suất , nhờ vậy mà ta được các hiệu quả sau :","options":["Giảm tổn thất trên lưới","Chống sụt áp .","Khả năng truyền tải của đường dây được tốt hơn .","Tất cả đều đúng ."],"correct":3,"explain":""},{"q":"Trị số điện áp tiếp xúc càng lớn khi :","options":["Điện áp của mạng lớn , khoảng cách giữa người và vỏ thiết bị càng xa","Khoảng cách giữa người và vỏ thiết bị gần , điện áp của mạng lớn .","Bước chân càng dài .","Tất cả đều đúng"],"correct":0,"explain":""},{"q":"Mục đích của phương pháp cân bằng điện áp là :","options":["Giảm thấp điện áp của thiết bị xuống đến mức an toàn nhất .","Giảm điện áp làm việc của thiết bị xuống bằng điện áp đất .","Loại trừ và hạn chế đến mức an toàn dòng điện khép mạch qua người xuống đất.","Tất cả đều sai ."],"correct":2,"explain":""},{"q":"Điện áp bước có giá trị phụ thuộc vào :","options":["Điện áp của mạng và khoảng cách giữa người với vỏ thiết bị .","Điện áp của mạng , độ lớn của bước chân , khoảng cách giữa điểm chạm đất và người .","Khoảng cách giữa người với vỏ thiết bị càng xa thì điện áp bước càng lớn .","Câu A và C đúng"],"correct":1,"explain":""},{"q":"Trong mạng 3 pha trung tính cách điện đối với đất , nếu người tiếp xúc với 1 dây pha và chân không có cách điện thì :","options":["Người không bị điện giật vì trung tính đã cách điện .","Người bị điện giật vì điện áp đặt vào người là điện áp pha .","Người bị điện giật vì phải chịu 1 phần của điện áp dây.","Người bị điện giật vì điện áp đặt vào người là điện áp dây"],"correct":2,"explain":""},{"q":"Hộ tiêu thu loại 3 khi bị mất điện sẽ:","options":["Không gây ảnh hưởng gì nghiêm trọng","Gây thiệt hại nghiêm trọng cho nền kinh tế quốc dân .","Xáo trộn trật tự xã hội .","Anh hưởng đến an ninh quốc phòng"],"correct":0,"explain":""},{"q":"Một trong các biện pháp để đề phòng tai nạn điện có thể xảy ra cho người là :","options":["Không chạm vào thiết bị lúc nó đang làm việc .","Nối đất bảo vệ hoặc nối trung tính các vỏ của thiết bị điện làm bằng kim loại","Đeo găng cách điện khi chạm vào các thiết bị .","Trang bị đầy đủ bảo hộ an toàn cho người làm việc ."],"correct":1,"explain":""},{"q":"Điện năng do nhà máy điện sản xuất ra cần phải :","options":["Có chất lượng cao và giá thành rẻ, đáp ứng được yêu cầu của hộ tiêu thu.","Xét đến phần điện năng dự trữ để sử dụng khi cần thiết .","Cân bằng công suất giữa số lượng phát  ra và số lượng tiêu thụ kể cả lượng tổn hao .","Tất cả đều đúng."],"correct":2,"explain":""},{"q":"Để tránh dòng điện làm việc vượt quá mức cho phép ta phải :","options":["Lắp đặt các thiết bị đo lường để kiểm tra sự làm việc của mạch","Lắp đặt các thiết bị đóng cắt để cắt điện khi dòng tăng cao .","Lắp đặt các thiết bị bảo vệ (cầu chì , máy cắt …) cho mạch .","Tất cả đều đúng ."],"correct":2,"explain":""},{"q":"Trong quá trình vận hành cần phải làm mát MBA nhằm mục đích :","options":["Nâng cao hiệu suất làm việc","Giảm tổn thất công suất .","Tăng cường công suất .","Tất cả đều đúng ."],"correct":0,"explain":""},{"q":"Trị số điện dung của tụ điện phụ thuộc vào yếu tố sau :","options":["Điện áp làm việc , hằng số điện môi của chất cách điện có trong tụ.","Kích thước , khoảng cách giữa 2 bản cực và hằng số điện môi của môi chất trong tụ.","Môi trường làm việc , điện áp làm việc và vị trí lắp đặt tụ điện","Tất cả đều đúng"],"correct":1,"explain":""},{"q":"Nối trung tính là nối vỏ máy của thiết bị đến dây trung tính của lưới , nhằm mục đích :","options":["Tăng tính cách điện cho các thiết bị","Tạo ra ngắn mạch 1 pha để thiết bị bảo vệ hoạt động (khi có xảy ra chạm vỏ) .","Ngăn ngừa khi vỏ của thiết bị điện bị hư","Giảm thấp điện áp của vỏ máy xuống bằng điện thế đất"],"correct":1,"explain":""},{"q":"Aptomat (C.B.) là khí cụ điện hạ thế dùng để:","options":["Tự động cắt mạch điện để bảo vệ quá tải, ngắn mạch, sụt áp.","Đóng cắt bằng tay các mạch điện có công suất lớn lúc không mang tải .","Đóng cắt bằng tay các mạch điện có công suất bé lúc có mang tải.","Tất cả đều đúng"],"correct":3,"explain":""},{"q":"Hãy tìm phát biểu sai : Trong mạch điện xoay chiều :","options":["Dòng điện và điện áp luôn có chu kỳ bằng nhau","Dòng điện và điện áp luôn có tần số bằng nhau","Dòng điện và điện áp luôn có tần số góc bằng nhau.","Dòng điện và điện áp luôn có góc pha bằng nhau ."],"correct":3,"explain":""},{"q":"Để cung cấp cho lưới hạ thế là 1 pha 2 dây , hai cuộn thứ cấp của MBA 1 pha được đấu theo :","options":["Sao hoặc tam giác tùy theo yêu cầu của tải","Chỉ đấu song song với nhau .","Song song hoặc nối tiếp tùy theo điện áp của 1 cuộn thứ cấp .","Chỉ đấu nối tiếp với nhau ."],"correct":2,"explain":""},{"q":"Các biện pháp có thể dùng để giải nhiệt cho MBA :","options":["Đối lưu dầu","Quạt gió.","Đối lưu khí .","Tất cả đều đúng ."],"correct":3,"explain":""},{"q":"Phương tiện bảo vệ chắc chắn để đề phòng điện áp xuất hiện bất ngờ trên những phần đã được cắt điện để sửa chữa là :","options":["Dùng sào cách điện .","Lắp thiết bị ngắn mạch .","Đặt tiếp địa lưu động .","Tất cả đều đúng ."],"correct":2,"explain":""},{"q":"Máy biến áp phân phối là máy biến áp dùng để biến đổi :","options":["Dòng điện từ trị số cao xuống trị số thấp , phục vụ cho việc truyền tải điện .","Tần số từ trị số này sang trị số khác , sản xuất ra điện cung cấp cho phụ tải .","Điện áp từ cấp trung thế xuống cấp hạ thế, chủ yếu phục vụ cho các hộ dùng điện .","Tất cả đều sai."],"correct":2,"explain":""},{"q":"Tổn thất điện năng là :","options":["Phần điện năng bị thất thoát trên đường dây , để toả nhiệt vô ích trên đường dây.","Phần điện năng bị mất trên nội trở của nguồn , làm giảm công suất nguồn .","Phần điện bị tiêu hao trên điện trở của phụ tải , làm giảm công suất của tải .","Phần điện áp hao hụt cho việc truyền dẫn điện ."],"correct":0,"explain":""},{"q":"Yêu cầu cơ bản của 1 mạng lưới điện :","options":["Cung cấp đúng chất lượng của điện năng và đảm bảo an toàn .","Phù hợp cho khả năng phát triển trong tương lai .","Chi phí xây dựng và tổn hao trong mạng là kinh tế nhất .","Tất cả đều đúng ."],"correct":3,"explain":""},{"q":"Đấu song song các phụ tải là đấu sao cho :","options":["Tất cả các phụ tải đều đặt vào 1 điện áp .","Tổng các điện áp đặt trên các phụ tải bằng điện áp đặt vào mạch .","Chỉ có 1 dòng điện duy nhất chạy qua các phụ tải .","Câu a , c  đúng ."],"correct":0,"explain":""},{"q":"Trong mạch điện , khi đấu song song các phụ tải ta được :","options":["Tất cả các phụ tải đều đặt vào 1 điện áp .","Tổng các dòng điện chạy trên các phụ tải bằng dòng điện trên toàn mạch .","Chỉ có 1 dòng điện duy nhất chạy qua các phụ tải .","Câu a , b  đúng ."],"correct":3,"explain":""},{"q":"Khi trị số dòng điện qua người tăng lên thì","options":["Trị số điện trở của người tăng lên .","Trị số điện trở của người không có gì thay đổi .","Trị số điện trở của người giảm xuống .","Trị số điện áp đặt vào người giảm xuống ."],"correct":2,"explain":""},{"q":"Khi nhiệt độ làm việc tăng lên quá cao , thiết bị sẽ bị nóng quá mức cho phép, đưa đến :","options":["Hư hỏng cách điện , giảm độ bền cơ và tăng tổn thất năng lượng .","Sự toả nhiệt , làm gia nhiệt môi trường chung quanh , đem lại lợi ích cho đời sống .","Bóng điện phát sáng , làm nóng bàn ủi , mỏ hàn , bếp điện ....","Tất cả đều đúng ."],"correct":0,"explain":""},{"q":"Những yếu tố chính để xác định tình trạng nguy hiểm của điện giật :","options":["Trị số dòng điện qua người và điện trở của cơ thể người .","Đường đi của dòng điện qua cơ thể người .","Th
