n phát sinh mới để thu thêm sản lượng, số tiền đã tính thiếu.","Đơn vị làm thủ tục hủy bỏ hóa đơn đã phát hành và lập hóa đơn phát sinh mới để hoàn trả lại sản lượng, số tiền đã tính thừa.","Đơn vị không làm thủ tục hủy bỏ hóa đơn đã phát hành và không lập hóa đơn phát sinh mới mà làm thủ tục truy thu hoặc thoái hoàn.","Đơn vị làm thủ tục hủy bỏ hóa đơn đã phát hành và lập hóa đơn phát sinh mới."],"correct":2,"explain":""},{"q":"Đối với trường hợp có hóa đơn sai thông tin cần hủy bỏ, đơn vị thực hiện:","options":["Lập thủ tục hủy bỏ hóa đơn sai theo quy định.","Trình Lãnh đạo phê duyệt để hủy bỏ hóa đơn sai.","Trình Lãnh đạo phê duyệt để lập thủ tục thay thế hóa đơn sai.","Lập hóa đơn 0 đồng để thay thế cho hóa đơn đã lập."],"correct":3,"explain":""},{"q":"Đối với các trường hợp không cần xác minh thêm thông tin, thời gian thực hiện điều chỉnh hoá đơn tiền điện của khách hàng theo quy định là:","options":["Tối đa 7 ngày làm việc.","Tối đa 3 ngày làm việc.","Tối đa 3 ngày làm việc, đối với các trường hợp cần xác minh thêm thông tin tại nhà khách hàng thì không quá 7 ngày.","Tối đa 3 ngày làm việc, đối với các trường hợp cần xác minh thêm thông tin tại nhà khách hàng thì không quá 5 ngày làm việc."],"correct":1,"explain":""},{"q":"Trong công tác điều chỉnh hóa đơn, hóa đơn và các bảng kê điều chỉnh, thay thế chỉ được phép phát hành sau khi:","options":["Lãnh đạo đơn vị hoặc người được ủy quyền phê duyệt.","Trưởng Phòng Kinh doanh phê duyệt.","Lãnh đạo đơn vị phê duyệt trên chương trình CMIS.","Trưởng Phòng Kinh doanh và Đội trưởng Đội QLTG phê duyệt."],"correct":2,"explain":""},{"q":"Sau khi đối chiếu và xác nhận số liệu hóa đơn, Tổng công ty quy định bộ phận nào tại CTĐL lập Biên bản xác nhận số liệu hóa đơn sau phát hành cho Công ty CNTT:","options":["Phòng Kinh doanh","Đội Dịch vụ Khách hàng","Đội Quản lý Thu ghi","Phòng Tài chính kế toán"],"correct":2,"explain":""},{"q":"Khi thực hiện hoàn trả tiền điện cho khách hàng, bộ hồ sơ thoái hoàn bao gồm các chứng từ sau:","options":["Phiếu giải trình thoái hoàn hoá đơn tiền điện, biên bản thoả thuận điều chỉnh hoá đơn, bảng kê hoá đơn điều chỉnh giảm theo tháng.","Phiếu giải trình truy thu - thoái hoàn hoá đơn tiền điện, biên bản thoả thuận điều chỉnh hoá đơn, bảng kê hoá đơn điều chỉnh giảm theo tháng.","Phiếu giải trình điều chỉnh hoá đơn tiền điện, biên bản thoả thuận điều chỉnh hoá đơn, bảng kê hoá đơn điều chỉnh giảm theo tháng.","Phiếu giải trình thoái hoàn hoá đơn tiền điện, biên bản thoả thuận điều chỉnh hoá đơn, bảng kê hoá đơn điều chỉnh theo tháng."],"correct":0,"explain":""},{"q":"Trong công tác lập hoá đơn điều chỉnh, những đối tượng khách hàng nào được thoái hoàn tiền điện tại nhà:","options":["Không quy định đối tượng khách hàng, Công ty Điện lực tự thực hiện thỏa thuận với khách hàng để thoái hoàn tiền điện.","Khách hàng thanh toán bằng tiền mặt, Công ty Điện lực tự thực hiện thỏa thuận với khách hàng để thoái hoàn tiền điện.","Khách hàng thanh toán có số tiền thoái hoàn dưới 1 triệu, Công ty Điện lực tự thực hiện thỏa thuận với khách hàng để thoái hoàn tiền điện.","Khách hàng thanh toán bằng tiền mặt và có số tiền thoái hoàn dưới 1 triệu."],"correct":0,"explain":""},{"q":"Hoá đơn hủy bỏ không lập lại được áp dụng cho các trường hợp sai sót như sau:","options":["Hoá đơn sai giá điện phải huỷ bỏ toàn bộ sản lượng.","Hoá đơn sai giá điện phải huỷ bỏ toàn bộ sản lượng và số tiền ghi trên hoá đơn.","Hoá đơn sai chỉ số điện kế phải huỷ bỏ toàn bộ sản lượng và số tiền ghi trên hoá đơn.","Hoá đơn sai chỉ số điện kế phải huỷ bỏ toàn bộ sản lượng."],"correct":2,"explain":""},{"q":"Hoá đơn truy thu được áp dụng cho các trường hợp sai sót như sau:","options":["Hoá đơn sai chỉ số điện kế phải huỷ bỏ toàn bộ sản lượng và số tiền ghi trên hoá đơn.","Điện năng bị bỏ sót không tính, điện năng bồi thường do hành vi trộm cắp điện, do điện kế hư, do sai giá.","Sai chỉ số điện kế, giá bán điện, số hộ dùng chung... phải huỷ bỏ hoặc truy thu thêm một phần sảu lượng hoặc số tiền ghi trên hoá đơn.","Sai chỉ số điện kế, giá bán điện, điện kế chạy không chính xác phải huỷ bỏ hoặc truy thu thêm một phần sảu lượng."],"correct":1,"explain":""},{"q":"Đối với các hoá đơn đã phát hành và thu tiền của khách hàng, khi phát hiện hóa đơn sai Công ty Điện lực thực hiện thủ tục:","options":["Huỷ bỏ và truy thu hoá đơn, hồ sơ hủy bỏ-truy thu gồm có: Phiếu giải trình điều chỉnh hóa đơn, bảng kê hóa đơn hủy bỏ, bảng kê hóa đơn truy thu.","Hủy bỏ và lập lại hoá đơn, hồ sơ hủy bỏ-lập lại gồm có:Phiếu giải trình điều chỉnh hóa đơn, bảng kê hóa đơn hủy bỏ, bảng kê hóa đơn lập lại.","Truy thu hoặc thoái hoàn để thu thêm sản lượng, số tiền đã tính thiếu hoặc hoàn trả lại sản lượng, số tiền đã tính thừa cho khách hàng. Hồ sơ gồm có: Phiếu giải trình điều chỉnh hóa đơn, biên bản thỏa thuận điều chỉnh hóa đơn, bảng kê hóa đơn truy thu hoặc thoái hoàn.","Truy thu hoặc thoái hoàn để thu thêm sản lượng, số tiền đã tính thiếu hoặc hoàn trả lại sản lượng, số tiền đã tính thừa cho khách hàng. Hồ sơ gồm có: Phiếu giải trình điều chỉnh hóa đơn, bảng kê hóa đơn truy thu hoặc thoái hoàn."],"correct":2,"explain":""},{"q":"Khách hàng đã ký HĐMBĐ có phần mua công suất phản kháng với ngành điện, khi tính toán tiền điện truy thu do khách hàng câu điện bất hợp pháp, cần tính toán như sau:","options":["Thương lượng với khách hàng nếu khách hàng đồng ý, truy thu thêm phần điện năng vô công","Chỉ tính toán truy thu điện năng tác dụng cho khách hàng","Truy thu điện năng tác dụng và vô công cho khách hàng","Căn cứ vào HĐMBĐ để tính truy thu cho khách hàng"],"correct":1,"explain":""},{"q":"Việc lập hóa đơn tiền điện được căn cứ vào các nội dung nào sau đây?","options":["HĐMBĐ, biên bản treo tháo các thiết bị đo đếm điện, dữ liệu ghi chỉ số công tơ, giá bán điện, thuế suất GTGT của các cơ quan Nhà nước có thẩm quyền quy định, biên bản truy thu và thoái hoàn hoặc bồi thường về sự cố HTĐĐ, các trường hợp vi phạm sử dụng điện (nếu có).","HĐMBĐ, biên bản treo tháo, dữ liệu ghi chỉ số, biên bản áp giá.","Giá bán điện, biên bản treo tháo, dữ liệu ghi chỉ số, biên bản áp giá, biên bản truy thu và thoái hoàn.","Giá bán điện, HĐMBĐ, biên bản treo tháo, dữ liệu ghi chỉ số, biên bản áp giá, biên bản truy thu và thoái hoàn.."],"correct":0,"explain":""},{"q":"Công ty Điện lực không được sử dụng các danh mục lý do sai sau đây trên hệ thống CMIS trong công tác điều chỉnh hoá đơn:","options":["Không ghi chỉ số; Sai chỉ số đầu kỳ, cuối kỳ.","Nhà đóng cửa ghi mã U.","Khách hàng cho chỉ số sai.","Điều chỉnh hóa đơn do lỗi chương trình."],"correct":0,"explain":""},{"q":"Quy định về thời hạn phát hành hóa đơn tiền điện hàng tháng:","options":["Tối đa không quá 3 ngày làm việc kể từ ngày ghi chỉ số điện kế.","Tối đa không quá 4 ngày làm việc kể từ ngày ghi chỉ số điện kế.","Tối đa không quá 2 ngày làm việc kể từ ngày ghi chỉ số điện kế.","Tối đa không quá 3 ngày làm việc kể từ ngày tính hóa đơn tiền điện."],"correct":2,"explain":""},{"q":"Trong kỳ thay đổi giá bán điện theo quyết định của Chính phủ, đối tượng nào sau đây phải thực hiện chốt chỉ số điện kế?","options":["Tất cả điện kế (trừ điện kế bán lẻ điện sinh hoạt).","Tất cả điện kế.","Điện kế khách hàng kinh doanh dịch vụ.","Điện kế khách hàng sản xuất."],"correct":0,"explain":""},{"q":"Yêu cầu đối với việc lập hóa đơn tiền điện đối với trường hợp Khách hàng ký 01 HĐMBĐ có nhiều công tơ, Đơn vị Điện lực phát hành hóa đơn như thế nào?","options":["Phát hành 01 hóa đơn tiền điện ghi tổng tiền điện của tất cả các công tơ.","Phát hành hóa đơn tiền điện của từng công tơ.","Phát hành 01 hóa đơn tiền điện ghi tổng tiền điện của tất cả các công tơ, kèm theo phụ lục chi tiết tiền điện của từng công tơ.","Tất cả các câu trên đều sai."],"correct":2,"explain":""},{"q":"Bảng kê hóa đơn tiền điện được lập và lưu trữ như thế nào?","options":["Hàng quý, lưu trữ điện tử trong 05 (năm) năm (định dạng file PDF, không được can thiệp, chỉnh sửa)","Hàng tháng, lưu trữ điện tử trong 05 (năm) năm (định dạng file PDF, không được can thiệp, chỉnh sửa).","Hàng tháng, lưu trữ điện tử trong 10 (mười) năm (định dạng file PDF, không được can thiệp, chỉnh sửa)","Hàng quý, lưu trữ điện tử trong 10 (mười) năm (định dạng file PDF, không được can thiệp, chỉnh sửa)"],"correct":1,"explain":""},{"q":"Hóa đơn điện tử được chuyển đổi sang hóa đơn giấy bao nhiêu lần:","options":["1 lần.","2 lần.","3 lần.","Tùy theo yêu cầu của khách hàng và nhu cầu của Công ty Điện lực."],"correct":0,"explain":""},{"q":"Bộ phận nào chịu trách nhiệm đăng ký mẫu hóa đơn giá trị gia tăng đặc thù và báo cáo, quyết toán hóa đơn theo quy định gửi Cục thuế TP.HCM:","options":["Tập đoàn Điện lực Việt Nam.","Tổng công ty Điện lực TP.HCM.","Công ty Điện lực.","Công ty CNTT."],"correct":3,"explain":""},{"q":"Bộ phận nào chịu trách nhiệm thực hiện chuyển đổi HĐĐT ra giấy?","options":["Phòng Tài chính Kế toán Công ty Điện lực.","Công ty CNTT.","Phòng Kinh doanh Công ty Điện lực.","Ban Tài chính Kế toán Tổng công ty."],"correct":0,"explain":""},{"q":"Công ty Điện lực chỉ được thực hiện chuyển đổi hóa đơn điện tử sang hóa đơn giấy trong các trường hợp sau:","options":["Phục vụ cho việc khởi kiện khách hàng nợ tại tòa án.","Đính kèm vào hồ sơ thanh lý khi có quyết định của Giám đốc Công ty Điện lực.","Theo yêu cầu của khách hàng.","Phục vụ cho việc khởi kiện khách hàng nợ tại tòa án và đính kèm vào hồ sơ thanh lý khi có quyết định của Giám đốc Công ty Điện lực."],"correct":3,"explain":""},{"q":"Về việc phân bổ ký hiệu hóa đơn, mỗi hóa đơn sau khi thực hiện chức năng tính hóa đơn sẽ được gắn với một mã số duy nhất (ID hóa đơn). Mã số này do:","options":["Do Công ty CNTT cung cấp.","Được đăng ký và phê duyệt bởi Cục thuế TP.HCM.","Do máy tính tự sinh đảm bảo là số duy nhất trong một đơn vị","Do máy tính tự sinh và không nhất thiết phải là số duy nhất trong một đơn vị."],"correct":2,"explain":""},{"q":"Sau khi khách hàng thanh toán tiền điện, EVNHCMC thực hiện gửi hóa đơn điện tử cho khách hàng:","options":["Qua địa chỉ email và SMS.","Qua trang web CSKH và SMS.","Qua địa chỉ email, Apps và trang web CSKH.","Qua địa chỉ email, SMS và trang web CSKH."],"correct":2,"explain":""}]},{"name":"NHCH - Chuẩn mực đạo đức","addedAt":1789792793283,"questions":[{"q":"Bộ tiêu chí Người công nhân ngành Điện thành phố mang tên Bác được cụ thể hóa thành:","options":["3 có, 4 không","4 có, 3 không","2 có, 5 không","5 có, 2 không"],"correct":1,"explain":""},{"q":"Các tiêu chí “Có” trong Bộ tiêu chí Người công nhân ngành Điện thành phố mang tên Bác bao gồm:","options":["Có lý tưởng; Có trách nhiệm, trung thực","Có ý thức học tập, rèn luyện","Có tinh thần đoàn kết, nhân ái","Bao gồm tất cả các câu trên"],"correct":3,"explain":""},{"q":"Các tiêu chí “Không” trong Bộ tiêu chí Người công nhân ngành Điện thành phố mang tên Bác bao gồm:","options":["Không để mất an toàn","Không quan liêu, vô cảm","Không tham nhũng, lãng phí","Bao gồm tất cả các câu trên"],"correct":3,"explain":""},{"q":"Theo tiêu chí “Có lý tưởng” trong Bộ tiêu chí “Người công nhân ngành điện thành phố mang tên Bác”, CNVC-LĐ Tổng công ty phải:","options":["Có niềm tin vào các chủ trương, chính sách của Đảng, Chính phủ, các nghị quyết, chỉ thị, chiến lược phát triển của Tổng công ty","Không nói khác, làm trái các chủ trương, điều lệ, nghị quyết, qui định của Đảng, Chính phủ, vào chiến lược phát triển của Tổng công ty","Xem phục vụ nhân dân, khách hàng là nhiệm vụ trọng tâm hàng đầu","Bao gồm tất cả các câu trên"],"correct":3,"explain":""},{"q":"Điền vào chỗ trống tiêu chí “Có trách nhiệm, trung thực” trong Bộ tiêu chí “Người công nhân ngành điện thành phố mang tên Bác”, CNVC-LĐ Tổng công ty phải:\n        “Phấn đấu vượt mọi ..., hoàn thành tốt mọi nhiệm vụ được giao”","options":["trở ngại","khó khăn","thách thức","gian khổ"],"correct":1,"explain":""},{"q":"Theo tiêu chí “Có ý thức học tập, rèn luyện” trong Bộ tiêu chí “Người công nhân ngành điện thành phố mang tên Bác”, CNVC-LĐ Tổng công ty phải:","options":["Tham gia đóng góp xây dựng tổ chức mình là thành viên vững mạnh.","Tự giác nghiên cứu, học tập nâng cao trình độ chuyên môn, nghiệp vụ để đáp ứng yêu cầu công việc; tham gia đóng góp xây dựng tổ chức mình là thành viên vững mạnh.","Tự giác nghiên cứu, học tập; Tham gia đóng góp xây dựng tổ chức mình là thành viên vững mạnh.","Tự giác nghiên cứu, học tập nâng cao trình độ chuyên môn, nghiệp vụ để đáp ứng yêu cầu công việc."],"correct":1,"explain":""},{"q":"Theo tiêu chí “Có tinh thần đoàn kết, nhân ái” trong Bộ tiêu chí “Người công nhân ngành điện thành phố mang tên Bác”, CNVC-LĐ Tổng công ty phải:","options":["Đoàn kết, thân ái với đồng chí, đồng nghiệp","Luôn vì lợi ích của tập thể, phòng, đội, đơn vị, Tổng công ty và khách hàng","Tích cực tham gia các hoạt động đoàn thể, công tác an sinh, xã hội","Bao gồm tất cả các câu trên"],"correct":3,"explain":""},{"q":"Theo tiêu chí “Không để mất an toàn” trong Bộ tiêu chí “Người công nhân ngành điện thành phố mang tên Bác”, CNVC-LĐ Tổng công ty phải:","options":["Trang bị đầy đủ phương tiện, dụng cụ bảo hộ lao động theo quy định khi thực hiện công tác; Tuyệt đối không để xảy ra tai nạn lao động dù nhẹ.","An toàn khi tham gia giao thông, an toàn trong bảo mật thông tin, tài liệu của Tổng công ty/đơn vị; Tuân thủ tuyệt đối 4 quy tắc vàng.","Trang bị đầy đủ phương tiện, dụng cụ bảo hộ lao động theo quy định khi thực hiện công tác; Tuân thủ tuyệt đối 4 quy tắc vàng; Tuyệt đối không để xảy ra tai nạn lao động dù nhẹ; An toàn khi tham gia giao thông, an toàn trong bảo mật thông tin, tài liệu của Tổng công ty/đơn vị.","Trang bị đầy đủ phương tiện, dụng cụ bảo hộ lao động theo quy định khi thực hiện công tác; Tuyệt đối không để xảy ra tai nạn lao động dù nhẹ; An toàn khi tham gia giao thông, an toàn trong bảo mật thông tin, tài liệu của Tổng công ty/đơn vị."],"correct":2,"explain":""},{"q":"Điền vào chỗ trống tiêu chí “Không quan liêu, vô cảm” trong Bộ tiêu chí “Người công nhân ngành điện thành phố mang tên Bác”, CNVC-LĐ Tổng công ty phải:\n“Lắng nghe có ... yêu cầu của khách hàng, người dân, đồng nghiệp”","options":["trách nhiệm","phải thấu tình, đạt lý","trách nhiệm và giải quyết thấu tình, đạt lý","trách nhiệm và giải quyết"],"correct":2,"explain":""},{"q":"Theo tiêu chí “Không tham nhũng, lãng phí” trong Bộ tiêu chí “Người công nhân ngành điện thành phố mang tên Bác”, CNVC-LĐ Tổng công ty phải:","options":["Tuân thủ đúng pháp luật của nhà nước, nội quy, qui định của cơ quan/đơn vị","Đấu tranh với mọi hành vi tham nhũng, tiêu cực trong thực thi công việc","Có ý thức thực hành tiết kiệm; Chủ động, tích cực giải quyết công việc; không đùn đẩy trách nhiệm, phối hợp giải quyết công việc một cách nhanh chóng và hiệu quả","Bao gồm tất cả các câu trên"],"correct":3,"explain":""}]},{"name":"Nội quy lao động BD-SHN","addedAt":1789792793322,"questions":[{"q":"Nội quy lao động là những quy định cụ thể các vấn đề trong quan hệ lao động, bao gồm:","options":["Thời giờ làm việc; thời giờ nghỉ ngơi; trật tự tại nơi làm việc, an toàn vệ sinh lao động.","Bảo vệ tài sản sản và bí mật kinh doanh; phòng chống quấy rối tình dục tại nơi làm việc.","Các hành vi vi phạm kỷ luật lao động và các hình thức xử lý kỷ luật lao động, thẩm quyền xử lý kỷ luật lao động; trách nhiệm vật chất và các vấn đề có liên quan của doanh nghiệp.","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Đối tượng áp dụng của Nội quy lao động Tổng công ty Điện lực TP. Hồ Chí Minh là:","options":["Tất cả người lao động chính thức của Tổng công ty Điện lực TP. Hồ Chí Minh","Tất cả người lao động trong Tổng công ty Điện lực TP. Hồ Chí Minh, không kể người lao động trong thời gian thử việc, học nghề.","Tất cả người lao động đang làm việc trong Tổng công ty Điện lực TP. Hồ Chí Minh, kể cả người lao động trong thời gian thử việc, học nghề.","Tất cả cán bộ công nhân viên chức lao động trong Tổng công ty Điện lực TP Hồ Chí Minh, kể cả người lao động trong thời gian thử việc."],"correct":2,"explain":""},{"q":"Các trường hợp không quy định trong Nội quy lao động Tổng công ty Điện lực TP. Hồ Chí Minh thì thực hiện theo:","options":["Quy định của pháp luật hiện hành.","Quy định của pháp luật hiện hành, Thỏa ước lao động tập thể.","Quy định của pháp luật hiện hành, Thỏa ước lao động tập thể và các QCQLNB do EVN ban hành","Quy định của pháp luật hiện hành; Thỏa ước lao động tập thể và các QCQLNB do EVN, EVNHCMC ban hành"],"correct":3,"explain":""},{"q":"Thời giờ làm việc theo giờ hành chính tại EVNHCMC/Đơn vị:","options":["Buổi sáng: từ 07 giờ 00 phút đến 11 giờ 30 phút; \nBuổi chiều: từ 13 giờ 30 phút đến 17 giờ 00 phút.","Buổi sáng: từ 07 giờ 15 phút đến 11 giờ 45 phút;\nBuổi chiều. từ 13 giờ 00 phút đến 16 giờ 30 phút.","Buổi sáng: từ 07 giờ 30 phút đến 12 giờ 00 phút; \nBuổi chiều: từ 13 giờ 00 phút đến 16 giờ 30 phút.","Buổi sáng: từ 07 giờ 45 phút đến 12 giờ 15 phút;\nBuổi chiều từ 13 giờ 00 phút đến 16 giờ 30 phút."],"correct":2,"explain":""},{"q":"Thời giờ làm việc theo ca tại EVNHCMC/Đơn vị:","options":["Ca 1: 06h00 đến 14h00; Ca 2: 14h00 đến 22h00; Ca 3: 22h00 đến 06h00","Ca 1: 06h00 đến 15h00; Ca 2: 15h00 đến 21h00; Ca 3: 21h00 đến 05h00","Ca 1: 06h00 đến 14h00; Ca 2: 14h00 đến 23h00; Ca 3: 23h00 đến 07h00","Ca 1: 07h00 đến 15h00; Ca 2: 15h00 đến 23h00; Ca 3: 23h00 đến 07h00"],"correct":0,"explain":""},{"q":"Thời giờ nào sau đây được xem là thời giờ làm việc có hưởng lương?","options":["Thời giờ học tập, huấn luyện an toàn lao động, vệ sinh lao động; thời giờ hội họp, học tập, tập huấn theo yêu cầu của EVNHCMC/Đơn vị.","Thời giờ học tập, huấn luyện an toàn lao động, vệ sinh lao động; thời giờ hội họp, học tập, tập huấn được EVNHCMC/Đơn vị đồng ý.","Thời giờ hội họp, học tập, tập huấn của các tổ chức Đoàn thể cùng cấp.","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Đối với người lao động làm việc theo ca, theo lịch riêng, thời giờ làm việc được quy định như sau:","options":["a. Không quá 08 giờ trong 01 ca và không quá 48 giờ trong 01 tuần","b. Không quá 07 giờ trong 01 ca và không quá 40 giờ trong 01 tuần","c. NLĐ được nghỉ bình quân ít nhất là 04 ngày/tháng","a và c đúng"],"correct":3,"explain":""},{"q":"Trong thời gian học tập, tập huấn người lao động nghỉ không tham gia học tập không được sự chấp thuận của cấp quản lý trực tiếp thì bị xem là:","options":["Vi phạm sẽ bị xử lý kỷ luật theo quy định pháp luật lao động hiện hành.","Vi phạm sẽ bị xử lý kỷ luật theo Nội quy lao động và các quy chế khác của EVN, EVNHCMC ban hành.","Tuỳ theo mức độ vi phạm sẽ bị xử lý kỷ luật theo quy định pháp luật lao động hiện hành, Nội quy lao động và các quy chế khác của EVN, EVNHCMC ban hành.","Vi phạm sẽ bị xử lý hình thức kiểm điểm và hạ mức năng suất tháng."],"correct":2,"explain":""},{"q":"Sau mỗi đợt làm thêm giờ, 07 ngày liên tục trong tháng, EVN HCMC/Đơn vị phải bố trí cho NLĐ","options":["Bố trí cho NLĐ nghỉ bù cho thời gian làm thêm","Trả lương làm thêm giờ cho những ngày làm thêm","Trường hợp không bố trí nghỉ bù đủ số thời gian thì phải trả lương làm thêm giờ","a, c đúng."],"correct":3,"explain":""},{"q":"Trong các trường hợp đặc biệt nào Thủ trưởng đơn vị có quyền yêu cầu người lao động làm thêm giờ vào bất kỳ ngày nào và người lao động không được từ chối?","options":["Thực hiện lệnh động viên, huy động bảo đảm nhiệm vụ quốc phòng, an ninh theo quy định của pháp luật.","Thực hiện các công việc nhằm bảo vệ tính mạng con người, tài sản của cơ quan, tổ chức, cá nhân trong phòng ngừa, khắc phục hậu quả thiên tai, hỏa hoạn, dịch bệnh nguy hiểm và thảm họa.","Đảm bảo cung ứng điện phục vụ quốc phòng an ninh và trật tự an toàn xã hội trên địa bàn.","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Tác phong lao động của người lao động tại EVNHCMC/Đơn vị là:","options":["Trong giờ làm việc, người lao động có mặt tại địa điểm làm việc đúng theo quy định, chấp hành nghiêm túc Nội quy lao động của Tổng công ty.","Người lao động sắp xếp nơi làm việc, lưu trữ hồ sơ trật tự, gọn gàng, ngăn nắp và gìn giữ vệ sinh nơi làm việc sạch sẽ;","Luôn có thái độ lịch thiệp, nghiêm tục trong giao tiếp hàng ngày và ứng xử theo VHDN với đồng nghiệp, khách hàng và đối tác.","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Theo nhu cầu sản xuất kinh doanh, EVNHCMC/Đơn vị có quyền thỏa thuận làm thêm giờ với người lao động như sau:","options":["Số giờ làm thêm của người lao động không quá 50% số giờ làm việc bình thường trong 01 ngày, trường hợp áp dụng quy định làm việc theo tuần thì tổng số giờ làm việc bình thường cùng với số giờ làm thêm không quá 12 giờ trong 01 ngày.","Số giờ làm thêm của người lao động không quá 40 giờ trong 01 tháng; đảm bảo tổng số giờ làm thêm của người lao động không quá 200 giờ trong 01 năm.","Trường hợp phải tổ chức làm thêm giờ từ 200 giờ đến 300 giờ trong 01 năm,  EVNHCMC/Đơn vị phải thông báo bằng văn bản cho Sở Nội vụ TP. Hồ Chí Minh.","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Người lao động làm việc theo ca được nghỉ ít nhất bao nhiêu giờ trước khi chuyển sang ca làm việc khác ?","options":["Được nghỉ ít nhất 24 giờ trước khi chuyển sang ca làm việc khác.","Được nghỉ ít nhất 18 giờ trước khi chuyển sang ca làm việc khác.","Được nghỉ ít nhất 12 giờ trước khi chuyển sang ca làm việc khác.","Được nghỉ ít nhất 08 giờ trước khi chuyển sang ca làm việc khác."],"correct":2,"explain":""},{"q":"Người lao động làm thêm giờ vào ngày thường được trả bao nhiêu phần trăm trên số tiền lương hiện hưởng?","options":["1.5","2","3","Tất cả đều sai."],"correct":0,"explain":""},{"q":"Người lao động làm việc vào ban đêm thì được trả thêm bao nhiêu phần trăm tiền lương tính theo đơn giá tiền lương hoặc tiền lương theo công việc của ngày làm việc bình thường?","options":["0.3","0.35","0.5","Tất cả đều sai."],"correct":0,"explain":""},{"q":"Người lao động làm thêm vào ngày nghỉ lễ, nghỉ tết, ngày nghỉ có hưởng lương được trả thêm ít nhất bằng bao nhiên phần trăm tiền lương?","options":["Ít nhất bằng 150% tiền lương","Ít nhất bằng 200% tiền lương","Ít nhất bằng 300% tiền lương","Tất cả đều sai."],"correct":2,"explain":""},{"q":"Thời gian nghỉ trong giờ làm việc đối với người lao động trong EVNHCMC/Đơn vị là:","options":["Người lao động làm việc liên tục 08 giờ thì được nghỉ giữa giờ ít nhất 30 phút, tính vào thời giờ làm việc.","Trường hợp làm việc ban đêm, thì người lao động được nghỉ giữa giờ ít nhất 45 phút, tính vào thời giờ làm việc.","Người lao động làm việc liên tục 08 giờ thì được nghỉ giữa giờ nhiều nhất 30 phút, tính vào thời giờ làm việc; trường hợp làm việc ban đêm, thì người lao động được nghỉ giữa giờ nhiều nhất 45 phút, tính vào thời giờ làm việc.","Người lao động làm việc liên tục 08 giờ thì được nghỉ giữa giờ ít nhất 30 phút, tính vào thời giờ làm việc; trường hợp làm việc ban đêm, thì người lao động được nghỉ giữa giờ ít nhất 45 phút, tính vào thời giờ làm việc."],"correct":3,"explain":""},{"q":"Thời gian nghỉ hàng tuần đối với người lao động trong EVNHCMC/Đơn vị là:","options":["Người lao động làm việc theo giờ hành chính thì mỗi tuần được nghỉ 01 ngày là ngày Chủ nhật.","Trường hợp người lao động đã hoàn thành khối lượng công việc được giao của 01 tuần trong 05 ngày thì được nghỉ thêm ngày thứ Bảy (không phải là ngày nghỉ hàng tuần).","Đối với người lao động làm việc theo ca, theo lịch riêng thì ngày nghỉ hàng tuần của người lao động là 01 ngày nghỉ trong tuần từ thứ Hai đến Chủ nhật và NSDLĐ phải đảm bảo cho người lao động được nghỉ bình quân ít nhất là 04 ngày/tháng và báo trước 15 ngày.","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Nghỉ phép hàng năm đối với người lao động có đủ 12 tháng làm việc cho EVNHCMC/Đơn vị thì được nghỉ hàng năm, hưởng nguyên lương theo HĐLĐ như sau:","options":["12 ngày làm việc đối với người làm công việc trong điều kiện bình thường.","14 ngày làm việc đối với người làm công việc nặng nhọc, độc hại, nguy hiểm theo danh mục do Bộ Lao động - Thương binh và Xã hội chủ trì phối hợp với Bộ Y tế ban hành hoặc lao động là người khuyết tật.","16 ngày làm việc đối với người làm công việc đặc biệt nặng nhọc, độc hại, nguy hiểm hoặc làm việc ở những nơi có điều kiện sinh sống đặc biệt khắc nghiệt theo danh mục do Bộ Lao động - Thương binh và Xã hội chủ trì phối hợp với Bộ Y tế ban hành.","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Số ngày nghỉ hàng năm được tăng thêm theo thâm niên làm việc tại EVNHCMC/Đơn vị, cụ thể là:","options":["cứ đủ 04 năm thâm niên được nghỉ thêm tương ứng 01 ngày.","cứ đủ 03 năm thâm niên được nghỉ thêm tương ứng 01 ngày.","cứ đủ 06 năm thâm niên được nghỉ thêm tương ứng 01 ngày.","cứ đủ 05 năm thâm niên được nghỉ thêm tương ứng 01 ngày."],"correct":3,"explain":""},{"q":"Nghỉ phép hàng năm đối với người lao động không đủ 12 tháng làm việc cho EVNHCMC/Đơn vị thì số ngày nghỉ được tính như sau:","options":["a. Được tính theo tỷ lệ tương ứng với số tháng làm việc trong năm.","b. Trường hợp không nghỉ thì được thanh toán bằng tiền.","c. Được tính theo tỷ lệ tương ứng với số thời gian làm việc trong năm, trường hợp không nghỉ thì không được thanh toán bằng tiền.","a và b đúng."],"correct":3,"explain":""},{"q":"Trong các trường hợp đặc biệt nếu những ngày nghỉ Lễ, Tết trong năm trùng vào ngày nghỉ hàng tuần thì:","options":["a. Người lao động được nghỉ bù vào ngày làm việc tiếp theo.","b. Người lao động được bố trí nghỉ bù vào các ngày khác do Thủ trưởng đơn vị và người lao động thỏa thuận và được trả tiền lương làm thêm giờ theo quy định hiện hành.","c. Không bố trí nghỉ bù và trả tiền lương làm thêm giờ theo quy định hiện hành.","a và b đúng."],"correct":3,"explain":""},{"q":"Theo nội quy lao động EVNHCMC, thời hạn tạm đình chỉ công việc đối với người lao động:","options":["Không quá 10 ngày làm việc, trường hợp đặc biệt không quá 30 ngày làm việc.","Không quá 15 ngày làm việc, trường hợp đặc biệt không quá 60 ngày làm việc.","Không quá 15 ngày làm việc, trường hợp đặc biệt không quá 90 ngày làm việc.","Tất cả đều sai."],"correct":2,"explain":""},{"q":"Người lao động tromg EVNHCMC/Đơn vị nghỉ việc riêng mà vẫn được hưởng nguyên lương trong những trường hợp nào sau đây?","options":["Kết hôn: nghỉ 03 ngày.","Con đẻ, con nuôi kết hôn: nghỉ 01 ngày.","Cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi; cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi của vợ hoặc chồng; vợ hoặc chồng; con đẻ, con nuôi qua đời: nghỉ 03 ngày.","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Giải quyết các trường hợp nghỉ không hưởng lương đối với người lao động tromg EVNHCMC/Đơn vị","options":["Người lao động xin nghỉ không hưởng lương phải có lý do chính đáng và được sự đồng ý của NSDLĐ.","NSDLĐ được giải quyết nghỉ không hưởng lương tối đa 30 ngày làm việc cộng dồn trong năm đối với trường hợp nghỉ giải quyết việc riêng của người lao động.","Đơn vị giải quyết nghỉ không hưởng lương tối đa 60 ngày làm việc cộng dồn trong năm đối với các trường hợp nghỉ điều trị bệnh. Trường hợp người lao động cần nghỉ quá thời hạn, NSDLĐ thỏa thuận với NLĐ tạm hoãn thực hiện hợp đồng lao động theo quy định tại Điều 30, BLLĐ, trừ trường hợp NLĐ xin nghỉ để điều trị bệnh thuộc danh mục bệnh cần chữa trị dài ngày do Bộ Y tế ban hành.","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Thẩm quyền phê duyệt nghỉ phép hằng năm, nghỉ việc riêng, nghỉ không hưởng lương theo Nội quy lao động EVNHCMC:","options":["Chủ tịch HĐTV phê duyệt đơn nghỉ phép của Giám đốc đơn vị.","Tổng giám đốc phê duyệt đơn nghỉ phép của Trưởng các Ban chức năng, Phó giám đốc, Kế toán trưởng các đơn vị nghỉ đi nước ngoài hoặc nghỉ từ 03 ngày trở lên.","Giám đốc các đơn vị phê duyệt đơn nghỉ phép của Phó giám đốc/Kế toán trưởng đơn vị có số ngày nghỉ dưới 03 ngày (nghỉ trong nước).","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Theo nội quy lao động EVNHCMC, người lao động làm mất dụng cụ, thiết bị, tài sản của Đơn vị hoặc tài sản khác do Đơn vị giao hoặc tiêu hao vật tư quá định mức cho phép thì phải bồi thường thiệt hại một phần theo thời giá thị trường:","options":["Trong trường hợp có hợp đồng trách nhiệm thì phải bồi thường theo hợp đồng trách nhiệm.","Trong trường hợp bất khả kháng do thiên tai, hỏa hoạn, địch họa, dịch bệnh, thảm họa, sự kiện xảy ra khách quan không thể lường trước được và khống chế khắc phục được mặc dù đã áp mọi biện pháp cần thiết và khả năng cho phép thì không phải bồi thường.","Hai ý trên đều đúng.","Hai ý trên đều sai."],"correct":2,"explain":""},{"q":"Theo nội quy lao động EVNHCMC, người có thẩm quyền xử lý bồi thường thiệt hại là ai?","options":["Chủ tịch HĐTV.","Chủ tịch Công đoàn EVNHCMC.","Chủ tịch Công đoàn cơ sở.","Tổng giám đốc."],"correct":3,"explain":""},{"q":"Quy định về đồng phục và phương tiện bảo vệ cá nhân đối với người lao động theo Nội quy lao động EVNHCMC:","options":["Trong giờ làm việc hoặc đang thi hành nhiệm vụ, người lao động phải mặc đồng phục và trang bị đầy đủ phương tiện bảo vệ cá nhân theo quy định của EVNHCMC.","Trong suốt thời gian làm việc, người lao động phải đeo bảng tên theo quy định.","Người lao động nữ đang mang thai thì không bắt buộc mặc đồng phục nhưng  trang phục phải đảm bảo lịch sự, nghiêm túc và tuân thủ đầy đủ quy định trang bị bảo vệ cá nhân phù hợp chức danh công việc.","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Bảo vệ tài sản theo Nội quy lao động EVNHCMC:","options":["Người lao động được mang bất cứ tài sản, công cụ, dụng cụ ra ngoài.","Người lao động được mang bất cứ tài sản, công cụ, dụng cụ ra ngoài sau khi đã xin phép.","Người lao động không được mang bất kỳ tài sản, công cụ, dụng cụ của EVNHCMC/Đơn vị ra ngoài nơi làm việc mà chưa có sự đồng ý bằng văn bản của người có thẩm quyền.","Người lao động không được mang bất kỳ tài sản, công cụ, dụng cụ của EVNHCMC/Đơn vị ra ngoài mà chưa có sự đồng ý của người có thẩm quyền."],"correct":2,"explain":""},{"q":"Theo Nội quy lao động EVNHCMC, người lao động có nghĩa vụ nào sau đây trong công tác an toàn - vệ sinh lao động:","options":["Người lao động hiểu rõ tính năng, cách sử dụng và sử dụng đúng tính năng, hiệu quả tốt của phương tiện bảo vệ cá nhân, dụng cụ đồ nghề, trang cụ an toàn được giao quản lý, sử dụng trong quá trình thực hiện công việc nhiệm vụ được giao.","Người lao động phải chấp hành các quy định, quy trình về an toàn lao động, vệ sinh lao động của EVNHCMC/Đơn vị hoặc các cấp thẩm quyền ban hành liên quan đến công việc, nhiệm vụ được giao. Người lao động thực hiện đầy đủ biện pháp bảo đảm an tòan, vệ sinh lao động tại nơi làm việc, tuân thủ các nội dung đã giao kết hoặc cam kết về an toàn.","Người lao động phải báo cáo kịp thời với người có trách nhiệm khi phát hiện nguy cơ xảy ra sự cố kỹ thuật gây mất an toàn, mất vệ sinh lao động, tai nạn lao động hoặc bệnh nghề nghiệp. Người lao động phải chủ động tham gia cấp cứu, khắc phục sự cố, tai nạn lao động theo phương án xử lý sự cố, ứng cứu khẩn cấp hoặc khi có lệnh của NSDLĐ hoặc yêu cầu của cơ quan nhà nước có thẩm quyền.","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Trách nhiệm của NSDLĐ trong việc bảo đảm an toàn, vệ sinh lao động tại nơi làm việc theo Nội quy lao động EVNHCMC là:","options":["Bảo đảm nơi làm việc phải đạt yêu cầu về vệ sinh lao động, môi trường lao động theo quy định của pháp luật.","Bảo đảm các trang thiết bị, máy móc được bảo trì, bảo quản, vận hành tại nơi làm việc theo quy chuẩn kỹ thuật của nhà sản xuất và quy chuẩn về an toàn, vệ sinh lao động.","Trang bị, cấp phát đầy đủ cho NLĐ các phương tiện bảo vệ cá nhân khi thực hiện công việc có yếu tố nguy hiểm, yếu tố có hại, trang bị đầy đủ các thiết bị an toàn, vệ sinh lao động tại nơi làm việc.","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Các hình thức xử lý kỷ luật lao động theo pháp luật lao động là: (Điều 124 của Bộ luật Lao động 2019)","options":["Khiển trách; Kéo dài thời hạn nâng lương không quá 06 tháng; Cách chức; Sa thải.","Phê bình bằng văn bản; Khiển trách; Kéo dài thời hạn nâng lương không quá 06 tháng; Cách chức; Sa thải.","Khiển trách; Kéo dài thời hạn nâng lương không quá 12 tháng; Cách chức; Sa thải.","Khiển trách; Kéo dài thời hạn nâng lương; Cách chức; Sa thải."],"correct":0,"explain":""},{"q":"Nội quy lao động EVNHCMC có bao nhiêu hình thức xử lý kỷ luật lao động?","options":["02 hình thức.","03 hình thức.","04 hình thức.","05 hình thức."],"correct":2,"explain":""},{"q":"Hình thức nào sau đây không phải là hình thức xử lý kỷ luật lao động theo Nội quy lao động EVNHCMC?","options":["Phê bình bằng văn bản.","Khiển trách.","Cách chức.","Sa thải."],"correct":0,"explain":""},{"q":"Hành vi nào sau đây bị cấm khi xử lý kỷ luật lao động? (khoản 2 Điều 127 của Bộ luật Lao động 2019)","options":["Khiển trách người lao động theo đúng trình tự, thủ tục.","Kéo dài thời hạn nâng lương theo quy định của nội quy lao động.","Phạt tiền người lao động thay cho việc xử lý kỷ luật lao động.","Tổ chức họp xử lý kỷ luật có sự tham gia của các bên theo quy định."],"correct":2,"explain":""},{"q":"Người sử dụng lao động không được xử lý kỷ luật lao động đối với người lao động đang trong các thời gian sau: (khoản 4 Điều 122 của Bộ luật Lao động 2019)","options":["Nghỉ ốm đau, điều dưỡng; nghỉ việc được sự đồng ý của người sử dụng lao động.","Đang bị tạm giữ, tạm giam.","Đang chờ kết quả của cơ quan có thẩm quyền điều tra, xác minh và kết luận đối với hành vi vi phạm có dấu hiệu tội phạm hoặc các hành vi vi phạm được quy định tại khoản 1 và khoản 2 Điều 125 Bộ luật Lao động.","Lao động nữ mang thai; người lao động đang nghỉ thai sản hoặc đang nuôi con dưới 12 tháng tuổi.","Tất cả đều đúng."],"correct":4,"explain":""},{"q":"Theo Bộ luật Lao động năm 2019, thời hiệu xử lý kỷ luật lao động đối với hành vi vi phạm thông thường là bao lâu kể từ ngày xảy ra vi phạm? (Điều 123 của Bộ luật Lao động 2019)","options":["03 tháng.","06 tháng.","09 tháng.","12 tháng."],"correct":1,"explain":""},{"q":"Thời hiệu xử lý kỷ luật lao động đối với hành vi vi phạm liên quan trực tiếp đến tài chính, tài sản, bí mật công nghệ hoặc bí mật kinh doanh của người sử dụng lao động là bao lâu? (Điều 123 của Bộ luật Lao động 2019)","options":["06 tháng.","09 tháng.","12 tháng.","24 tháng."],"correct":2,"explain":""},{"q":"Người sử dụng lao động (EVNHCMC) được áp dụng hình thức xử lý kỷ luật sa thải trong những trường hợp nào sau đây?","options":["Người lao động thông đồng, bao che, nhận lợi ích từ khách hàng để che giấu, không tố giác hành vi vi phạm sử dụng điện hoặc lợi dụng nhiệm vụ được giao trực tiếp làm sai lệch kết quả kiểm tra, xử lý vi phạm sử dụng điện dẫn đến đe dọa gây thiệt hại đặc biệt nghiêm trọng về lợi ích của EVNHCMC/Đơn vị.","Sử dụng giấy tờ, văn bằng cá nhân không hợp pháp hoặc scan chữ ký hoặc giả mạo chữ ký người khác trong quá trình thực hiện nhiệm vụ gây thiệt hại nghiêm trọng hoặc đe dọa gây thiệt hại đặc biệt nghiêm trọng đến tài sản, lợi tích EVNHCMC/Đơn vị.","Nhân danh EVNHCMC/Đơn vị thông tin, chia sẻ qua báo chí, phương tiện truyền thông, các trang, mạng xã hội các nội dung, thông tin không chính thức, hoặc chưa được đại diện Lãnh đạo EVNHCMC/Đơn vị, Người phát ngôn EVNHCMC thông qua gây ra khủng hoảng truyền thông gây thiệt hại nghiệm trọng đến tài sản, lợi ích EVNHCMC/Đơn vị.","Tất cả đều đúng."],"correct":3,"explain":""},{"q":"Theo Bộ luật Lao động năm 2019, người sử dụng lao động được áp dụng hình thức kỷ luật sa thải đối với người lao động trong trường hợp nào sau đây? (Điều 125 của Bộ luật Lao động 2019)","options":["Đi làm muộn nhiều lần trong tháng.","Tự ý bỏ việc 05 ngày làm việc cộng dồn trong thời hạn 30 ngày mà không có lý do chính đáng.","Không hoàn thành công việc được giao trong 01 ngày làm việc.","Nghỉ phép năm không thông báo trước."],"correct":1,"explain":""},{"q":"Theo Bộ luật Lao động năm 2019, nguyên tắc nào sau đây đúng khi xử lý kỷ luật lao động? (Điều 122 của Bộ luật Lao động 2019)","options":["Có thể áp dụng nhiều hình thức kỷ luật đối với một hành vi vi phạm.","Người sử dụng lao động không cần chứng minh lỗi của người lao động.","Người lao động có quyền tự bào chữa hoặc nhờ người khác bào chữa cho mình.","Không cần lập biên bản xử lý kỷ luật lao động."],"correct":2,"explain":""},{"q":"Khi một người lao động đồng thời có nhiều hành vi vi phạm kỷ luật lao động thì xử lý như thế nào? (Điều 122 của Bộ luật Lao động 2019)","options":["Áp dụng tất cả các hình thức kỷ luật tương ứng với từng hành vi vi phạm.","Áp dụng hình thức kỷ luật nhẹ nhất để bảo đảm quyền lợi người lao động.","Chỉ áp dụng hình thức kỷ luật cao nhất tương ứng với hành vi vi phạm nặng nhất.","Người sử dụng lao động được lựa chọn bất kỳ hình thức kỷ luật nào."],"correct":2,"explain":""},{"q":"Theo Bộ luật Lao động năm 2019, hợp đồng lao động là gì? (Điều 13 của Bộ luật Lao động 2019)","options":["Văn bản do người sử dụng lao động ban hành để giao việc cho người lao động.","Sự thỏa thuận giữa người lao động và người sử dụng lao động về việc làm có trả công, tiền lương, điều kiện lao động, quyền và nghĩa vụ của mỗi bên trong quan hệ lao động.","Cam kết của người lao động về việc chấp hành nội quy lao động.","Thỏa thuận giữa các tổ chức công đoàn và người sử dụng lao động."],"correct":1,"explain":""},{"q":"Theo Bộ luật Lao động năm 2019, có mấy loại hợp đồng lao động?","options":["02 loại: Hợp đồng lao động không xác định thời hạn và hợp đồng lao động xác định thời hạn.","03 loại: Hợp đồng lao động không xác định thời hạn, hợp đồng lao động xác định thời hạn và hợp đồng lao động theo mùa vụ.","04 loại: Hợp đồng lao động thử việc, hợp đồng lao động mùa vụ, hợp đồng lao động xác định thời hạn và không xác định thời hạn.","05 loại theo tính chất công việc."],"correct":0,"explain":""},{"q":"Trường hợp nào người sử dụng lao động được quyền đơn phương chấm dứt hợp đồng lao động? (Điều 36 của Bộ luật Lao động 2019)","options":["Người lao động thường xuyên không hoàn thành công việc theo hợp đồng lao động theo tiêu chí đánh giá mức độ hoàn thành công việc do người sử dụng lao động ban hành.","Người lao động cung cấp trung thực thông tin khi giao kết hợp đồng lao động làm ảnh hưởng đến việc tuyển dụng.","Người lao động có mặt tại nơi làm việc sau thời hạn tạm hoãn thực hiện hợp đồng lao động.","Người lao động bị ốm đau, tai nạn đã điều trị:\n12 tháng liên tục đối với hợp đồng lao động không xác định thời hạn;\n06 tháng liên tục đối với hợp đồng lao động xác định thời hạn từ 12 tháng đến 36 tháng;\nQuá 1/3 thời hạn hợp đồng đối với hợp đồng lao động xác định thời hạn dưới 12 tháng; mà khả năng lao động chưa hồi phục."],"correct":0,"explain":""},{"q":"Trường hợp nào sau đây người lao động được quyền đơn phương chấm dứt hợp đồng lao động? (Điều 35 của Bộ luật Lao động 2019)","options":["Được bố trí đúng công việc, địa điểm làm việc hoặc không được bảo đảm điều kiện làm việc theo thỏa thuận, trừ trường hợp điều chuyển tạm thời theo quy định của pháp luật.","Được trả đủ lương hoặc trả lương không đúng thời hạn, trừ trường hợp bất khả kháng theo quy định.","Bị quấy rối tình dục tại nơi làm việc.","Người sử dụng lao động cung cấp thông tin trung thực khi giao kết hợp đồng lao động."],"correct":2,"explain":""},{"q":"Người lao động đơn phương chấm dứt hợp đồng lao động trái pháp luật phải thực hiện nghĩa vụ nào sau đây? (Điều 40 của Bộ luật Lao động 2019)","options":["Được hưởng trợ cấp thôi việc đầy đủ.","Chỉ cần xin lỗi người sử dụng lao động bằng văn bản.","Bồi thường cho người sử dụng lao động nửa tháng tiền lương theo hợp đồng lao động.","Không phải chịu bất kỳ trách nhiệm nào."],"correct":2,"explain":""},{"q":"Người lao động được quyền đơn phương chấm dứt hợp đồng lao động không cần báo trước trong trường hợp nào sau đây?","options":["Muốn chuyển sang công việc khác có thu nhập cao hơn.","Không được trả đủ lương hoặc trả lương không đúng thời hạn theo thỏa thuận.","Đã làm việc đủ 06 tháng tại doanh nghiệp.","Không hài lòng với môi trường làm việc."],"correct":1,"explain":""},{"q":"Theo Nội quy lao động EVNHCMC, việc xem xét, xử lý trách nhiệm vật chất đối với người lao động gây ra thiệt hại tài sản được căn cứ vào các yếu tố nào để ra quyết định mức đền bù và phương thức bồi thường thiệt hại?","options":["Lỗi; Tính chất hành vi gây thiệt hại; Mức độ thiệt hại tài sản thực tế; Hoàn cảnh gia đình, nhân thân và tài sản của người lao động.","Tính chất hành vi gây thiệt hại; Mức độ thiệt hại tài sản thực tế; Hoàn cảnh gia đình, nh "options":["Hợp đồng kinh tế; biên bản thanh lý hợp đồng (nếu có).","Đối chiếu công nợ; trường hợp không có đối chiếu công nợ thì phải có văn bản đề nghị đối chiếu xác nhận công nợ hoặc văn bản đòi nợ do doanh nghiệp đã gửi (có dấu bưu điện hoặc xác nhận của đơn vị chuyển phát).","Bảng kê công nợ; các chứng từ khác có liên quan (nếu có).","Cả 03 câu trên đều đúng."],"correct":3,"explain":""},{"q":"Hiện nay, khoản nợ được xem xét là khoản nợ phải thu khó đòi được áp dụng theo thông tư nào?","options":["Thông tư 228/2009/TT-BTC ngày 07/12/2009.","Thông tư 48/2019/TT-BTC ngày 08/08/2019.","Thông tư 38/2019/TT-BTC ngày 08/08/2019.","Câu a và c đúng."],"correct":1,"explain":""},{"q":"Nợ phải thu được xác định là khoản nợ phải thu khó đòi khi:","options":["Nợ phải thu đã quá thời hạn thanh toán từ 06 tháng trở lên (tính theo thời hạn trả nợ gốc ban đầu theo hợp đồng kinh tế, khế ước vay nợ hoặc các cam kết nợ khác, không tính đến thời gian gia hạn trả nợ giữa các bên), doanh nghiệp đã gửi đối chiếu xác nhận nợ hoặc đôn đốc thanh toán nhưng vẫn chưa thu hồi được nợ.","Nợ phải thu chưa đến hạn thanh toán nhưng doanh nghiệp thu thập được các bằng chứng xác định tổ chức kinh tế đã phá sản, đã mở thủ tục phá sản, đã bỏ trốn khỏi địa điểm kinh doanh.","Nợ phải thu chưa đến hạn thanh toán nhưng doanh nghiệp thu thập được các bằng chứng xác định đối tượng nợ đang bị các cơ quan pháp luật truy tố, giam giữ, xét xử hoặc đang thi hành án hoặc đang mắc bệnh hiểm nghèo (có xác nhận của bệnh viện) hoặc đã chết hoặc khoản nợ đã được doanh nghiệp yêu cầu thi hành án nhưng không thể thực hiện được do đối tượng nợ bỏ trốn khỏi nơi cư trú.","Cả 03 câu trên đều đúng."],"correct":3,"explain":""},{"q":"Nợ phải thu không có khả năng thu hồi: trường hợp đối với tổ chức kinh tế khi có đủ các tài liệu chứng minh:","options":["Đối tượng nợ đã phá sản: có quyết định của Tòa án tuyên bố phá sản doanh nghiệp theo Luật phá sản.","Đối tượng nợ đã ngừng hoạt động, giải thể: có văn bản xác nhận hoặc thông báo bằng văn bản/thông báo trên trang điện tử chính thức của cơ quan quyết định thành lập doanh nghiệp hoặc tổ chức đăng ký kinh doanh hoặc cơ quan thuế quản lý trực tiếp về việc doanh nghiệp, tổ chức đã ngừng hoạt động hoặc giải thể; hoặc khoản nợ đã được doanh nghiệp, tổ chức khởi kiện ra tòa án theo quy định, có bản án, quyết định của tòa và có ý kiến xác nhận của cơ quan thi hành án về việc đối tượng nợ không có tài sản để thi hành án.","Giấy chứng tử (bản sao chứng thực hoặc bản sao từ sổ gốc) hoặc xác nhận của chính quyền địa phương đối với đối tượng nợ đã chết.","Câu a và b đúng."],"correct":3,"explain":""},{"q":"Nợ phải thu không có khả năng thu hồi: trường hợp đối với cá nhân khi có đủ các tài liệu chứng minh:","options":["Lệnh truy nã; hoặc xác nhận của cơ quan pháp luật đối với đối tượng nợ đã bỏ trốn.","Đối tượng nợ đã phá sản: có quyết định của Tòa án tuyên bố phá sản doanh nghiệp theo Luật phá sản.","Đối tượng nợ đã ngừng hoạt động, giải thể: có văn bản xác nhận hoặc thông báo bằng văn bản/thông báo trên trang điện tử chính thức của cơ quan quyết định thành lập doanh nghiệp hoặc tổ chức đăng ký kinh doanh hoặc cơ quan thuế quản lý trực tiếp về việc doanh nghiệp, tổ chức đã ngừng hoạt động hoặc giải thể; hoặc khoản nợ đã được doanh nghiệp, tổ chức khởi kiện ra tòa án theo quy định, có bản án, quyết định của tòa và có ý kiến xác nhận của cơ quan thi hành án về việc đối tượng nợ không có tài sản để thi hành án.","Câu b và c đúng"],"correct":0,"explain":""},{"q":"Nợ phải thu quá hạn thanh toán, mức trích lập dự phòng như sau:","options":["30% giá trị đối với khoản nợ phải thu quá hạn từ 6 tháng đến dưới 01 năm, 50% giá trị đối với khoản nợ phải thu quá hạn từ 01 năm đến dưới 02 năm, 70% giá trị đối với khoản nợ phải thu quá hạn từ 02 năm đến dưới 03 năm, 100% giá trị đối với khoản nợ phải thu từ 03 năm trở lên.","50% giá trị đối với khoản nợ phải thu quá hạn từ 6 tháng đến dưới 01 năm, 70% giá trị đối với khoản nợ phải thu quá hạn từ 01 năm đến dưới 02 năm, 1000% giá trị đối với khoản nợ phải thu quá hạn từ 02 năm đến dưới 03 năm.","30% giá trị đối với khoản nợ phải thu quá hạn từ 03 tháng đến dưới 6 tháng, 50% giá trị đối với khoản nợ phải thu quá hạn từ 6 tháng đến dưới 9 tháng, 70% giá trị đối với khoản nợ phải thu quá hạn từ 9 tháng đến dưới 12 tháng, 100% giá trị đối với khoản nợ phải thu từ 12 tháng trở lên.","50% giá trị đối với khoản nợ phải thu quá hạn từ 03 tháng đến dưới 6 tháng, 70% giá trị đối với khoản nợ phải thu quá hạn từ 6 tháng đến dưới 9 tháng, 100% giá trị đối với khoản nợ phải thu quá hạn từ 9 tháng đến dưới 12 tháng."],"correct":0,"explain":""},{"q":"Nợ phải thu không có khả năng thu hồi là các khoản nợ phải thu đã quá thời hạn thanh toán hoặc chưa đến thời hạn thanh toán thuộc một trong những trường hợp sau:","options":["Đối tượng nợ là doanh nghiệp, tổ chức đã hoàn thành việc phá sản theo quy định của pháp luật hoặc đã ngừng hoạt động hoặc giải thể.","Đối tượng nợ là cá nhân đã chết hoặc đang bị các cơ quan pháp luật truy tố, giam giữ, xét xử, đang thi hành án.","Khoản nợ phải thu đã được trích lập 100% dự phòng theo quy định tại thông tư hiện hành mà sau 03 năm tính từ thời điểm doanh nghiệp trích lập đủ 100% dự phòng mà vẫn chưa thu hồi được nợ.","Cả 03 câu trên đều đúng"],"correct":3,"explain":""},{"q":"Kể từ ngày thực hiện xử lý các khoản nợ phải thu không có khả năng thu hồi sau khi đã có quyết định xử lý theo quy định, doanh nghiệp tục có biện pháp để thu hồi nợ thời gian như sau:","options":["Tối đa 05 năm.","Tối thiểu 10 năm.","Tối đa 10 năm.","Từ 10- 15 năm."],"correct":1,"explain":""},{"q":"Điều kiện xử lý tài chính nợ phải thu không có khả năng thu hồi đối với các trường hợp đã khởi kiện ra Tòa án theo quy định, có bản án và:","options":["Quyết định của cơ quan thi hành án về thời hạn thi hành án","Ý kiến xác nhận của cơ quan thi hành án về việc đối tượng nợ không có tài sản để thi hành án","Ý kiến xác nhận của cơ quan thi hành án về việc đối tượng nợ chưa có tài sản để thi hành án","Ý kiến xác nhận của cơ quan thi hành án về việc đối tượng nợ chưa có tài sản để thi hành án (lần 2)"],"correct":1,"explain":""},{"q":"Điều kiện xử lý tài chính nợ phải thu không có khả năng thu hồi đối với cá nhân nợ tiền điện là:","options":["Xác nhận của cơ quan pháp luật đối với đối tượng nợ đã bỏ trốn","Xác nhận của cơ quan pháp luật đối với đối tượng nợ đã chuyển đi nơi khác","Xác nhận của cơ quan pháp luật đối với đối tượng nợ đi đâu không rõ","Xác nhận của cơ quan pháp luật đối với đối tượng nợ không còn ở nơi cư trú"],"correct":0,"explain":""},{"q":"Khi xử lý khoản nợ phải thu không có khả năng thu hồi doanh nghiệp phải lập hồ sơ sau:","options":["Biên bản của Hội đồng xử lý nợ của doanh nghiệp. Trong đó ghi rõ giá trị của từng khoản nợ phải thu, giá trị nợ đã thu hồi được, giá trị thiệt hại thực tế (sau khi đã trừ đi các khoản thu hồi được).","Bảng kê chi tiết các khoản nợ phải thu đã xóa để làm căn cứ hạch toán. Sổ kế toán, chứng từ, tài liệu chứng minh khoản nợ chưa thu hồi được, đến thời điểm xử lý nợ doanh nghiệp đang hạch toán nợ phải thu trên sổ kế toán của doanh nghiệp.","Các hồ sơ, tài liệu liên quan đến việc thực hiện trích lập dự phòng liên quan đến các khoản nợ phải thu không có khả năng thu hồi.","Cả 03 câu trên đều đúng."],"correct":3,"explain":""},{"q":"Điều kiện xử lý tài chính nợ phải thu không có khả năng thu hồi đối với cá nhân đã chết là:","options":["Giấy chứng tử bản sao từ sổ gốc","Giấy chứng tử bản sao chứng thực","Xác nhận của chính quyền địa phương về việc đối tượng đã chết","Giấy chứng tử (bản sao chứng thực hoặc bản sao từ sổ gốc) hoặc xác nhận của chính quyền địa phương đối với đối tượng nợ đã chết"],"correct":3,"explain":""},{"q":"Hiện nay, nợ khó đòi được quản lý:","options":["Quản lý thủ công bằng file excel","Đã có chương trình quản lý trên Cmis 4.0","Đã có chương trình quản lý trên Cmis 4.0 và web điều hành nội bộ","Đã có chương trình quản lý trên Cmis 3.0"],"correct":2,"explain":""},{"q":"Để phòng ngừa rủi ro thất thoát nợ khi thanh lý nợ phải thu không có khả năng thu hồi cho các trường hợp hồ sơ xác minh thông tin khách hàng là đã bỏ trốn nhưng thực tế khách hàng vẫn còn tại địa chỉ mua bán điện thì:","options":["Hội đồng xử lý nợ phải kiểm tra thực tế trước khi thông qua/duyệt hồ sơ thanh lý","Hội đồng xử lý rà soát lại hồ sơ trước khi thanh lý","Người phụ trách xác minh lại trước khi thanh lý","Câu a, b đúng"],"correct":0,"explain":""}]},{"name":"Thị trường điện & DPPA","addedAt":1789792793352,"questions":[{"q":"Nguyên nhân chính tại sao mô hình tổ chức ngành điện thường là độc quyền liên kết dọc (phát điện, truyền tải, phân phối, bán lẻ) trước khi bị phân tách do có thị trường điện:","options":["Do chính trị.","Do bản chất độc quyền tự nhiên.","Do mục tiêu an sinh xã hội.","Do mục tiêu lợi nhuận ."],"correct":1,"explain":""},{"q":"Vai trò hàng đầu của thị trường điện là để:","options":["Chỉ đảm bảo cho đơn vị sản xuất điện có được giá bán điện tốt nhất.","Thiết lập cân bằng giữa nguồn và tải trên thứ tự huy động kinh tế và có xét đến các ràng buộc về truyền tải.","Dễ dàng điều tiết giá điện.","Chỉ đảm bảo cho khách hàng có giá mua điện tốt nhất."],"correct":1,"explain":""},{"q":"Nội dung nào sau đây không phải là lợi ích của thị trường điện khu vực?","options":["An ninh cung cấp điện.","Tiết kiệm chi phí.","Luôn có giá điện thấp.","Tất cả các câu trên"],"correct":2,"explain":""},{"q":"Ưu điểm của mô hình thị trường bán buôn điện là gì?","options":["Tạo ra cạnh tranh trong khâu bán lẻ điện.","Giá bán lẻ điện sẽ do thị trường quyết định.","Xóa bỏ độc quyền mua điện của đơn vị mua duy nhất trong thị trường phát điện.","Khách hàng sử dụng điện được tự do mua điện với nhà máy điện."],"correct":2,"explain":""},{"q":"Thị trường điện Việt Nam sẽ được phát triển lần lượt theo các cấp độ:","options":["Thị trường phát điện - Thị trường bán buôn điện - Thị trường bán lẻ điện.","Thị trường phát điện - Thị trường bán lẻ điện - Thị trường bán buôn điện.","Thị trường phát điện - Thị trường bán lẻ điện.","Thị trường phát điện - Thị trường bán buôn điện."],"correct":0,"explain":""},{"q":"Đơn vị mua điện tham gia thị trường điện bán buôn hiện nay là:","options":["Đơn vị vận hành hệ thống điện và thị trường điện (NSMO)","Chỉ có duy nhất 1 đơn vị mua điện là Tập đoàn Điện lực Việt Nam.","Các Tổng công ty Điện lực miền Bắc, miền Trung, miền Nam, Hà Nội, TP.HCM.","Tập đoàn Điện lực Việt Nam và các Tổng công ty Điện lực miền Bắc, miền Trung, miền Nam, Hà Nội, TP.HCM."],"correct":3,"explain":""},{"q":"Đơn vị vận hành hệ thống điện và thị trường điện Việt Nam là:","options":["Công ty TNHH MTV Vận hành hệ thống điện và thị trường điện Quốc gia - NSMO","Tổng công ty Truyền tải điện quốc gia.","Tập đoàn Điện lực Việt Nam.","Công ty Mua bán điện."],"correct":0,"explain":""},{"q":"Đơn vị trực tiếp điều tiết hoạt động của thị trường điện Việt Nam là:","options":["Bộ Công thương.","Tập đoàn Điện lực Việt Nam.","Cục Điện lực.","Công ty TNHH MTV Vận hành hệ thống điện và thị trường điện Quốc gia - NSMO"],"correct":2,"explain":""},{"q":"Giá dịch vụ truyền tải điện:","options":["Do Tổng công ty Truyền tải điện quốc gia tự công bố.","Do thị trường điện quyết định.","Do Tập đoàn Điện lực Việt Nam phê duyệt và ban hành.","Do Bộ Công thương phê duyệt và ban hành."],"correct":3,"explain":""},{"q":"Trong thị trường bán buôn điện, giá bán lẻ điện:","options":["Do thị trường quyết định.","Do Chính phủ quy định và áp dụng khác nhau tại từng Tổng công ty Điện lực.","Do các Tổng công ty Điện lực tự quyết định.","Do Chính phủ quy định và áp dụng thống nhất trên toàn quốc."],"correct":3,"explain":""},{"q":"Chu kỳ giao dịch trong thị trường điện giao ngay của Việt Nam hiện nay là","options":["Theo chu kỳ 1 tháng.","Theo chu kỳ 1 tuần.","Theo chu kỳ 1 ngày.","Theo chu kỳ 30 phút."],"correct":3,"explain":""},{"q":"Đơn vị chịu trách nhiệm quản lý và vận hành hệ thống thông tin thị trường điện, quản trị cổng thông tin điện tử thị trường điện là:","options":["Tập đoàn Điện lực Việt Nam.","Đơ ,"Tổ chức, cá nhân phát triển nguồn điện có công suất lắp đặt từ 1.000 kW trở lên; Tổ chức, cá nhân phát triển nguồn điện có công suất lắp đặt nhỏ hơn 1.000 kW không bán sản lượng điện dư nhưng có nhu cầu cấp Giấy chứng nhận đăng ký phát triển; Tổ chức, cá nhân phát triển nguồn điện có công suất lắp đặt nhỏ hơn 1.000 kW đăng ký bán sản lượng điện dư vào lưới điện của Bên mua điện dư, trừ hộ gia đình phát triển nguồn điện có công suất nhỏ hơn 100 kW trên mái công trình nhà ở riêng lẻ và đối tượng quy định tại khoản 6 Điều 14 Nghị định này.","Tổ chức, cá nhân phát triển nguồn điện có công suất lắp đặt nhỏ hơn 1.000 kW đăng ký bán sản lượng điện dư vào lưới điện của Bên mua điện dư.","Hộ gia đình phát triển nguồn điện có công suất nhỏ hơn 100 kW trên mái công trình nhà ở riêng lẻ."],"correct":1,"explain":""},{"q":"Chỉ thị số 10/CT-TTg ngày 30/3/2026 của Thủ tướng Chính phủ đề cập trực tiếp đến nội dung nào?","options":["Thực thi tiết kiệm điện và phát triển điện mặt trời mái nhà.","Phát triển điện mặt trời mái nhà tự sản xuất, tự tiêu thụ.","Tiết kiệm năng lượng.","Chuyển dịch năng lượng."],"correct":0,"explain":""},{"q":"Theo Thông tư số 07/2025/TT-BCT ngày 01/02/2025, sự kiện điều chỉnh phụ tải điện là gì?","options":["Khoảng thời gian mà khách hàng tham gia chương trình điều chỉnh phụ tải điện thực hiện điều chỉnh giảm nhu cầu sử dụng điện của mình sau khi nhận được thông báo của Đơn vị thực hiện chương trình điều chỉnh phụ tải điện.","Không có quy định.","Biểu đồ phụ tải điển hình.","Khoảng thời gian quy định trong hợp đồng cung cấp dịch vụ điều chỉnh phụ tải điện."],"correct":0,"explain":""},{"q":"Theo quy định hiện hành, cơ quan nào có thẩm quyền ban hành danh sách cơ sở sử dụng năng lượng trọng điểm hằng năm?","options":["EVN.","Ủy ban nhân dân cấp tỉnh.","Bộ Công Thương.","Sở Công Thương."],"correct":1,"explain":""},{"q":"Các ngưỡng/hạn mức chỉ số KRI của rủi ro huy động và quản lý điện mặt trời mái nhà?","options":["<=20% sản lượng tạo ra.","<=50%; >50%.","<=2 c Công ty phát điện quản lý được tính vào TTĐN lưới điện","Điện năng tự dùng tại các trạm biến áp trung gian 110kV trở lên của Tổng công ty sẽ được tính vào tổn thất điện năng trên lưới điện do Công ty Lưới điện cao thế quản lý"],"correct":2,"explain":""},{"q":"Theo Quyết định số 905/QĐ-EVN ngày 17/6/2025 về việc ban hành Quy định về công tác Quản lý kỹ thuật trong Tập đoàn Điện lực Việt Nam, Điện năng tự dùng tại các trạm biến áp trung gian 110kV trở lên của Tổng công ty sẽ được tính vào tổn thất điện năng trên lưới điện của đơn vị nào:","options":["Công ty LĐCT TP.HCM","Công ty Điện lực khu vực","Cả a và b","Được tính trực tiếp vào tổn thất điện năng của Tổng công ty"],"correct":0,"explain":""},{"q":"Theo quy trình quản lý TBĐĐ ban hành kèm Quyết định số 2599/QĐ-EVNHCMC ngày 30/5/2025 v/v về việc ban hành Quy trình kinh doanh điện năng áp dụng trong Tổng công ty Điện lực Thành phố Hồ Chí Minh, phát biểu nào sau đây là đúng:","options":["TBĐĐ ranh giới giữa các Công ty Điện lực với nhau phải được kiểm định mỗi năm một lần","TBĐĐ ranh giới giữa các Công ty Điện lực với Công ty Lưới điện Cao thế phải được kiểm định mỗi năm một lần","TBĐĐ ranh giới nội bộ phải được kiểm định định kỳ theo đúng quy định pháp luật đo lường.","Các câu trên đều đúng"],"correct":2,"explain":""},{"q":"Theo Thông tư 05/2025/TT-BCT ngày 01/02/2025 của Bộ Công Thương quy định hệ thống truyền tải điện, phân phối điện và đo đếm điện năng, yêu cầu về cấp chính xác đối với công tơ thuộc hệ thống đo đếm chính có cấp điện áp dưới 220kV và lớn hơn 1kV là:","options":["Công tơ đo đếm chính phải đạt cấp chính xác tối thiểu là 0,5 với điện năng tác dụng và 2,0 với điện năng phản kháng theo các tiêu chuẩn do Bộ Khoa học và Công nghệ quy định","Công tơ đo đếm chính phải đạt cấp chính xác là 0,5 với điện năng tác dụng và 2,0 với điện năng phản kháng theo các tiêu chuẩn do Bộ Khoa học và Công nghệ quy định","Công tơ đo đếm chính phải đạt cấp chính xác tối đa là 0,5 với điện năng tác dụng và 2,0 với điện năng phản kháng theo các tiêu chuẩn do Bộ Khoa học và Công nghệ quy định","Công tơ đo đếm chính phải đạt cấp chính xác tối thiểu là 0,5 với điện năng tác dụng và 1,0 với điện năng phản kháng theo các tiêu chuẩn do Bộ Khoa học và Công nghệ quy định"],"correct":0,"explain":""},{"q":"Theo quy trình quản lý TBĐĐ ban hành kèm Quyết định số 2599/QĐ-EVNHCMC ngày 30/5/2025 v/v về việc ban hành Quy trình kinh doanh điện năng áp dụng trong Tổng công ty Điện lực Thành phố Hồ Chí Minh, phát biểu nào sau đây là đúng đối với công tác kiểm định TBĐĐ theo yêu cầu:","options":["Trước ngày kiểm định 10 ngày, Đơn vị yêu cầu kiểm định thông báo bằng văn bản cho Đơn vị giao nhận điện liên quan và Công ty TNĐL về kế hoạch kiểm định.","Trong thời gian ≤ 03 ngày làm việc kể từ ngày nhận được thông báo, Đơn vị giao nhận điện liên quan có trách nhiệm trả lời bằng văn bản về việc phối hợp thực hiện kế hoạch kiểm định.","Kiểm định theo yêu cầu chỉ được tiến hành sau khi Đơn vị giao nhận điện liên quan thống nhất kế hoạch.","Các câu trên đều đúng"],"correct":3,"explain":""},{"q":"Theo quy trình quản lý TBĐĐ ban hành kèm Quyết định số 2599/QĐ-EVNHCMC ngày 30/5/2025 v/v về việc ban hành Quy trình kinh doanh điện năng áp dụng trong Tổng công ty Điện lực Thành phố Hồ Chí Minh, phát biểu nào sau đây là đúng nhất đối với công tác xử lý sự cố TBĐĐ ranh giới:","options":["Khi phát hiện TBĐĐ ranh giới (TU, TI, mạch nhị thứ, công tơ…) bị hỏng, đơn vị phát hiện phải thông báo thông báo cho Đơn vị giao nhận điện liên quan và Công ty TNĐL, Công ty CNTT phối hợp thực hiện sửa chữa, thay thế ngay","Trong thời gian ≤ 04 ngày kể từ ngày xảy ra sự cố TBĐĐ, Đơn vị quản lý TBĐĐ mời Công ty TNĐL, Công ty CNTT, Ban Kinh doanh, xác định sản lượng điện năng truy thu, thoái hoàn theo các phương pháp quy định tại Phụ lục 02, Phần IV, Quy trình quản lý TBĐĐ EVN và có văn bản báo cáo về Tổng công ty.","Thủ tục nghiệm thu TBĐĐ sau khi xử lý sự cố tương tự trường hợp lắp đặt mới","Các câu trên đều đúng"],"correct":3,"explain":""},{"q":"Theo mục tiêu, giải pháp trong công tác giảm tổn thất điện năng năm 2026 của Tổng công ty ban hành, nhằm nâng cao chất lượng công tác quản lý chỉ số điện năng, phát biểu nào sau đây là đúng:","options":["Trong bộ phận làm công tác kiểm soát chỉ số phải có phân công cụ thể nhân viên chịu trách nhiệm khai thác, phân tích thông tin từ hệ thống thu thập dữ liệu MDIS và các cảnh báo trên chương trình nhằm phục vụ công tác quản lý chỉ số điện năng; tăng cường công tác phúc tra ghi điện và quản lý chặt chẽ tình trạng bất thường của công tơ, sót bộ công tơ, sai hệ số nhân công tơ, chuyển khai thác và cập nhật biến động công tơ khách hàng kịp thời đúng quy định, cụ thể hóa trách nhiệm khi xảy ra sai sót","Tăng cường kiểm tra, chuyển phiên kịp thời các khách hàng có điện năng tiêu thụ lớn theo đúng quy định","Nâng cao chất lượng công tác quản lý dữ liệu thu thập từ công tơ tổng TBACC, TBA khách hàng nhằm nâng cao tính kịp thời và chính xác trong công tác theo dõi, cập nhật biến động và tính toán tổn thất khu vực.","Các câu trên đều đúng"],"correct":3,"explain":""},{"q":"Theo quy trình quản lý TBĐĐ ban hành kèm Quyết định số 2599/QĐ-EVNHCMC ngày 30/5/2025 v/v về việc ban hành Quy trình kinh doanh điện năng áp dụng trong Tổng công ty Điện lực Thành phố Hồ Chí Minh, phát biểu nào sau đây là sai đối với công tác kiểm định định kỳ TBĐĐ ranh giới:","options":["Trước ngày 30 tháng 11 hàng năm, Đơn vị quản lý TBĐĐ phải lập kế hoạch thử nghiệm sai số TBĐĐ của năm tiếp theo và gửi văn bản thông báo cho Công ty TNĐL để đăng ký kế hoạch thử nghiệm sai số TBĐĐ.","Công ty TNĐL có trách nhiệm phối hợp Đơn vị quản lý TBĐĐ lập kế hoạch thử nghiệm sai số TBĐĐ, gửi kế hoạch đến Đơn vị giao nhận điện liên quan và báo cáo Tổng công ty. Ít nhất trước ngày thử nghiệm sai số 10 ngày, Công ty TNĐL có văn bản thông báo về thời gian, địa điểm, gửi cho tất cả Đơn vị giao nhận điện liên quan TBĐĐ để cùng phối hợp thực hiện.","Công ty TNĐL có trách nhiệm nhiệm tập hợp và gửi kết quả thử nghiệm sai số, kết quả xác định điện năng không qua đo đếm và điện năng tăng thêm trong khi kiểm định cho tất cả Đơn vị giao nhận điện liên quan TBĐĐ. Báo cáo Tổng công ty kết quả thử nghiệm sai số vào ngày 25 mỗi tháng thuộc kế hoạch.","Khi thực hiện kiểm định TBĐĐ ranh giới các đơn vị không cần phối hợp đủ thành phần mà chỉ cần có nhóm công tác Công ty TNĐL và một trong các đơn vị giao hoặc nhận điện là có thể tiến hành kiểm định TBĐĐ ranh giới."],"correct":3,"explain":""},{"q":"Theo quy trình quản lý TBĐĐ ban hành kèm Quyết định số 2599/QĐ-EVNHCMC ngày 30/5/2025 v/v về việc ban hành Quy trình kinh doanh điện năng áp dụng trong Tổng công ty Điện lực Thành phố Hồ Chí Minh, TBĐĐ ranh giới nội bộ là:","options":["TBĐĐ ranh giới giữa CT LĐCT TP.HCM với các Công ty Điện lực","TBĐĐ ranh giới giữa các Công ty Điện lực với nhau","TBĐĐ ranh giới do các đơn vị của Tổng công ty quản lý vận hành","Cả a và b đều đúng."],"correct":3,"explain":""},{"q":"Theo Quyết định số 6297/QĐ-EVNHCMC ngày 29/12/2023 về việc ban hành quy định quản lý tổn thất khu vực trong Tổng công ty Điện lực TP.HCM, chọn câu đúng nhất đối với công tác tính toán tổn thất:","options":["Lịch GCS HTĐĐ giao nhận điện ranh giới, xuất tuyến trung thế, phân đoạn trung thế: Đồng bộ CS vào 0h ngày 01 hàng tháng. Trường hợp điểm đo đếm ranh giới không có người trực hoặc chưa lắp hệ thống thu thập số liệu từ xa cho phép ghi vào 0 giờ 00 + 12 giờ 00 ngày 01 hàng tháng, nhưng đảm bảo thời điểm ghi trong ngày đối với một công tơ là cố định.","Lịch GCS công tơ phiên 50 được thực hiện vào ngày 01 hàng tháng cùng với lịch ghi các công tơ giao nhận điện, xuất tuyến trung thế, phân đoạn trung thế. Lưu ý đảm bảo thời điểm ghi trong ngày đối với một công tơ là cố định hàng tháng.","Lịch GCS công tơ trạm công cộng: Lịch GCS phiên 40 được thực hiện cùng với việc GCS tất cả các công tơ khách hàng dùng điện sau trạm biến áp. Lưu ý đảm bảo thời điểm GCS trong ngày đối với một trạm cộng cộng là cố định vào ngày cuối tháng.","Các câu trên đều đúng"],"correct":3,"explain":""},{"q":"Theo quy trình quản lý TBĐĐ ban hành kèm Quyết định số 2599/QĐ-EVNHCMC ngày 30/5/2025 v/v về việc ban hành Quy trình kinh doanh điện năng áp dụng trong Tổng công ty Điện lực Thành phố Hồ Chí Minh, mã số hệ thống đo đếm ranh giới nội bộ dùng để quản lý điểm đo ranh giới nội bộ gồm có mấy ký tự chữ cái:","options":["2","4","Tuỳ trường hợp.","Câu b và c đúng"],"correct":0,"explain":""},{"q":"Theo Quyết định số 905/QĐ-EVN ngày 17/6/2025 về việc ban hành Quy định về công tác Quản lý kỹ thuật trong Tập đoàn Điện lực Việt Nam, tổn thất điện năng là:","options":["TTĐN trên hệ thống điện của EVN là tổn thất điện năng trên toàn bộ lưới điện do EVN và các Đơn vị của EVN quản lý","TTĐN trên một lưới điện được xác định bằng tổng điện năng nhận vào trừ tổng điện năng giao đi của lưới điện đó. Trong đó, tổng điện năng giao, nhận của lưới điện là tổng đại số lượng điện giao, nhận được xác định bởi hệ thống đo đếm điện năng tại các điểm đo đếm ranh giới của lưới điện đó","Câu a và b đúng","Câu a và b sai"],"correct":2,"explain":""},{"q":"Theo Quyết định số 905/QĐ-EVN ngày 17/6/2025 về việc ban hành Quy định về công tác Quản lý kỹ thuật trong Tập đoàn Điện lực Việt Nam, ranh giới giao nhận điện năng là:","options":["Vị trí ranh giới quản lý tài sản","Vị trí ranh giới quản lý vận hành","Vị trí lắp đặt hệ thống đo đếm điện năng giao nhận giữa các đơn vị","Các câu trên đều đúng"],"correct":2,"explain":""},{"q":"Theo Quyết định số 905/QĐ-EVN ngày 17/6/2025 về việc ban hành Quy định về công tác Quản lý kỹ thuật trong Tập đoàn Điện lực Việt Nam, điện năng nhận giao ngay không gây TTĐN trên lưới điện là:","options":["Là điện năng giao nhận giữa các đơn vị trong ngành điện, không mua bán với khách hàng","Là sản lượng điện năng nhận nhưng giao ngay cho Đơn vị khác hoặc khách hàng trên cùng một điểm đo được coi là điện năng không gây TTĐN trên lưới điện của Đơn vị","Điện tự dùng trong các trạm trung gian là điện năng giao ngay","Câu b và c đúng"],"correct":1,"explain":""},{"q":"Tổn thất điện năng phi kỹ thuật do:","options":["Điện năng dùng để phân phối","Điện năng tiêu thụ không qua hệ thống đo đếm","Điện năng thất thoát do trộm cắp điện","Câu a và c đúng"],"correct":2,"explain":""},{"q":"Tổn thất điện năng kỹ thuật là:","options":["Điện năng dùng để truyền tải và phân phối","Tổn hao máy biến thế","Điện năng thất thoát do trộm cắp điện","Các câu trên đều sai"],"correct":1,"explain":""},{"q":"Theo Quyết định số 704/QĐ-EVNHCMC ngày 04/02/2026 về việc ban hành quy định quản lý tổn thất khu vực trong Tổng công ty Điện lực TP.HCM, chọn câu đúng nhất đối với công tác cập nhật biến động tránh gây ảnh hưởng TTKV:","options":["Đối với các trường hợp máy biến thế lưu động, công tơ gắn tạm, công tơ phục vụ Lễ hội … các nhân viên thực hiện thay gắn ngoài hiện trường có nhiệm vụ thông báo cho bộ phận quản lý TTKV, DVKH, thu ghi để thực hiện chốt sản lượng tiêu thụ, cập nhật vào phần sản lượng không qua đo đếm trên hệ thống CMIS, theo dõi việc ra hóa đơn tiền điện tránh trường hợp sót bộ.","Các biến động khác có ảnh hưởng đến công tác quản lý TTKV bao gồm: Điều chỉnh chỉ số, điều chỉnh hệ số nhân HTĐĐ trạm công cộng, điều chỉnh công suất đèn dân lập, truy thu thoái hoàn điện năng.","Đối với các trường hợp biến động này thời gian thực hiện và thời gian cập nhật biến động vào chương trình CMIS phải được thực hiện đúng theo các quy trình kinh doanh điện năng của TCT hiện hành. Các trường hợp sai sót sẽ bị xử lý trách nhiệm theo đúng quy định","Các câu trên đều đúng"],"correct":3,"explain":""},{"q":"Theo Quyết định số 704/QĐ-EVNHCMC ngày 04/02/2026 về việc ban hành quy định quản lý tổn thất khu vực trong Tổng công ty Điện lực TP.HCM, chọn câu đúng nhất đối với công tác cập nhật biến động tránh gây ảnh hưởng TTKV:","options":["Đối với các khu vực có tổn thất cao liên tục từ 02 kỳ trở lên hoặc các khu vực có tổn thất cao trong kỳ tính toán, đơn vị phải tổ chức kiểm tra tại hiện trường để phân tích xác định tất cả nguyên nhân gây nên tổn thất. Các nguyên nhân tổn thất cần kiểm tra phân tích theo Check list kiểm soát tổn thất","Trong thời hạn 01 ngày làm việc kể từ ngày điều tra tại hiện trường, các đơn vị được giao phải báo cáo kết quả kiểm tra, phân tích nguyên nhân tổn thất của khu vực và báo cáo đề xuất cho Ban chỉ đạo chống tổn thất theo mẫu 01 (BM-QyĐ-24/01)","Hàng tháng, đơn vị phải có kế hoạch tổ chức kiểm tra phân tích xác định nguyên nhân tổn thất các khu vực nêu trên. Số lượng khu vực cần kiểm tra phân tích trong tháng do đơn vị quyết định trên cơ sở sử dụng hiệu quả nguồn lực tại đơn vị để đảm bảo lộ trình giảm tổn thất của đơn vị","Các câu trên đều đúng"],"correct":3,"explain":""},{"q":"Hành vi sử dụng điện nào gây tổn thất điện năng trên lưới điện:","options":["Hành vi trộm cắp điện","Sử dụng điện thực tế sai với mục đích sử dụng mà khách hàng đã đăng ký sử dụng trong hợp đồng mua bán điện","Hệ thống đo đếm sai số vượt cấp chính xác cho phép","Câu a và c đúng"],"correct":3,"explain":""},{"q":"Tổn thất lưới điện phân phối là:","options":["Tổn thất điện năng chung của các CTĐL","Bao gồm tổn thất lưới trung áp và hạ áp","Câu a và b đúng","Câu a và b sai"],"correct":2,"explain":""},{"q":"Theo Quyết định số 704/QĐ-EVNHCMC ngày 04/02/2026 về việc ban hành quy định quản lý tổn thất khu vực trong Tổng công ty Điện lực TP.HCM, chọn câu đúng nhất đối với công tác cập nhật biến động tránh gây ảnh hưởng TTKV:","options":["Căn cứ kết quả tính toán TTKV trung thế do bộ phận quản lý TTKV cung cấp vào ngày 03 hàng tháng, bộ phận quản lý kỹ thuật chủ trì, phối hợp với các phòng/đội liên quan tổ chức cập nhật sản lượng chuyển tải giữa các tuyến dây, các biến động trong tháng và tổng hợp báo cáo theo mẫu 02 (BM-QyĐ-24/02). Từ đó, tổ chức kiểm tra, phân tích nguyên nhân tại hiện trường đối với các khu vực trung thế có tổn thất cao theo Check list kiểm soát tổn thất","Trước ngày 05 hàng tháng bộ phận quản lý kỹ thuật báo cáo kết quả phân tích nguyên nhân các khu vực trung thế có tổn thất cao theo. Đồng thời đề xuất giải pháp, tiến độ thực hiện giảm tổn thất từng khu vực cụ thể cho Ban Chỉ đạo giảm tổn thất","Các câu trên sai","Câu a và b đúng"],"correct":3,"explain":""},{"q":"Theo quy trình quản lý TBĐĐ ban hành kèm Quyết định số 2599/QĐ-EVNHCMC ngày 30/5/2025 v/v về việc ban hành Quy trình kinh doanh điện năng áp dụng trong Tổng công ty Điện lực Thành phố Hồ Chí Minh, chọn câu đúng nhất đối với trách nhiệm của các đơn vị trong việc đầu tư, lắp đặt, quản lý vận hành TBĐĐ và HTTTSL:","options":["TBĐĐ và HTTTSL của các điểm đo ranh giới, điểm đo nội bộ trạm trung gian 110kV, 220kV phải được nghiệm thu đưa vào sử dụng cùng lúc. TBĐĐ và HTTTSL phải phù hợp với yêu cầu kỹ thuật của Tổng công ty","Công ty LĐCT có trách nhiệm quản lý, cập nhật thông tin vào CMIS, MDIS (bao gồm điểm đo ranh giới Tập đoàn và ranh giới nội bộ, các điểm đo đầu phát tuyến trung thế phục vụ tính toán tổn thất) đối với các TBĐĐ và HTTTSL ranh giới đặt tại các trạm trung gian thuộc của Tổng công ty","Trách nhiệm đầu tư TBĐĐ và HTTTSL ranh giới theo thứ tự ưu tiên như sau: Ranh giới quản lý vận hành, ranh giới quản lý tài sản của các đơn vị giao nhận điện, trừ các trường hợp có thỏa thuận khác. Trong trường hợp không thể thống nhất được đơn vị đầu tư TBĐĐ và HTTTSL ranh giới, Tổng công ty sẽ chỉ định đơn vị đầu tư","Các câu trên đều đúng"],"correct":3,"explain":""},{"q":"Theo quy trình quản lý TBĐĐ ban hành kèm Quyết định số 2599/QĐ-EVNHCMC ngày 30/5/2025 v/v về việc ban hành Quy trình kinh doanh điện năng áp dụng trong Tổng công ty Điện lực Thành phố Hồ Chí Minh, chọn câu đúng nhất đối với trách nhiệm của các đơn vị trong việc lắp đặt, nghiệm thu TBĐĐ và HTTTSL :","options":["Thủ tục nghiệm thu: sau khi công tác thi công hoàn tất, đơn vị đầu tư (bao gồm Ban QLDALĐ) TBĐĐ và HTTTSL chuẩn bị đầy đủ các biên bản thí nghiệm thiết bị, bản vẽ hoàn công, sau đó mời đơn vị giao nhận điện liên quan, Công ty TNĐL, Công ty CNTT cùng chứng kiến nghiệm thu","Khi nghiệm thu, Công ty TNĐL kiểm tra lại các hồ sơ có liên quan đến TBĐĐ, xác định sơ đồ đấu dây. Nếu tất cả đều đảm bảo tiêu chuẩn kỹ thuật dùng làm TBĐĐ ranh giới thì lập biên bản nghiệm thu đưa vào vận hành (có chứng kiến của đại diện đơn vị giao nhận điện). Trường hợp các TBĐĐ không đủ tiêu chuẩn kỹ thuật dùng làm điểm đo ranh giới, đơn vị quản lý tài sản phải báo cáo về Tổng công ty để có hướng dẫn xử lý","Biên bản nghiệm thu gồm hai phần: (i) Biên bản nghiệm thu về TBĐĐ; (ii) Biên bản nghiệm thu về hệ thống đo xa. Trong đó, biên bản nghiệm thu về TBĐĐ thực hiện theo Phụ lục 03 của Thông tư số 42/2015/TT-BCT. Biên bản nghiệm thu HTTTSL phải ghi nhận đầy đủ kết quả đọc dữ liệu từ xa của điểm đo, bao gồm các thông số vận hành (điện áp U, dòng điện I, hệ số công suất Cosφ, tần số f), các sự kiện của công tơ và dữ liệu load profile. Biên bản được Công ty TNĐL và Công ty CNTT lập thành 04 bản, mỗi đơn vị giữ một bản và gửi về Ban Kinh doanh một bản với thời gian không quá 02 ngày làm việc sau ngày công tác","Các câu trên đều đúng"],"correct":3,"explain":""},{"q":"Theo mục tiêu, giải pháp trong công tác giảm tổn thất điện năng năm 2026 của Tổng công ty ban hành ở nhóm \"Giải pháp đầu tư xây dựng, sửa chữa lớn và sửa chữa thường xuyên\": để tránh gây ra sai số tính toán tổn thất trung, hạ thế online do biến động lưới điện....","options":["các công trình ĐTXD, sửa chữa… làm thay đổi lưới điện hiện hữu phải có bản vẽ chi tiết lưới điện và danh sách khách hàng","bộ phận quản lý tổn thất khu vực và GIS phải được cung cấp đủ thông tin và cập nhật ngay trong ngày thi công","hạn chế phải quay lại hiện trường thi công để điều tra tổn thất khu vực, xử lý nghiêm đơn vị thi công làm khác phương án được duyệt mà không cập nhật, báo cáo ngay trong ngày thi công","Các câu trên đều đúng"],"correct":3,"explain":""},{"q":"Theo mục tiêu, giải pháp trong công tác giảm tổn thất điện năng năm 2026 của Tổng công ty ban hành ở nhóm \"Giải pháp công tác quản lý kỹ thuật và vận hành\", chọn câu đúng nhất:","options":["Rà soát tình hình mang tải của lưới điện truyền tải, lưới điện phân phối để có phương án, biện pháp khắc phục kịp thời; đặc biệt, không để vận hành đầy/quá tải trong trường hợp vận hành lưới điện ở kết lưới bình thường hoặc không phải giờ cao điểm","Tăng cường khai thác số liệu đo xa trong công tác quản lý vận hành lưới điện. Chú trọng việc ứng dụng linh hoạt các chương trình, phần mềm để nâng cao hiệu quả quản lý, vận hành lưới điện","Tăng cường việc kiểm tra lưới điện để phát hiện và xử lý triệt để dòng rò, các vị trí quá nhiệt trên lưới nhằm góp phần giảm tổn thất điện năng","Các câu trên đều đúng"],"correct":3,"explain":""},{"q":"Theo mục tiêu, giải pháp trong công tác giảm tổn thất điện năng năm 2026 của Tổng công ty ban hành ở nhóm \"Giải pháp công tác quản lý kỹ thuật và vận hành\", chọn câu đúng nhất:","options":["Đảm bảo các công trình ĐTXD mới TBA trung gian 220 kV, 110 kV, đường dây trung thế, TBA phân phối đều có tính toán và lắp đặt tụ bù với dung lượng phù hợp và vị trí tối ưu","Tăng cường theo dõi hệ thống đo xa, các báo cáo giám sát cảnh báo vận hành, theo dõi công suất phản kháng, hệ số công suất của các tuyến dây và TBA phân phối","Thực hiện rà soát và xử lý nhanh các trường hợp hệ số công suất không đạt theo quy định, đồng thời, xem xét xây dựng phương án hoán chuyển lắp đặt tụ bù trên địa bàn quản lý để nâng cao chất lượng điện năng; Tổ chức kiểm tra, rà soát tình trạng vận hành của tụ bù trên lưới điện","Các câu trên đều đúng"],"correct":3,"explain":""},{"q":"Theo mục tiêu, giải pháp trong công tác giảm tổn thất điện năng năm 2026 của Tổng công ty ban hành ở nhóm \"Giải pháp công tác quản lý kỹ thuật và vận hành\", chọn câu đúng nhất:","options":["Tăng cường rà soát, kiểm tra, chủ động kiện toàn thông tin, đảm bảo đồng bộ và chính xác dữ liệu tại các chương trình PMIS, MDIS, CMIS, OMS, GIS để phục vụ hiệu quả công tác tính toán tổn thất online 100% các tuyến dây trung thế, trạm biến áp phân phối","Đảm bảo dữ liệu thành phần tính toán tổn thất điện năng được khai báo trên chương trình tính toán điện năng online đúng, đủ; tăng cường sử dụng và sử dụng một cách hiệu quả trong công tác quản lý tổn thất điện năng, đặc biệt là công tác hiệu suất khu vực","Rà soát, lập kế hoạch kiện toàn kết cấu lưới điện trung, hạ thế","Các câu trên đều đúng"],"correct":3,"explain":""}]},{"name":"Văn hóa doanh nghiệp 2026","addedAt":1789792793387,"questions":[{"q":"Tài liệu Văn hóa EVN gồm mấy chương?","options":["1","2","3","4"],"correct":1,"explain":""},{"q":"Trong Chương I - Bản sắc Văn hóa EVN bao gồm những nội dung gì?","options":["Sứ mệnh, tầm nhìn, khẩu hiệu và triết lý hoạt động EVN","Các giá trị cốt lõi của EVN","Các chuẩn mực đạo đức nghề nghiệp của EVN","Câu a,b,c đúng"],"correct":3,"explain":""},{"q":"Sứ mệnh của EVN là cung cấp điện với chất lượng và dịch vụ ngày càng tốt hơn, đảm bảo trách nhiệm với môi trường và cộng đồng.","options":["Đúng","Sai"],"correct":0,"explain":""},{"q":"Trong tài liệu Văn hóa EVN, nội dung \"EVN là tập đoàn kinh tế hàng đầu trong lĩnh vực năng lượng tại Việt Nam và khu vực châu Á\" là","options":["Sứ mệnh","Tầm nhìn","Khẩu hiệu","Triết lý hoạt động"],"correct":1,"explain":""},{"q":"Khẩu hiệu của EVN là:","options":["Chuyên nghiệp-Minh bạch-Hiệu quả","Niềm tin-Trách nhiệm-Tiên phong","An toàn-Đoàn kết-Nhân văn","Thắp sáng niềm tin"],"correct":3,"explain":""},{"q":"\"Khách hàng là trung tâm của sự tồn tại và phát triển, con người là tài sản quý giá nhất, niềm tin được thắp sáng bằng các giá trị được tạo dựng và chia sẻ\" là:","options":["Sứ mệnh","Các giá trị cốt lõi của EVN","Triết lý hoạt động","Tầm nhìn"],"correct":2,"explain":""},{"q":"Trong tài liệu Văn hóa EVN có bao nhiêu giá trị cốt lõi","options":["4","5","8","7"],"correct":1,"explain":""},{"q":"Giá trị cốt lõi của EVN bao gồm:","options":["Niềm tin-Chất lượng","Tiên phong - Sáng tạo","Trách nhiệm","Cả a, b,c"],"correct":3,"explain":""},{"q":"Trong tài liệu Văn hóa EVN có bao nhiêu chuẩn mực đạo đức nghề nghiệp?","options":["5","2","3","4"],"correct":0,"explain":""},{"q":"Các chuẩn mực đạo đức nghề nghiệp của EVN gồm:","options":["An toàn-Đoàn kết","Nhân văn-Trung thực-Minh bạch","Niềm tin-Chất lượng-Tiên phong","Câu a và b"],"correct":3,"explain":""},{"q":"EVN thắp sáng ….. bằng trách nhiệm, sự tận tâm, tinh thần tiên phong và sáng tạo để nâng cao chất lượng cuộc sống của…..và….","options":["Ước mơ-khách hàng-đối tác","Niềm tin-khách hàng-cộng đồng xã hội","Tương lai-khách hàng-CBCNV","Cả a, b,c đều sai"],"correct":1,"explain":""},{"q":"Trong tài liệu Văn hóa EVN, Niềm tin thể hiện ở:","options":["Tôn trọng khách hàng, đối tác, đồng nghiệp và đối xử với họ như cách chúng ta muốn được đối xử","Ứng xử chuyên nghiệp và thiện chí với mọi người","Câu a và b đúng","Tuân thủ các tiêu chuẩn nghiêm ngặt về an toàn"],"correct":2,"explain":""},{"q":"Trong tài liệu Văn hóa EVN, EVN cam kết cung cấp sản phẩm và dịch vụ có…. cho khách hàng và cộng đồng xã hội","options":["Niềm tin","Chất lượng","Sáng tạo","Tiên phong"],"correct":1,"explain":""},{"q":"EVN….trong nghiên cứu và phát triển để tạo ra những đột phát về năng lượng cho đất nước","options":["Tin tưởng","Phấn đấu","Tiên phong","Sáng tạo"],"correct":2,"explain":""},{"q":"Trong tài liệu Văn hóa EVN, nâng cao tinh thần học hỏi từ công việc, đồng nghiệp và đối tác, thử thách bản thân bằng các sáng kiến mới là điều chúng ta nên làm theo giá trị cốt lõi nào?","options":["Sáng tạo","Niềm tin","Nhân văn","Đoàn kết"],"correct":0,"explain":""},{"q":"EVN luôn có quan điểm nhất quán rằng,….. với khách hàng, đối tác, cộng đồng xã hội và với tương lai của đất nước là một phần không thể thiếu trong….của EVN","options":["Phương châm - nhận thức","Đoàn kết - giá trị","An toàn - nhiệm vụ","Trách nhiệm - sứ mệnh"],"correct":3,"explain":""},{"q":"Các giá trị chuẩn mực đạo đức nghề nghiệp của người EVN bao gồm \"An toàn-Đoàn kết-Nhân văn-Trung thực-Minh bạch\"","options":["Đúng","Sai"],"correct":0,"explain":""},{"q":"....là tôn chỉ hành động và chuẩn mực … mà EVN phải thực hiện nghiêm ngặt."
