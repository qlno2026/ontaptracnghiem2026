<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ── HELPERS ────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Bỏ dấu tiếng Việt + hạ chữ thường (dùng cho tìm kiếm/so khớp)
function normVn(s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
// normVn() bỏ dấu được nhưng chữ "đ" không phân rã NFD được, nên phải đổi thủ công.
function quizNormBase(s) { return normVn(String(s == null ? '' : s)).replace(/đ/g, 'd'); }
function quizKey(s) { return quizNormBase(s).replace(/[_\s]/g, ''); }
function quizText(s) { return quizNormBase(s).replace(/\s+/g, ' ').trim(); }

// Đọc file thành workbook. File CSV/txt được tự giải mã UTF-8, vì SheetJS mặc định
// đọc CSV theo codepage Latin-1 nên tiếng Việt sẽ bị sai dấu và không khớp tên cột.
// cellDates:true là BẮT BUỘC — xem giải thích ở cellText(). Thiếu nó thì ô ngày của
// Excel (01/01/2025 hiển thị trong Excel) về tay app dưới dạng SỐ SÊ-RI 45658.
function readWorkbook(arrayBuffer, fileName) {
  const bytes = new Uint8Array(arrayBuffer);
  if (/\.(csv|txt|tsv)$/i.test(String(fileName || ''))) {
    let text = new TextDecoder('utf-8').decode(bytes);
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // bỏ BOM nếu có
    return XLSX.read(text, { type: 'string', cellDates: true });
  }
  return XLSX.read(bytes, { type: 'array', cellDates: true });
}

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ── CLOCK ──────────────────────────
function updateLiveClock() {
  const el = document.getElementById('clockLive');
  const dateEl = document.getElementById('clockDateLive');
  if (!el) return;
  const now = new Date();
  el.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  if (dateEl) {
    const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
    dateEl.textContent = days[now.getDay()] + ', ' + now.getDate() + '/' + (now.getMonth() + 1) + '/' + String(now.getFullYear()).slice(-2);
  }
}
updateLiveClock();
setInterval(updateLiveClock, 1000);

function showClock() {
  let overlay = document.getElementById('clockOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'clockOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center';
    overlay.onclick = function(e) { if (e.target === overlay) overlay.style.display = 'none'; };
    const box = document.createElement('div');
    box.style.cssText = 'background:var(--navy-mid);border-radius:20px;padding:32px 40px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,0.5);min-width:240px';
    box.innerHTML = '<div id="clockDigital" style="font-size:49px;font-weight:200;color:#60a5fa;letter-spacing:2px"></div>' +
      '<div id="clockDate" style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:#94a3b8;margin-top:8px"></div>';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }
  overlay.style.display = 'flex';
  (function tick() {
    if (overlay.style.display === 'none') return;
    const now = new Date();
    document.getElementById('clockDigital').textContent =
      String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
    const days = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
    const months = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];
    document.getElementById('clockDate').textContent =
      days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    requestAnimationFrame(tick);
  })();
}

// ── THEME ──────────────────────────
// Chủ đề ghi nhớ RIÊNG cho hai kiểu màn hình: màn RỘNG mặc định TỐI, màn HẸP
// (điện thoại, ≤480px — cùng ngưỡng với các tính năng mobile trước đây) mặc định SÁNG.
// Bấm nút chỉ đổi cho kiểu màn hình đang xem, nên lựa chọn tối trên máy tính không
// kéo theo điện thoại và ngược lại.
const THEME_MOBILE_W = 480;
function isPhoneView() { return window.innerWidth <= THEME_MOBILE_W; }
function themeBucket() { return isPhoneView() ? 'narrow' : 'wide'; }
let _theme = { wide: 'dark', narrow: 'light' };
(function restoreTheme() {
  let raw = null;
  try { raw = localStorage.getItem('qlno_theme'); } catch (e) {}
  if (raw === 'light' || raw === 'dark') {
    _theme.wide = raw;                    // dạng cũ (một chuỗi) = lựa chọn trên màn RỘNG
  } else if (raw) {
    try {
      const saved = JSON.parse(raw);
      if (saved && typeof saved === 'object') {
        if (saved.wide === 'light' || saved.wide === 'dark') _theme.wide = saved.wide;
        if (saved.narrow === 'light' || saved.narrow === 'dark') _theme.narrow = saved.narrow;
      }
    } catch (e) {}
  }
  if (_theme[themeBucket()] === 'light') document.body.classList.add('light-mode');
})();
function toggleTheme() {
  const bucket = themeBucket();
  _theme[bucket] = document.body.classList.toggle('light-mode') ? 'light' : 'dark';
  try { localStorage.setItem('qlno_theme', JSON.stringify(_theme)); } catch (e) {}
}

let _mix = { total: MIX_DEFAULT_TOTAL, pct: {}, locked: {} };   // pct[setId] = phần trăm của bộ đó trong đề trộn

function quizNewId(prefix) { return (prefix || 'q') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function normalizeQ(q) {
  const out = {
    id: (q && q.id) ? String(q.id) : quizNewId(),
    q: String((q && q.q) || ''),
    options: (q && Array.isArray(q.options)) ? q.options.map(function (o) { return String(o); }) : [],
    correct: (q && typeof q.correct === 'number') ? q.correct : 0,
    explain: (q && typeof q.explain === 'string') ? q.explain : ''
  };
  if (!out.q || out.options.length < 2) return null;
  if (out.correct < 0 || out.correct >= out.options.length) out.correct = 0;
  return out;
}

function normalizeSet(s) {
  return {
    id: (s && s.id) ? String(s.id) : quizNewId('s'),
    name: String((s && s.name) || 'Bộ đề'),
    addedAt: (s && s.addedAt) || Date.now(),
    questions: ((s && Array.isArray(s.questions)) ? s.questions : []).map(normalizeQ).filter(Boolean)
  };
}

function loadLib() {
  let raw = null;
  try { raw = localStorage.getItem(LIB_KEY); } catch (e) { raw = null; }

  if (raw === null) {                    // lần đầu chạy bản nhiều bộ đề
    let old = [];
    try { old = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]'); } catch (e) { old = []; }
    quizLib = [];
    const qs = (Array.isArray(old) ? old : []).map(normalizeQ).filter(Boolean);
    if (qs.length) quizLib.push(normalizeSet({ name: OLD_SET_NAME, questions: qs }));
    saveLib();
    return;
  }

  let parsed = [];
  try { parsed = JSON.parse(raw); } catch (e) { parsed = []; }
  quizLib = (Array.isArray(parsed) ? parsed : [])
    .map(normalizeSet)
    .filter(function (s) { return s.questions.length; });
}

function saveLib() {
  try { localStorage.setItem(LIB_KEY, JSON.stringify(quizLib)); }
  catch (e) { alert('Không lưu được thư viện: ' + ((e && e.message) || e)); }
}

function libSet(id) {
  for (let i = 0; i < quizLib.length; i++) if (quizLib[i].id === id) return quizLib[i];
  return null;
}
function curSet() { return libSet(_libSetId) || quizLib[0] || null; }
function totalQuestions() { return quizLib.reduce(function (n, s) { return n + s.questions.length; }, 0); }

function updateBankLabel() {
  const el = document.getElementById('bankLabel');
  if (!el) return;
  const n = totalQuestions();
  el.textContent = quizLib.length ? (quizLib.length + ' bộ đề · ' + n + ' câu') : 'Chưa có bộ đề';
}

// ── RENDER ──────────────────────────
function renderQuiz() {
  const pane = document.getElementById('quizPane');
  if (!pane) return;
  updateBankLabel();
  if (_quizMode === 'browse') { pane.innerHTML = quizBrowseHtml(); return; }
  if (_quizMode === 'play') { pane.innerHTML = quizPlayHtml(); return; }
  if (_quizMode === 'playAll') { pane.innerHTML = quizAllHtml(); updateAllSummary(); return; }
  if (_quizMode === 'study') { pane.innerHTML = quizStudyHtml(); updateStudySummary(); return; }
  if (_quizMode === 'result') { pane.innerHTML = quizResultHtml(); return; }
  pane.innerHTML = quizHomeHtml();
  paintMix();
}

// Chip bật/tắt. Nhãn KHÔNG kèm “: Bật/Tắt” nữa — hai chip này phải nằm chung một
// hàng ở khung nhìn 311px (chỗ trống 266px), mà “Đảo câu hỏi: Bật” + “Đảo đáp
// án: Bật” cần 309px. Trạng thái hiện bằng MÀU (chip đang bật có nền xanh, viền
// và chữ xanh) và ghi rõ ở `title` để vẫn tra được khi trỏ chuột.
function quizToggleHtml(key, label) {
  const on = !!_quizOpts[key];
  return `<button class="quiz-toggle chip${on ? ' on' : ''}" onclick="toggleQuizOpt('${key}')"`
    + ` title="${label}: đang ${on ? 'BẬT' : 'TẮT'} — bấm để ${on ? 'tắt' : 'bật'}">${label}</button>`;
}
function toggleQuizOpt(k) { _quizOpts[k] = !_quizOpts[k]; renderQuiz(); }

// Một ô trong hàng 2×2: ô ĐANG được chọn dùng kiểu xanh (.primary), các ô còn lại kiểu
// viền. Hai kiểu cùng cỡ nên đổi màu KHÔNG làm nút nhảy kích thước.
// `exam` = true khi nút nằm ở màn 👁 "Câu hỏi" — lúc đó ô xanh tra theo `examKey` chứ không
// phải `key` (xem `isExamActOn`). Mặc định false = thẻ "Chọn từng bộ đề".
function setActBtn(setId, key, label, title, off, exam) {
  const on = exam ? isExamActOn(setId, key) : isSetActOn(setId, key);
  return '<button class="quiz-btn' + (on ? ' primary' : '') + '" data-set-act="' + key + '"'
    + (off || '')
    + ' onclick="useSetAct(\'' + setId + '\',\'' + key + '\')"'
    + (title ? ' title="' + title + '"' : '')
    + (on ? ' aria-current="true"' : '') + '>' + label + '</button>';
}

// ── DROPDOWN CHỌN BỘ ĐỀ (tự vẽ, 19/9/2026) ──
// Thay cho `onSetSelect()` của `<select>` cũ. Ba hàm nhỏ, đọc DOM tại thời điểm gọi vì
// `renderQuiz()` dựng lại toàn bộ thẻ sau mỗi lần chọn.
function toggleSetDd() {
  const list = document.getElementById('setDdList');
  if (!list) return;
  const box = document.getElementById('setDd');
  const btn = document.getElementById('setDdBtn');
  const dangMo = !list.hasAttribute('hidden');
  if (dangMo) { closeSetDd(); return; }
  list.removeAttribute('hidden');
  if (box) box.classList.add('open');
  if (btn) btn.setAttribute('aria-expanded', 'true');
}
function closeSetDd() {
  const list = document.getElementById('setDdList');
  if (list) list.setAttribute('hidden', '');
  const box = document.getElementById('setDd');
  if (box) box.classList.remove('open');
  const btn = document.getElementById('setDdBtn');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}
// Chọn một bộ: nhớ bộ đó rồi VẼ LẠI cả thẻ — nhãn trên nút, hàng được tô xanh và hàng nút làm bài
// đều phải đổi cùng lúc. Không cần đóng danh sách trước vì `renderQuiz()` dựng lại DOM và danh
// sách mới luôn bắt đầu ở trạng thái đóng.
function pickSet(id) {
  if (!libSet(id)) return;
  _libSetId = id;
  saveSetAct();
  renderQuiz();
}
// Đóng khi bấm ra ngoài hoặc bấm Esc. Đăng ký MỘT LẦN ở cấp document (không đăng ký lại mỗi lần
// vẽ thẻ), và tra `#setDd` tại thời điểm sự kiện — nếu tra lúc đăng ký thì sau lần render đầu
// tiên nút đã là một node mới và `contains()` sẽ luôn sai.
// Bấm vào chính nút mở cũng nổi bọt lên đây, nhưng `contains()` đúng nên không đóng ngay sau khi mở.
document.addEventListener('click', ev => {
  const box = document.getElementById('setDd');
  if (box && !box.contains(ev.target)) closeSetDd();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSetDd(); });

function useSetAct(setId, key) {
  if (!SET_ACTS[key]) return;
  // 'browse' KHÔNG xoá ký ức về chế độ làm bài (20/9/2026). Đây là chỗ hỏng đã làm cả một lượt
  // sửa thành vô hình: đường vào màn 👁 DUY NHẤT là bấm nút 👁, nên nếu 'browse' ghi đè thẳng vào
  // `_setActSel` thì cả ba nút ở màn đó luôn xám — màu xanh chẳng bao giờ hiện ra để người dùng
  // thấy. Giữ `examKey` của CHÍNH bộ này (đổi sang bộ khác thì không giữ) là đủ để nó hiện.
  const keepExam = (_setActSel.setId === setId && SET_EXAM_ACTS[_setActSel.examKey])
    ? _setActSel.examKey : null;
  _setActSel = {
    setId: setId,
    key: key,
    examKey: SET_EXAM_ACTS[key] ? key : keepExam
  };
  saveSetAct();
  if (key === 'browse') openBrowse(setId);
  else startSetExam(setId, key);
}

function quizHomeHtml() {
  const nQ = totalQuestions();
  let h = '';

  // ── Thanh tìm kiếm ── (NGOÀI thẻ, ngay dưới thanh xanh trên cùng)
  if (quizLib.length) {
    // `.search-field` là gốc định vị CHỈ cho ô nhập (icon 🔍 bên trái, nút ✕ bên phải). Không thể
    // để chúng định vị theo `.search-wrap` được: trong wrap còn cả danh sách kết quả (cao tới
    // 360px), nên `top: 50%` sẽ rơi xuống GIỮA DANH SÁCH KẾT QUẢ — đúng lỗi đã thấy trong ảnh chụp
    // (ô chỉ cao ~44px). Cùng lỗi này trước đó cũng làm icon 🔍 lạc chỗ mỗi khi có kết quả.
    h += '<div class="search-wrap"><div class="search-field">';
    h += '<span class="search-icon">🔍</span>';
    h += '<input id="searchInput" class="search-input" type="text" placeholder="Tìm kiếm câu hỏi..." oninput="onSearch()">';
    // Nút ✕ xoá nhanh. `onpointerdown="event.preventDefault()"` là BẮT BUỘC: thiếu nó thì cú chạm
    // làm ô nhập MẤT TIÊU ĐIỂM và bàn phím trên điện thoại đóng lại — mà `clearSearch()` lại vừa
    // `focus()` trở lại, thành ra bàn phím nhấp nháy. `hidden` từ đầu vì ô mới luôn rỗng.
    h += '<button type="button" id="searchClear" class="search-clear" aria-label="Xoá tìm kiếm" title="Xoá tìm kiếm" hidden onpointerdown="event.preventDefault()" onclick="clearSearch()">✕</button>';
    h += '</div>';                     // đóng `.search-field` — CHỈ chứa ô nhập + hai nút hai bên
    h += '<div id="searchResults" class="search-results"></div>';
    h += '</div>';                     // đóng `.search-wrap`
  }

  // ── Thư viện ──
  h += '<div class="quiz-card">';
  // Tiêu đề + dòng phụ + nút 📦 nằm CHUNG một hàng (19/9/2026 — "tôi muốn tab thư viện nằm kế thư
  // viện bộ đề"). Dòng phụ KHÔNG còn `margin-bottom: 9px`: lề đó vốn để tách khỏi nút nằm dưới,
  // mà nút giờ ở bên cạnh — giữ lại chỉ làm đáy thẻ dày thêm 9px vô ích.
  h += '<div class="lib-head">';
  h += '<div class="lib-head-text">';
  h += '<div style="font-size:var(--fs-head);font-weight:var(--fw-ui);margin-bottom:4px">📚 Thư viện bộ đề</div>';
  h += `<div style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim)">${quizLib.length ? quizLib.length + ' bộ đề · ' + nQ + ' câu hỏi' : 'Chưa có bộ đề nào'}</div>`;
  h += '</div>';
  // Trang chủ chỉ còn MỘT nút, mở bảng 📦. Nạp file, nạp cả thư mục, sao lưu và
  // phục hồi đều nằm trong bảng đó, nên hai nút “Chọn file”/“Thư mục” đã bị bỏ.
  h += '<button class="big-upload-btn lib-act" onclick="openLibPanel()"'
    + ' title="Nạp file, nạp cả thư mục, đổi tên, xoá, sao lưu, phục hồi">📦 Thư viện</button>';
  h += '</div>';
  if (!quizLib.length) {
    h += '<div style="display:flex;gap:8px;margin-top:8px">';
    h += '<button class="quiz-btn" style="flex:1;min-width:0" onclick="pickRestoreFile()">📂 Phục hồi từ file sao lưu</button>';
    h += '</div>';
  }
  // Hai chip "Đảo câu hỏi / Đảo đáp án" đã DỜI khỏi thẻ thư viện (19/9/2026 — "tôi muốn tab đảo câu
  // hỏi, đảo đáp án dời xuống dưới tab học và câu hỏi") — giờ nằm ở ĐÁY thẻ "📝 Chọn từng bộ đề".
  h += '</div>';

  if (!nQ) {
    h += '<div class="quiz-card" style="text-align:center;color:var(--text-dim);font-size:var(--fs-sub);line-height:1.6">'
      + 'Chưa có bộ đề nào.<br>Bấm “📦 Thư viện” rồi chọn “📥 Nạp hoặc nạp lại file bộ đề” — chọn được nhiều file Excel/CSV, hoặc 1 file .zip chứa cả thư mục.<br>Mỗi file sẽ thành một bộ đề riêng.</div>';
    return h;
  }

  // ── ChỌN từng bộ đề ── (dropdown thay vì list card). Tiêu đề là "Chọn từng bộ đề" từ 19/9/2026
  // ("đổi tên thi từng bộ đề thành Chọn từng bộ đề") — thẻ này chỉ CHỌN bộ rồi mới bấm nút làm bài,
  // nên "Chọn" đúng hơn "Thi"; các nút bên trong vẫn là "Từng câu / Cả bộ / Học / Câu hỏi".
  h += '<div class="quiz-card">';
  // Dòng phụ "Chọn bộ đề trong dropdown rồi bấm nút thi bên dưới." đã XOÁ (19/9/2026 — "tôi muốn bỏ
  // những chữ này"): chính các nút bên dưới đã nói rõ phải làm gì. Lề dưới của tiêu đề 2px → 10px
  // để giữ nguyên khoảng thở cũ (2px + dòng phụ + 9px) chứ không để tiêu đề dính vào dropdown.
  h += '<div style="font-size:var(--fs-head);font-weight:var(--fw-ui);margin-bottom:10px">📝 Chọn từng bộ đề</div>';
  // ── Dropdown chọn bộ đề — TỰ VẼ, không còn <select> (19/9/2026) ──
  // `<select>` gốc không nhận CSS cho bảng xổ xuống nên không thể có kẻ ngang giữa các hàng;
  // xem khối `.set-dd` ở CSS. Cấu trúc: nút mở + danh sách nút nằm đè.
  // Bộ đang xem lấy ĐÚNG cách cũ: `libSet(_libSetId)` và nếu chưa chọn gì thì về bộ đầu tiên —
  // nhờ vậy nhãn trên nút và hàng được tô xanh luôn nói cùng một điều.
  const ddSel = libSet(_libSetId) || quizLib[0];
  h += '<div style="margin-bottom:12px">';
  h += '<div class="set-dd" id="setDd">';
  // Icon 📚 đứng TRƯỚC tên bộ (19/9/2026 — "tôi muốn có icon ở bảng này") nên nhãn nút phải bọc
  // trong `.set-dd-lbl`: nút là `justify-content: space-between`, để icon là con trực tiếp thì nó
  // bị đẩy sát mép trái và tên bộ rơi xuống giữa.
  h += `<button type="button" class="set-dd-btn" id="setDdBtn" aria-haspopup="listbox" aria-expanded="false" onclick="toggleSetDd()"><span class="set-dd-lbl"><span class="set-dd-ico">📚</span><span>${esc(ddSel.name)} (${ddSel.questions.length} câu)</span></span><span class="set-dd-caret">▾</span></button>`;
  h += '<div class="set-dd-list" id="setDdList" role="listbox" hidden>';
  quizLib.forEach(s => {
    const on = ddSel.id === s.id;
    h += `<button type="button" class="set-dd-item${on ? ' on' : ''}" role="option" aria-selected="${on ? 'true' : 'false'}" onclick="pickSet('${s.id}')">${esc(s.name)} (${s.questions.length} câu)</button>`;
  });
  h += '</div></div>';
  h += '</div>';
  // Nút thi cho bộ đề được chọn
  const selSet = libSet(_libSetId) || quizLib[0];
  if (selSet) {
    const off = selSet.questions.length ? '' : ' disabled';
    // Dòng "Bộ \"…\" có N câu hỏi" ở đây đã XOÁ (19/9/2026 — "tôi muốn bỏ những chữ này"): số câu
    // đã hiện ngay trên nút dropdown ("Tên (N câu)") và trên từng hàng của danh sách xổ xuống.
    h += '<div class="set-acts">';
    h += setActBtn(selSet.id, 'single', '▶️ Từng câu', 'Làm từng câu một', off);
    h += setActBtn(selSet.id, 'all', '📋 Cả bộ', 'Làm cả bộ trong một trang', off);
    h += setActBtn(selSet.id, 'study', '📖 Học', 'Học: chọn sai thì chọn lại', off);
    h += setActBtn(selSet.id, 'browse', '👁 Câu hỏi', 'Xem danh sách câu hỏi của bộ này', '');
    h += '</div>';
  }
  // Hai chip "Đảo câu hỏi / Đảo đáp án" nằm ở ĐÁY thẻ này, NGAY DƯỚI hàng nút "Học / Câu hỏi"
  // (19/9/2026 — "tôi muốn tab đảo câu hỏi,đảo đáp án dời xuống dưới tab học và câu hỏi").
  // Đặt NGOÀI khối `if (selSet)` để hai chip không phụ thuộc việc có bộ đề hay không.
  // Không cần thêm CSS: `.chip-row` đã có `margin-top: 8px`, đúng nhịp 8px của `.set-acts` phía trên.
  h += '<div class="chip-row">';
  h += quizToggleHtml('shuffleQ', 'Đảo câu hỏi');
  h += quizToggleHtml('shuffleA', 'Đảo đáp án');
  h += '</div>';
  h += '</div>';

  // ── Trộn đề ──
  h += quizMixHtml();
  return h;
}

// Xem / sửa câu hỏi của một bộ đề
function quizBrowseHtml() {
  const s = curSet();
  if (!s) { _quizMode = 'home'; return quizHomeHtml(); }
  const n = s.questions.length;
  let h = '<div class="quiz-card">';
  // Tên bộ đề và nút "Về trang chủ" là HAI Ô BẰNG NHAU trên cùng một hàng (20/9/2026 — "cho 2
  // tab này kích cỡ bằng nhau"). Vì thế hàng này là LƯỚI `1fr 1fr` chứ không phải flex: lưới chia
  // đôi bề ngang bằng nhau BẤT KỂ độ dài chữ, còn `align-items` mặc định (stretch) tự kéo cả hai
  // ô cao bằng nhau — cùng một cặp bảo đảm như hàng ba nút bên dưới.
  // Nút đứng SAU tên trong DOM nên thứ tự đọc và thứ tự tab vẫn đúng.
  // `min-width:0` trên khối tên là BẮT BUỘC: không có nó thì tên dài ("Các tình huống vi phạm
  // sử dụng điện") làm tràn lưới thay vì tự xuống dòng — cùng cái bẫy đã gặp ở `.set-dd-lbl`
  // và hàng nút của bảng trộn. KHÔNG cắt chữ bằng ellipsis vì app không rút gọn tên bộ đề ở đâu cả.
  // Nhãn KHÔNG còn hộp nền/viền, chỉ còn chữ + icon 📚 (20/9/2026 — "bỏ viền bỏ nền, thêm icon") —
  // xem `.browse-name` ở khu vực chính; lớp cũ `set-name-fill` (giãn kín ô + canh giữa) đã bị xoá
  // cùng lượt này vì nó tồn tại chỉ để canh giữa chữ TRONG cái hộp không còn nữa.
  h += '<div class="browse-head">';
  h += `<div class="browse-name" style="font-size:var(--fs-base);font-weight:var(--fw-ui);line-height:1.35" title="${esc(s.name)}">`
    + `<span class="set-dd-ico">📚</span><span class="set-name">${esc(s.name)}</span></div>`;
  // Nhãn là ICON SVG, cùng hình với nút ở đầu màn làm bài (20/9/2026 — "đổi icon về trang chủ").
  // Đường đi của chỗ này: "← Về trang chủ" (chữ có mũi tên → Windows vẽ "←" thành emoji mũi tên
  // xanh có nền, nặng thị giác) → CHỮ "Về trang chủ" → ICON như bây giờ. Bề ngang nút do lưới `1fr`
  // quyết định nên nhãn đổi cỡ nào cũng KHÔNG làm nút nhỏ đi — hai ô vẫn bằng nhau.
  // `title`/`aria-label` là BẮT BUỘC: nút chỉ có hình, không còn chữ nào để đọc.
  h += '<button class="quiz-btn home-btn browse-back" onclick="backHome()"'
    + ' title="Về trang chủ" aria-label="Về trang chủ">' + homeIcoSvg() + '</button>';
  h += '</div>';
  // `margin-top` 4px → 0 (20/9/2026 — "cho chữ 25 câu hỏi nằm xích lên gần tên bộ đề"): dòng này
  // nằm ngay dưới hàng tên bộ, mà hàng đó cao hơn chữ tên một khoảng (nút icon quyết định chiều
  // cao), nên mỗi px margin ở đây cộng thêm vào khe hở đã có sẵn → bỏ hẳn. `margin-bottom` 12px
  // GIỮ NGUYÊN vì đó là nhịp xuống hàng ba nút bên dưới.
  h += `<div style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim);margin:0 0 12px">${n} câu hỏi</div>`;
  // BA nút làm bài trên MỘT hàng (20/9/2026 — "cho 3 tab còn lại nằm cùng hàng"), sau khi nút
  // Nút "Về trang chủ" đã dời lên hàng tên bộ đề (xem `.browse-head` ở đầu hàm này).
  // Bề ngang mỗi nút theo ĐỘ DÀI CHỮ đã từng gây lệch cỡ (đo 20/9: 155,1 / 128,2 / 227,4px), nên
  // dùng lưới: `grid-template-columns: 1fr 1fr 1fr` + `grid-auto-rows: 1fr` cho cả ba ô cùng bề
  // ngang VÀ cùng chiều cao. `grid-auto-rows: 1fr` đặc biệt quan trọng Ở ĐÂY: nhãn dài nhất
  // ("📖 Học (chọn sai làm lại)") chỉ còn ~101px chỗ chữ nên phải xuống 3 dòng, và chính nó là
  // thứ giữ cho hai nút kia cao bằng — không có nó thì ba nút so le ngay.
  // `margin-top:0` là để giữ nguyên nhịp cũ: dòng "N câu hỏi" phía trên đã có `margin-bottom:12px`,
  // cộng thêm 8px mặc định của `.set-acts` là thành 20px — hụt hẳn so với trước.
  // Ba nút làm bài dùng CHUNG `setActBtn`/`useSetAct` với thẻ "Chọn từng bộ đề" (20/9/2026 —
  // "chọn vô tab nào thì tab đó hiển thị màu"): nút vừa bấm nhận `primary` (nền xanh), hai nút
  // kia tự về kiểu viền, và lựa chọn được LƯU vào máy nên mở lại màn này vẫn thấy đúng nút đó.
  // Trước đây "▶️ Thi từng câu" bị gán CỨNG `primary` và onclick gọi thẳng `startSetExam`, nên
  // màu xanh đứng yên một chỗ dù bấm nút nào — và nó còn lệch với ô xanh của thẻ bộ đề.
  // Vì dùng chung một `_setActSel` cho cả app, ở đây chỉ có ĐÚNG MỘT ô xanh tại một thời điểm,
  // khớp với "cả 44 ô" ở trang chủ (bấm "Thi cả bộ" ở đây thì ô "📋 Cả bộ" ở trang chủ cũng xanh).
  // NHÃN NGẮN + CÓ ICON (20/9/2026). Hai bước, theo đúng thứ tự người dùng yêu cầu:
  //   1. "cho 3 tab này gọn lại" — rút nhãn `▶️ Thi từng câu / 📋 Thi cả bộ / 📖 Học (chọn sai làm lại)`
  //      (đo: 129,7 / 102,8 / 201,9px) xuống `Từng câu / Cả bộ / Học` VÀ bỏ icon — vì ở khung 409px
  //      mỗi nút chỉ có 100,5px chỗ chữ, mà ngay cả `▶️ Từng câu` (104,9px, tức chỉ rút nhãn) cũng
  //      vẫn hụt 4,4px. Hàng cao 83,6px → 40,3px.
  //   2. "cho icon vô" — trả lại ba icon, GIỮ nhãn ngắn. Giờ VỪA ĐƯỢC, vì luật
  //      `.set-acts-3 .quiz-btn { padding-left/right: 0 }` (xem khối CSS) đã nới chỗ chữ từ 100,5px
  //      lên **112,5px** — `▶️ Từng câu` cần 104,9px nên lọt.
  // ⚠ NGUỠNG BỊ LẠI: cả ba chỉ nằm một dòng khi khung ≥ khoảng 390px. Dưới mức đó `▶️ Từng câu`
  // lại xuống 2 dòng → hàng cao thêm ~20px (vẫn cao BẰNG NHAU nhờ `grid-auto-rows: 1fr`).
  // Đừng sửa nhãn nữa nếu chưa đo lại: đây là cặp nhãn đã được chọn qua hai lượt và có số ở trên.
  h += '<div class="set-acts set-acts-3" style="margin-top:0">';
  h += setActBtn(s.id, 'single', '▶️ Từng câu', 'Thi từng câu một', n ? '' : ' disabled', true);

  h += '</div></div>';

  if (!n) {
    h += '<div class="quiz-card" style="text-align:center;color:var(--text-dim);font-size:var(--fs-sub);line-height:1.6">Bộ đề này chưa có câu hỏi.<br>Mở 📦 để nạp lại file cho bộ này.</div>';
    return h;
  }

  h += '<div class="quiz-card">';
  h += '<div style="font-size:var(--fs-head);font-weight:var(--fw-ui);margin-bottom:10px">Danh sách câu hỏi</div>';
  s.questions.forEach((q, i) => {

    h += `<div style="color:var(--q-text);font-size:var(--fs-lead);font-weight:var(--fw-head);line-height:1.5">${i + 1}. ${esc(q.q)}</div>`;
    // Dòng đáp án đúng trong danh sách câu hỏi. Đã từng bị bỏ (19/9/2026 sáng) rồi được KHÔI PHỤC
    // cùng ngày ("tôi muốn khôi phục câu đáp án trong ô câu hỏi") — đây là danh sách để HỌC,
    // thiếu đáp án thì mở ra không dùng được gì.
    // `correct` có thể là MỘT chỉ số hoặc MẢNG chỉ số (câu nhiều đáp án đúng): xử lý cả hai, giống
    // onSearch() đang làm — in thẳng q.options[q.correct] với mảng sẽ ra undefined.
    const ans = Array.isArray(q.correct)
      ? q.correct.map(ix => q.options[ix] || '—').join(', ')
      : (q.options[q.correct] || '—');
    h += `<div style="font-size:var(--fs-sub);color:var(--green);margin-top:6px;font-weight:400">✓ ${esc(ans)}</div>`;
    h += '</div>';
  });
  h += '</div>';
  return h;
}

// ── TRỘN ĐỀ THEO TỶ LỆ ──
function clampPct(v) {
  if (typeof v !== 'number' || !isFinite(v)) return 0;
  return Math.max(0, Math.min(100, Math.round(v)));
}
function pctOf(id) { return clampPct(_mix.pct[id]); }

// ── GHIM MỘT HÀNG (19/9/2026) ─────────────────────────────
// Yêu cầu: "thêm nút dừng kế mũi tên lên xuống, khi nhấn nút đó thì số lượng câu đã chọn
// sẽ đứng yên, không bị ảnh hưởng bởi những lựa chọn khác."
// Cách làm: hàng ghim bị loại khỏi danh sách "các bộ còn lại" trong rebalanceAround(), nên
// nó không nhường điểm khi hàng khác tăng và cũng không nhận điểm khi hàng khác giảm.
// Ô nhập và cặp ▲▼ của hàng ghim VẪN dùng được — người dùng tự sửa tay thì số đó đổi.
function isMixLocked(id) { return !!(_mix.locked && _mix.locked[id]); }

function toggleMixLock(id) {
  if (!_mix.locked) _mix.locked = {};
  if (_mix.locked[id]) delete _mix.locked[id]; else _mix.locked[id] = 1;
  paintMixLock(id);
  paintMix();
  saveMix();                       // ghim là lựa chọn của người dùng → phải nhớ
}

// Vẽ lại ĐÚNG MỘT nút ghim tại chỗ. Cố ý không render lại cả bảng: trên điện thoại, render
// lại sẽ đẩy màn hình về đầu và người dùng mất chỗ đang xem.
function paintMixLock(id) {
  const on = isMixLocked(id);
  const b = document.getElementById('mixLock-' + id);
  if (b) {
    b.classList.toggle('on', on);
    // Đổi CHỈ span icon, KHÔNG đụng `textContent` của nút: nút giờ chứa `<span class="mix-lock-ico">`
    // và viền của nút phải giữ màu (xem ghi chú `.mix-lock-ico` ở CSS).
    const ic = b.querySelector('.mix-lock-ico');
    if (ic) ic.textContent = on ? '📌' : '📍';
    b.title = on
      ? 'Đang ghim: các bộ khác chỉnh không làm đổi số của bộ này. Nhấn để bỏ ghim.'
      : 'Ghim số câu của bộ này — các bộ khác chỉnh sẽ không làm đổi số này.';
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  const n = document.getElementById('mixName-' + id);
  if (n) n.classList.toggle('pinned', on);
}

function mixTotalValue() {
  const available = Math.max(1, totalQuestions());
  let t = parseInt(_mix.total, 10);
  if (!(t > 0)) t = Math.min(MIX_DEFAULT_TOTAL, available);
  return Math.min(t, available);
}

// Chia số câu cho từng bộ theo tỷ lệ, dùng phương pháp "phần dư lớn nhất"
function mixRows() {
  const total = mixTotalValue();
  const rows = quizLib.map(s => ({ s: s, pct: pctOf(s.id) }));
  const sum = rows.reduce((a, r) => a + r.pct, 0);
  const raw = rows.map(r => sum > 0 ? (r.pct / 100) * total : 0);
  const counts = raw.map(v => Math.floor(v));
  let left = sum === 100 ? total - counts.reduce((a, b) => a + b, 0) : 0;
  const order = raw.map((v, i) => ({ i: i, frac: v - Math.floor(v) })).sort((a, b) => b.frac - a.frac);
  let k = 0;
  while (left > 0 && order.length) { counts[order[k % order.length].i]++; left--; k++; }
  return rows.map((r, i) => ({
    set: r.s, pct: r.pct, want: counts[i],
    got: Math.min(counts[i], r.s.questions.length),
    locked: isMixLocked(r.s.id)
  }));
}

// Cột số câu của bảng trộn: "lấy bao nhiêu / bộ có bao nhiêu" (yêu cầu 19/9/2026:
// "thêm tổng số câu phía sau, ví dụ 7/20 câu").
// Luôn đủ CẢ HAI đầu để đọc ra ngay mức độ phủ — "7/10" nói ngay là bộ chỉ có 10 câu.
// Dấu "/" ở đây CHỈ có một nghĩa (lấy/tổng); chuyện THIẾU câu không nhét vào cột này nữa mà
// do dòng cảnh báo nói rõ ("cần 12 nhưng bộ chỉ có 10"), trước đây cột dùng "/" cho cả hai
// nghĩa nên "10/12" vừa là lấy/tổng vừa là lấy/cần — không đọc được.
function mixCountText(r) {
  return r.got + '/' + r.set.questions.length + ' câu';
}

// ── LƯU / KHÔI PHỤC TỶ LỆ TRỘN VÀO MÁY ──
// Yêu cầu 19/9/2026: "Lưu tỷ lệ trộn đề mà tôi tự chỉnh vào máy, để mở app lần sau vẫn
// giữ đúng tỷ lệ đó."
//
// File lưu có BỐN trường, và trường `keyed` mới là trường quan trọng:
//   total : tổng số câu của bài
//   sig   : id các bộ theo đúng thứ tự thư viện — "dấu vân tay" để biết thư viện còn
//           Y HỆT lần lưu hay không
//   pct   : { setId: phần trăm } — dùng khi sig khớp
//   keyed : [[khoá tên, phần trăm]] — dùng khi sig KHÁC (nạp thêm bộ, xoá bộ, hoặc phục
//           hồi từ file .json làm MỌI id đổi mới). Nếu chỉ lưu theo id thì mỗi lần phục
//           hồi file là tỷ lệ chỉnh tay mất sạch — mà đây lại là thao tác người dùng làm
//           nhiều lần trong ngày (3 lần trong phiên 19/9).
// Khoá tên dùng quizKey() nên khớp được cả khi tên có gạch dưới/khoảng trắng khác nhau;
// hai bộ TRÙNG tên thì dòng sau thắng — chấp nhận, vì chúng cũng trùng số câu.
function saveMix() {
  try {
    localStorage.setItem(MIX_KEY, JSON.stringify({
      total: _mix.total,
      sig: quizLib.map(s => s.id).join(','),
      pct: _mix.pct,
      keyed: quizLib.map(s => [quizKey(s.name), pctOf(s.id)]),
      // Ghim lưu song song hai dạng như pct: theo ID (thư viện không đổi) và theo TÊN
      // (thư viện đã đổi) — hai danh sách phải luôn đi cùng nhau, nếu không thì sau khi
      // nạp file mới, tỷ lệ được ghép theo tên mà ghim thì mất.
      locked: _mix.locked || {},
      lockedKeyed: quizLib.filter(s => isMixLocked(s.id)).map(s => [quizKey(s.name), 1])
    }));
  } catch (e) {}
}

// Trả về true nếu đọc lại được tỷ lệ đã lưu (false = giữ nguyên mặc định).
// LUÔN gọi SAU resetMixDefaults(), vì đường ghép theo tên dựa vào mặc định cho những bộ
// không có trong file lưu.
function restoreMix() {
  if (!quizLib.length) return false;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(MIX_KEY) || 'null'); } catch (e) { saved = null; }
  if (!saved || typeof saved !== 'object') return false;
  const t = parseInt(saved.total, 10);
  if (t > 0) _mix.total = Math.min(t, Math.max(1, totalQuestions()));
  // Nhánh 1 — thư viện không đổi: dùng thẳng id, không suy diễn gì thêm, và CHỈ nhận id
  // còn tồn tại (bộ đã xoá thì mục của nó bị bỏ, không hồi sinh số 0 lạ).
  if (saved.pct && saved.sig === quizLib.map(s => s.id).join(',')) {
    _mix.pct = {};
    quizLib.forEach(s => { _mix.pct[s.id] = clampPct(saved.pct[s.id]); });
    if (saved.locked && typeof saved.locked === 'object') {
      _mix.locked = {};
      quizLib.forEach(s => { if (saved.locked[s.id]) _mix.locked[s.id] = 1; });
    }
    return true;
  }
  // Nhánh 2 — thư viện đã đổi: ghép lại theo TÊN. Bộ khớp giữ đúng số người dùng đặt,
  // bộ mới/không khớp giữ mặc định vừa tính, rồi cân cả bảng về 100.
  if (!Array.isArray(saved.keyed)) return false;
  const byKey = {};
  saved.keyed.forEach(function (row) {
    if (Array.isArray(row) && row.length === 2) byKey[row[0]] = row[1];
  });
  // Ghim phục hồi theo TÊN, đúng cách tỷ lệ được ghép ở nhánh này.
  const lockKey = {};
  if (Array.isArray(saved.lockedKeyed)) {
    saved.lockedKeyed.forEach(function (row) {
      if (Array.isArray(row) && row.length === 2 && row[1]) lockKey[row[0]] = 1;
    });
  }
  _mix.locked = {};
  let hit = 0;
  quizLib.forEach(s => {
    const k = quizKey(s.name);
    if (k in byKey) { _mix.pct[s.id] = clampPct(byKey[k]); hit++; }
    if (lockKey[k]) _mix.locked[s.id] = 1;
  });
  if (!hit) return false;   // thư viện hoàn toàn khác → để mặc định, đừng bịa số
  balanceMixTo100();
  return true;
}

// Cân lại _mix.pct cho tổng đúng 100, GIỮ NGUYÊN tỷ lệ tương đối. Dùng ở nhánh ghép-theo-tên
// và ở chỗ tự chia lại khi một bộ về 0.
//
// Chia phần lẻ theo "SỐ DƯ LỚN NHẤT" (đúng cách mixRows() chia câu): lấy phần nguyên trước,
// rồi mỗi hàng có phần lẻ lớn nhất nhận thêm 1 — mỗi hàng NHIỀU NHẤT 1 điểm.
// Đừng quay lại cách cũ (Math.round từng hàng rồi dồn hết phần lệch vào hàng lớn nhất):
// với 18 bộ, làm tròn sinh tổng lệch tới 3 điểm, dồn hết vào một hàng làm bộ ghim 10% tụt
// còn 8% trong khi các hàng khác lại tăng — đo được đúng như vậy ngày 19/9/2026.
// Hàng đang 0% KHÔNG bao giờ nhận điểm: chúng bị loại khỏi danh sách chia phần lẻ, nếu không
// một bộ đang bị loại (ví dụ Bậc 6-7) có thể thành 1%.
function balanceMixTo100() {
  const ids = quizLib.map(s => s.id);
  if (!ids.length) return;
  // Hàng ghim KHÔNG bị cân: nó giữ đúng số đang có, và chỉ phần 100 - (tổng hàng ghim) được
  // chia cho các hàng còn lại. Nhờ vậy việc nạp/xoá bộ (đường ghép-theo-tên) không phá số
  // người dùng đã ghim.
  const pinned = ids.filter(isMixLocked);
  const free = ids.filter(id => !isMixLocked(id));
  const pinSum = pinned.reduce((a, id) => a + pctOf(id), 0);
  if (!free.length) {
    // Cả bảng đều ghim → không còn ai để chia. Chỉ cắt bớt khi tổng vượt 100, nếu không
    // ba nút trộn sẽ bị khoá vĩnh viễn mà người dùng không hiểu vì sao.
    if (pinSum > 100) {
      let left = 100;
      pinned.forEach(id => { const v = Math.min(pctOf(id), left); _mix.pct[id] = v; left -= v; });
    }
    return;
  }
  const cur = free.map(id => pctOf(id));
  const sum = cur.reduce((a, v) => a + v, 0);
  const budget = Math.max(0, 100 - pinSum);
  if (sum <= 0) { Object.assign(_mix.pct, splitPctEven(free, budget)); return; }
  const raw = cur.map(v => v * budget / sum);
  const out = raw.map(v => Math.floor(v));
  let left = 100 - out.reduce((a, v) => a + v, 0);
  const order = raw
    .map((v, i) => ({ i: i, frac: v - Math.floor(v), live: cur[i] > 0 }))
    .filter(x => x.live)
    .sort((a, b) => b.frac - a.frac);
  let k = 0;
  while (left > 0 && k < order.length) { out[order[k].i]++; left--; k++; }
  // Chốt an toàn cho trường hợp bất thường (số âm / NaN): dồn nốt vào hàng lớn nhất.
  if (left) {
    let big = 0;
    out.forEach((v, i) => { if (v > out[big]) big = i; });
    out[big] = Math.max(0, out[big] + left);
  }
  free.forEach((id, i) => { _mix.pct[id] = Math.max(0, out[i]); });
}

// Nút "↺ Mặc định": quên tỷ lệ chỉnh tay, VỀ mặc định của app trong mã, và ghi luôn mặc
// định đó vào máy — nếu không thì lần mở sau tỷ lệ cũ lại quay về.
function resetMixToDefaults() {
  resetMixDefaults();
  saveMix();
  renderQuiz();
}

// Gọi mỗi khi THƯ VIỆN đổi (nạp file, xoá bộ, phục hồi). Tính lại mặc định rồi ghép tỷ lệ
// đã lưu lên trên: nạp thêm bộ không làm mất công chỉnh tay, mà bộ mới vẫn được chia phần.
function refreshMix() { resetMixDefaults(); restoreMix(); }

// ── SEARCH ────────────────────────────────────────────────
// Tìm kiếm câu hỏi theo nội dung. Hiển thị câu hỏi + đáp án đúng.
// Nút ✕ chỉ hiện khi ô CÓ chữ. Đọc `value.length` chứ không dùng luật 2 ký tự của `onSearch()`:
// gõ 1 chữ đã phải xoá được ngay.
function paintSearchClear() {
  const inp = document.getElementById('searchInput');
  const btn = document.getElementById('searchClear');
  if (!inp || !btn) return;
  btn.hidden = inp.value.length === 0;
}

// Xoá nội dung ô tìm kiếm (19/9/2026 — "tôi muốn có dấu x để xoá ở thanh tìm kiếm").
// Gọi `onSearch()` để dọn luôn danh sách kết quả (chuỗi rỗng đi thẳng vào nhánh `innerHTML = ''`),
// rồi TRẢ TIÊU ĐIỂM về ô nhập để gõ câu khác ngay mà không phải chạm lại vào ô.
function clearSearch() {
  const inp = document.getElementById('searchInput');
  if (!inp) return;
  inp.value = '';
  onSearch();
  paintSearchClear();
  inp.focus();
}

function onSearch() {
  const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  const el = document.getElementById('searchResults');
  paintSearchClear();
  if (!el) return;
  if (!q || q.length < 2) { el.innerHTML = ''; return; }
  const hits = [];
  for (const s of quizLib) {
    for (const qu of s.questions) {
      const txt = qu.q.toLowerCase();
      const opts = (qu.options || []).join(' ').toLowerCase();
      if (txt.includes(q) || opts.includes(q)) {
        hits.push({ set: s.name, q: qu.q, options: qu.options, correct: qu.correct, explain: qu.explain || '' });
        if (hits.length >= 50) break;   // giới hạn 50 kết quả cho nhanh
      }
    }
    if (hits.length >= 50) break;
  }
  if (!hits.length) {
    el.innerHTML = '<div class="search-empty">Không tìm thấy kết quả.</div>';
    return;
  }
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  el.innerHTML = hits.map(h => {
    const qHtml = h.q.replace(re, '<em>$1</em>');
    // tìm đáp án đúng
    const correctText = Array.isArray(h.correct)
      ? h.correct.map(i => h.options[i]).join(', ')
      : (h.options[h.correct] || '');
    const aHtml = correctText.replace(re, '<em>$1</em>');
    return '<div class="search-hit">'
      + '<div class="search-hit-set">' + esc(h.set) + '</div>'
      + '<div class="search-hit-q">' + qHtml + '</div>'
      + '<div class="search-hit-a">✅ ' + aHtml + '</div>'
      + '</div>';
  }).join('');
}

function quizMixHtml() {
  const rows = mixRows();
  const pctSum = rows.reduce((a, r) => a + r.pct, 0);
  const ok = pctSum === 100 && rows.some(r => r.got > 0);
  let h = '<div class="quiz-card">';
  h += '<div style="font-size:var(--fs-head);font-weight:var(--fw-ui)">🎲 Trộn đề theo tỷ lệ</div>';
  h += '<div style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim);margin:2px 0 12px">Đặt phần trăm cho từng bộ; tổng phải đúng 100%.</div>';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">';
  h += '<div style="flex:1;font-size:var(--fs-sub);font-weight:var(--fw-body)">Tổng số câu của bài</div>';
  // Ô nhập trong bảng trộn để cỡ 15px cho BẰNG các chữ xung quanh (yêu cầu 19/9/2026).
  // Cố ý KHÔNG hạ .quiz-input xuống 15px: lớp đó còn dùng cho ô đổi tên bộ đề ở bảng 📦
  // (ô nhập tên là chữ chính, phải giữ 17px/500). Chỉ hai ô của bảng trộn hạ cỡ.
  h += `<input id="mixTotal" type="number" min="1" max="${Math.max(1, totalQuestions())}" class="quiz-input" style="width:88px;text-align:center;font-size:var(--fs-sub)" value="${mixTotalValue()}" oninput="onMixInput()">`;
  h += '</div>';
  // 18 hàng nằm trong `.mix-table` — khung giữ VIỀN + BO GÓC của cả khối (xem khối .mix-table ở
  // CSS). Nhờ nó, kẻ TRÊN hàng đầu và kẻ DƯỚI hàng cuối là viền của khung nên BO THEO CUNG, còn
  // kẻ giữa các hàng vẫn do từng `.mix-row` tự vẽ ở phía trên.
  // Class `last` của hàng cuối đã BỎ (19/9/2026): giờ viền dưới của khung đóng đáy bảng, không
  // hàng nào cần kẻ dưới nữa.
  h += '<div class="mix-table">';
  rows.forEach((r) => {
    // Hàng ĐÃ CHỌN SỐ (> 0) mang thêm class `on` → nền xanh dương nhạt (.mix-row.on ở CSS).
    // Gắn NGAY TỪ ĐÂY chứ không chờ `paintMixMarks()`: lần vẽ đầu có thể chưa qua hàm đó, và khi ấy
    // hàng có số vẫn trắng cho tới lần chỉnh ô đầu tiên — đúng lỗi đã gặp với `.mix-zero`.
    h += '<div class="mix-row' + (r.pct > 0 ? ' on' : '') + '">';
    h += `<div style="flex:1;min-width:0;font-size:var(--fs-sub);font-weight:var(--fw-body);line-height:1.35;white-space:normal" title="${esc(r.set.name)}"><span id="mixName-${r.set.id}" class="mix-name${r.locked ? ' pinned' : ''}">${esc(r.set.name)}</span></div>`;
    // Nút ghim ĐỨNG TRƯỚC ô số (19/9/2026 — "muốn ô ghim dời qua trước ô số"). Đặt trước
    // cũng hợp lý hơn về nghĩa: ghim là thuộc tính CỦA HÀNG, không phải của cặp ▲▼.
    h += `<button type="button" id="mixLock-${r.set.id}" class="mix-lock${r.locked ? ' on' : ''}" aria-pressed="${r.locked ? 'true' : 'false'}" title="${r.locked ? 'Đang ghim: các bộ khác chỉnh không làm đổi số của bộ này. Nhấn để bỏ ghim.' : 'Ghim số câu của bộ này — các bộ khác chỉnh sẽ không làm đổi số này.'}" onclick="toggleMixLock('${r.set.id}')"><span class="mix-lock-ico">${r.locked ? '📌' : '📍'}</span></button>`;
    // Ô số 0 nhận thêm class `mix-zero` NGAY TỪ ĐÂY (không chờ `paintMix`), vì thẻ bảng có thể
    // được vẽ mà chưa qua một lần `paintMix()` nào — thiếu bước này thì hàng 0 vẫn xanh ở lần
    // vẽ đầu, chỉ đổi sau khi người dùng chỉnh một ô bất kỳ.
    h += `<input id="mixPct-${r.set.id}" type="number" min="0" max="100" class="quiz-input mix-input${r.pct === 0 ? ' mix-zero' : ''}" value="${r.pct}" oninput="onMixTyped()" onchange="onMixCommit('${r.set.id}')" onblur="onMixCommit('${r.set.id}')">`;
    // Đè ngón tay là tự lặp (xem mixStepStart): đổi 0 → 15 bằng một lần giữ, khỏi bấm 15 lần.
    h += `<div class="mix-step">`;
    h += `<button type="button" title="Tăng 1%" aria-label="Tăng 1%" onpointerdown="mixStepStart(event,'${r.set.id}',1)" onpointerup="mixStepEnd()" onpointerleave="mixStepEnd()" onpointercancel="mixStepEnd()">▲</button>`;
    h += `<button type="button" title="Giảm 1%" aria-label="Giảm 1%" onpointerdown="mixStepStart(event,'${r.set.id}',-1)" onpointerup="mixStepEnd()" onpointerleave="mixStepEnd()" onpointercancel="mixStepEnd()">▼</button>`;
    h += `</div>`;
    // Dấu `%` đã bỏ (19/9/2026 — "bỏ dấu %"). Nghĩa của cột số đã rõ nhờ dòng phụ "Đặt phần trăm
    // cho từng bộ" và dòng tổng "Tổng tỷ lệ: 100%"; bỏ đi trả lại ~23px cho cột tên bộ đề.
    h += `<div id="mixCnt-${r.set.id}" style="width:84px;text-align:right;font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim)">${mixCountText(r)}</div>`;
    h += '</div>';
  });
  h += '</div>';   // đóng `.mix-table` — khung bo góc của cả khối hàng
  h += '<div style="display:flex;align-items:center;gap:8px;margin-top:10px">';
  // 15px → 17px (19/9/2026 — "tất cả chữ này cỡ 17px"). Giữ nguyên `font-weight:400`: đây là
  // dòng TRẠNG THÁI, không phải nhãn nút — tăng cỡ chứ không tăng nét.
  h += '<div id="mixSum" style="flex:1;font-size:var(--fs-base);font-weight:var(--fw-body)"></div>';
  h += '<button class="mix-reset" onclick="resetMixToDefaults()" title="Về tỷ lệ mặc định của app">↺ Mặc định</button>';
  h += '</div>';
  h += '<div id="mixWarn" style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--gold);margin-top:4px"></div>';
  h += '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">';
  h += `<button id="mixBtnSingle" class="big-upload-btn" style="width:100%" onclick="mixExam('single')">🎲 Trộn &amp; làm từng câu</button>`;
  // Hai nút dưới chia ĐỀU bề ngang (yêu cầu 19/9/2026 — "cho 2 bảng này đều nhau"): trước đây
  // chúng là flex item tự co theo chữ, nên "Trộn & làm cả bộ" dài hơn "Trộn & học" và hai mép
  // phải lệch nhau. `flex:1` + `min-width:0` cho mỗi nút đúng một nửa hàng; `min-width:0` là
  // BẮT BUỘC, thiếu nó flex item không co xuống dưới cỡ chữ nội tại và hàng sẽ tràn ở màn hẹp.
  // Hàng này dùng chung khuôn với hàng nút khôi phục ở trang chủ (`flex:1;min-width:0`).
  // `mix-act`: hai nút này chỉ hiện màu xanh LÚC BẤM GIỮ (20/9/2026 — "tôi muốn khi chọn mới hiển
  // thị màu"); lúc nghỉ chúng là `.quiz-btn` xám bình thường. Class `mix-act` chỉ khai `:active`.
  // Thêm class thay vì tô `.quiz-btn` vì lớp đó dùng chung với nửa app.
  h += `<button id="mixBtnAll" class="quiz-btn mix-act" style="flex:1;min-width:0" onclick="mixExam('all')">📋 Trộn &amp; làm cả bộ</button>`;
  h += `<button id="mixBtnStudy" class="quiz-btn mix-act" style="flex:1;min-width:0" onclick="mixExam('study')">📖 Trộn &amp; học</button>`;
  h += '</div></div>';
  return h;
}

// Chỉ vẽ lại phần số câu + tổng + trạng thái nút, để ô nhập không mất con trỏ
function paintMix() {
  const rows = mixRows();
  const pctSum = rows.reduce((a, r) => a + r.pct, 0);
  const ok = pctSum === 100 && rows.some(r => r.got > 0);
  const sumEl = document.getElementById('mixSum');
  if (sumEl) {
    sumEl.textContent = 'Tổng tỷ lệ: ' + pctSum + '%' + (pctSum === 100 ? ' ✓' : ' — cần đúng 100%');
    sumEl.style.color = pctSum === 100 ? 'var(--green)' : 'var(--red)';
  }
  rows.forEach(r => {
    const el = document.getElementById('mixCnt-' + r.set.id);
    if (!el) return;
    el.textContent = mixCountText(r);
    el.style.color = (r.want === r.got) ? 'var(--text-dim)' : 'var(--gold)';
  });
  const short = rows.filter(r => r.want > r.got);
  const warnEl = document.getElementById('mixWarn');
  if (warnEl) {
    // Hai cảnh báo có thể CÙNG đúng một lúc (đo được 19/9/2026: 6 hàng ghim + một hàng không
    // đủ câu). Trước đây chúng loại trừ nhau nên cái sau che mất cái trước — giờ ghép lại.
    const msgs = [];
    if (short.length) {
      msgs.push('Không đủ câu: ' + short.map(r => r.set.name + ' cần ' + r.want + ' nhưng bộ chỉ có ' + r.set.questions.length + ' câu').join(', '));
    }
    const lockedRows = rows.filter(r => r.locked);
    if (pctSum !== 100 && lockedRows.length) {
      // Hàng ghim không nhường, nên phần vượt/thiếu có thể không có ai bù. Nói thẳng ra đây
      // thay vì để ba nút trộn tắt im lặng — đó là kiểu "app tự nhiên hỏng" khó hiểu nhất.
      msgs.push('Đang ghim ' + lockedRows.length + ' bộ (' + lockedRows.reduce((a, r) => a + r.pct, 0) + '%) nên các bộ còn lại không tự bù được về 100% — nhấn 📌 để bỏ ghim, hoặc chỉnh tay các bộ còn lại.');
    }
    warnEl.textContent = msgs.join(' ');
  }
  ['mixBtnSingle', 'mixBtnAll', 'mixBtnStudy'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.disabled = !ok;
  });
  paintMixMarks();
}

// Gắn/gỡ HAI class trạng thái của bảng trộn, cả hai đều tính từ chính giá trị ô số của hàng:
//   `mix-zero` trên Ô SỐ có giá trị 0 (xem khối .mix-zero ở CSS)
//   `on`       trên HÀNG có giá trị > 0 → nền xanh dương nhạt (xem .mix-row.on ở CSS)
// Phải chạy lại ở cuối `paintMix()`: cặp ▲▼, luật chia lại phần trăm và nút "↺ Mặc định" đều đổi
// giá trị của NHIỀU ô cùng lúc, không chỉ ô vừa chạm — nên gắn class ở chỗ nhập liệu là thiếu.
// `input[id^="mixPct-"]` chỉ gồm ô của bảng trộn: ô "Tổng số câu" có id `mixTotal` nên không lọt
// vào đây, và cũng đúng — ô đó không phải ô phần trăm.
function paintMixMarks() {
  document.querySelectorAll('input[id^="mixPct-"]').forEach(el => {
    const v = parseInt(el.value, 10) || 0;
    el.classList.toggle('mix-zero', v === 0);
    const row = el.closest('.mix-row');
    if (row) row.classList.toggle('on', v > 0);
  });
}

function onMixInput() {
  const t = document.getElementById('mixTotal');
  if (t) _mix.total = Math.max(1, Math.min(parseInt(t.value, 10) || 1, Math.max(1, totalQuestions())));
  quizLib.forEach(s => {
    const el = document.getElementById('mixPct-' + s.id);
    if (el) _mix.pct[s.id] = clampPct(parseInt(el.value, 10));
  });
  paintMix();
  // Ghi vào máy NGAY mỗi lần gõ, không chờ rời ô hay đóng app: người dùng thường chỉnh
  // vài ô rồi đóng luôn, và một lần ghi ~1KB là không đáng kể. Cũng KHÔNG cần chờ tổng
  // đúng 100 — tỷ lệ dở dang (ví dụ 95%) vẫn phải được nhớ đúng như nó đang là.
  saveMix();
}

// Chờ người dùng NGỪNG GÕ rồi mới chia lại (19/9/2026 — lỗi báo từ ĐIỆN THOẠI: "khi chỉnh số
// tỷ lệ tăng giảm thì các bộ đề khác không tự chia"). Nguyên nhân: trên Android, nút "ẩn bàn
// phím" KHÔNG làm ô mất tiêu điểm, mà change chỉ chạy khi RỜI Ô — nên bảng đứng im dù người
// dùng đã sửa xong. Hẹn giờ thì không phụ thuộc vào việc ô có mất tiêu điểm hay không.
// Gõ "0" rồi "5" vẫn an toàn: mỗi nhịp gõ đều đặt lại đồng hồ, và nếu có chia sớm thì lần chốt
// cuối vẫn ghim ĐÚNG số cuối cùng của dòng đó rồi chia lại phần còn lại (luật ở rebalanceAround).
const MIX_COMMIT_DELAY_MS = 700;
let _mixCommitTimer = null;

function onMixTyped() {
  onMixInput();                                  // đọc + ghi vào máy NGAY như cũ
  clearTimeout(_mixCommitTimer);
  _mixCommitTimer = setTimeout(function () {
    _mixCommitTimer = null;
    const el = document.activeElement;
    const id = (el && el.id && el.id.indexOf('mixPct-') === 0) ? el.id.slice(7) : null;
    onMixCommit(id);                             // id rỗng = chỉ vẽ lại, không chia
  }, MIX_COMMIT_DELAY_MS);
}

// Cặp nút ▲▼ cạnh ô phần trăm. Mỗi cú chạm CHỐT LUÔN (không chờ rời ô) — đây cũng là đường
// chắc chắn nhất trên điện thoại, vì cú chạm là sự kiện không trình duyệt nào bỏ qua.
// Đè ngón tay thì tự lặp 160ms/nhịp, nên 0 → 15 chỉ cần một lần giữ.
let _mixStepTimer = null;

function mixStep(id, delta) {
  const el = document.getElementById('mixPct-' + id);
  if (!el) return;
  const typed = parseInt(el.value, 10);
  const base = isFinite(typed) ? typed : pctOf(id);
  const next = Math.max(0, Math.min(100, base + delta));
  if (next === base) return;             // đã chạm trần/sàn → không làm gì
  el.value = next;                       // ghi vào Ô trước: onMixCommit đọc lại từ các ô
  onMixCommit(id);
}

function mixStepStart(ev, id, delta) {
  ev.preventDefault();                   // đừng để nút chiếm tiêu điểm hay bắn thêm click
  clearInterval(_mixStepTimer);
  mixStep(id, delta);
  _mixStepTimer = setInterval(function () { mixStep(id, delta); }, 160);
}

function mixStepEnd() { clearInterval(_mixStepTimer); _mixStepTimer = null; }

function mixFocusedId() {
  const el = document.activeElement;
  return (el && el.id && el.id.indexOf('mixPct-') === 0) ? el.id.slice(7) : null;
}

// Đường dự phòng thứ ba: người dùng gõ xong rồi CHẠM ra chỗ khác. Có trình duyệt điện thoại
// không bắn change (và đôi khi cả blur) cho ô số, nên cú chạm đó cũng phải chốt số. Chỉ chốt
// khi ô tỷ lệ đang giữ tiêu điểm VÀ cú chạm KHÔNG rơi vào chính ô đó (chạm vào ô là để sửa tiếp).
document.addEventListener('pointerup', function (ev) {
  const id = mixFocusedId();
  if (!id) return;
  if (ev.target && ev.target.id === 'mixPct-' + id) return;
  onMixCommit(id);
});

// Ghi _mix.pct trở lại các Ô NHẬP. Cần riêng hàm này vì paintMix() chỉ vẽ cột số câu,
// không động vào giá trị trong ô — sau khi tự chia lại mà không ghi lại thì màn hình vẫn
// hiện số CŨ dù bảng đã tính theo số MỚI.
function syncMixInputs() {
  quizLib.forEach(s => {
    const el = document.getElementById('mixPct-' + s.id);
    if (el) el.value = pctOf(s.id);
  });
}

// Trọng số của một bộ khi chia phần tăng/giảm: số câu hỏi bộ đó có (hoặc phần trăm đang
// đặt, nếu MIX_REBALANCE_BY = 'share').
function mixWeight(s) {
  return MIX_REBALANCE_BY === 'share'
    ? Math.max(0, pctOf(s.id))
    : Math.max(0, (s.questions || []).length);
}

// Chia `amount` điểm cho danh sách theo TRỌNG SỐ, trả về mảng số nguyên tổng đúng bằng
// `amount` — cùng phương pháp "số dư lớn nhất" với mixRows()/balanceMixTo100().
function splitByWeight(list, amount) {
  const out = list.map(() => 0);
  if (amount <= 0 || !list.length) return out;
  const totalW = list.reduce((a, s) => a + mixWeight(s), 0);
  if (totalW <= 0) return out;   // mọi trọng số = 0 (bộ không có câu nào) → chia được gì thì chia
  const raw = list.map(s => amount * mixWeight(s) / totalW);
  raw.forEach((v, i) => { out[i] = Math.floor(v); });
  let left = amount - out.reduce((a, v) => a + v, 0);
  const order = raw.map((v, i) => ({ i: i, frac: v - Math.floor(v) }))
    .sort((a, b) => b.frac - a.frac);
  let k = 0;
  while (left > 0 && k < order.length) { out[order[k].i]++; left--; k++; }
  return out;
}

// Lấy bớt `amount` điểm khỏi danh sách, KHÔNG để bộ nào xuống dưới 0. Bộ nào không đủ để
// nhường thì nhường hết phần mình có, phần còn thiếu chia tiếp cho các bộ khác — nên bộ
// nhỏ không bao giờ bị đẩy thành số âm (tổng sẽ sai ngay nếu có số âm).
function takeFromSets(list, amount) {
  let left = amount, guard = 0;
  while (left > 0 && guard++ < 30) {
    const live = list.filter(s => pctOf(s.id) > 0);
    if (!live.length) break;
    const step = splitByWeight(live, left);
    let taken = 0;
    live.forEach((s, i) => {
      const take = Math.min(step[i], pctOf(s.id));
      _mix.pct[s.id] = pctOf(s.id) - take;
      taken += take;
    });
    if (!taken) break;               // không lấy được gì nữa → thoát, đừng lặp vô hạn
    left -= taken;
  }
  return left === 0;
}

// Cân lại quanh bộ vừa được sửa: giữ ĐÚNG giá trị người dùng vừa nhập cho bộ đó, rồi
// - nếu tổng đang thiếu (bộ kia bị TĂNG): lấy bớt từ các bộ còn lại
// - nếu tổng đang thừa (bộ kia bị GIẢM): chia thêm cho các bộ còn lại
// theo trọng số mixWeight() — mặc định là số câu hỏi của từng bộ.
// Bộ đang 0% KHÔNG được nhận thêm: đang 0% nghĩa là "bộ này không lấy câu nào", nhất quán
// với luật nhập 0 ở dưới.
function rebalanceAround(id) {
  // Hàng GHIM bị loại khỏi "các bộ còn lại": nó không nhường khi hàng khác tăng và không
  // nhận khi hàng khác giảm — đúng nghĩa "đứng yên, không bị ảnh hưởng".
  const others = quizLib.filter(s => s.id !== id && !isMixLocked(s.id));
  const have = others.reduce((a, s) => a + pctOf(s.id), 0);
  // PHẢI trừ cả phần của các hàng ghim khỏi ngân sách 100. Bỏ sót chỗ này thì hàng ghim vừa
  // không nhường, vừa không bị tính vào ngân sách → tổng vọt lên đúng bằng số của nó (đo
  // được 19/9/2026: ghim một bộ 8% rồi nâng bộ khác, tổng ra 108% chứ không phải 100%).
  const pinnedSum = quizLib
    .filter(s => s.id !== id && isMixLocked(s.id))
    .reduce((a, s) => a + pctOf(s.id), 0);
  const budget = 100 - pinnedSum;
  const diff = (budget - pctOf(id)) - have;   // >0 các bộ khác phải tăng, <0 phải giảm
  if (diff === 0) return false;
  if (diff < 0) return takeFromSets(others, -diff);
  const live = others.filter(s => pctOf(s.id) > 0);
  if (!live.length) return false;             // không còn ai để nhận → để nguyên, cảnh báo lo
  const add = splitByWeight(live, diff);
  live.forEach((s, i) => { _mix.pct[s.id] = pctOf(s.id) + add[i]; });
  return true;
}

// Chạy khi RỜI Ô (hoặc Enter) — cố ý KHÔNG chạy ở sự kiện input: gõ "0" hay "1" có thể chỉ
// là bước trung gian khi sửa 15 → 0 rồi 5, chạy ngay lúc đó thì bảng đã chia lại xong mới
// nhận nốt chữ số và tổng vọt lên quá 100. Ở sự kiện change thì giá trị đã chốt.
function onMixCommit(id) {
  onMixInput();                                   // đọc lại hết các ô trước khi tính
  if (!id) { paintMix(); return; }
  if (!rebalanceAround(id)) { paintMix(); return; }
  syncMixInputs();
  paintMix();
  saveMix();                                      // số mới là số phải nhớ, không phải số cũ
}

// Nhóm "mặc định 0%": bộ KHÔNG được lấy câu khi trộn (người dùng vẫn tự nâng phần
// trăm lên được nếu muốn). So khớp theo "chỉ chữ và số" nên "Bậc 6-7", "Bậc6_7",
// "KT điện cho CNKD-Bậc6_7" đều khớp, còn "Bậc7_7" thì không (…bac77).
function isZeroSet(name) {
  const k = quizKey(name).replace(/[^a-z0-9]/g, '');
  return ZERO_SET_KEYS.some(w => k.indexOf(w) >= 0);
}

// Trả về số phần trăm CỐ ĐỊNH của bộ, hoặc null nếu bộ không thuộc nhóm nào.
// Dùng cùng cách so khớp "chỉ chữ và số" như isZeroSet.
function fixedPctFor(name) {
  const k = quizKey(name).replace(/[^a-z0-9]/g, '');
  const hit = FIXED_SET_PCT.find(function (row) { return k.indexOf(row[0]) >= 0; });
  return hit ? hit[1] : null;
}

// Chia đều `budget` phần trăm cho danh sách id, tổng đúng bằng budget.
function splitPctEven(ids, budget) {
  const out = {};
  if (!ids.length) return out;
  const base = Math.floor(budget / ids.length);
  let left = budget - base * ids.length;
  ids.forEach(id => { out[id] = base + (left-- > 0 ? 1 : 0); });
  return out;
}

// Tỷ lệ mặc định chia làm BA nhóm, xét theo thứ tự:
//   1. cố định (FIXED_SET_PCT)  → mỗi bộ đúng số câu của nó (8/7/5/10/3/7 = 40 câu)
//   2. 0% (ZERO_SET_KEYS)       → không lấy câu nào (bậc 6-7)
//   3. còn lại                  → chia đều 100 - 40 = 60 câu
// Bộ nào bị ĐỔI TÊN đến mất khoá thì tự rơi xuống nhóm chia đều — không vỡ app.
function resetMixDefaults() {
  _mix.total = Math.min(MIX_DEFAULT_TOTAL, Math.max(1, totalQuestions()));
  _mix.pct = {};
  // Ghim bị xoá cùng tỷ lệ: nút "↺ Mặc định" là "quên hết chỉnh tay", mà ghim là một dạng
  // chỉnh tay. Đường nạp/xoá bộ thì KHÁC — ở đó refreshMix() gọi resetMixDefaults() rồi
  // restoreMix() phục hồi lại ghim theo TÊN bộ, nên ghim không mất khi thư viện đổi.
  _mix.locked = {};
  if (!quizLib.length) return;
  let fixed = [];        // [{ s, pct }]
  const zero = [];
  let rest = [];
  quizLib.forEach(s => {
    const f = fixedPctFor(s.name);
    if (f !== null) { fixed.push({ s: s, pct: f }); return; }
    if (isZeroSet(s.name)) { zero.push(s); return; }
    rest.push(s);
  });
  let fixedBudget = fixed.reduce((a, x) => a + x.pct, 0);
  // Chốt an toàn: nếu người dùng đổi tên nhiều bộ trùng khoá cố định đến mức tổng
  // vượt 100 thì cắt nhóm cố định lại, để phần chia đều không bị âm (số âm sẽ làm
  // splitPctEven chia ra số vô lý và nút trộn bị khoá).
  if (fixedBudget > 100) fixedBudget = 100;
  // Nhóm cố định và nhóm 0% nhận phần của mình — nhưng nếu KHÔNG còn bộ nào nhận
  // phần chia đều (thư viện chỉ có bộ cố định và bộ 0%) thì phần đó phải trả về cho
  // một trong hai nhóm kia, nếu không tổng không đủ 100% và các nút trộn bị khoá.
  // Ưu tiên trả về cho nhóm 0%, rồi mới đến nhóm cố định.
  if (!rest.length) {
    if (zero.length) rest = zero;
    else if (fixed.length) { rest = fixed.map(x => x.s); fixed = []; fixedBudget = 0; }
  }
  // Nhóm cố định: mỗi bộ nhận ĐÚNG số của nó — không dùng splitPctEven vì sáu bộ
  // khác số nhau (8/7/5/10/3/7) mà chia đều thì thành 6/6/7/7/6/7. Nếu chốt an toàn
  // ở trên phải cắt thì cắt theo tỷ lệ và dồn phần lẻ vào bộ cuối để tổng vẫn đúng.
  const wantFixed = fixed.reduce((a, x) => a + x.pct, 0);
  const scale = wantFixed > fixedBudget ? fixedBudget / wantFixed : 1;
  let fixedSum = 0;
  fixed.forEach((x, i) => {
    const v = (i === fixed.length - 1) ? Math.max(0, fixedBudget - fixedSum) : Math.round(x.pct * scale);
    _mix.pct[x.s.id] = v;
    fixedSum += v;
  });
  const restBudget = Math.max(0, 100 - fixedSum);
  Object.assign(_mix.pct, splitPctEven(rest.map(s => s.id), restBudget));
  // Bộ mặc định 0% (khi không phải nhóm dự phòng ở trên) ghi rõ 0% cho dễ đọc code.
  zero.forEach(s => { if (!(s.id in _mix.pct)) _mix.pct[s.id] = 0; });
}

function backHome() {
  _libPending = null;
  _quizMode = 'home'; renderQuiz(); window.scrollTo(0, 0);
}
function openBrowse(setId) {
  _libSetId = setId; _libPending = null;
  _quizMode = 'browse'; renderQuiz(); window.scrollTo(0, 0);
}

// ── LÀM BÀI ──
// mode: 'single' = từng câu một | 'all' = mọi câu trên một màn
function startExam(questions, title, mode) {
  const list = (questions || []).filter(Boolean);
  if (!list.length) { alert('Chưa có câu hỏi nào.'); return; }
  const m = (mode === 'all' || mode === 'study') ? mode : 'single';
  const items = list.map(q => {
    const opts = q.options.map((t, i) => ({ t: t, ok: i === q.correct }));
    if (_quizOpts.shuffleA) shuffleArr(opts);
    return { q: q.q, explain: q.explain || '', opts: opts, chosen: null, done: false, tried: [], wrongFirst: false };
  });
  if (_quizOpts.shuffleQ) shuffleArr(items);
  _exam = { questions: list, title: title || '', mode: m };
  _quizState = { items: items, idx: 0, chosen: null, score: 0, wrong: [], title: _exam.title };
  _quizMode = m === 'all' ? 'playAll' : (m === 'study' ? 'study' : 'play');
  renderQuiz();
  window.scrollTo(0, 0);
}

function startSetExam(setId, mode) {
  const s = libSet(setId);
  if (!s || !s.questions.length) { alert('Bộ đề này chưa có câu hỏi.'); return; }
  _libSetId = s.id;
  startExam(s.questions, s.name, mode);   // tên đầy đủ — không còn rút gọn ở màn hẹp
}

function replayExam() { if (_exam) startExam(_exam.questions, _exam.title, _exam.mode); }

// Trộn đề: lấy ngẫu nhiên đúng số câu mỗi bộ phải đóng góp rồi xáo lại toàn bộ
function mixExam(mode) {
  const rows = mixRows();
  const picked = [];
  rows.forEach(r => {
    if (r.got <= 0) return;
    const pool = r.set.questions.slice();
    shuffleArr(pool);
    pool.slice(0, r.got).forEach(q => picked.push(q));
  });
  if (!picked.length) { alert('Tỷ lệ hiện tại không lấy được câu nào. Hãy tăng phần trăm cho ít nhất một bộ.'); return; }
  shuffleArr(picked);
  startExam(picked, '🎲 Trộn đề · ' + picked.length + ' câu', mode);
}

function answerQuiz(i) {
  const st = _quizState;
  if (!st || st.chosen !== null) return;
  const it = st.items[st.idx];
  if (!it || !it.opts[i]) return;
  st.chosen = i;
  // Ghi đáp án vào CHÍNH CÂU ĐÓ (19/9/2026). st.chosen chỉ là "câu đang xem", bị xoá mỗi lần
  // chuyển câu; thiếu dòng này thì quay lại câu cũ sẽ thấy nó như CHƯA LÀM, và bấm lại là
  // CỘNG ĐIỂM LẦN THỨ HAI (st.chosen về null nên chốt chặn `st.chosen !== null` không đỡ được).
  // answerAll() đã làm đúng kiểu này từ trước (`it.chosen = oi`).
  it.chosen = i;
  const right = it.opts.find(o => o.ok);
  if (it.opts[i].ok) st.score++;
  else st.wrong.push({ q: it.q, chosen: it.opts[i].t, correct: right ? right.t : '—', explain: it.explain });
  renderQuiz();
}

// Điều hướng câu (19/9/2026 — "bỏ nút thoát bài làm, thay bằng 2 nút câu tiếp và câu trước").
// Cả hai hàm làm một việc giống nhau: CẤT đáp án của câu đang xem vào câu đó rồi MỞ LẠI đáp án
// của câu sắp tới. Nhờ vậy quay lại câu đã làm vẫn thấy nguyên trạng đúng/sai, và không thể
// làm lại để cộng điểm thêm lần nữa.
function nextQuiz() {
  const st = _quizState;
  if (!st || st.idx >= st.items.length - 1) return;
  st.items[st.idx].chosen = st.chosen;
  st.idx++;
  st.chosen = st.items[st.idx].chosen !== undefined ? st.items[st.idx].chosen : null;
  renderQuiz(); window.scrollTo(0, 0);
}
function prevQuiz() {
  const st = _quizState;
  if (!st || st.idx === 0) return;
  st.items[st.idx].chosen = st.chosen;
  st.idx--;
  st.chosen = st.items[st.idx].chosen !== undefined ? st.items[st.idx].chosen : null;
  renderQuiz(); window.scrollTo(0, 0);
}
function finishQuiz() { _quizMode = 'result'; renderQuiz(); window.scrollTo(0, 0); }
function quitQuiz() { _quizState = null; _quizMode = 'home'; renderQuiz(); window.scrollTo(0, 0); }

// Nút về trang chủ ở đầu mọi màn làm bài — để không phải cuộn xuống đáy mới thoát
// được (đề 30-60 câu thì nút “Thoát” ở đáy rất xa).
// Chữ câu hỏi kèm SỐ CÂU trong vòng tròn xanh ở đầu — dùng cho BA màn làm bài
// (từng câu, cả bộ, học). Dùng flex chứ không nối chuỗi số vào câu: nối chuỗi thì
// câu dài xuống dòng sẽ có dòng thứ hai thụt vào thẳng lề, lệch hẳn với dòng đầu;
// flex cho vòng tròn một cột riêng nên cả khối chữ thẳng hàng.
// KHÔNG dùng ở hai màn danh sách (👁 Câu hỏi và “Cần ôn lại”): ở đó mỗi câu đã có
// số “1.” đứng trước, thêm vòng tròn nữa thành rối.
function qTextHtml(text, extraStyle, num) {
  return '<div style="display:flex;gap:6px;align-items:flex-start;' + (extraStyle || '') + '">'
    + '<span class="q-num">' + num + '</span>'
    + '<div style="flex:1;min-width:0">' + text + '</div></div>';
}

// Icon nút "về trang chủ" — vẽ bằng SVG, KHÔNG dùng emoji (20/9/2026 — "đổi chữ về trang chủ
// thành icon như ảnh"). Lý do phải là SVG chứ không phải emoji: cùng một ký tự `↩️` nhưng Windows
// vẽ ra ô VUÔNG XANH DƯƠNG + mũi tên TRẮNG, còn ảnh người dùng gửi là ô VUÔNG XANH LÁ + mũi tên
// ĐEN. Màu của emoji do FONT HỆ THỐNG quyết định, không sửa được bằng CSS, và nó khác nhau giữa
// máy tính với điện thoại — nên không có cách nào "giống ảnh" bằng emoji.
// Hình dưới đây lấy ĐÚNG từ ảnh đó, đọc từng pixel: khung 45×45 bo góc ~5,5px, nền `#3DC697`
// (đo được rgb(61,198,151)), mũi tên `#0a0a0a` (rgb(10,10,10)): một nét dọc ở bên PHẢI nối xuống
// thành nét ngang chạy sang TRÁI (khúc móc ở toạ độ 29,5/24,5), đầu mũi tên chữ V ở bên trái.
// Đổi lại: cùng một hình trên mọi máy, mọi chế độ sáng/tối, và không bị mờ khi phóng to.
function homeIcoSvg() {
  const stroke = 'fill="none" stroke="#0a0a0a" stroke-width="2.3"'
    + ' stroke-linecap="round" stroke-linejoin="round"';
  // VÁT NỔI (20/9/2026 — "thêm hiệu ứng nổi khối"): hai vệt mảnh chạy sát mép TRÊN và mép DƯỚI
  // của tấm — sáng ở trên, tối ở dưới — đúng quy ước ánh sáng từ trên xuống, nên tấm đọc ra là một
  // khối NỔI chứ không phải miếng dán phẳng. Bóng đổ nằm ở CSS (`.home-btn svg`), còn vát nằm trong
  // hình vì chỉ ở đây mới vẽ được bên trong tấm.
  // Hai vệt này dừng trước hai góc (x 5,5 → 39,5) để không đè lên đường bo 5,5 của tấm.
  // Cỡ nét 2,0 trong hệ 45 nên ở cỡ hiển thị 32px nó ra ~1,4px — mảnh, không thành hai vạch kẻ.
  const bevel = 'fill="none" stroke-linecap="round" stroke-width="2"';
  return '<svg viewBox="0 0 45 45" aria-hidden="true" focusable="false">'
    + '<rect x="0" y="0" width="45" height="45" rx="5.5" fill="#3DC697"></rect>'
    + '<path d="M5.5 2.4 H39.5" ' + bevel + ' stroke="rgba(255,255,255,0.42)"></path>'
    + '<path d="M5.5 42.6 H39.5" ' + bevel + ' stroke="rgba(0,0,0,0.20)"></path>'
    + '<path d="M29.5 15.5 V24.5 H16.5" ' + stroke + '></path>'
    + '<path d="M20.5 20 L16.5 24.5 L20.5 29" ' + stroke + '></path>'
    + '</svg>';
}

function homeBtnHtml() {
  // Nút này là LỐI THOÁT DUY NHẤT khỏi bài thi (nút "Thoát bài làm" ở đáy đã bị thay bằng cặp
  // điều hướng) và ở "Cả bộ"/"Học" thẻ này là thanh DÍNH nên nút luôn trong tầm mắt dù cuộn tới đâu.
  // Lịch sử trong ngày 20/9/2026, để không ai "sửa qua sửa lại" thêm lần nữa:
  //   icon ⬅️ → CHỮ "Về trang chủ" (theo yêu cầu "bỏ icon cho đồng bộ") → ICON SVG như trên
  //   (theo yêu cầu "đổi chữ về trang chủ thành icon như ảnh"). Chữ tốn thêm ~77px bề ngang của
  //   tiêu đề bộ đề trên cùng hàng; icon trả lại đúng 77px đó.
  // `title`/`aria-label` là BẮT BUỘC ở đây: nút chỉ có hình, không còn chữ nào để đọc.
  return '<button class="quiz-btn home-btn" onclick="quitQuiz()" title="Về trang chủ"'
    + ' aria-label="Về trang chủ">' + homeIcoSvg() + '</button>';
}

function quizPlayHtml() {
  const st = _quizState;
  if (!st || !st.items.length) return '<div class="quiz-card">Không có câu hỏi.</div>';
  const it = st.items[st.idx];
  const total = st.items.length;
  const answered = st.chosen !== null;
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  let h = '<div class="quiz-card">';
  h += '<div class="head-row" style="margin-bottom:8px">';
  h += `<div style="flex:1;min-width:0;font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim);line-height:1.35">${st.title ? esc(st.title) : ''}</div>`;
  h += homeBtnHtml();
  h += '</div>';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">';
  h += `<div style="font-size:var(--fs-sub);font-weight:var(--fw-body)">Câu ${st.idx + 1}/${total}</div>`;
  // Số câu SAI hiện ngay cạnh số câu đúng (20/9/2026 — "tôi muốn hiển thị thêm câu sai ở bảng
  // từng câu"). `st.wrong` là mảng các câu làm sai, đã có sẵn từ trước (nó dùng cho bảng kết quả
  // và cho danh sách "📌 Cần ôn lại") nên chỉ là hiển thị thêm, KHÔNG phải thêm cơ chế đếm mới.
  // Màu dùng `--red-text` chứ không phải `--red`: xem ghi chú ở `:root`.
  h += `<div style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim)">Đúng: <b style="color:var(--green)">${st.score}</b> · Sai: <b style="color:var(--red-text)">${st.wrong.length}</b></div>`;
  h += '</div>';
  h += `<div style="height:6px;background:var(--border);border-radius:3px;margin:8px 0 10px;overflow:hidden"><div style="height:100%;width:${Math.round(st.idx / total * 100)}%;background:var(--accent)"></div></div>`;
  h += qTextHtml(esc(it.q), 'color:var(--q-text);font-size:var(--fs-lead);font-weight:var(--fw-head);line-height:1.5;margin-bottom:10px', st.idx + 1);
  it.opts.forEach((o, i) => {
    let cls = 'quiz-opt';
    if (answered) {
      if (o.ok) cls += ' correct';
      else if (i === st.chosen) cls += ' wrong';
    }
    h += `<button class="${cls}"${answered ? ' disabled' : ''} onclick="answerQuiz(${i})">`;
    h += `<span class="quiz-badge">${letters[i]}</span><span style="flex:1">${esc(o.t)}</span>`;
    if (answered && o.ok) h += '<span>✅</span>';
    else if (answered && i === st.chosen) h += '<span>❌</span>';
    h += '</button>';
  });
  if (answered) {
    // KHÔNG hộp phản hồi nào nữa: đúng cũng không, sai cũng không (19/9/2026 — "bỏ luôn ô này",
    // nối tiếp "bỏ luôn hàng này cho gọn" của câu sai). Các đáp án ngay trên đã nói đủ: đáp án
    // đúng viền xanh ✅, đáp án vừa chọn viền đỏ ❌.
    // Chỉ còn LỜI GIẢI (💡) nếu file nguồn có cột giải thích — hiện thư viện không câu nào có.
    if (it.explain) h += '<div style="margin-top:6px;font-size:14px;line-height:1.55;color:var(--text-dim)">💡 ' + esc(it.explain) + '</div>';
  }
  h += '</div>';
  // ── HAI NÚT ĐIỀU HƯỚNG Ở ĐÁY (19/9/2026 — "bỏ nút thoát bài làm, thay bằng 2 nút câu tiếp và
  // câu trước"). Chúng ngồi đúng chỗ nút "Thoát bài làm" cũ; lối thoát bây giờ là nút "Về trang chủ"
  // ở đầu thẻ (homeBtnHtml) — nhãn CHỮ, không icon (đổi 20/9/2026).
  // "Câu tiếp" LUÔN BẬT — người dùng đã chọn cho phép bỏ qua câu chưa trả lời, nên có thể nhảy
  // qua lại tự do; "Câu trước" tắt ở câu đầu vì phía trước không còn gì (xem .quiz-btn:disabled).
  // Nút "Câu tiếp →" TRONG thẻ và nút "🏁 Xem kết quả" cũ đã BỎ: ở câu CUỐI, chính nút bên
  // phải này đổi thành "Xem kết quả", để mỗi màn chỉ có MỘT nút "tiếp" duy nhất — giữ cả hai
  // thì thành hai chỗ bấm làm cùng một việc.
  const lastQ = st.idx === total - 1;
  h += '<div style="display:flex;gap:8px;margin-top:8px">';
  h += `<button class="quiz-btn" style="flex:1" onclick="prevQuiz()"${st.idx === 0 ? ' disabled' : ''}>◀ Câu trước</button>`;
  h += `<button class="quiz-btn${lastQ ? ' primary' : ''}" style="flex:1" onclick="${lastQ ? 'finishQuiz()' : 'nextQuiz()'}">${lastQ ? '🏁 Xem kết quả' : 'Câu tiếp ▶'}</button>`;
  h += '</div>';
  return h;
}

// Lớp của hộp phản hồi: đúng → hộp xanh; SAI → 'quiz-fb show plain' (đúng thẻ div đó nhưng
// không nền/viền, xem .quiz-fb.plain). Dùng cặp hàm này ở cả "Cả bộ" và "Học" để hai chế độ
// không lệch nhau.
// KHÔNG còn hộp phản hồi nào — đúng hay sai đều không có hộp (19/9/2026). Hàng này chỉ còn dùng
// cho LỜI GIẢI (💡) khi file nguồn có cột giải thích; không câu nào có thì nó là 'quiz-fb' TRẦN
// = display:none, và cả hàng biến mất, không chiếm một pixel nào.
// Nếu ai muốn trả lại hộp xanh/đỏ: đây là chỗ DUY NHẤT phải sửa, và các class .quiz-fb.ok /
// .quiz-fb.no / .quiz-fb.plain vẫn còn nguyên trong CSS.
function quizFeedbackCls(it) {
  return it.explain ? 'quiz-fb show plain' : 'quiz-fb';
}

function quizFeedbackHtml(it) {
  return it.explain ? '<span style="color:var(--text-dim)">💡 ' + esc(it.explain) + '</span>' : '';
}

function quizAllHtml() {
  const st = _quizState;
  if (!st || !st.items.length) return '<div class="quiz-card">Không có câu hỏi.</div>';
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  let h = '<div class="quiz-card quiz-all-head">';
  h += '<div class="head-row">';
  h += `<div style="flex:1;min-width:0;font-size:var(--fs-base);font-weight:var(--fw-ui)">${st.title ? esc(st.title) : '📋 Cả bộ đề'} · ${st.items.length} câu</div>`;
  h += homeBtnHtml();
  h += '</div>';
  h += '<div id="allSummary" style="font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-dim);margin-top:3px"></div>';
  h += '</div>';

  st.items.forEach((it, qi) => {
    const done = it.chosen !== null;
    h += `<div class="quiz-card" id="qb-${qi}">`;
    h += qTextHtml(esc(it.q), 'color:var(--q-text);font-size:var(--fs-lead);font-weight:var(--fw-head);line-height:1.5;margin-bottom:8px', qi + 1);
    it.opts.forEach((o, oi) => {
      let cls = 'quiz-opt';
      let mark = '';
      if (done) {
        if (o.ok) { cls += ' correct'; mark = '<span class="mark">✅</span>'; }
        else if (oi === it.chosen) { cls += ' wrong'; mark = '<span class="mark">❌</span>'; }
      }
      h += `<button class="${cls}" id="qo-${qi}-${oi}"${done ? ' disabled' : ''} onclick="answerAll(${qi},${oi})">`;
      h += `<span class="quiz-badge">${letters[oi]}</span><span style="flex:1">${esc(o.t)}</span>${mark}`;
      h += '</button>';
    });
    h += `<div class="${done ? quizFeedbackCls(it) : 'quiz-fb'}" id="qfb-${qi}">${done ? quizFeedbackHtml(it) : ''}</div>`;
    h += '</div>';
  });

  h += '<div class="quiz-card" style="text-align:center">';
  // Nút "Thoát bài làm" ở đây cũng bỏ (19/9/2026, cùng lượt): ở "Cả bộ" không có chuyện
  // câu trước/câu tiếp (tất cả câu nằm trên một trang), nên chỗ đó KHÔNG thay bằng cặp điều
  // hướng được — lối thoát là nút "Về trang chủ" ở đầu thanh DÍNH, luôn trong tầm mắt dù cuộn tới đâu.
  h += '<button class="big-upload-btn" style="width:100%" onclick="finishQuiz()">🏁 Xem kết quả</button>';
  h += '</div>';
  return h;
}

function updateAllSummary() {
  const st = _quizState;
  const el = document.getElementById('allSummary');
  if (!st || !el) return;
  const done = st.items.filter(x => x.chosen !== null).length;
  el.innerHTML = `Đã trả lời <b>${done}</b>/${st.items.length} · ` +
    `Đúng <b style="color:var(--green)">${st.score}</b> · ` +
    `Sai <b style="color:var(--red-text)">${st.wrong.length}</b>`;
}

function answerAll(qi, oi) {
  const st = _quizState;
  if (!st) return;
  const it = st.items[qi];
  if (!it || it.chosen !== null || !it.opts[oi]) return;
  it.chosen = oi;
  const right = it.opts.find(o => o.ok);
  const isRight = !!it.opts[oi].ok;
  if (isRight) st.score++;
  else st.wrong.push({ q: it.q, chosen: it.opts[oi].t, correct: right ? right.t : '—', explain: it.explain });

  // Cập nhật tại chỗ thay vì render lại cả danh sách, để không mất vị trí cuộn
  it.opts.forEach((o, i) => {
    const btn = document.getElementById('qo-' + qi + '-' + i);
    if (!btn) return;
    btn.disabled = true;
    if (o.ok) { btn.classList.add('correct'); btn.insertAdjacentHTML('beforeend', '<span class="mark">✅</span>'); }
    else if (i === oi) { btn.classList.add('wrong'); btn.insertAdjacentHTML('beforeend', '<span class="mark">❌</span>'); }
  });
  const fb = document.getElementById('qfb-' + qi);
  if (fb) { fb.className = quizFeedbackCls(it); fb.innerHTML = quizFeedbackHtml(it); }
  updateAllSummary();
}
