       #ffffff  = chỉ dành cho chữ TRÊN NỀN MÀU ĐẶC (`--on-accent`) — không phải chữ trên nền xám
       #cbd5e1  = chữ chính (token này)
       #94a3b8  = `--text-dim` / `--answer`, chữ phụ
     ĐO TRƯỚC/SAU trên nền THẬT: thẻ #202020 **13,17 → 10,94:1**; nền trang #171717 **14,55 → 12,07:1**.
     Vẫn thừa xa ngưỡng 4,5:1, và vẫn cách chữ phụ (#94a3b8 = 6,33:1) một khoảng rõ — nên thứ bậc
     chữ chính / chữ phụ KHÔNG đổi, kiểm bằng số chứ không bằng mắt.
     NẤC TIẾP THEO nếu còn bị yêu cầu tối hơn: #94a3b8 = đúng bằng chữ phụ → mất luôn phân cấp,
     đừng đi; muốn khác thì phải nâng `--text-dim` LÊN cùng lúc, và nói rõ đánh đổi cho người dùng. */
  --text: #cbd5e1;
  --text-dim: #94a3b8;
  --answer: #94a3b8;   /* chữ đáp án ở chế độ tối. Đường đi cả ngày 19/9/2026 — mỗi nấc đo trên
                          NỀN ĐANG DÙNG lúc đó, nên các số bên cạnh KHÔNG so sánh chéo được:
                          #9aa8bb → #6b7d93 → #5f7086 → #5b6c7f →(nền đổi sang #262a33)
                          → #8b9bb0 → #8394a9 → #7d8ea3 →(nền đổi lần nữa sang #21252e)
                          → #77879c → **#8394a9** ("sáng hơn").
                          Trên tấm #21252e (cũ): 4.95:1.
                          19/9/2026 — cả dải nền tối đổi sang xám THUẦN (nền #171717, tấm #262626):
                          trên tấm MỚI con số là **4.88:1 — VẪN vượt ngưỡng 4.5:1**, nên giữ nguyên
                          màu chữ này, KHÔNG phải chỉnh lại màu chữ lần nào nữa.
                          Chữ câu hỏi cùng tấm mới là 12.28:1 nên vẫn cách xa.
                          Thang sáng dần trên tấm MỚI: #77879c 4.13 · #7d8ea3 4.52 ·
                          #8394a9 4.88 · #8b9bb0 5.34 · **#94a3b8 5.90 (dùng từ 20/9/2026)**.
                          20/9/2026 — người dùng lại hỏi "chữ đáp án màu sáng hơn ở dark mode", nên lượt
                          này đi HAI nấc cho dứt: #8394a9 → **#94a3b8**. Đây ĐÚNG BẰNG `--text-dim`,
                          tức chữ đáp án giờ ở mức chữ phụ của app, và vẫn cách chữ câu hỏi
                          (#e2e8f0 = 12.28:1) một khoảng rõ nên cặp "câu hỏi / đáp án" không nhoè
                          vào nhau.
                          TRẦN: nấc tiếp theo (#a8b3c4 rồi tới trắng) làm đáp án ngang cỡ chữ câu hỏi
                          — mất luôn tương phản CỐ Ý giữa hai dòng. Muốn vượt #94a3b8 thì phải nói rõ
                          đánh đổi đó cho người dùng. */
  --q-text: #cbd5e1;   /* chữ CÂU HỎI ở chế độ tối. 20/9/2026 — hạ CÙNG nấc với `--text`
                          (#e2e8f0 → #cbd5e1). Hai token này là cùng MỘT vai trò "chữ chính", chỉ khác
                          chỗ dùng, nên lệch nấc là chữ câu hỏi sáng hơn mọi chữ khác trên màn và
                          đọc như lỗi. Trên tấm đáp án #262626: **12,28 → 10,0:1** — vẫn thừa xa 4,5:1
                          và vẫn cách `--answer` (#94a3b8) một khoảng rõ nên cặp câu hỏi/đáp án không nhoè.
                          Ở chế độ sáng là #1f2937 (xám RẤT ĐẬM) — đã đi qua hai nấc theo yêu cầu:
                          đen mặc định → xanh dương đậm #1e3a8a → xám đậm #1f2937.
                          Muốn đậm hơn nữa thì dùng #111827 (xám 900). */
  --set-box-bg: #262626;   /* nền hộp từng bộ đề — xám THUẦN ĐẬM ở chế độ tối (đổi từ #262a33
                              cùng lượt với --navy #171717 và tấm đáp án #262626, 19/9/2026),
                              xám nhạt ở chế độ sáng (body.light-mode đè lại) */
  --border: rgba(255,255,255,0.22);   /* viền ô ở chế độ tối: rõ hơn 0.08 cũ */
  /* Viền nút GHIM (📌) — TÍM, và ĐÂY LÀ LÝ DO NÓ KHÔNG CÒN XANH DƯƠNG (21/9/2026 —
     "tôi muốn nút ghim có màu khác để khỏi nhầm").
     Nút ghim từ 19/9/2026 dùng #3b82f6 (blue-500) để tách khỏi viền xám `--border` của mọi ô
     khác — nhưng Ô SỐ ngay BÊN PHẢI nó là #38bdf8 (sky-400, xem khối `.mix-input`) — tức HAI
     XANH NẰM CẠNH NHAU: một xanh là "ô nhập được", một xanh là "nút bấm được", mà ở cỡ 1px
     mắt không tách ra nổi nên bấm nhầm. ĐO của lượt này: ghim `rgb(59,130,246)` · ô số
     `rgba(56,189,248,0.55)` — chỉ cách nhau một nấc trên CÙNG một thang xanh.
     Chọn TÍM vì trong tệp này MỌI hệ màu đã mang nghĩa rồi, không được mượn lại:
       xanh lá (--ok, --green)   = đáp án ĐÚNG, và viền neon của `.set-dd-btn`
       đỏ (--red, --red-text)    = đáp án SAI
       vàng (--gold)             = CẢNH BÁO / "cập nhật" / tỷ lệ 50–79% (6 chỗ)
       xanh dương + cyan         = ô nhập và nút chính (--accent, --accent-glow, --mix-cyan)
     Tím chưa xuất hiện ở ĐÂU trong tệp (grep `#a78bfa|#8b5cf6|#7c3aed|#6d28d9|#c4b5fd|purple|
     violet`: 0 kết quả) nên nó không đè lên nghĩa nào — đó chính là điều kiện để dùng.
     ĐO TƯƠNG PHẢN, không đoán (đúng cách đã chọn #3b82f6 ngày trước):
       chế độ tối #a78bfa = **5,99:1** trên thẻ #202020 (bản xanh cũ 4,43:1) — lượt này ĐẬM HƠN,
         không yếu đi;
       KHÔNG lấy #8b5cf6 chỉ vì nó "cùng nấc blue-500": trên thẻ #202020 nó chỉ **3,85:1**,
         thấp hơn cả bản xanh cũ. Đây đúng cái bẫy ghi chú cũ về #1d4ed8 đã cảnh báo: chọn theo
         TÊN nấc thì sai, phải chọn theo SỐ ĐO;
       chế độ sáng #6d28d9 = **7,10:1** trên nền trắng (bản cũ #1d4ed8 = 6,70:1).
     Trỏ chuột dùng nấc tím riêng `--pin-brd-hover` (tối #c4b5fd = 8,82:1 · sáng #7c3aed =
     5,70:1) — hover PHẢI Ở LẠI trong họ TÍM. Đừng trả nó về `--accent-glow` như các nút khác:
     như vậy là vừa trỏ vào nút ghim nó đã hoá XANH lại, đúng lúc người dùng đang nhắm bấm.
     Dùng BIẾN chứ không viết luật `body.light-mode .mix-lock` riêng: luật đó có độ ưu tiên
     (0,2,1) nên sẽ đè mất cả `.mix-lock:hover` (0,2,0) ở chế độ sáng — mất luôn dấu khi trỏ chuột.
     HÀNG ĐANG GHIM (`.mix-lock.on`) CỐ Ý KHÔNG đổi ở lượt này: nó vẫn cyan cho đồng bộ với ô số
     theo yêu cầu 20/9/2026 ("đổi màu nền và viền ghim cho đồng bộ với màu nền viền số"). Nếu
     người dùng muốn lúc ghim cũng tím thì sửa ĐÚNG hai luật `.mix-lock.on` bên dưới. */
  --pin-brd: #a78bfa;
  --pin-brd-hover: #c4b5fd;
  /* ── TÊN cho các vai trò màu (20/9/2026 — "gom màu về biến") ───────────────────────
     Bảng màu dưới đây đã có biến từ trước, nhưng các LUẬT THÀNH PHẦN vẫn viết mã màu trần,
     vì chưa có TÊN cho những vai trò đó. Nhóm này chỉ ĐẶT TÊN — KHÔNG gộp màu nào lại,
     từng chữ số giữ nguyên.
     ĐỪNG GỘP: thang màu trong khối `body.light-mode` là kết quả ĐO TƯƠNG PHẢN chứ không phải
     chọn tuỳ hứng — `--border-answer` #96a2af = 2,60:1 (khớp ĐÚNG viền của chế độ tối),
     `--border-field` #b3bfcc = 1,87:1, `--surface-answer` #fafbfc chỉ hơn thẻ trắng 1,04:1,
     và `--ok-strong` #059669 = 3,77:1 vì `--green` #10b981 chỉ được 2,54:1 trên nền trắng.
     Gộp hai màu "trông gần giống nhau" ở đây là tự ý sửa lại công đo đó — đọc ghi chú ngay
     cạnh màu trước khi đổi, và đo lại cả HAI chế độ.
     Một chỗ KHÔNG token hoá được bằng `var()`: quầng `box-shadow` cần cùng màu nhưng khác
     alpha — `rgba(74,222,128,0.35)` chính là `--ok` ở 0,35. Đổi hex thì phải đổi cả rgba,
     đừng chỉ sửa một bên. */
  --on-accent: #ffffff;       /* chữ TRẮNG trên nền màu đặc: nút chính, huy hiệu, ô/hàng đang chọn */
  --header-from: #1d4ed8;     /* gradient header — đầu (chế độ sáng đè lại bằng #1e40af) */
  --header-deep: #1e3a8a;     /* gradient header — cuối (hai chế độ giống nhau) */
  --accent-deep: #1e40af;     /* xanh đậm làm MÀU CHỮ ở chế độ sáng (7,45:1 trên nền đã pha) */
  --ok: #4ade80;              /* viền nút bộ đề ở chế độ TỐI (9,36:1) */
  --ok-hover: #86efac;        /* viền nút bộ đề khi trỏ/bấm, chế độ tối */
  --ok-strong: var(--green);  /* viền đáp án ĐÚNG ở chế độ tối (chế độ sáng cần #059669) */
  --mix-cyan: #7dd3fc;        /* ô nhập tỷ lệ %: chữ + viền focus + đồng hồ khoá (3 chỗ, chế độ tốI) */
  /* ── HỆ CỠ CHỮ (20/9/2026 — "thêm hệ cỡ chữ") ──────────────────────────────────────
     Trước lượt này app chỉ có HAI nấc thấy được: 17px/500 và 15px/400 — mà 17px/500 bị dùng
     cho CẢ BA thứ cùng lúc: tiêu đề mục trong thẻ, MỌI nút, và từng hàng danh sách. Nên tiêu
     đề không phân biệt được với nút, và mắt không có chỗ nào để bám.
     Bậc thang từ đây: micro < tiny < note < sub < lead < base < head.
     `--fs-head` là nấc DUY NHẤT thực sự đổi kích thước ở lượt này (17px → 18px, kèm 500 → 600),
     và nó CHỈ áp cho 7 tiêu đề mục. Mọi token còn lại giữ ĐÚNG giá trị cũ đang dùng, nên phần
     lớn app không xê dịch một pixel.
     `.header-title` (tên app) CỐ Ý không dùng token nào ở đây: nó có luật responsive riêng
     (17px → 16px ở ≤380px, xem media query ở khu vực HEADER). Đổi nó là đổi ngưỡng vỡ dòng
     đã đo, nên để nguyên. */
  --fs-micro: 10px;           /* nút tăng/giảm ▲▼ của bảng trộn */
  --fs-tiny: 11px;            /* mũi tên ▾ của ô chọn bộ đề */
  --fs-note: 13px;            /* phụ chú nhỏ nhất */
  --fs-sub: 15px;             /* chữ phụ: dòng đếm, nhãn hàng, mô tả dưới tiêu đề */
  --fs-lead: 16px;            /* chữ nhấn 600 (đề bài / tiêu đề phụ) */
  --fs-base: 17px;            /* CHUẨN của app: nút, ô nhập, hàng danh sách, tên bộ đề */
  --fs-head: 18px;            /* tiêu đề MỤC trong thẻ — một nấc TRÊN --fs-base */
  --fw-body: 400;             /* chữ thường */
  --fw-ui: 500;               /* nút, hàng danh sách, tên bộ đề */
  --fw-head: 600;             /* chữ CẦN NHẤN trong câu hỏi (danh sách / màn xem lại).
                                 Tiêu đề mục KHÔNG dùng nấc này nữa: từ 20/9/2026 ("nét mỏng lại")
                                 tiêu đề mục dùng `--fw-ui` = 500, tức mỏng hơn một nấc. ĐỪNG đổi
                                 giá trị ở đây thành 500 — làm thế thì chữ câu hỏi mỏng theo, mà
                                 đó là thay đổi KHÔNG ai yêu cầu. */
  /* (Biến `--home-brd` của nút QUAY LẠI `.home-btn` đã bị XOÁ 20/9/2026 — "bỏ viền và cho icon to
     hơn": nút giờ KHÔNG có viền ở cả hai chế độ. Đừng dựng lại biến này; lịch sử dài của nó
     (viền xám 0,22 → 0,45 vì ngưỡng 3:1 của WCAG) nằm trong khối `.home-btn` bên dưới.) */
  --card: rgba(255,255,255,0.04);
  --radius: 12px;
  --header-h: 56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', sans-serif;
  font-size: var(--fs-base);   /* nền chung cho chữ không tự đặt cỡ, khớp mức +1px của cả app */
  background: var(--navy);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
  transition: background 0.4s ease, color 0.4s ease;
}

/* ── HEADER ───────────────────────── */
.header {
  background:
    linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0) 40%),
    linear-gradient(135deg, var(--header-from), var(--header-deep));
  border-bottom: 1px solid var(--border);
  box-shadow: 0 3px 10px rgba(0,0,0,0.35);
  height: calc(var(--header-h) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 10px 0 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
}
.header-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
.title-wrap { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
/* Tiêu đề app. Đổi thành "Ôn Tập Trắc Nghiệm" (20/9/2026) làm chữ dài thêm ~66px, nên phải có
   LƯỚI AN TOÀN: `white-space: nowrap` mà không có ellipsis thì ở màn hẹp chữ sẽ chồng lên đồng hồ
   (`#clockBtn` là `flex-shrink: 0` bên phải, không nhường chỗ). Giữ nowrap + ellipsis: chữ CHỈ bị
   rút gọn khi thật sự hết chỗ, còn ở bề rộng thường vẫn hiện đủ. `max-width:100%` để nó co theo
   `.title-wrap` (đã có `min-width: 0`). */
.header-title { font-size: var(--fs-base); font-weight: 500; letter-spacing: 0.3px; color: var(--on-accent); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.header-sub { font-size: var(--fs-sub); font-weight: 400; color: #cbd5e1; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
/* Màn HẸP: tiêu đề "Ôn Tập Trắc Nghiệm" (17px = 173px) cộng đồng hồ có dòng NGÀY (108px)
   cần ~361px bề ngang mới hiện ĐỦ (đo được: 18 lề + 44 nút sáng/tối + 6 + 173 chữ + 12 khe +
   108 đồng hồ). Dưới mức đó không thể đủ cả hai, nên từ 380px trở xuống nhường chỗ bằng hai thứ
   RẺ NHẤT — không đụng gì khác của header:
   - đồng hồ bỏ dòng NGÀY: 108px → **77,4px** (GIỜ vẫn hiện, và bấm `Xem đồng hồ` vẫn ra đủ ngày;
     `updateLiveClock()` chỉ ghi `textContent` nên ẩn bằng CSS là an toàn).
   - tiêu đề 17px → **16px**: 173px → 162,8px.
   Còn lại cần ~320px, nên từ ~320px trở lên chữ vẫn hiện ĐỦ; hẹp hơn nữa thì ellipsis của
   `.header-title` tự rút gọn — không bao giờ chồng lên đồng hồ. */
@media (max-width: 380px) {
  .header-title { font-size: var(--fs-lead); }
  #clockDateLive { display: none; }
}

/* Nút sáng/tối của header — 20/9/2026 "cho nút này nổi khối và đẹp hơn". Ba lớp cộng lại mới ra
   cảm giác NỔI, và cả ba đều chỉ dùng CSS — ảnh (data URI) KHÔNG bị đụng tới:
     1. BÓNG ĐỔ hai tầng: một lớp TIẾP XÚC sát viền + một lớp TOẢ rộng xuống dưới.
     2. Lớp GLOSS phủ trên ảnh: sáng ở trên-trái, tối dần xuống đáy => mặt cầu LỒI.
     3. Ánh viền (rim): cạnh trên sáng, cạnh dưới tối — đây là thứ khiến nó đọc ra "khối" chứ
        không phải "hình tròn dán phẳng".
   Bóng đặt bằng `filter: drop-shadow` trên `.theme-toggle img`, KHÔNG phải `box-shadow` trên nút:
   drop-shadow bám theo ALPHA của chính ảnh tròn, nên bóng cũng tròn và không lộ góc vuông — đúng
   lý do đã dùng cho `.home-btn svg` (xem ghi chú ở khu vực .home-btn).
   Hai tầng bóng chứ không một: một bóng đơn hoặc quá mờ (trông phẳng) hoặc quá đậm (trông như dán
   nổi trên nền, rời khỏi nút). Lớp tiếp xúc giữ nó "nằm trên" mặt header, lớp toả cho nó "nhấc lên".
   Header LUÔN nền xanh đậm ở cả hai theme (`#1d4ed8→#1e3a8a` tối, `#1e40af→#1e3a8a` sáng — xem
   `body.light-mode .header`), nên MỘT giá trị bóng dùng chung cho cả hai theme là đủ; khác với
   `.home-btn svg` phải tách alpha vì nút đó nằm trên nền sáng/tối thật. */
.theme-toggle {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  padding: 0;
  background: transparent;
  flex-shrink: 0;
}
.theme-toggle img {
  width: 100%; height: 100%;
  border-radius: 50%; object-fit: contain; display: block;
  filter: drop-shadow(0 1px 1.5px rgba(0,0,0,0.55)) drop-shadow(0 5px 7px rgba(0,0,0,0.38));
  transition: filter 70ms ease-out;
}
/* Gloss + rim. `::after` là CON GIẢ CUỐI của `.theme-toggle` nên vẽ ĐÈ lên `.theme-toggle img`
   (cả hai cùng ở tầng vẽ "positioned/stacking", `::after` đứng sau theo thứ tự cây DOM — `img`
   tuy thành stacking context vì có `filter`, nhưng vẫn trước `::after`). `pointer-events:none` để
   nó không ăn mất cú bấm; độ mờ để THẤP vì đây là lớp phủ trên một tia sét vàng — đậm hơn thì tia
   sét bạc màu và nút trông bóng nhẫy. */
.theme-toggle::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 50%;
  pointer-events: none;
  background:
    radial-gradient(circle at 34% 22%, rgba(255,255,255,0.50), rgba(255,255,255,0.13) 42%, rgba(255,255,255,0) 64%),
    linear-gradient(180deg, rgba(255,255,255,0) 56%, rgba(0,0,0,0.20) 100%);
  box-shadow:
    inset 0 1.5px 2px rgba(255,255,255,0.45),
    inset 0 -2.5px 4px rgba(0,0,0,0.26);
}
/* Nhấn XUỐNG như một phím thật — cùng ngôn ngữ đã dùng cho `.home-btn` ("> giữ cho tấm xanh nhún
   xuống khi bấm giữ"): `scale` nhỏ lại VÀ bóng NGẮN lại trong cùng một nhịp. Bóng ngắn đi mới là
   thứ bán được cảm giác "đi xuống" — chỉ thu nhỏ mà bóng vẫn dài thì trông như trượt ra xa.
   `.theme-toggle:active img` phải ghi rõ `img` vì bóng nằm trên chính thẻ ảnh, không phải trên nút. */
.theme-toggle:active { transform: scale(0.9); }
.theme-toggle:active img {
  filter: drop-shadow(0 0 1px rgba(0,0,0,0.60)) drop-shadow(0 2px 2px rgba(0,0,0,0.30));
}

.upload-btn-header {
  background: transparent; color: var(--on-accent); border: none;
  padding: 6px 10px; border-radius: 8px;
  cursor: pointer; display: flex; flex-direction: column;
  align-items: center; line-height: 1.1; gap: 0;
  font-family: 'Inter', sans-serif; flex-shrink: 0;
}
.upload-btn-header:active { background: rgba(203,213,225,0.4); }

/* ── MAIN ───────────────────────── */
.main { padding: 0 8px 60px; }

/* ── BUTTONS ───────────────────────── */
/* MỘT kiểu duy nhất cho CẢ BỐN nút lớn: nền xanh dương TRONG SUỐT + viền cùng màu chữ.
   20/9/2026 theo hai bước: "tôi muốn đổi nền xanh dương trong suốt" (nút 📦) rồi "cho ba nút xanh
   còn lại (Trộn & làm từng câu, hai nút Xem kết quả) dùng cùng kiểu nền xanh trong suốt cho đồng
   bộ" — đó là TẤT CẢ các chỗ dùng `.big-upload-btn`, nên kiểu này thuộc về LỚP GỐC chứ không còn
   là ngoại lệ của riêng `.lib-act`: một nguồn duy nhất, sửa một chỗ là cả bốn nút đổi theo.
   Chữ buộc phải đổi màu CÙNG LÚC với nền — trắng trên nền nhạt là mất chữ. Đo trên nền đã pha:
   tối rgb(37,50,71) + #60a5fa = **5,08:1**; sáng rgb(226,236,253) + #1d4ed8 = **7,33:1**. Viền
   cùng màu chữ: 6,41:1 trên thẻ #202020, 6,70:1 trên nền trắng (ngưỡng viền điều khiển là 3:1).
   ĐÁNH ĐỔI ĐÃ BIẾT: "🎲 Trộn & làm từng câu" và "🏁 Xem kết quả" là hành động CHÍNH của màn hình
   chúng, trước đây nền đặc nên chúng nổi nhất; giờ bốn nút cùng một hạng. Muốn nhấn mạnh lại thì
   là một yêu cầu riêng — đừng tự ý trả nền đặc cho một nút nào.
   Chế độ sáng khai ngay dưới: độ ưu tiên (0,2,1) cao hơn (0,1,0) nên thắng bất kể thứ tự. */
.big-upload-btn {
  padding: 12px 18px;
  border: 1px solid var(--accent-glow);
  border-radius: 10px;
  background: rgba(59,130,246,0.18);
  color: var(--accent-glow);
  font-family: 'Inter', sans-serif;
  font-size: var(--fs-base);
  font-weight: 500;
  cursor: pointer;
}
body.light-mode .big-upload-btn {
  background: rgba(59,130,246,0.14);
  border-color: var(--accent);
  color: var(--accent);
}
.big-upload-btn:active { opacity: 0.9; }
.big-upload-btn:disabled { opacity: 0.45; cursor: not-allowed; }
/* Hai nút dưới của bảng 🎲 (`📋 Trộn & làm cả bộ`, `📖 Trộn & học`) CHỈ HIỆN MÀU LÚC BẤM GIỮ
   (20/9/2026 — "tôi muốn khi chọn mới hiển thị màu").
   Lịch sử trong ngày, để không ai "khôi phục" nhầm: (1) hai nút này từng là `.quiz-btn` xám bình
   thường; (2) rồi được tô nền xanh trong suốt ở MỌI LÚC cho đồng bộ với nút 🎲; (3) giờ quay lại
   xám lúc nghỉ — nhưng khác bước (1) ở chỗ khi BẤM GIỮ thì hiện đúng màu xanh của nút 🎲.
   Nên lớp `mix-act` giờ CHỈ khai trạng thái `:active`, không khai gì cho lúc nghỉ: lúc nghỉ hai
   nút này rơi về `.quiz-btn` (nền trong suốt + viền `--border` + chữ `--text`) và
   `body.light-mode .quiz-btn` (nền trắng + chữ `#1e293b`).
   Nút 🎲 ở trên KHÔNG dùng lớp này nên vẫn xanh suốt — nó là nút chính của thẻ.
   Độ ưu tiên: `.quiz-btn.mix-act:active` = (0,3,0), mạnh hơn `body.light-mode .quiz-btn` (0,2,1),
   nhưng chế độ sáng vẫn PHẢI có luật riêng (0,4,1) để ra xanh ĐẬM thay vì xanh nhạt — nếu chỉ
   khai một luật thì chế độ sáng sẽ dùng màu của `--accent-glow` trên nền trắng (quá nhạt). */
.quiz-btn.mix-act:active {
  background: rgba(59, 130, 246, 0.18); border-color: var(--accent-glow); color: var(--accent-glow);
}
body.light-mode .quiz-btn.mix-act:active {
  background: rgba(59, 130, 246, 0.14); border-color: var(--accent); color: var(--accent);
}
/* Vòng focus CHỈ cho bàn phím (`:focus-visible`): nó không kích hoạt khi CHẠM trên điện thoại,
   nên không phá yêu cầu "chỉ hiện màu khi bấm giữ" — mà bàn phím vẫn thấy mình đang ở nút nào. */
.quiz-btn.mix-act:focus-visible { box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.45); }
body.light-mode .quiz-btn.mix-act:focus-visible { box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.35); }

.quiz-btn {
  padding: 9px 12px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--border); background: var(--navy-mid); color: var(--text);
  font-family: 'Inter', sans-serif; font-size: var(--fs-base); font-weight: 500;
}
.quiz-btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.quiz-btn.danger { background: var(--red); color: var(--on-accent); border-color: var(--red); }
.quiz-btn:active { opacity: 0.85; }
/* Nút điều hướng "Câu trước" bị TẮT ở câu đầu tiên (19/9/2026). Trước lượt này app chưa hề có
   nút .quiz-btn nào bị tắt, nên không có luật :disabled nào — thiếu nó thì nút trông y như bấm
   được, người dùng bấm mãi mà không hiểu sao không chạy. */
.quiz-btn:disabled { opacity: 0.45; cursor: default; }
/* Nút làm bài ĐANG ĐƯỢC CHỌN (focus) — đây là giá trị của CHẾ ĐỘ TỐI.
   Lịch sử trong ngày 19/9/2026: `.quiz-btn` trước đó KHÔNG hề có luật :focus nào, nên trình duyệt
   tự vẽ vòng focus mặc định (viền xám/đen) — và trên điện thoại `:focus` DÍNH LẠI sau khi chạm,
   nên nút vừa bấm mang một viền lạ cho tới khi chạm chỗ khác.
     → lượt 1: dùng `--accent` (#1d4ed8, xanh dương đậm) theo yêu cầu "khi chọn thì viền có màu
       xanh dương đậm". Đo ra ở tối chỉ **2,43:1** trên nền nút `#202020`.
     → lượt 2 (đang dùng): ở TỐI đổi sang `--accent-glow` (#60a5fa) — **6,41:1** trên cùng nền,
       gần gấp ba. Xanh dương đậm trên nền tối là thứ khó thấy về bản chất, không phải lỗi chọn nấc.
   Ở chế độ SÁNG vẫn giữ `--accent` — xem khối `body.light-mode .quiz-btn:focus` bên dưới.
   Vì cả hai chế độ giờ chỉ có MỘT màu focus cho mọi nút, luật riêng cho `.primary`/`.danger`
   ở chế độ tối đã bị xoá (nó trùng giá trị, để lại chỉ thành mã chết). Chế độ sáng VẪN cần luật
   riêng vì ở đó nút thường dùng màu đậm còn nút đặc dùng màu sáng.
   `outline: none` là BẮT BUỘC: không có nó thì vòng mặc định vẫn vẽ thêm một lớp nữa. */
.quiz-btn:focus { outline: none; border-color: var(--accent-glow); }

.quiz-toggle {
  padding: 7px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--text-dim);
  font-family: 'Inter', sans-serif; font-size: var(--fs-base); font-weight: 500;
}
/* Chip ĐANG BẬT — ĐẬM HƠN (19/9/2026 — "tôi muốn khi chọn có màu đậm hơn").
   Lịch sử nền: 0,14 → **0,32**; viền `--accent` (#1d4ed8, chỉ 2,43:1 trên thẻ #202020 — gần như
   chìm) → **`--accent-glow` #60a5fa (6,41:1)**.
   Chữ TRẮNG #ffffff (10,5:1) → XANH `#93c5fd` (20/9/2026 — "tôi muốn chữ xanh khi chọn ở dark
   mode") → **`--accent-glow` #60a5fa** (xem lượt đồng bộ ngay dưới).
   ĐỒNG BỘ VỚI NÚT 📦 THƯ VIỆN (20/9/2026 — "cho màu bảng này đồng bộ màu bảng thư viện"): chip
   đang bật lấy ĐÚNG cặp màu của `.big-upload-btn.lib-act` (nút 📦 Thư viện) theo từng chế độ —
   nền `0,32 → **0,18**` (tối) và `0,26 → **0,14**` (sáng), chữ `#93c5fd`/`#1e40af` →
   **`--accent-glow` #60a5fa** (tối) / **`#1d4ed8`** (sáng). Viền không đổi vì hai chỗ vốn đã cùng
   một giá trị.
   Nền nhạt hơn là điều kiện để chữ `#60a5fa` đọc được: ở alpha 0,32 nó chỉ 4,10:1, còn ở 0,18
   được **5,09:1** (tối) — đúng "nền và màu chữ phải đổi CÙNG NHAU" đã ghi ở trên.
   Chế độ sáng: nền 0,14 + `#1d4ed8` = **5,71:1** trên nền đã pha `rgb(228,238,254)`.
   Chip CHƯA bật không đụng tới (trong suốt + viền `--border` + chữ `--text-dim`).
   Muốn quay lại nền đậm thì phải đi cùng chữ sáng hơn, đo lại chứ đừng đổi alpha một mình. */
.quiz-toggle.on { background: rgba(59,130,246,0.18); border-color: var(--accent-glow); color: var(--accent-glow); }

/* Hai chip bật/tắt trên trang chủ nằm CHUNG MỘT HÀNG.
   Đo bằng canvas ở cỡ 17px: “Đảo câu hỏi” 96.3px, “Đảo đáp án” 92.2px. Cộng
   padding 8px mỗi bên và gap 8px thì cần 228.5px — vừa khung nhìn 311px (thẻ
   rộng 266px). Bản cũ “Đảo câu hỏi: Bật” + “Đảo đáp án: Bật” cần 309px nên mỗi
   cái phải xuống một hàng; thêm icon 🔀 còn tốn thêm ~56px nữa.
   `auto-fit` + `minmax(120px, 1fr)` cho hai cột BẰNG NHAU khi đủ chỗ, và tự dồn
   thành một cột khi cửa sổ hẹp hơn ~248px — không bao giờ tràn chữ. */
.chip-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px; margin-top: 8px;
}
.quiz-toggle.chip { padding: 7px 8px; text-align: center; }

/* Hàng nút thư viện trên trang chủ — KHÔNG còn dùng ở trang chủ từ 19/9/2026 (nút 📦 đã chuyển
   vào hàng `.lib-head`, xem ngay dưới). Giữ lại lớp này vì lịch sử lớp `.lib-act` gắn với nó;
   đừng “khôi phục” bằng cách bọc nút vào `.lib-act-row` trở lại.
   Trước 18/9/2026 hàng này có BA nút (Chọn file /
   Thư mục / Thư viện) và phải đo bằng canvas ở cửa sổ 311px mới vừa: cả ba nhãn đầy
   đủ cần 294px trong khi thẻ chỉ có 265px, nên nhãn phải rút ngắn và thử cả
   `flex: 1 1 0` (làm "Chọn thư mục" bị bẻ 3 dòng). Hai nút đầu đã bỏ theo yêu cầu —
   còn đúng một nút mở bảng 📦, `.lib-act` bên dưới giờ chỉ giữ cỡ nút ổn định.
   `flex: 1 1 auto` (không phải `1 1 0`) để bề ngang thả theo nội dung; `flex-wrap:
   wrap` là lưới an toàn cho cửa sổ hẹp hơn nữa — nút cuối xuống hàng dưới chứ
   KHÔNG bị cắt chữ (đừng dùng `white-space: nowrap`: nó tràn chữ ra ngoài nút
   ngay khi flex phải co lại).
   Không emoji trong ba nhãn: “📁 ” chiếm 28px, đủ đẩy tổng vượt 265px.
   `width:auto` để thắng `width:100%` của .big-upload-btn, và lớp này đặt sau nên
   đè được padding 12px 18px của nút đó. */
.lib-act {
  flex: 1 1 auto; min-width: 0; width: auto;
  padding: 9px 5px;
  text-align: center;
}
.lib-act-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
/* Nút 📦 nằm KẾ tiêu đề "📚 Thư viện bộ đề" (19/9/2026 — "tôi muốn tab thư viện nằm kế thư viện
   bộ đề"): trước đó nút chiếm TRỌN một hàng riêng bên dưới hai dòng chữ, làm thẻ cao thêm ~53px.
   Giờ hai dòng chữ và nút nằm trong CÙNG một hàng flex: chữ bên trái, nút bên phải.
   `min-width: 0` trên khối chữ là BẮT BUỘC — thiếu nó thì cột chữ không chịu co, nó đẩy nút tràn
   ra ngoài thẻ khi dòng "18 bộ đề · 643 câu hỏi" dài ra. */
.lib-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lib-head-text { min-width: 0; }
/* Nút trong hàng này chỉ rộng bằng nội dung: `.lib-act` gốc có `flex: 1 1 auto` (để nó lấp đầy
   hàng khi đứng một mình) nên phải tắt dãn ở đây. Lề ngang 18px → 11px cho vừa hàng hẹp; chiều
   cao giữ 12px trên/dưới của `.big-upload-btn` để nút cao ≈ 45px, đúng bằng hai dòng chữ cạnh nó. */
.lib-head .lib-act { flex: 0 0 auto; padding: 12px 11px; }
/* Nút 📦 CẦN BÙ PADDING — và chỉ nó, vì nó là nút DUY NHẤT rộng theo nội dung (ba nút kia
   `width:100%`). Viền 1px ở lớp gốc làm `box-sizing: border-box` KHÔNG cứu được (chỉ ăn khi phần
   tử có width/height ĐẶT SẴN), nên viền cộng 2px vào cả rộng lẫn cao (46,3 → 48,3px) và phá thế
   canh cao bằng hai dòng chữ bên cạnh. 12/11 → **11/10** giữ nguyên cỡ: đo lại được
   **120,2 × 45,8** so với 120,7 × 46,3 trước đó, chênh đúng phần viền bị làm tròn dưới 1 điểm ảnh.
   Phải đứng SAU `.lib-head .lib-act` (cùng độ ưu tiên 0,2,0) — luật `padding: 12px 11px` ở đó sẽ
   thắng nếu luật này bị đặt trước. */
.big-upload-btn.lib-act { padding: 11px 10px; }

/* ── QUIZ ───────────────────────── */
/* Lề giữa các bảng trên trang chủ, siết 19/9/2026 ("khoảng cách các bảng này nhỏ lại"):
   chủ yếu là PADDING chứ không phải margin — nhìn vào khe giữa hai thẻ là thấy 10px lề
   trong + 5px margin + 10px lề trong, nên chỉ hạ margin thì gần như không đổi. Đây là chỗ
   NGƯỢC với thanh dính (thanh dính siết để đỡ che nội dung, còn ở đây chỉ để đỡ trống). */
.quiz-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px; margin: 5px 0;
}
.quiz-input {
  width: 100%; padding: 10px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--navy-mid);
  color: var(--text); font-family: 'Inter', sans-serif; font-size: var(--fs-base); font-weight: 500;
}
.quiz-input:focus { outline: none; border-color: var(--accent); }
/* ── DROPDOWN CHỌN BỘ ĐỀ: TỰ VẼ (19/9/2026) ───────────────────────────────────────
   TRƯỚC ĐÂY LÀ `<select>` GỐC. Lý do đổi: người dùng muốn "thêm kẻ ngang chia các hàng" trong
   danh sách, nhưng bảng xổ xuống của `<select>` do TRÌNH DUYỆT vẽ nên KHÔNG nhận CSS của trang —
   không có cách nào đặt kẻ giữa các `<option>`. Ô chọn giờ là `<button>` + danh sách `<button>`.
   Kích thước giữ Y HỆT ô select cũ (nó vốn lấy từ `.quiz-input`: padding 10px, radius 10px,
   border 1,5px) nên thẻ không nhảy bố cục.
   Viền NEON giữ NGUYÊN cách dựng: hai lần viền — 1px lằn ngoài + quầng toả — cho cảm giác dày mà
   KHÔNG phải tăng border-width (tăng border sẽ nhảy bố cục 0,5px).
   Màu đổi sang XANH LÁ NEON (yêu cầu 20/9/2026 — "đổi sang viền xanh lá neon"); trước đó là xanh
   dương neon #38bdf8 (tối) / #0ea5e9 (sáng).
   Cặp màu chọn theo ĐÚNG cách cặp xanh dương trước đây: chế độ TỐI cần màu SÁNG mới gọi là neon —
   #4ade80 = **9,36:1** trên nền tối (đủ để quầng toả đọc ra như ánh sáng); chế độ SÁNG dùng màu
   ĐẬM hơn — #16a34a = **3,28:1** trên nền trắng, vượt ngưỡng 3:1 của WCAG cho viền điều khiển
   (nhạt hơn nữa thì tan vào nền trắng y như #38bdf8 từng bị).
   QUẦNG TOẢ ĐÃ HẠ (20/9/2026 — "cho viền đổ bóng ít lại"): lằn ngoài 1px giữ nguyên (nó làm viền
   dày lên chứ không toả), còn quầng mờ giảm mạnh — tối 10px/0,45 → **6px/0,25**, sáng 9px/0,35 →
   **5px/0,20**; lằn ngoài 0,55 → 0,35 (tối) và 0,5 → 0,30 (sáng). Trạng thái trỏ chuột cũng hạ
   theo (15px/0,65 → 9px/0,40 và 13px/0,55 → 8px/0,35) để nó vẫn "sáng hơn lúc nghỉ" nhưng không
   thành vệt sáng. Màu viền KHÔNG đổi — chỉ độ toả đổi.
   Lịch sử quy ước: app TỪNG có "xanh lá = đã ghim" (.mix-lock.on #34d399 / #166534) nhưng nút
   ghim đã chuyển sang cặp cyan `--mix-cyan` cho đồng bộ với Ô SỐ (20/9/2026), nên xanh lá giờ
   chỉ còn mang nghĩa "đáp án đúng". Đó cũng là lý do ĐỪNG dùng lại #34d399 ở đây. */
.set-dd { position: relative; }
.set-dd-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  text-align: left; cursor: pointer;
  padding: 10px; border-radius: 10px; border: 1.5px solid var(--ok);
  background: var(--navy-mid); color: var(--text);
  /* Cỡ 17px (19/9/2026 — "tôi muốn tất cả chữ này cỡ 17px", ảnh người dùng khoanh cả nút
     dropdown). Trước đó 15px (bản gốc) → 16px (một lượt trước trong ngày) → 17px. */
  font-family: 'Inter', sans-serif; font-size: var(--fs-base); font-weight: 500;
  box-shadow: 0 0 0 1px rgba(74, 222, 128, 0.35), 0 0 6px rgba(74, 222, 128, 0.25);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.set-dd-btn:hover, .set-dd-btn:focus {
  outline: none; border-color: var(--ok-hover);
  box-shadow: 0 0 0 1px rgba(134, 239, 172, 0.6), 0 0 9px rgba(74, 222, 128, 0.4);
}
/* Nhóm NHÃN + ICON của nút mở (19/9/2026 — "tôi muốn có icon ở bảng này"). Bọc trong một
   flex con vì nút dùng `justify-content: space-between`: không bọc thì icon bị đẩy ra mép trái
   còn tên bộ rơi xuống giữa nút.
   `min-width: 0` trên nhóm là BẮT BUỘC — không có nó, nhóm flex không chịu co xuống dưới bề ngang
   nội tại của chữ nên tên bộ dài sẽ tràn khỏi nút ở màn hẹp thay vì xuống dòng.
   `flex: none` trên icon để tên bộ xuống 2 dòng mà icon không bị bóp méo. */
.set-dd-lbl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.set-dd-ico { flex: none; font-size: var(--fs-base); line-height: 1; }
/* Mũi tên TỰ VẼ: <select> gốc tự có mũi tên của trình duyệt, <button> thì không. Quay 180° khi mở
   để trạng thái đóng/mở đọc được ngay cả khi danh sách bị che một phần. */
.set-dd-caret { flex: none; font-size: var(--fs-tiny); line-height: 1; transition: transform 0.15s; }
.set-dd.open .set-dd-caret { transform: rotate(180deg); }
/* Danh sách xổ ra NẰM ĐÈ lên nội dung bên dưới (position:absolute) chứ không đẩy trang xuống —
   đẩy sẽ làm cả thẻ nhảy mỗi lần mở. Thẻ `.quiz-card` không đặt `overflow` và không tạo stacking
   context nên danh sách không bị cắt; `z-index` để cao hơn thanh dính của màn làm bài. */
.set-dd-list {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 40;
  max-height: 280px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--navy-mid); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
}
.set-dd-list[hidden] { display: none; }
/* ── ĐƯỜNG KẺ NGANG CHIA CÁC HÀNG (yêu cầu 19/9/2026 — "thêm kẻ ngang chia các hàng") ──
   Đây chính là thứ không thể làm được với `<select>`. Dùng CÙNG cách với bảng 🎲 Trộn đề:
   kẻ ở TRÊN mỗi hàng, hàng đầu bỏ kẻ → chỉ cần một luật `:first-child`, không phải xử lý hàng cuối. */
.set-dd-item {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 9px 11px; border: 0; border-top: 1px solid var(--border);
  background: none; color: var(--text);
  /* 17px, ĐI CÙNG nút mở: nhãn nút và nhãn hàng là cùng một chuỗi "Tên (N câu)" nên lệch
     nhau 1px là thấy ngay khi mở bảng (19/9/2026 — "tất cả chữ này cỡ 17px"). */
  font-family: 'Inter', sans-serif; font-size: var(--fs-base); font-weight: 500;
}
.set-dd-item:first-child { border-top: 0; }
.set-dd-item:hover { background: rgba(127, 127, 127, 0.18); }
/* Hàng ĐANG CHỌN: nền xanh đặc + chữ trắng, đúng quy ước "ô đang chọn" của `.quiz-btn.primary`. */
.set-dd-item.on { background: var(--accent); color: var(--on-accent); }
/* Chữ của cả nút và danh sách là ĐEN ở chế độ sáng (19/9/2026 — "đổi chữ màu đen ở dropdow light
   mode"). Trước đó cả hai chỗ lấy `var(--text)` = #e2e8f0 — màu chỉ tồn tại trong `:root` (chế độ
   tối), còn `body.light-mode` KHÔNG ghi đè `--text`, nên ở chế độ sáng chữ trắng-xám nằm trên nền
   sáng: nút gần như trống chữ. Đây là lỗi thật đã thấy trong ảnh người dùng gửi, không phải cảm
   nhận. Đen là màu chữ nền của `body.light-mode` nên khớp cả app. */
body.light-mode .set-dd-btn {
  background: var(--surface-sunken); border-color: var(--ok); color: var(--text-base);
  box-shadow: 0 0 0 1px rgba(22, 163, 74, 0.3), 0 0 5px rgba(22, 163, 74, 0.2);
}
body.light-mode .set-dd-btn:hover, body.light-mode .set-dd-btn:focus {
  border-color: var(--ok-hover);
  box-shadow: 0 0 0 1px rgba(21, 128, 61, 0.55), 0 0 8px rgba(22, 163, 74, 0.35);
}
/* Bảng xổ ở CHẾ ĐỘ SÁNG dùng #e9ecef = nền trang, đúng màu bảng xổ của `<select>` cũ. */
body.light-mode .set-dd-list { background: var(--surface-sunken); border-color: var(--border-light); }
body.light-mode .set-dd-item { color: var(--text-base); }
body.light-mode .set-dd-item:hover { background: rgba(0, 0, 0, 0.06); }
/* Phải khai báo LẠI ở đây: `body.light-mode .set-dd-item` là (0,2,1) còn `.set-dd-item.on` chỉ
   (0,2,0) nên luật chế độ sáng sẽ ĐÈ MẤT nền xanh của hàng đang chọn. Cùng họ bẫy specificity
   đã ghi ở mục `.quiz-opt` — luật `body.light-mode .<x>` luôn thắng luật trạng thái. */
body.light-mode .set-dd-item.on { background: var(--accent); color: var(--on-accent); }
.quiz-opt {
  display: flex; align-items: flex-start; gap: 8px; width: 100%;
  text-align: left; padding: 9px; margin-bottom: 6px;
  border-radius: 10px;
  /* ── VIỀN Ô ĐÁP ÁN — CỐ Ý MẠNH HƠN MỌI Ô KHÁC (19/9/2026: "làm cho tấm đáp án nổi rõ bằng cách
     định hình bằng VIỀN thay vì hạ nền"). Lý do: nền đã hết dư địa — tấm ở chế độ sáng chỉ còn
     1,04:1 và ở chế độ tối 1,08:1, gần như KHÔNG còn gánh việc định hình. Viền mới là thứ cho
     người dùng thấy mỗi ô đáp án bắt đầu và kết thúc ở đâu.
     Vì thế chỗ này KHÔNG dùng `var(--border)` (0,22) như thẻ/nút/ô nhập nữa — 0,29 là cố ý đậm
     hơn để ô đáp án nổi hơn phần còn lại. ĐỪNG "thống nhất lại cho khớp" với --border.
     Độ dày 1,5px → **2px**, và HAI CHẾ ĐỘ ĐƯỢC KHỚP TỈ LỆ với nhau (giải ngược từ mục tiêu
     2,60:1 so với nền thẻ bao quanh, chứ không chọn bằng mắt):
       dark  rgba(255,255,255,0.29) trên thẻ #202020 → #606060 → **2,60:1**
       light #96a2af trên thẻ #ffffff (đè lại bằng luật body.light-mode bên dưới) → **2,60:1**
     Trước lượt này hai bên còn lệch nhau và đều nhạt: light #b3bfcc 1,87:1 · dark 0,22 → 2,05:1.
     Muốn đậm nữa thì dùng nấc sẵn có — thang đo trên đúng nền thẻ tương ứng:
       light #8e9cad 2,80:1 · #8794a5 3,08:1 · #7f8d9f 3,38:1
       dark  alpha 0,34 → 3,10:1 · 0,42 → 4,01:1 · 0,46 → 4,54:1
     Đáp án ĐÚNG/SAI vẫn đè viền này bằng --green/--red (chỉ đổi MÀU, không đổi độ dày). */
  border: 2px solid rgba(255,255,255,0.29);
  /* Nền ô đáp án ở CHẾ ĐỘ TỐI = XÁM ĐEN. Lịch sử 19/9/2026 (nền thẻ luôn là #1a1d24):
       var(--navy-mid) #1a1d24 → TRÙNG KHÍT nền thẻ (đo được 1.00:1) nên đáp án KHÔNG thành
         một tấm riêng, khác hẳn chế độ sáng nơi hộp xám nằm trên thẻ trắng
     → #262a33  (tấm/thẻ 1.17:1, đúng bằng --set-box-bg của hộp bộ đề ở trang chủ)
     → #2c323d  ("nhạt hơn 1 tí", tấm/thẻ 1.31:1)
     → **#21252e** ("đậm hơn", tấm/thẻ 1.10:1) — giờ KHÔNG còn bằng --set-box-bg nữa.
     Vì sao chọn #21252e chứ không lùi đúng một bước về #262a33: nền đậm lên thì chữ đáp án
     ĐỠ chìm, nên nấc này kéo #7d8ea3 từ 3.84:1 về **4.58:1** — vượt lại ngưỡng 4.5:1.
     CẢNH BÁO: tấm/thẻ chỉ còn 1.10:1. Đậm thêm nữa là tấm biến mất (#1e222b = 1.06:1,
     và #1a1d24 = 1.00:1 chính là lúc nó hoà hẳn vào thẻ).
     → **#262626** (19/9/2026 — "bảng màu xám thuần": cả dải tối bỏ hẳn sắc XANH, xám thuần
       R = G = B. Tấm này lấy ĐÚNG màu tấm trong ảnh mẫu, và trùng lại với --set-box-bg).
       Tấm/thẻ = 1.08:1; chữ đáp án #8394a9 trên tấm mới = **4.88:1** — vẫn trên ngưỡng 4.5:1.
     Chế độ sáng đè lại bằng luật body.light-mode .quiz-opt ngay bên dưới. */
  background: #262626; color: var(--answer);
  font-family: 'Inter', sans-serif; font-size: var(--fs-lead); line-height: 1.5;
  font-weight: 500;   /* câu trả lời: 16px, nét 500 */
  cursor: pointer;
}
.quiz-opt:disabled { cursor: default; }
/* ── TRẠNG THÁI ĐÚNG/SAI — đo lại toàn bộ 19/9/2026 ("kiểm và chỉnh tương phản cho trạng thái
   đáp án ĐÚNG/SAI ở cả hai chế độ, cả khi chọn sai thì đáp án đúng có còn nổi bật không").
   Hai LỖI THẬT tìm được khi đo (không phải cảm nhận):
     (1) Ở chế độ SÁNG, viền "đúng" #10b981 chỉ đạt **2,54:1 — YẾU HƠN viền ô bình thường**
         (#96a2af = 2,60:1). Nghĩa là đáp án ĐÚNG được viền MỜ HƠN một ô chưa trả lời. Sửa ở
         khối body.light-mode bên dưới.
     (2) Chữ đáp án trên nền tint thấp hơn ngưỡng 4,5:1: dark "đúng" 4,12:1 và light "sai"
         4,45:1 → hạ độ đậm của tint (xem từng dòng ngay dưới).
   QUY TẮC cho mọi lần chỉnh sau: (a) viền trạng thái PHẢI mạnh hơn viền bình thường 2,60:1,
   (b) chữ đáp án trên nền tint PHẢI ≥ 4,5:1, (c) LIGHT cần màu ĐẬM hơn dark để nổi trên nền
   trắng — nên hai chế độ KHÔNG dùng chung một mã màu cho trạng thái. */
.quiz-opt.correct { border-color: var(--green); background: rgba(16,185,129,0.10); }
/* Tint 0,15 → 0,10: chữ đáp án #8394a9 trên nền tint đi từ 4,12:1 (DƯỚI ngưỡng) → **4,53:1**.
   Viền --green #10b981 trên nền tối vốn rất mạnh (6,42:1) nên vẫn là tín hiệu chính; nền có
   nhạt đi một chút (tint/thẻ 1,27 → 1,16) nhưng vẫn thấy rõ là một tấm xanh khác các ô còn lại. */
.quiz-opt.wrong { border-color: var(--red); background: rgba(239,68,68,0.12); }
/* Tint 0,15 → 0,12: chữ 4,51:1 → **4,67:1** — 4,51 là sát ngưỡng nên lấy khoảng an toàn hơn. */
.quiz-badge {
  min-width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: var(--on-accent);
  font-size: var(--fs-note); font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.quiz-opt .mark { font-size: var(--fs-lead); line-height: 1.2; flex-shrink: 0; }
/* Số câu đặt trước nội dung câu hỏi. Thay icon ❓ emoji ở lượt trước: emoji rộng
   19px mà không mang thông tin gì, còn vòng tròn mang luôn SỐ CÂU nên bỏ được dòng
   nhãn “Câu 1/30” trên mỗi thẻ — trang ngắn hơn hẳn.
   Kiểu: KHÔNG có nền, chỉ một viền đỏ mảnh + số màu đỏ (yêu cầu người dùng — trước
   đó là nền xanh đặc như huy hiệu A/B/C/D). Vì không còn nền nên viền phải là
   `1px solid` chứ không phải nền mờ, nếu không số sẽ trôi trên nền thẻ.
   Dài ra thành viên thuốc khi số có 2-3 chữ số: bài trộn mặc định 100 câu nên
   “100” phải vừa.
   Cỡ số 13px trên vòng 20px (người dùng thấy 12px hơi nhỏ). Vòng chỉ tăng 1px vì
   bề ngang của vòng chính là bề ngang câu hỏi bị lấy đi — đo trên bộ 30 câu: tổng
   số dòng phải xuống thêm không đổi so với vòng 19px. `margin-top: 2px` giữ số
   nằm giữa dòng chữ đầu (hộp 20px trong dòng 24px). */
.q-num {
  min-width: 20px; height: 20px; border-radius: 10px; padding: 0 5px;
  box-sizing: border-box; background: transparent;
  border: 1px solid var(--red); color: var(--red);
  font-size: var(--fs-note); font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px;
}
.quiz-fb {
  display: none; margin-top: 5px; padding: 8px 10px;
  border-radius: 10px; font-size: var(--fs-lead); line-height: 1.5;
}
.quiz-fb.show { display: block; }
.quiz-fb.ok { background: rgba(16,185,129,0.14); border: 1px solid var(--green); }
.quiz-fb.no { background: rgba(239,68,68,0.14); border: 1px solid var(--red); }
/* Chọn SAI thì KHÔNG còn hộp đỏ "Chưa đúng" (19/9/2026 — "tôi chỉ muốn bỏ bảng chưa đúng").
   Vẫn dùng đúng thẻ div đó (JS chỉ đổi class, không phải sửa chỗ nào khác) nhưng bỏ nền, viền
   và lề trong — còn lại một dòng chữ nêu ĐÁP ÁN ĐÚNG, thứ người dùng yêu cầu khôi phục.
   KHÔNG gắn class 'no' cùng lúc với 'plain': body.light-mode .quiz-fb.no (0,3,0) sẽ thắng
   .quiz-fb.plain (0,2,0) và hộp đỏ quay lại ở chế độ sáng. */
.quiz-fb.plain { background: none; border: none; padding: 0; }
.quiz-all-head {
  position: sticky; z-index: 5;
  top: calc(var(--header-h) + env(safe-area-inset-top, 0px));
  /* Nền ĐỤC là bắt buộc vì đây là thanh DÍNH: câu hỏi và đáp án cuộn qua bên dưới.
     `.quiz-card` cho nền `--card` = rgba(255,255,255,0.04) — đúng cho thẻ thường,
     nhưng ở thanh dính thì 96% trong suốt nên chữ cuộn qua hiện xuyên lên, đè cả
     tiêu đề bộ đề lẫn dòng “Đã trả lời… · Đúng… · Sai…”. Chỉ chế độ tối bị, vì
     `body.light-mode .quiz-card` (độ ưu tiên cao hơn) đã đặt #ffffff đục sẵn.
     --navy-mid (#202020) chính là --navy (#171717) hoà 4% trắng — đúng cái mà
     rgba(255,255,255,0.04) đang cho ra trên nền trang, nhưng ĐỤC. */
  background: var(--navy-mid);
  /* GỌN: đây là thanh DÍNH, mỗi px chiều cao là một px nội dung bị che, nên padding
     riêng cho nó nhỏ hơn thẻ thường (7px 10px thay vì 11px). Đo ở khung 468px:
     78px → 63px (−19%). Kèm theo: khe tiêu đề ↔ dòng điểm 6px → 3px và nút 🏠
     padding 6px 9px → 4px 8px (khi đó nút còn 41×26).
     SAU ĐÓ (cùng ngày) nút 🏠 được làm TO LÊN theo yêu cầu — xem khối `.home-btn`
     ở trên: nút 62×45 nên thanh này cao lại 63px → 82px khi tiêu đề một dòng. */
  padding: 7px 10px;
}

/* ── ĐẦU MÀN LÀM BÀI ─────────────────
   Hàng đầu của mọi màn làm bài: nút về trang chủ + tiêu đề bộ đề.
   Nút nằm BÊN TRÁI HÀNG TIÊU ĐỀ — vị trí chuẩn của nút quay lại, và cũng là chỗ
   rẻ nhất về chiều cao. Ba phương án đã đo ở khung nhìn 393px (thẻ 349px):
   - Cạnh tiêu đề (đang dùng): ô tiêu đề còn 298px. Tiêu đề ngắn (“Văn hóa doanh
     nghiệp · 30 câu” 253px) vẫn một dòng; vài tên dài thêm một dòng.
   - Cạnh dòng tóm tắt: tiêu đề giữ nguyên, nhưng ở khung nhìn 311px dòng tóm tắt
     “Đã trả lời … · Đúng … · Sai …” cần 218.5px + nút 51px = 269px mà chỉ có
     249px → tóm tắt bị ngắt thành hai dòng, xấu hơn ngắt tiêu đề.
   - Hàng riêng cho nút: đầu bài cao thêm ~30px ở mọi bề ngang.
   Nút chỉ dùng emoji 🏠 (23px chữ): nhãn “Trang chủ” cần 103px + padding, đủ để
   ngốn thêm 80px bề ngang của tiêu đề.
   ⚠️ KẾT LUẬN TRÊN ĐÃ BỊ NGƯỜI DÙNG ĐẢO NGƯỢC (20/9/2026 — “bỏ icon ở hai nút quay về còn lại …
   cho đồng bộ với nút Về trang chủ”): nút giờ là CHỮ và đúng là ngốn thêm ~77px của tiêu đề
   (đo: tiêu đề còn 221,9px thay vì 299,4px). Chiều cao thì KHÔNG đổi vì font đã hạ 20px → 17px.
   Đừng “tối ưu” ngược lại thành icon — đó là yêu cầu, không phải sót. */
.head-row { display: flex; align-items: center; gap: 8px; }
/* Nút về trang chủ đã được làm TO hơn (yêu cầu 18/9/2026: “cho nút quay lại màn
   hình chính to hơn”). Trước đó nó bị thu nhỏ xuống 4px 8px chính vì lý do ngược lại
   — xem khối .quiz-all-head bên dưới: đây là thứ QUYẾT ĐỊNH chiều cao hàng đầu bài.
   Đo ở khung 468px, tiêu đề ngắn “Chuẩn mực đạo đức · 10 câu” (một dòng, 21px):

   | font/padding        | nút     | thanh dính |
   |---------------------|---------|------------|
   | 17px 4px 8px (cũ)   | 41×26   | 63px       |
   | 22px 6px 11px       | 54×35   | 72px       |
   | **24px 10px 14px**  | **62×45** | **82px** |
   | 28px 8px 14px       | 68×45   | 82px       |

   Chọn dòng in đậm ban đầu, rồi GIẢM xuống ("cho icon quay lại nhỏ hơn 1 tí", 19/9/2026):
   font 24px → 20px, padding 10/14 → 7/11 → nút **48×34**. Vẫn lớn hơn bản gốc 41×26,
   vẫn trên ngưỡng chạm WCAG 24×24, và thanh dính hạ xuống **74px** (từ 82).*/
.home-btn {
  /* ICON SVG, không chữ (20/9/2026 — xem `homeIcoSvg`).
     KHÔNG VIỀN + icon 32px (20/9/2026 — "bỏ viền và cho icon to hơn", rồi "cho nút to hơn 1 tí"):
     bỏ hẳn viền (trước là `--home-brd` = trắng 0,45 — biến đó đã xoá) và icon 22 → 28 → **32px**.
     Padding hạ 5px 12px → 3px 6px → **1px 4px** nên kích thước NÚT vẫn ĐÚNG **40 × 34px** như bản
     48×34 trước đó — tức thanh dính KHÔNG cao thêm px nào, bề ngang tiêu đề cũng không hụt thêm:
     icon lớn lên 4px thì padding nhỏ đi 4px, phần hộp giữ nguyên. Điểm chạm 40×34 vẫn trên ngưỡng
     24×24 của WCAG.
     `inline-flex` để icon luôn nằm giữa và không bị `line-height` của nút đẩy lệch — SVG là phần
     tử inline nên nếu để mặc định sẽ thừa một khoảng trắng dưới đáy. */
  padding: 1px 4px; flex-shrink: 0; border: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
/* Hiệu ứng NỔI KHỐI (20/9/2026 — "thêm hiệu ứng nổi khối"): bóng đổ đặt trên chính `<svg>`, KHÔNG
   phải trên nút — hai lý do:
   1. `box-shadow` của nút đã dùng cho VÒNG FOCUS (`.home-btn:focus-visible` ở dưới); đặt bóng đổ
      lên nút thì lúc focus sẽ bị luật sau GHI ĐÈ MẤT bóng.
   2. `filter: drop-shadow()` bám theo HÌNH DẠNG THẬT của tấm (đã bo góc 5,5) — còn `box-shadow`
      trên `<svg>` vẽ ra một bóng HÌNH CHỮ NHẬT, bốn góc vuông lòi ra ngoài tấm bo góc.
   Bóng nhẹ (2px, alpha 0,45) để đọc ra "nổi" mà không thành vệt loang — đúng bài học từ quầng sáng
   của nút ghim đã phải hạ hai lần. Chế độ sáng dùng alpha thấp hơn vì nền sáng ăn bóng mạnh hơn. */
.home-btn svg {
  display: block; width: 32px; height: 32px;
  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45));
  /* 70ms là mức "tức thì nhưng không giật": dài hơn thì cảm giác bị trễ tay, ngắn hơn thì tấm
     nhảy cứng. Áp cho cả lúc NHẢ (tấm nổi lại) nên cú bấm có vào có ra, không phải bật/tắt. */
  transition: transform 70ms ease-out, filter 70ms ease-out;
}
body.light-mode .home-btn svg { filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.22)); }
/* NHÚN XUỐNG KHI BẤM GIỮ (20/9/2026 — "thêm phản hồi xúc giác"): tấm xanh tụt xuống 2px và bóng
   thu lại còn 1px — đúng cách một phím thật ăn xuống mặt bàn (vật đi xuống thì bóng ngắn lại).
   CHỈ `transform` trên `<svg>`, KHÔNG đụng kích thước nút: transform không tham gia vào layout nên
   hàng và các nút xung quanh không nhích một px nào (đây là điều kiện của yêu cầu "giữ nguyên
   kích cỡ"). Tấm tụt xuống dưới đáy nút 2px nhưng không bị cắt: tổ tiên của nút không đặt
   `overflow:hidden` (đã kiểm trên trang thật — xem run doc).
   `opacity: 1` là BẮT BUỘC: `.quiz-btn:active { opacity: 0.85 }` (0,2,0) sẽ làm tấm MỜ ĐI, mà tấm mờ
   trông như bị khoá/nút tắt chứ không phải bị ấn. Phím thật không mờ, nó TỤT XUỐNG. */
.home-btn:active { opacity: 1; }
.home-btn:active svg { transform: translateY(2px); filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.5)); }
/* Chế độ sáng phải khai LẠI ở đây: `body.light-mode .home-btn svg` là (0,2,2) nên nó ĐÈ `:active`
   (0,2,1) — thiếu luật này thì ở chế độ sáng tấm vẫn tụt xuống nhưng bóng KHÔNG thu lại, mất một
   nửa cảm giác "ăn xuống". (0,3,1) của luật dưới mới thắng được. */
body.light-mode .home-btn:active svg { transform: translateY(2px); filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.25)); }
/* Vòng focus của nút này phải vẽ bằng `box-shadow`, KHÔNG phải viền: nút đã bỏ viền nên
   `.quiz-btn:focus { border-color: var(--accent-glow) }` (0,2,0) chỉ đổi MÀU của một đường dày
   0px — không thấy gì. Thiếu khối này thì đây là nút duy nhất trong app không có dấu hiệu nào
   khi được chọn bằng bàn phím. Dùng `:focus-visible` (không phải `:focus`) đúng như các nút
   `.mix-act`, để chạm trên điện thoại không dính vòng xanh sau khi nhả tay. */
.home-btn:focus-visible { box-shadow: 0 0 0 2px var(--accent-glow); }
/* (Icon ❓ emoji ở lượt trước đã bị thay bằng .q-num — xem khai báo .q-num ở trên.) */
/* Ghi chú cũ của icon ❓, giữ lại để biết vì sao không quay lại emoji ở cỡ chữ lớn:
   emoji ở 16px rộng 22px, cộng khe 8px là lấy mất 30px bề ngang câu hỏi — đo trên
   bộ Văn hóa doanh nghiệp thì 10/30 câu phải xuống thêm một dòng.

/* Bốn nút làm bài của mỗi bộ đề: lưới 2×2 với hai cột BẰNG NHAU.
   Trước đây là flex-wrap nên mỗi nút rộng theo nhãn — hàng trên [Từng câu][Cả bộ]
   và hàng dưới [Học][Câu hỏi] lệch cỡ nhau, nhìn như lỗi. Lưới 2 cột cho cả bốn
   nút cùng bề ngang và cùng chiều cao.
   Padding ngang co từ 12px xuống 6px để nhãn dài nhất “▶️ Từng câu” (≈93px) vẫn
   nằm một dòng: ở khung nhìn 311px mỗi cột chỉ còn ≈120px, trừ 12px padding là
   ≈108px chỗ cho chữ. Bốn nút trên MỘT hàng là không thể ở cỡ 17px (mỗi nút chỉ
   còn ≈78px, không đủ cho nhãn), nên 2×2 là cách duy nhất để cả bốn đều nhau.
   LỚP NÀY GIỜ CÓ BA CHỖ DÙNG (20/9/2026): màn KẾT QUẢ (🔄 Làm lại / Về trang chủ — hai NÚT HÀNH ĐỘNG,
   không phải ô chọn) và hai chỗ dưới đây; thẻ "Chọn từng bộ đề" (Từng câu / Cả bộ / Học / Câu hỏi)
   và thẻ mở bằng nút 👁 "Câu hỏi" (Thi từng câu / Thi cả bộ / Học (chọn sai làm lại) / Về trang chủ).
   Chỗ thứ hai trước đây là hai hàng flex riêng nên bốn nút lệch nhau (155,1 / 128,2 / 227,4 / 151px)
   — đó chính là lý do nó chuyển sang dùng lớp này. Nhãn dài nhất ở đó ("Học (chọn sai làm lại)")
   PHẢI xuống hai dòng ở khung hẹp, và `grid-auto-rows: 1fr` chính là thứ giữ cho bốn nút vẫn cao bằng nhau.
   Sửa lớp này thì SỬA CHO CẢ HAI THẺ. */
.set-acts {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;
  grid-auto-rows: 1fr;   /* cửa sổ rất hẹp: có nhãn phải xuống 2 dòng thì cả bốn nút vẫn cao bằng nhau */
}
.set-acts .quiz-btn { width: 100%; padding: 9px 6px; text-align: center; }
/* Nút ICON nằm trong lưới này (màn KẾT QUẢ — 20/9/2026) phải TRẢ LẠI padding của `.home-btn`:
   `.set-acts .quiz-btn` (0,2,0) MẠNH HƠN `.home-btn` (0,1,0), nên không có luật này thì icon mang
   padding 9px 6px → nút cao 28+18 = 46px và KÉO CẢ HÀNG cao thêm 4px (nút chữ bên cạnh chỉ 41,8px).
   Với 3px 6px nút icon còn 34px — thấp hơn nút chữ nên hàng giữ nguyên 41,8px, và hai nút vẫn cao
   bằng nhau nhờ `grid-auto-rows: 1fr`. Phải khai SAU `.set-acts .quiz-btn`: cùng độ ưu tiên (0,2,0)
   nên CHỈ THỨ TỰ phân định. */
.set-acts .home-btn { padding: 3px 6px; }
/* Hàng BA nút ở màn 👁 "Câu hỏi" (20/9/2026 — "cho 3 tab còn lại nằm cùng hàng").
   Cùng công thức với `.set-acts`, chỉ đổi số cột. Phải khai SAU `.set-acts`: hai luật cùng độ ưu
   tiên (0,1,0) nên CHỈ THỨ TỰ phân định — dời lên trên là ba nút quay về 2×2 ngay.
   Ba cột ở khung 393px còn ~101px chỗ chữ cho mỗi nút, nên "📖 Học (chọn sai làm lại)" xuống
   3 dòng; `grid-auto-rows: 1fr` của `.set-acts` giữ cả ba nút cao bằng nhau. */
.set-acts-3 { grid-template-columns: 1fr 1fr 1fr; }
/* BỎ padding NGANG của hàng ba nút. Bề ngang mỗi ô đã do LƯỚI `1fr` quyết định, nên 12px padding
   chỉ ăn mất chỗ của chữ: ở khung 327px ô rộng 87,1px → còn 73px chỗ chữ, mà nhãn dài nhất
   (`Từng câu`, 77px ở 17px) lại phải xuống 2 dòng. Bỏ padding ngang → 85,1px, một dòng, và
   vẫn đủ chỗ tới khoảng 310px. Canh giữa KHÔNG đổi: `text-align:center` canh theo lòng hộp, mà
   padding đối xứng thì lòng hộp vẫn cùng tâm. */
.set-acts-3 .quiz-btn { padding-left: 0; padding-right: 0; }
/* Hàng đầu thẻ 👁 "Câu hỏi": tên bộ đề bên trái, nút quay về dồn ra mép phải.
   LƯỚI `1fr auto` — KHÔNG còn `1fr 1fr` (20/9/2026, cùng lượt "bỏ viền bỏ nền, thêm icon"):
   hai cột bằng nhau chỉ có nghĩa khi hai bên là hai HỘP cùng cỡ (yêu cầu "cho 2 tab này kích cỡ
   bằng nhau" ngày 19/9). Từ khi nhãn tên bộ mất nền/viền và thành tiêu đề chữ + icon 📚, việc
   chia đôi chỉ làm hại: icon ăn 23,3px + 8px khe nên ở khung hẹp "Chăm sóc KH" phải XUỐNG 2 DÒNG
   dù bên phải còn trống (đo ở khung 309px: chỗ chữ 101,3px < bề rộng chữ, hàng cao 45,9px).
   `1fr auto` cho tên chiếm hết phần còn lại → một dòng (đo lại: hàng 40px).
   Ô `auto` chỉ rộng bằng nút, nên `min-width: 44px` dưới đây giữ vùng chạm đủ lớn (WCAG 24px).
   Stretch mặc định của lưới vẫn kéo hai bên cao BẰNG NHAU, nên tên dài 2 dòng thì nút cao theo và
   cặp này không bao giờ lệch — cũng là lý do không được cắt tên bằng ellipsis cho gọn. */
.browse-head { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
/* Hàng tên bộ ở màn 👁 "Câu hỏi": BỎ NỀN + BỎ VIỀN của nhãn `.set-name` và THÊM ICON 📚 trước
   tên (20/9/2026 — "bỏ viền bỏ nền, thêm icon"). Đây là NGOẠI LỆ DUY NHẤT của `.set-name`: ở hộp
   "📝 Chọn từng bộ đề" trên trang chủ nhãn đó VẪN phải có nền xanh nhẹ + viền, nên ĐỪNG sửa
   `.set-name` ở khu vực chính — phải phủ bằng luật con `.browse-name .set-name` (0,2,0), mạnh hơn
   `body.light-mode .set-name` (0,1,1) nên chế độ sáng cũng mất nền/viền theo. Chữ giữ nguyên màu
   của `.set-name` (trắng ở tối, xanh đậm ở sáng) — chỉ mất cái hộp.
   Icon cách tên 8px, đúng khuôn `.set-dd-lbl` của nút chọn bộ đề ("icon 📚 đứng TRƯỚC tên bộ").
   Chữ canh TRÁI như một tiêu đề (trước là canh giữa trong hộp) — nút quay về ở ô bên phải đã dồn
   sát mép nên hai đầu hàng giờ nằm ở hai mép thẻ.
   `min-width:0` là BẮT BUỘC: thiếu nó thì tên dài ("Các tình huống vi phạm sử dụng điện") làm tràn
   lưới thay vì tự xuống dòng — cùng cái bẫy đã gặp ở `.set-dd-lbl` và hàng nút bảng trộn. */
.browse-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
/* BA lớp chứ không hai là BẮT BUỘC — đây đúng BẪY SPECIFICITY đã gặp nhiều lần trong app:
   `body.light-mode .set-name` = (0,2,1) vì `body` là TYPE selector, mạnh hơn `.browse-name
   .set-name` (0,2,0); và viết `body .browse-name .set-name` cũng vẫn (0,2,1) — HÒA, mà luật chế độ
   sáng lại nằm SAU trong tệp nên nó thắng theo thứ tự. Đo được sau lượt sửa đầu: ở chế độ sáng
   nền VẪN là rgba(29,78,216,0.1) — không hết. Thêm `.browse-head` thành (0,3,0) là thắng chắc,
   không phụ thuộc thứ tự khai báo. Chỉ chặn nền/viền/padding, KHÔNG đụng `color`, nên chữ vẫn
   trắng ở tối và xanh đậm ở sáng theo `.set-name`. */
.browse-head .browse-name .set-name { background: none; border: 0; padding: 0; }
/* Nút quay về ở màn này giờ là ICON (20/9/2026 — "đổi icon về trang chủ"): nó mang thêm lớp
   `.home-btn` nên dùng CHUNG hình SVG (cỡ icon 32px), bóng nổi khối, không viền và vòng focus bàn
   phím với nút ở đầu màn làm bài — hai chỗ đọc ra như cùng một nút. Khai ở ĐÂY (sau `.home-btn`)
   để đè `padding` của lớp đó: `width:100%` cho nút giãn kín cả ô, còn padding dọc 4px giữ chiều
   cao đúng 32 + 4×2 = 40px = đúng chiều cao ô tên bên cạnh, nên hàng KHÔNG cao thêm.
   `border:0` (shorthand, đè `1px` của `.quiz-btn`) — luật chế độ sáng `body.light-mode .quiz-btn`
   (0,2,1) chỉ còn đổi MÀU của đường dày 0px nên không vẽ ra gì. */
/* Icon DỒN RA SÁT MÉP PHẢI (20/9/2026 — "cho icon ra sát phía ngoài") bằng `justify-content:
   flex-end` + `padding` NGANG bằng 0: nút vẫn giãn kín ô lưới (nên vùng chạm vẫn bằng CẢ Ô —
   đo 173,68px ở khung 468px, và
   hai ô vẫn BẰNG NHAU), nhưng icon nằm ở mép phải của lòng thẻ. Padding ngang 0 là BẮT BUỘC: với
   6px cũ icon còn cách mép 6px và KHÔNG thẳng hàng với mép phải của hàng ba nút bên dưới (những
   nút đó không có padding ngang — xem `.set-acts-3 .quiz-btn`).
   Padding dọc 6px → 4px (khi icon lên 32px) → **2px** (20/9/2026 — "cho chữ 25 câu hỏi nằm xích lên
   gần tên bộ đề"): phần padding này là thứ QUYẾT ĐỊNH chiều cao hàng, mà hàng cao hơn chữ tên bao
   nhiêu thì chữ "25 câu hỏi" bị đẩy xuống bấy nhiêu (chữ tên được canh giữa trong hàng). Hàng 40 →
   **36px** nên khe hở dưới chữ tên hụt 2px ở mỗi phía. Điểm chạm vẫn 44 × 36px, trên ngưỡng 24. */
.browse-back { width: 100%; min-width: 44px; padding: 2px 0; border: 0; justify-content: flex-end; }

/* ── MODAL ───────────────────────── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal {
  /* 19/9/2026: trước là mã CỨNG #1a1d24 (xám pha xanh) nên khi cả dải tối đổi sang xám thuần
     thì tấm này vẫn giữ sắc cũ. Đổi sang BIẾN để nó luôn đi cùng --navy-mid. */
  background: var(--navy-mid);
  border: 1px solid var(--border);
  font-family: 'Inter', sans-serif;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 560px;
  max-height: 85vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
@media (min-width: 640px) {
  .modal-overlay { align-items: center; padding: 24px; }
  .modal { border-radius: 16px; max-height: 80vh; }
}
.modal-handle {
  width: 36px; height: 3px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  margin: 5px auto 0;
}
.modal-body { padding: 4px 12px 20px; }

/* ── MÀN HÌNH ĐĂNG NHẬP ───────────────────────── */
/* ĐÂY LÀ RÀO CHẮN CHO NGƯỜI DÙNG BÌNH THƯỜNG, KHÔNG PHẢI BẢO MẬT THẬT — và không được lẫn hai
   chuyện đó. App là MỘT file HTML tĩnh chạy trên máy người xem, không có máy chủ nào kiểm mật
   khẩu, nên ai mở “Xem mã nguồn” (hoặc lưu file về) đều đọc được cả mã lẫn — với bản điện thoại —
   cả 643 câu hỏi nằm sẵn trong chính file đó. Việc nó làm được: người cầm máy/link KHÔNG mở lên là
   dùng được ngay. Việc nó KHÔNG làm được: chặn người biết đọc mã. (Bản ghi 21/9/2026 ở run.md.)

   `z-index: 500` để nằm TRÊN `.modal-overlay` (300) và mọi thứ khác.
   KHÔNG có `display: none` mặc định và KHÔNG cần class `.open`: HTML để nó HIỆN SẴN, tức là
   "hỏng thì khoá" (fail-closed) — nếu script dưới cuối tệp lỗi thì người dùng thấy màn đăng nhập
   chứ không thấy nội dung. Chính vì vậy `hideGate()` mới là thứ PHẢI CHẠY ĐƯỢC, chứ không phải
   `showGate()`. */
.login-gate {
  position: fixed; inset: 0; z-index: 500;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: var(--navy);
  font-family: 'Inter', sans-serif;
}
.login-card {
  width: 100%; max-width: 330px;
  background: var(--navy-mid);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 26px 20px 20px;
  text-align: center;
  /* `color` lấy theo token chứ không theo `body`: thẻ này có nền riêng, và ở chế độ SÁNG nền thẻ
     là TRẮNG nên phải dùng `--text-strong` (xem `body.light-mode .login-card`). */
  color: var(--text);
}
.login-ico { font-size: 36px; line-height: 1; }
.login-title { font-size: var(--fs-head); font-weight: var(--fw-head); margin: 12px 0 4px; }
.login-sub { font-size: var(--fs-note); color: var(--text-dim); margin-bottom: 16px; }
/* Ô nhập dùng `--set-box-bg` + `--border`: cặp token này đã tự đúng ở CẢ HAI chế độ
   (#262626 trên thẻ #202020 · #f1f3f5 trên thẻ trắng) nên không cần luật riêng cho chế độ sáng. */
.login-input {
  width: 100%; padding: 11px 12px;
  background: var(--set-box-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: inherit;
  font: inherit; font-size: var(--fs-base);
  text-align: center; letter-spacing: 1px;
  outline: none;
}
.login-input::placeholder { color: var(--text-dim); letter-spacing: normal; }
.login-input:focus { border-color: var(--accent-glow); }
.login-btn {
  width: 100%; margin-top: 10px; padding: 12px;
  border: 0; border-radius: 10px;
  background: var(--accent); color: var(--on-accent);
  font: inherit; font-size: var(--fs-base); font-weight: var(--fw-ui);
  cursor: pointer;
}
.login-btn:active { transform: scale(0.98); }
/* Dòng báo lỗi GIỮ SẴN CHIỀU CAO (`min-height`) để lúc hiện chữ không đẩy nút Lên/xuống. */
.login-msg { min-height: 20px; margin-top: 10px; font-size: var(--fs-note); color: var(--red-text); }

/* ── LIGHT MODE ───────────────────────── */
/* Nền chế độ sáng: trắng xám để các thẻ trắng nổi rõ. Thẻ và ô nhập vẫn trắng. */
/* --text-dim đậm hơn #64748b một chút: hộp từng bộ đề giờ có nền xám #f1f3f5, mà
   #64748b trên xám đó chỉ đạt 4.31:1 (dưới ngưỡng 4.5:1). #5b6675 cho 5.27:1 trên
   nền xám và 5.83:1 trên thẻ trắng. */
body.light-mode {
  background: var(--surface-sunken); color: var(--text-base);
  --text-dim: #5b6675; --border: rgba(0,0,0,0.22); --answer: #5f6b7c; --q-text: #1f2937;
  --set-box-bg: #f1f3f5; --pin-brd: #6d28d9; --pin-brd-hover: #7c3aed; --red-text: #dc2626;
  /* ── Biến CHỈ dùng ở chế độ SÁNG ───────────────────────────────────────────────────
     Mọi luật dùng nhóm này đều là luật `body.light-mode .<x>`, nên khai ở đây là đủ và chế
     độ tối không thấy chúng. KHÔNG khai chúng trong `:root`: đó là cách để một biến chỉ có
     nghĩa ở một chế độ không lặng lẽ rò sang chế độ kia.
     `--on-accent`, `--header-deep` và `--accent-deep` KHÔNG khai lại ở đây — hai chế độ dùng
     chung đúng một giá trị, nên để nguyên ở `:root`. */
  --header-from: #1e40af;     /* đầu gradient header ở chế độ sáng */
  --mix-cyan: #075985;        /* cùng vai trò với --mix-cyan ở :root, nhưng phải ĐẬM hơn */
  --ok: #16a34a;              /* viền nút bộ đề ở chế độ sáng (3,28:1 trên nền sáng) */
  --ok-hover: #15803d;        /* viền khi trỏ/bấm, chế độ sáng */
  --ok-strong: #059669;       /* viền đáp án ĐÚNG (3,77:1) — KHÔNG dùng --green, chỉ 2,54:1 */
  --danger: #dc2626;          /* nút nguy hiểm + ô số câu (4,53:1 trên thẻ trắng) */
  --surface-card: #ffffff;    /* thẻ, ô nhập, nút — nền trắng đục */
  --surface-answer: #fafbfc;  /* tấm đáp án: chỉ 1,04:1 trên thẻ — CỐ Ý, xem ghi chú quiz-opt */
  --surface-sunken: #e9ecef;  /* nền trang + bảng xổ bộ đề */
  --surface-modal: #f0f1f4;   /* nền hộp thoại */
  --border-light: #c9d1da;    /* viền thẻ / khung */
  --border-field: #b3bfcc;    /* viền ô nhập và nút (1,87:1) */
  --border-answer: #96a2af;   /* viền tấm đáp án (2,60:1 — khớp đúng viền của chế độ tối) */
  --text-strong: #1e293b;     /* chữ trên nền trắng */
  /* Chữ trên NỀN TRANG (xám #e9ecef), chế độ sáng. 20/9/2026 — "chữ nào đen quá thì giảm xuống
     một tí light mode": #000000 → **#1e293b**. Đen tuyệt đối trên nền sáng là cặp gắt nhất có thể
     (21:1) và làm nét chữ dày lên trong mắt; #1e293b là nấc "đen mềm" app ĐÃ dùng sẵn cho chữ trên
     thẻ trắng (`--text-strong`), nên không thêm màu mới nào vào bảng.
     ĐO: trên nền trang #e9ecef **17,71 → 12,34:1**; trên thẻ trắng **21,0 → 14,63:1** — thừa xa 4,5:1.
     HỆ QUẢ CẦN BIẾT: từ đây `--text-base` bằng `--text-strong`. Giữ hai token vì chúng thuộc hai
     mặt nền khác nhau và còn có thể tách lại; nếu gộp làm một thì phải rà cả 4 chỗ dùng
     `var(--text-base)` — cả 4 đều là luật chế độ sáng (`.set-dd-btn`, `.set-dd-item`, `body`, và
     `.search-clear:hover`), nên `:root` KHÔNG được khai token này. */
  --text-base: #1e293b;
}

/* Hộp từng bộ đề trên trang chủ (📝 Chọn từng bộ đề) có nền riêng để tách khỏi thẻ
   chứa nó: xám ĐẬM #262626 ở chế độ tối (thẻ tối chỉ ≈#202020 nên hộp nhỉnh lên,
   đọc ra là một tấm riêng — tấm/thẻ 1.08:1 — và giờ cùng sắc với tấm đáp án),
   xám NHẠT #f1f3f5 ở chế độ sáng (thẻ trắng nên hộp lùi
   xuống). Một biến duy nhất, không phải hai luật chồng nhau. */
.set-box { background: var(--set-box-bg); }
/* Nhãn tên bộ đề: nền NHẸ (tint trong suốt) + chữ cùng tông, dáng giống hai chip
   “Đảo câu hỏi / Đảo đáp án”. Lịch sử màu theo yêu cầu người dùng: xanh ĐẶC + chữ
   trắng → xanh nhẹ → **đỏ nhẹ** (đang dùng). Đừng viết style thẳng trong thẻ: cần
   luật riêng cho chế độ sáng, mà style thẳng thì CSS thường không ghi đè được.
   Đỏ phải SÁNG hơn xanh khi làm chữ (mắt nhạy với đỏ kém hơn): ở chế độ tối dùng
   #f87171 chứ không phải --red #ef4444 — đo được 3,34:1 là quá mờ. */
.set-name {
  display: inline-block;
  /* Nền XANH DƯƠNG NHẸ + VIỀN (yêu cầu 19/9/2026) — trước đó là nền đỏ nhạt không viền.
     Dùng đúng sắc xanh của app (--accent #1d4ed8) ở alpha thấp, nên nhãn cùng họ màu với
     nút “Thư viện”/“Từng câu” mà không thành một khối xanh đặc.
     Lề trong hạ 1px mỗi phía (3px 9px → 2px 8px) để BÙ cho đường viền 1px: nhãn vẫn đúng
     182×30px như trước, không làm thẻ bộ đề cao thêm. */
  background: rgba(29,78,216,0.16);
  border: 1px solid rgba(96,165,250,0.55);
  color: var(--on-accent);
  padding: 2px 8px; border-radius: 8px;
}
/* Chế độ sáng: viền phải ĐẬM hơn chế độ tối mới thấy rõ, vì nền nhạt và mắt nhạy với
   xanh dương kém hơn. Đo trên nền đã pha: 0,45 → ~2,0:1 (mờ), 0,60 → ~2,6:1 (rõ mà vẫn mảnh). */
body.light-mode .set-name {
  background: rgba(29,78,216,0.10);
  border-color: rgba(29,78,216,0.6);
  /* Chữ XANH DƯƠNG ĐẬM (yêu cầu 19/9/2026) — trước là đen tuyền. Dùng #1e40af chứ không
     phải --accent #1d4ed8: đây đúng là màu chữ xanh đậm app đã dùng cho chip đang bật ở
     chế độ sáng, đo trên nền đã pha được 7,45:1. Chế độ tối vẫn giữ chữ TRẮNG — xanh đậm
     trên nền tối là không đọc được, và luật cũ của người dùng vẫn là “trắng ở dark mode”. */
  color: var(--accent-deep);
}
/* Tên bộ đề trong bảng 🎲 Trộn đề (yêu cầu 18/9/2026). Cùng dáng với nhãn .set-name ở
   danh sách bộ đề nhưng KHÁC TÔNG màu nên nhìn là biết đang ở bảng nào — đừng dùng
   chung một lớp cho cả hai chỗ.
   Đừng viết style thẳng trong thẻ: style thẳng không ghi đè được luật chế độ sáng. */
.mix-name {
  display: inline-block;
  /* KHÔNG NỀN — chỉ còn chữ (yêu cầu 19/9/2026 — "tôi muốn bỏ màu nền").
     Lịch sử nền của nhãn này: xanh lá 0,14 + chữ #34d399 → xanh lá 0,07 + chữ #ffffff
     → 0,06 ở chế độ sáng → và giờ là KHÔNG có nền.
     Lề trong `3px 8px` CỐ Ý GIỮ LẠI dù không còn khối màu: nó chính là thứ đang đặt chữ vào
     đúng chỗ hiện tại, nên bỏ luôn lề là chữ NHẢY sang trái 8px so với hôm nay. Muốn bỏ thì
     bỏ lề trong cùng lúc, đừng bỏ lẻ. */
  background: none;
  /* --text, KHÔNG dùng --on-accent (20/9/2026 — "cho những chữ này màu tối 1 tí").
     `--on-accent` là #ffffff ở chế độ tối: đó là màu cho chữ TRÊN NỀN MÀU ĐẶC (nút chính,
     huy hiệu, hàng đang chọn) — nó chỉ lọt vào đây từ hồi nhãn này còn nền xanh lá. Nền đã
     bỏ từ 19/9 nhưng màu chữ thì sót lại, nên tên bộ đề thành chữ TRẮNG TINH, sáng nhất cả
     app — còn hơn cả --text #e2e8f0. Vì `--on-accent` vẫn đang dùng thật cho nút chính nên
     KHÔNG được sửa giá trị token; chỉ đổi ở đây thôi. Chế độ sáng giữ #134e4a (khối dưới). */
  color: var(--text);
  padding: 3px 8px; border-radius: 8px;
}
/* Chế độ sáng: chữ XANH ĐEN (#134e4a), không phải đen tuyền (yêu cầu 19/9/2026).
   Đổi màu chữ chứ KHÔNG đổi màu nền: nền vẫn là tint xanh lá 0,06 của .mix-name.
   Đo trên nền đã pha (tint trên thẻ trắng #ffffff = rgb(241,251,247)): #134e4a được
   8,97:1 — còn dễ đọc hơn cả đen tuyền vì bớt tương phản gắt. Đừng dùng #166534 ở đây:
   đó là xanh LÁ (đang dùng cho đáp án đúng), trùng tông với nền tint của chính nhãn. */
/* Chế độ sáng: cũng KHÔNG nền (19/9/2026). Luật này giờ chỉ còn đổi MÀU CHỮ — nền trong suốt
   nên chữ nằm thẳng trên thẻ trắng #ffffff, #134e4a đạt ~9:1. Nếu ai trả lại nền thì phải xem
   lại màu chữ cùng lúc: cặp màu này từng được chọn cho nền tint xanh lá, không phải cho nền trắng. */
body.light-mode .mix-name { background: none; color: #134e4a; }
/* Nút "↺ Mặc định" trong thẻ Trộn đề. Chỉ là CHỮ XANH có viền mảnh, không phải nút khối:
   nó là lối thoát cho việc tỷ lệ đã được lưu vào máy, nên phải có nhưng không được tranh
   chỗ với ba nút trộn thật. Vì là chữ trong thẻ nên phải dùng --accent-glow, KHÔNG dùng
   --text-dim (chữ mờ trong thẻ này là chữ phụ 15px/400, nút cần nổi hơn một bậc).
   KHÔNG dùng --accent ở đây: #1d4ed8 là màu cho NỀN NÚT (chữ trắng trên nó), làm màu
   chữ trên nền thẻ tối chỉ đạt 4,0:1 — đúng cái bẫy --accent-glow sinh ra để tránh. */
.mix-reset {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  color: var(--accent-glow); font-family: 'Inter', sans-serif;
  /* 15px → 17px (19/9/2026 — "tất cả chữ này cỡ 17px", ảnh có nút "↺ Mặc định"). Nút cao thêm
     ~3px; nó nằm cùng hàng flex với dòng "Tổng tỷ lệ" (cũng vừa lên 17px) nên hàng vẫn cân. */
  font-size: var(--fs-base); font-weight: 400; padding: 4px 9px; cursor: pointer;
}
.mix-reset:hover { border-color: var(--accent-glow); }

/* ── CẶP NÚT ▲▼ cạnh ô phần trăm (19/9/2026 — "muốn có dấu mũi tên lên xuống kế ô số
   chỉnh cho dễ khi xem trên điện thoại"). Đặt NGAY SAU ô nhập nên không phải với tay, và
   mỗi cú chạm CHỐT LUÔN (chia lại tỷ lệ), khác mũi tên mặc định của trình duyệt — thứ chỉ
   sửa số rồi chờ rời ô. Vì vậy mũi tên mặc định được ẩn đi ở các ô phần trăm để không
   thành hai bộ mũi tên chồng nhau trên máy tính.
   26×20 mỗi nút: nhỏ hơn khuyến nghị 44px, nhưng bù lại GIỮ để tự lặp khi đè ngón tay. */
.mix-step { display: flex; flex-direction: column; gap: 2px; flex: none; }
.mix-step button {
  width: 32px; height: 17px; padding: 0; line-height: 1;
  font-family: 'Inter', sans-serif; font-size: var(--fs-micro);
  background: none; border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-dim); cursor: pointer;
}
/* Ô số của bảng trộn — lớp RIÊNG để thu nhỏ (19/9/2026 "cho ô số nhỏ lại") mà không kéo theo
   .quiz-input (ô đổi tên bộ đề dùng chung lớp đó, phải giữ 17px/10px lề). 46×35 thay vì 62×41:
   đủ chỗ cho 3 chữ số "100", và trả lại ~16px cho cột tên bộ đề. */
.mix-input { width: 40px; padding: 5px 3px; text-align: center; font-size: var(--fs-sub); }
/* Ô SỐ (%) của bảng trộn: NỀN XANH NHẸ + CHỮ XANH + VIỀN XANH (19/9/2026 — "tôi muốn hàng số có
   nền xanh nhẹ và chữ xanh, viền xanh"). Cặp màu lấy từ viền neon của `.set-dd-btn` khi nó còn
   xanh dương (trước 19/9/2026 là `#setSelect` — ô select đã được thay bằng dropdown tự vẽ), nên
   hai chỗ từng nhìn như một bộ.
   LƯU Ý: viền dropdown đã chuyển sang XANH LÁ NEON (20/9/2026 — "đổi sang viền xanh lá neon"),
   còn ô số ở đây VẪN xanh dương theo yêu cầu riêng của người dùng. Đây là hai thứ KHÁC nhau bây
   giờ — đừng "đồng bộ" chúng trừ khi người dùng yêu cầu.
   Chỉ khai báo trên .mix-input — KHÔNG đụng .quiz-input: lớp đó còn là ô ĐỔI TÊN bộ đề trong
   bảng 📦, và nếu tô ở đó thì ô đổi tên cũng xanh theo mà người dùng không hề yêu cầu.
   Chữ phải là xanh SÁNG (#7dd3fc): chữ trắng trên nền tint xanh vẫn đọc được nhưng mất hẳn ý
   "chữ xanh" người dùng muốn. */
/* "cho nền và viền xanh nhẹ hơn" (19/9/2026, sau khi xem ảnh chụp): hạ độ đậm của NỀN và VIỀN.
   Nền: alpha 0,14 → 0,08. Viền: thay màu ĐẶC bằng màu TRONG SUỐT (alpha 0,55) — cách này làm viền
   nhạt đi mà KHÔNG phải giảm border-width, nên ô vẫn cao 31px như cũ (giảm độ dày viền sẽ làm
   nhảy bố cục 0,5px, xem ghi chú của `.set-dd-btn`).
   Chữ giữ nguyên #7dd3fc: nền nhạt đi thì chữ phải giữ độ sáng mới còn đọc được. */
.mix-input {
  background: rgba(56, 189, 248, 0.08);
  border-color: rgba(56, 189, 248, 0.55);
  color: var(--mix-cyan);
}
.mix-input:focus { border-color: var(--mix-cyan); }
/* Ô số = 0: NỀN ĐEN (tối) / TRẮNG (sáng) + VIỀN XÁM (19/9/2026 — "tôi muốn những ô số 0 thì có
   viền cùng màu với bảng và có viền xám ở light mode và dark mode").
   Viền dùng ĐÚNG `--border` — cùng màu với kẻ ngang và viền khung của bảng Trộn đề, nên ô số 0
   đọc ra như một ô "để trống" nằm trong hệ của bảng, không phải ô tự vẽ màu riêng.
   Chữ đổi sang `--text-dim`: chữ xanh #7dd3fc vốn dành cho ô ĐANG CÓ phần trăm; trên nền trắng
   nó chỉ đạt 1,6:1, không đọc được. `--text-dim` tự đổi theo chế độ (#94a3b8 ở tối trên nền đen
   ≈ 7:1; #5b6675 ở sáng trên nền trắng ≈ 5,5:1) nên chỉ cần khai báo một lần.
   Chỉ NỀN là phải tách theo chế độ — và vì vậy mới cần class `.mix-zero` do JS gắn: CSS không
   chọn được theo giá trị của ô nhập.
   Ô có số > 0 vẫn giữ nguyên nền xanh nhẹ + chữ xanh như cũ. */
.mix-zero {
  /* KHÔNG NỀN RIÊNG (19/9/2026 — "tôi muốn màu nền số 0 cùng màu với nền nút lên xuống").
     Nút ▲▼ dùng `background: none`, nên nền THẬT của nó chính là nền hàng/thẻ (#202020 ở chế độ
     tối, #ffffff ở chế độ sáng — đã đo bằng cách chồng màu các tổ tiên). Ô số 0 làm y hệt: để
     trong suốt, chỉ giữ viền — hai thứ nằm cạnh nhau trong cùng hàng nên phải cùng một nền.
     Lịch sử nền ô 0 (đều đã bỏ): #000000 → #333333 → #2b2b2b → **trong suốt**. Mọi nấc xám tự vẽ
     đều sai ở chỗ nó KHÔNG ăn theo nền thẻ, còn cách này ăn theo tự động kể cả khi thẻ đổi màu.
     Chỉ NỀN đổi theo cách này — viền vẫn `--border` (đúng màu kẻ bảng) và chữ vẫn `--text-dim`. */
  background: none;
  border-color: var(--border);
  color: var(--text-dim);
}
/* Chế độ sáng khai ở CUỐI tệp, ngay sau `body.light-mode .mix-input` — xem ghi chú ở đó. */
/* Nhỏ thêm lần nữa (19/9/2026 — "cho ô số nhỏ thêm"): 46×35 → 40×30.
   Cỡ CHỮ vẫn 15px, chỉ cắt lề trong: chữ số là thứ phải đọc được, còn lề thừa mới là thứ
   chiếm chỗ. Lòng ô còn 32px, đủ cho "100" (đo được 26px) nên không bị cắt số 3 chữ số.
   Chiều cao hàng KHÔNG đổi (36px): cặp ▲▼ và nút 📌 vẫn cao 36px — nếu muốn cả hàng thấp
   xuống thì phải thu cả ba thứ đó, mà như vậy thì ngón tay khó chạm hơn khi dùng điện thoại. */
.mix-step button:hover { border-color: var(--accent-glow); color: var(--text); }
.mix-step button:active { background: rgba(127, 127, 127, 0.22); color: var(--text); }

/* ── NÚT GHIM (📌) ngay TRƯỚC ô số (19/9/2026 — "muốn ô ghim dời qua trước ô số"; trước đó nó
   đứng sau cặp ▲▼ theo đúng yêu cầu ban đầu "thêm nút dừng kế mũi tên lên xuống").
   Rộng 23px và lề PHẢI ÂM 4px — đổi từ lề trái sang khi dời vị trí, vì khe cần thu hẹp bây
   giờ là khe với Ô SỐ ở bên phải: hàng rất chật ở bề ngang 409px, lề âm làm khe hở thật
   xuống 4px nên chỉ lấy thêm ~19px của cột tên bộ đề thay vì 27px.
   Màu khi ghim trước đây theo quy ước xanh lá của app (#34d399 tối / #166534 sáng) nhưng đã
   đổi sang cặp xanh của Ô SỐ cho đồng bộ (20/9/2026) — xem ngay dưới. */
.mix-lock {
  width: 23px; height: 36px; margin-right: -4px; padding: 0; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif; font-size: var(--fs-note); line-height: 1;
  /* Viền TÍM (`--pin-brd`) chứ không phải viền xám `--border` như mọi ô khác trong hàng: nút ghim
     là chỗ BẤM ĐƯỢC, không phải ô hiển thị, nên viền màu tách nó khỏi nền hàng ở cả hai chế độ.
     Đổi xanh dương → tím 21/9/2026 vì xanh dương quá gần màu ô số ngay bên phải — xem ghi chú
     `--pin-brd` ở `:root` để có đủ số đo và lý do chọn tím. */
  background: none; border: 1px solid var(--pin-brd); border-radius: 8px;
  color: var(--text-dim); cursor: pointer;
  /* KHÔNG đặt `filter` trên chính NÚT nữa (sửa 19/9/2026): `filter` áp cho cả PHẦN TỬ gồm cả
     viền, nên `grayscale(1)` đã biến viền xanh dương vừa thêm thành XÁM — `getComputedStyle`
     vẫn trả về `rgb(59,130,246)` nên nhìn mã thì tưởng đúng, chỉ ảnh chụp mới lộ. Làm mờ ở
     span bên trong thì chỉ icon đổi, viền giữ nguyên màu. */
}
/* CHƯA GHIM thì ICON MÀU XÁM — ĐÂY LÀ CHỖ ĐỔI Ý so với 20/9/2026, theo yêu cầu của người dùng
   (21/9/2026 — "tôi muốn icon này có màu khác khi chưa ghim").
   **LỆNH CẤM CŨ ĐÃ ĐƯỢC GỠ, nhưng LÝ DO của nó thì không được quên.** Bản ghi 20/9 viết "ĐỪNG đặt
   lại `filter` cho span này" vì `grayscale(1) opacity(0.5)` từng làm nút ghim thành chỗ TƯƠNG
   PHẢN THẤP NHẤT toàn app: icon bị xám hoá RỒI hạ thêm 50% opacity nên cây ghim gần như tan vào
   nền hàng. Thứ làm hỏng là `opacity(0.5)`, KHÔNG phải `grayscale` — nên lượt này bỏ HẴN opacity
   và bù lại bằng `brightness()`, rồi ĐO chứ không đoán (số ở dưới).
   **VÌ SAO PHẢI DÙNG `filter`:** đây là EMOJI, màu của nó do FONT HỆ THỐNG quyết định — `color`
   KHÔNG có tác dụng gì lên emoji (đúng cái bẫy `▶️` ra ô VUÔNG XANH và `👁` ra mắt XÁM ở mục
   lịch sử 20/9). `filter` là đường DUY NHẤT đổi được màu một emoji bằng CSS mà vẫn giữ emoji.
   SỐ ĐO — dựng chính hai emoji lên `<canvas>` với `ctx.filter` rồi đọc pixel alpha > 200 (đúng
   cách đã dùng cho vụ emoji 20/9), nền là nền THẬT của hàng: tối rgb(30,48,56) · sáng rgb(231,246,253):
     📍 nguyên bản (hồng 244,56,160)        3,86:1 tối · 3,21:1 sáng   ← mức cũ
     grayscale(1)             (104,104,104)  **2,44:1 tối** · 5,07:1 sáng  ← TỤT, đúng như đã cảnh báo
     grayscale(1) brightness(1.5) (139,139,139) **4,00:1 tối** · 3,09:1 sáng
   Nên HAI CHẾ ĐỘ PHẢI KHAI KHÁC NHAU — một giá trị dùng chung thì kiểu gì cũng thua một bên:
     TỐI cần ánh SÁNG LÊN: `brightness(1.5)` → 4,00:1, tức lượt này còn RÕ HƠN mức cũ 3,86:1;
     SÁNG chỉ `grayscale(1)` (5,07:1) — sáng thêm nữa là xám nhạt tan vào nền trắng
       (`brightness(1.3)` ở SÁNG chỉ 3,62 · `1.5` chỉ 3,09 · `1.6` còn 2,87).
   ĐÃ GHIM thì icon HIỆN ĐỦ MÀU trở lại (`.mix-lock.on .mix-lock-ico` bên dưới) — đó là toàn bộ ý
   của thay đổi này: **XÁM = chưa ghim · ĐỎ/HỒNG = đã ghim**. Hai dấu hiệu cũ vẫn còn nguyên
   (HÌNH: 📍 tròn so với 📌 đầu thang — và MÀU NÚT: `.mix-lock.on` lấy viền + nền `--mix-cyan`),
   nên trạng thái giờ có tới bốn dấu hiệu. `aria-pressed` + `title` vẫn đổi theo trạng thái nên
   vẫn không phụ thuộc hoàn toàn vào thị giác.
   Không cần luật `:hover` cho span này: viền đã sáng lên khi trỏ chuột (`.mix-lock:hover`), thêm
   nữa là hai thứ nhấp nháy cùng lúc. */
.mix-lock-ico { line-height: 1; filter: grayscale(1) brightness(1.5); }
body.light-mode .mix-lock-ico { filter: grayscale(1); }
.mix-lock:hover { border-color: var(--pin-brd-hover); color: var(--text); }
/* Hàng ĐANG GHIM: nền + viền ĐỒNG BỘ VỚI Ô SỐ ngay bên cạnh (20/9/2026 — "đổi màu nền và viền
   ghim cho đồng bộ với màu nền viền số"). Trước đây là xanh LÁ (#34d399 / rgba(52,211,153,0.18)
   ở tối, #166534 / rgba(22,101,52,0.12) ở sáng) — hai ô nằm sát nhau mà lệch hệ màu.
   Lấy ĐÚNG cặp màu của `.mix-input` theo từng chế độ (tối `rgba(56,189,248,…)`, sáng
   `rgba(14,165,233,…)`) — xem khối `.mix-input` phía trên. Hai chỗ KHÔNG dùng chung biến nên
   sau này đổi màu ô số thì phải đổi cả ở đây, nếu không chúng lại lệch nhau.
   Viền xanh đứng sau `.mix-lock` nên thắng `--pin-brd` (cùng (0,2,0) với `.mix-lock:hover`,
   mà luật này khai SAU) — đó là lý do hàng ghim không còn viền `--pin-brd` đậm.
   Hàng ghim phân biệt với hàng thường bằng BỐN dấu hiệu: HÌNH icon (📌 so với 📍), MÀU icon
   (đỏ/hồng so với XÁM — `.mix-lock.on .mix-lock-ico` ngay dưới), và cặp viền + nền cyan ở đây.
   (Từ 21/9/2026 icon chưa ghim bị xám hoá — trước đó câu này viết "KHÔNG còn bằng cách hạ sáng"
   vì lượt 20/9 gỡ `grayscale(1) opacity(0.5)`; xem số đo ở `.mix-lock-ico` phía trên để biết vì
   sao lượt này đặt lại `filter` MÀ KHÔNG tái phạm lỗi tương phản cũ.)
   Chỉ MÀU đổi — độ dày viền vẫn 1px (ô số là 1,5px) và bo góc vẫn 8px (ô số 10px). */
.mix-lock.on {
  border-color: rgba(56, 189, 248, 0.55); color: var(--mix-cyan);
  background: rgba(56, 189, 248, 0.08);
}
body.light-mode .mix-lock.on {
  border-color: rgba(14, 165, 233, 0.45); color: var(--mix-cyan); background: rgba(14, 165, 233, 0.06);
}
/* ĐÃ GHIM → icon trở lại đủ màu. Độ ưu tiên (0,3,0) THẮNG cả `body.light-mode .mix-lock-ico`
   (0,2,1) lẫn `.mix-lock-ico` (0,1,0), nên khai Ở ĐÂU cũng được — để ngay đây cho dễ đọc cùng
   cặp luật `.mix-lock.on` vừa rồi. ĐỔI Ý Ở ĐÂY NẾU muốn icon lúc ghim cũng bị xám hoá. */
.mix-lock.on .mix-lock-ico { filter: none; }
/* Dấu chỉ hàng đang ghim trên chính tên bộ đề — ĐÃ BỎ (20/9/2026 — "tôi muốn bỏ viền khi ghim ở
   tên bộ đề"). Trước đây là `box-shadow: inset 0 0 0 1px rgba(52,211,153,0.7)` và lý do dùng inset
   (thay vì border) vẫn đúng: border làm ô nhích 2px và hàng đổi chiều cao.
   Class `pinned` KHÔNG bị bỏ: `toggleMixLock()` (dòng ~1660) vẫn bật/tắt nó và markup lúc dựng
   hàng vẫn gắn nó, nên state vẫn nằm trong DOM — chỉ là giờ không có khai báo CSS nào cho nó.
   Đừng xoá ở JS: `paintMixLock` sẽ lệch trạng thái với markup.
   Hàng đang ghim vẫn nhận ra được ngay qua NÚT GHIM (`.mix-lock.on`: viền + nền `--mix-cyan`,
   icon 📌 đủ màu) — đó mới là chỉ báo chính, không phải tên bộ đề. */
/* ── BẢNG TRỘN ĐỀ: KHỐI KẺ NGANG, BO GÓC (yêu cầu 19/9/2026 — "cho bảng Trộn đề bo góc theo
   đường kẻ mới") ──
